id: https://sis.agr.gc.ca/cansis/glossary/
name: CANSIS_GLOSSARY
title: CANSIS Glossary of Terms in Soil Science
description: Glossary of soil science terms from the Canadian Soil Information Service
  (CANSIS), Agriculture and Agri-Food Canada.
version: '2026'
license: ''
in_language: en
imports:
  - linkml:types
prefixes: {}
default_prefix: ''
classes: {}
enums:
  CANSIS_GLOSSARY:
    permissible_values:
      A horizon:
        description: 'See: horizon; soil'
      Ablation till:
        description: A surface deposit of loose permeable somewhat stratified sandy
          and stony till overlying denser till.
      absorbed water:
        description: Water held mechanically in a soil mass and having physical properties
          similar to ordinary water at the same temperature and pressure.
      accelerated erosion:
        description: Erosion much more rapid than normal, natural, geological erosion,
          primarily as a result of the influence of the activities of man or animals.
      acid soil:
        description: A soil material having a pH of less than 7.0. See also soil reaction.
      actinomycetes:
        description: Unicellular filamentous microorganisms that branch monopodially
          or more rarely dichotomously and form radiating colonies; mainly found in
          the soil, and cause of its characteristic odor.
      active acidity:
        description: The activity of hydrogen ion in the aqueous phase of a soil.
          It is measured and expressed as a pH value.
      adaptation:
        description: Change in an organism resulting from the action of natural selection
          on variation so that the organism is fitted more perfectly for existence
          in its environment.
      adaptive_enzyme:
        description: An enzyme produced by an organism in response to the presence
          of its substrate or a related substance. It is also called an induced enzyme
      adsorbed water:
        description: Water held mechanically in a soil mass and having physical properties
          similar to ordinary water at the same temperature and pressure.
      adsorption complex:
        description: The group of substances in the soil capable of adsorbing other
          materials. Organic and inorganic colloidal substances form the greater part
          of the adsorption complex. The noncolloidal materials, such as silt and
          sand exhibit adsorption to a much lesser extent than the colloidal materials.
      aerate:
        description: To impregnate with a gas usually air.
      aeration soil:
        description: The process by which air in the soil is replaced by air from
          the atmosphere. In a well-aerated soil, the soil air is similar in composition
          to the atmosphere above the soil. Poorly aerated soils usually contain a
          much higher percentage of carbon dioxide and a correspondingly lower percentage
          of oxygen than the atmosphere. The rate of aeration depends largely on the
          volume and continuity of pores in the soil.
      aerobic:
        description: (1) Having molecular oxygen as a part of the environment. (2)
          Growing only in the presence of molecular oxygen such as aerobic organisms.
          (3) Occurring only in the presence of molecular oxygen as applied to certain
          chemical or biochemical processes such as aerobic decomposition.
      aggradation:
        description: Filling in or leveling by deposition.
      aggregate:
        description: A group of soil particles cohering in such a way that they behave
          mechanically as a unit.
      agronomy:
        description: The branch of agriculture that deals with the theory and practice
          of field-crop production and the scientific management of soil.
      air (soil):
        description: The soil atmosphere, the gaseous phase of the soil, is the volume
          not occupied by solid or liquid.
      air porosity:
        description: The portion of the bulk volume of soil that is filled with air
          at any given time or under a given condition such as specified soil water
          potential. Usually this portion is made up of large pores that is those
          drained by a tension of less than about 100 cm of water. See also soil moisture
          tension.
      air-dry:
        description: (1) The state of dryness of a soil at equilibrium with the moisture
          content of the surrounding atmosphere. The moisture content depends on the
          relative humidity and the temperature of the surrounding atmosphere. (2)
          To allow to reach equilibrium in moisture content with the surrounding atmosphere.
      alkali soil:
        description: (1) A soil having a high degree of alkalinity (pH of 8.5 or higher)
          or having a high exchangeable sodium content (15% or more of the exchange
          capacity) or both. (2) A soil that contains enough alkali (sodium) to interfere
          with the growth of most crop plants. See also saline-alkali soil and sodic
          soil.
      alkaline soil:
        description: Any soil that has a pH greater than 7.0. See also - alkalization
          - saline-alkali soil - sodic soil - soil alkalinity - soil reaction
      alkalinity; soil:
        description: The degree or intensity of alkalinity of a soil expressed by
          a value greater than 7.0 on the pH scale See also - alkaline soil - alkalization
          - saline-alkali soil - sodic soil - soil reaction
      alkalization:
        description: The process whereby the exchangeable sodium content of a soil
          is increased. See also - alkaline_soil - saline-alkali soil - sodic soil
          - soil alkalinity - soil reaction
      allophane:
        description: An amorphous hydrated aluminosilicate of variable composition.
      alluvial fan:
        description: A fan-shaped deposit of alluvium laid down by a stream where
          it emerges from an upland into less steeply sloping terrain.
      alluvium:
        description: Material such as clay, silt, sand, and gravel deposited by modern
          rivers and streams.
      alpine soil:
        description: Mountain soil occurring above the timberline.
      amendment (soil):
        description: (1) An alteration of the properties of a soil and thereby of
          the soil by the addition of substances such as lime, gypsum and sawdust
          to make the soil more suitable for the growth of plants. (2) Any substance
          used for this purpose. Fertilizers constitute a special group of soil amendments.
      amino acid:
        description: An organic acid containing both amino (NH2) and carboxyl (COOH)
          groups, and usually having the general formula R-CH-COOH | NH2
      ammonification:
        description: The biochemical process whereby ammoniacal nitrogen is released
          from nitrogen-containing organic compounds.
      ammonium fixation:
        description: The adsorption or absorption of ammonium ions by the mineral
          or organic fractions of the soil in such a way that the ions are relatively
          insotuble in water and relatively unexchangeable by the usual methods of
          cation exchange.
      amorphous mineral:
        description: (1) A mineral that has no definite crystalline structure. (2)
          A mineral that has a definite crystalline structure but appears amorphous
          because of the small crystallite size.
      anaerobic:
        description: Having no molecular oxygen in the environment. Growing in the
          absence of molecular oxygen such as anaerobic bacteria. Occurring in the
          absence of molecular oxygen as in a biochemical process.
      angular cobbly:
        description: A descriptive term applied to coarse fragments. It is used for
          irregular and angular rock or mineral particles 7.5 to 25 cm (3 to 10 inches)
          in diameter. See also coarse fragments.
      anion exchange capacity:
        description: The total amount of exchangeabie anions that a soil can adsorb.
          It is expressed as milliequivalents per 100 g of soil or other adsorbing
          material such as clay.
      anisotropic mass:
        description: A mass whose properties have different values when they are measured
          in different directions at any given point.
      antagonism:
        description: The mutual killing, injury or inhibition of growth of dissimilar
          organisms occupying the same ecological niche.
      antibiotic:
        description: A substance that is produced by a species of microorganism and,
          in dilute solution, has the capacity to inhibit the growth of or kill certain
          other organisms.
      apparent density:
        description: See bulk density; soil.
      apparent specific gravity:
        description: See bulk specific gravity.
      arable soil:
        description: Soil suitable for plowing and cultivation.
      arthropod:
        description: A jointed-legged invertebrate such as an insect or a crustacean.
      artificial manure:
        description: In European usage artificial manure may denote commercial fertilizers.
          See compost.
      associate / soil:
        description: A nontaxonomic but cartographic grouping of soils or land segments,
          which combines related soils into units having similarity in geomorphic
          position, landform, edaphic and mechanical properties of soils (climate,
          drainage, particle size, etc.), and to some degree similarity in the geological
          nature of the soil materials and taxonomic classes.
      association (soil):
        description: A natural grouping of soil associates based on similarities in
          climatic or physiographic factors and soil parent materials. It may include
          a number of soil associates provided that they are all present in significant
          proportions.
      Atterberg limits:
        description: See - liquid limit - plastic limit
      auger (soil):
        description: A tool for boring into the soil and withdrawing a small sample
          for observation in the field or laboratory. The different kinds of augers
          include those having worm-type bits, unenclosed; those having worm-type
          bits enclosed in a hollow cylinder; and those having a hollow half-cylinder
          with cutting edge on the side that rotates around a stabilizing vane.
      autotrophic:
        description: Capable of utilizing inorganic carbon as the main source of carbon
          and of obtaining energy for life processes from the oxidation of inorganic
          elements (chemotrophic) or from radiant energy (phototrophic).
      available nutrient:
        description: The portion of any element or compound in the soil that can be
          readily absorbed and assimilated by growing plants. (Available should not
          be confused with exchangeable.)
      available water:
        description: The portion of water in a soil that can be readily absorbed by
          plant roots. Most workers consider it to be the water held in the soil against
          a pressure of up to approximately 15 bars. See also - field capacity - moisture
          tension, soil
      azonal soil:
        description: Soil without distinct genetic horizons. Such soils may have non-Chernozemic
          Ah horizons or thin Chernozemic Ah horizons but lack B horizons. In Canada
          they are included with Regosolic soils.
      B horizon:
        description: 'See: horizon; soil'
      badland:
        description: A land type generally devoid of vegetation and brohen by an intricate
          maze of narrow ravines, sharp crests, and pinnacles resulting from serious
          erosion of soft geologic materials. This type is most common in arid or
          semiarid regions. It is a miscellaneous land type.
      bar:
        description: A unit of pressure equal to one million dynes per square centimetre.
      base course; base:
        description: A layer of specified or selected material of planned thickness
          constructed on the subgrade or subbase for distributing load and providing
          drainage or minimizing frost action and other such purposes.
      base saturation percentage:
        description: The extent to which the adsorption complex of a soil is saturated
          with exchangeable cations other than hydrogen and aluminum. It is expressed
          as a percentage of the total cation exchange capacity.
      beach deposits:
        description: Sediments that are modified in their degree of sorting or surface
          relief or both by the action of waves .
      bearing capacity:
        description: The average load per unit area that is required to rupture a
          supporting soil mass.
      bed:
        description: A unit layer 1 cm (0.4 inch) or more thick that is visually or
          physically more or less distinctly separable from other layers above and
          below in a stratified sequence.
      bedrock:
        description: The solid rock that underlies soil and the regolith or that is
          exposed at the surface.
      bench terrace:
        description: See terrace.
      biosequence:
        description: A sequence of related soils that differ from one another primarily
          in the kinds and numbers of soil organisms that play a part in soil formation.
      bisect:
        description: A profile of plants and soil showing the vertical and lateral
          distribution of roots and tops in their natural position.
      bisequa:
        description: Two sequa in one soil; that is, two sequences of an eluvial horizon
          and its related illuvial horizon.
      Black:
        description: A great group of soils in the Chernozemic order. The soils occur
          in the cool to cold subhumid grassland and parkland regions. They have a
          very dark surface (Ah or Ap) horizon and ordinarily a brownish B (Bm, Btj
          or Bt) horizon which may be absent over a highly base-saturated usually
          calcareous C horizon.
      blocky:
        description: See structure types; soil.
      blowing sand:
        description: Sandy material that is or has been subjected to wind action.
      blown out land:
        description: An area from which all or almost all the soil and soil material
          have been removed by wind erosion. It is usually a barren shallow depression
          that has a flat or irregular floor consisting of a rather resistant layer
          or an accumulation of pebbles or both or a wet zone immediately above a
          water table. The land is usually unfit for crop production. It is a miscellaneous
          land type.
      blowout:
        description: A small area from which soil material has been removed by wind.
      bog:
        description: Permanently wet land having low bearing strength.
      bog iron:
        description: Impure iron deposits that develop in bogs or swamps by the chemical
          or biochemical oxidation of iron carried in solution.
      border-strip irrigation:
        description: See irrigation methods.
      bottomland:
        description: See floodplain.
      boulders:
        description: Rock fragments over 60 cm (2 ft) in diameter. In engineering
          practice boulders are greater than 20 cm (8 inches) in diameter. See also
          coarse fragments.
      breccia:
        description: A rock composed of coarse angular fragments cemented in a fine-grained
          matrix.
      Brown:
        description: A great group of soils in the Chernozemic order. The soils occur
          in the cool, subarid to semiarid grassland regions, and consist of a brown
          (dry) surface (Ah or Ap) horizon and ordinarily a lighter-colored brownish
          B (Bm, Btj or Bt) horizon which may be absent over a highly basesaturated
          usually calcareous C horizon.
      Brunisolic:
        description: 'An order of soils whose horizons are developed sufficiently
          to exclude the soils from the Regosolic order but that lack the degrees
          or kinds of horizon development specified for soils of the other orders.
          These soils which occur under a wide variety of climatic and vegetative
          conditions all have Bm or Btj horizons. See also: Brunisolic Soil Classification.'
      buffer compounds/ soil:
        description: The clay, organic matter, and materials such as carbonates and
          phosphates that enable the soil to resist appreciable change in pH.
      bulk density; soil:
        description: The mass of dry soil per unit bulk volume. The bulk volume is
          determined before the soil is dried to constant weight at 105° C. It has
          been called apparent density.
      bulk specific gravity:
        description: The ratio of the bulk density of a soil to the mass of a unit
          volume of water. (It is also called apparent specific gravity.)
      bulk volume:
        description: The volume, including the solids and the pores, of an arbitrary
          soil mass.
      buried soil:
        description: Soil covered by an alluvial loessial or other deposit usually
          to a depth greater than the thickness of the solum.
      butte:
        description: An isolated hill rising abruptly above the surrounding area and
          having steep sides and a flat top. Most of the top has been removed by erosion
          and it has a smaller summit area than a mesa.
      C horizon:
        description: 'See: horizon; soil'
      calcareous soil:
        description: Soil containing sufficient calcium carbonate often with magnesium
          carbonate to effervesce visibly when treated with cold 0.1 N hydrochloric
          acid.
      calciphytes:
        description: Plants that require or tolerate rather large amounts of calcium
          or are associated with soils rich in calcium.
      caliche:
        description: (1) A layer near the surface, more or less cemented by secondary
          carbonates of calcium or magnesium precipitated from the soil solution.
          It may be a soft thin soil horizon or a hard thick bed just beneath the
          solum or a surface layer exposed by erosion. It is not a geologic deposit.
          (2) Alluvium cemented with sodium nitrate or sodium chloride or other soluble
          salts in the nitrate deposits of Chile and Peru.
      capability class:
        description: A rating that indicates the capability of land for some use such
          as agriculture, forestry, recreation, or wildlife. In the Canadian system,
          it is a grouping of lands that have the same relative degree of limitation
          or hazard. The degree of limitation or hazard is nil in Class 1 and becomes
          progressively greater to Class 7.
      capability subclass:
        description: A grouping of lands that have similar kinds of limitations and
          hazards. It provides information on the kind of conservation problem or
          limitation. The class and subclass together provide information about the
          degree and kind of limitation, for broad landuse planning and for the assessment
          of conservation needs.
      capillary conductivity:
        description: '(Obsolete) See water: soil: hydraulic conductivity.'
      capillary fringe:
        description: A zone of essentially saturated soil just above the water table.
          The size distribution of the pores determines the extent and degree of the
          capillary fringe.
      capillary porosity:
        description: (Obsolete) The small pores or the bulk volume of small pores
          that hold water in soils against a tension usually greater than 60 cm (24
          inches) of water. See also moisture tension, soil.
      capillary potential:
        description: 'See water: soil: matric potential (capillary potential).'
      capillary water (Obsolete):
        description: The water held in the small pores of a soil, usually with a tension
          greater than 60 cm (24 inches) of water. See also moisture tension / soil.
      carbon cycle:
        description: The cycle whereby carbon dioxide is fixed in living organisms
          by photosynthesis or by chemosynthesis, is consumed in carbohydrate, protein
          and fat by most animals and plants that do not carry out photosynthesis
          and ultimately is returned to its original state when it is freed by respiration
          and by the death and decay of plant and animal bodies.
      carbon-nitrogen ratio:
        description: The ratio of the weight of organic carbon to the weight of total
          nitrogen in a soil or in an organic material. It is obtained by dividing
          the percentage of organic carbon (C) by the percentage of total nitrogen
          (N).
      category:
        description: A grouping of related soils defined at approximately the same
          level of abstraction. In the Canadian classification the categories are
          order, great group, subgroup, family and series.
      catena:
        description: A nontaxonomic grouping of a sequence of soils of about the same
          age, derived from similar parent materials and occurring under similar climatic
          conditions but having unlike characteristics because of variations in relief
          and in drainage.
      cation exchange:
        description: The interchange of a cation in solution and another cation on
          the surface of any surface-active material such as clay colloid or organic
          colloid.
      cation exchange capacity:
        description: 'The total amount of exchangeable cations that a soil can adsorb.
          It is sometimes called ""total exchange capacity"" ""base exchange capacity,""
          or ""cation adsorption capacity."" It is expressed in milliequivalents per
          100 g of soil or of other adsorbing materials such as clay. See also effective
          cation exchange capacity and pH-dependent cation exchange capacity.'
      cemented-indurate:
        description: Having a hard, brittle consistence because the particles are
          held together by cementing substances such as humus, calcium carbonate or
          the oxides of silicon, iron and aluminum. The hardness and brittleness persist
          even when the soil is wet. See also indurated layer
      channery:
        description: A descriptive term used for thin and flat limestone, sandstone
          or schist fragments up to 15 cm (6 inches) in length. See also coarse fragments.
      check-basin irrigation:
        description: See irrigation methods.
      chemistry (soil):
        description: The division of soil science dealing with the chemical constitution,
          properties and reactions of soils.
      Chernozemic:
        description: An order of soils that have developed under xerophytic or mesophytic
          grasses and forbs or under grassland-forest transition vegetation in cool
          to cold subarid to subhumid climates. The soils have a dark-colored surface
          (Ah or Ahe or Ap) horizon and a B or C horizon or both of high base saturation.
          See also Chernozemic Soil Classification.
      chisel / subsoil:
        description: See subsoiling.
      chiseling:
        description: A tillage implement having one or more cultivator-type feet to
          which are attached strong knifelike tools that are used to shatter or loosen
          hard compact layers usually in the subsoil to depths below normal plow depth.
          See also subsoiling.
      chitin:
        description: A nitrogen-containing polysaccharide present in the covering
          layer of insects and in the cell walls of many fungi.
      chlorite group:
        description: A group of nonexpanding platy clay minerals similar chemically
          to the vermiculite group but having a single hydroxide layer between the
          sheets in place of the exchangeable cations and water.
      chroma:
        description: The relative purity, strength or saturation of a color. It is
          directly related to the dominance of the determining wavelength of light.
          It is one of the three variables of color. See also Munsell color system;
          hue; value; color.
      chronosequence:
        description: A sequence of related soils that differ from one another in certain
          properties primarily as a result of time as a soil-forming factor.
      class (soil):
        description: A group of soils having a definite range in a particular property
          such as acidity, degree of slope, texture, structure, land-use capability,
          degree of erosion, or drainage. See also structure, soil and texture, soil.
      classification / soil:
        description: 'The systematic arrangement of soils into categories on the basis
          of their characteristics. Broad groupings are made on the basis of general
          characteristics and subdivisions on the basis of more detailed differences
          in specific properties. See: The Canadian System of Soil Classification.'
      clay:
        description: '(1) As a particle-size term: a size fraction less than 0.002
          mm in equivalent diameter, or some other limit (geologists and engineers).
          (2) As a rock term: a natural, earthy, fine grained material that develops
          plasticity with a small amount of water. (3) As a soil term: a textural
          class. See also texture, soil.. (4) As a soil separate: a material usually
          consisting largely of clay minerals but commonly also of amorphous free
          oxides and primary minerals.'
      clay films (skins):
        description: Coatings of oriented clays on the surfaces of soil peds and mineral
          grains and in soil pores.
      clay loam:
        description: Soil material that contains 27% to 40% clay and 20% to 45% sand.
          See also texture, soil.
      clay mineral:
        description: Finely crystalline hydrous aluminum silicates and hydrous magnesium
          silicates with a phyllosilicate structure.
      clayey:
        description: Containing large amounts of clay or having properties similar
          to those of clay.
      claypan:
        description: A term used in the United States for a dense, compact layer in
          the profile having a much higher clay content than the overlying material,
          from which it is separated by a sharply defined boundary. In the Canadian
          classification system, this pan is recognized as a clay-enriched illuvial
          B (Bt) horizon.
      climatic index:
        description: "A simple, single numerical value that expresses climatic relationships;\
          \ for example, the numerical value obtained in Transeau's precipitation-evaporation\
          \ ratio."
      climax:
        description: A plant community of the most advanced type capable of development
          under, and in dynamic equilibrium with, the prevailing environment.
      climosequence:
        description: A sequence of related soils that differ from one another in certain
          properties primarily as a result of the effect of climate as a soil-forming
          factor.
      clinosequence:
        description: A group of related soils that differ from one another in certain
          properties primarily as a result of the effect of the degree of slope on
          which they were formed. See also toposequence.
      clod:
        description: A compact, coherent mass of soil produced by digging or plowing.
          Clods usually slake easily with repeated wetting and drying.
      coarse fragments:
        description: Rock or mineral particles greater than 2.0 mm in diameter. The
          names used for coarse fragments in soils are shown in Table 2.
        see_also: https://sis.agr.gc.ca/cansis/glossary/table-2.html
      coarse sand:
        description: See separates; soil and texture; soil.
      coarse sandy loam:
        description: See texture, soil.
      coarse texture:
        description: The texture exhibited by sands, loamy sands, and sandy loams
          except very fine sandy loam. A soil containing large quantities of these
          textural classes. See also sand, sandy and moderately coarse texture.
      coating:
        description: Material covering the soil particles. See also clay films (skins).
      cobble:
        description: See cobblestone.
      cobblestone:
        description: Rounded or partially rounded rock or mineral fragment 7.5 to
          25 cm (3 to 10 inches) in diameter. In engineering practice, cobbles are
          greater than 7.5 cm (3 inches) but less than 20 cm (8 inches) in diameter.
          See also coarse fragments
      cobbly:
        description: 'Containing appreciable quantities of cobblestones. The term
          is used to describe both soil and land. ""Angular cobbly"" is used when
          the fragments are less rounded. See also coarse fragments.'
      colloid:
        description: A substance in a state of fine subdivision, whose particles are
          10-4 to 10-7 cm in diameter.
      colluvium:
        description: A heterogeneous mixture of material that as a result of gravitational
          action has moved down a slope and settled at its base. See also creep.
      colony:
        description: A macroscopically visible growth of microorganisms on a solid
          culture medium.
      color:
        description: See Munsell color system.
      columnar:
        description: See structure types, soil.
      commensalism:
        description: A relationship between two kinds of organisms living in the same
          cultural environment without harm to either species and in which one or
          both members of the pair may obtain food, protection, or other benefits.
      compact soil:
        description: See consistence.
      complex (soil):
        description: A mapping unit used in detailed and reconnaissance soil surveys
          where two or more defined soil units are so intimately intermixed geographically
          that it is impractical because of the scale used to separate them.
      compost:
        description: 'Organic residues, or a mixture of organic residues and soil
          that have been piled, moistened and allowed to decompose. Mineral fertilizers
          are sometimes added. If it is produced mainly from plant residue it is often
          called ""artificial manure"" or ""synthetic manure.""'
      compressibility:
        description: The susceptibility of a soil to decrease in volume when subjected
          to load.
      concentrated flow:
        description: The flowing of a rather large accumulated body of water over
          a relatively narrow course. It often causes serious erosion and gullying.
      concrete frost:
        description: Ice in the soil in such quantity as to form virtually a solid
          block.
      concretion:
        description: A mass or concentration of a chemical compound such as calcium
          carbonate or iron oxide in the form of a grain or nodule of varying size,
          shape, hardness and color found in soil and in rock. The term is sometimes
          restricted to concentrations having concentric fabric. The composition of
          some concretions is unlike that of the surrounding material.
      conservation (soil):
        description: (1) Protection of the soil against physical loss by erosion or
          against chemical deterioration; that is, excessive loss of fertility by
          either natural or artificial means. (2) A combination of all methods of
          management and land use that safeguard the soil against depletion or deterioration
          by natural or man-induced factors. (3) The division of soil science dealing
          with soil conservation 1. and 2. above.
      consistence:
        description: 'The resistance of a material to deformation or rupture. The
          degree of cohesion or adhesion of the soil mass. Terms used for describing
          consistence at various soil moisture contents are: wet soil: nonsticky,
          slightly sticky, sticky, and very sticky; nonplastic, slightly plastic,
          plastic, and very plastic. moist soil: loose, very friable, friable, firm,
          and very firm; compact, very compact, and extremely compact. dry soil: loose,
          soft, slightly hard, hard, very hard, and extremely hard. cementation: weakly
          cemented, strongly cemented, and indurated. In engineering practice, "consistency"
          has essentially the same meaning as "consistence."'
      consolidation:
        description: The gradual reduction in volume of a soil mass resulting from
          an increase in compressive stress.
      constitutive enzyme:
        description: An enzyme whose formation does not depend on the presence of
          a specific substrate
      control section (soil):
        description: The vertical section upon which the taxonomic classification
          of soil is based. The control section usually extends to a depth of 100
          cm (40 inches) in mineral materials and to 160 cm (64 inches) in organic
          materials.
      coprogenous earth:
        description: A material in some organic soils that contains at least 50% by
          volume of fecal pellets less than 0.5 mm in diameter.
      coprolite:
        description: Fecal pellet, casting
      corrected lime potential:
        description: Defined as pH - 1/2p(Ca + Mg) - 1/3(pKg - pY) where Kg is the
          solubility product of gibbsite and Y is the value of the ionic product (Al)(OH)3
          in the soil solution. The corrected lime potential (CLP) is also equal to
          1/6 log [(Ca + Mg)(OH)2]3/[(Al)(OH)3]2 + KCLP where KCLP is a constant dependent
          on temperature only. The CLP is therefore the ratio of the cube of the sum
          of the activities of Ca and Mg hydroxide to the square of the activity of
          Al hydroxide in the soil solution. The CLP has a relationship to the degree
          of base saturation based on the effective cation exchange capacity but the
          pH and the lime potential do not. See also lime potential.
      corrugation irrigation:
        description: See irrigation methods
      cradle knoll:
        description: A small knoll formed by earth that was raised and left by an
          uprooted tree. See also microrelief
      crag and tail:
        description: An elongate hill that has at one end a steep face of ice-smoothed
          rock and at the leeward end a tapering streamlined tail of till.
      creep:
        description: Slow mass movement of soil and soil material down rather steep
          slopes primarily under the influence of gravity, but aided by saturation
          with water and by alternate freezing and thawing. In engineering usage creep
          is any general slow displacement under load.
      crevasse fillings:
        description: Ridges or hummocks formed from glacial sediments that were deposited
          by water in the cracks and crevasses of the ice.
      critical density:
        description: The unit weight of a saturated granular material below which
          it will lose strength and above which it will gain strength when subjected
          to rapid deformation. The critical density of a given material depends on
          many factors.
      critical void ratio:
        description: The void ratio corresponding to the critical density.
      cross-bedding:
        description: An arrangement in which thin layers of stratified sediment are
          transverse or oblique to the main plane of stratification.
      crotovina:
        description: 'A former animal burrow in one soil horizon that has become filled
          with organic matter or material from another horizon. It is also spelled
          ""krotovina.""'
      crushing strength:
        description: The force required to crush a mass of dry soil, or conversely,
          the resistance of a mass of dry soil to crushing. It is expressed in units
          of force per unit area (pressure).
      crust:
        description: A surface layer of soil from a few millimetres to 2.5 cm (1 inch)
          thick that when dry is much more compact, hard and brittle than the material
          just under it.
      cryic layer:
        description: A perennially frozen layer.
      cryology:
        description: The study of the properties of snow, ice and frozen ground.
      Cryosolic:
        description: 'An order of soils proposed for adoption in the Canadian taxonomic
          system. Cryosolic soils are mineral or organic soils that have perennially
          frozen material within 1 m (3 ft) of the surface in some part of the soil
          body, or pedon. The mean annual soil temperature is less than 0&oslash;C
          (32&oslash;F). They are the dominant soils of the zone of continuous permafrost
          and become less widespread to the south in the zone of discontinuous permafrost;
          their maximum development occurs in organic and poorly drained, fine textured
          materials. The vegetation associated with Cryosolic soils varies from sparse
          plant cover in the high arctic, through tundra, to subarctic and northern
          boreal forests. The active layer of these soils is frequently saturated
          with water, especially near the frozen layers, and colors associated with
          gleying are therefore common in mineral soils, even those that occur on
          well drained portions of the landscape. They may or may not be markedly
          affected by cryoturbation. The order has three great groups: Turbic Cryosol,
          comprising mineral soils that display marked cryoturbation and generally
          occur on patterned ground; Static Cryosol, mineral soils without marked
          cryoturbation; and Organo Cryosol, organic soils.'
      cryoturbation:
        description: Frost action including frost heaving.
      crystal:
        description: A homogeneous inorganic substance of definite chemical composition
          bounded by plane surfaces that form definite angles with each other to give
          the substance a regular geometrical form. See also mineral, soil.
      crystal lattice:
        description: See lattice structure.
      cuesta:
        description: A hill or ridge that has a steep cliff on one side and a more
          gradual slope on the other side controlled more or less by the attitude
          of the rock strata.
      Cultivation:
        description: Tillage to prepare land for seeding or transplanting and later
          to control weeds and loosen the soil.
      cumulo layer:
        description: A layer of sandy, silty, or clayey material in an Organic soil.
      Cutan:
        description: A modification of the texture, structure or fabric at natural
          surfaces in soil materials due to concentration of particular soil constituents
          or in situ modification of the matrix. Cutans may be composed of any of
          the component substances of the soil material.
      Darcy&#39;s law:
        description: '(1) A law describing the rate of flow of water through porous
          media. (Named for Henry Darcy of Dijon, who formulated it in 1856 from extensive
          work on the flow of water through sand filter beds.) As formulated by Darcy
          the law is: Q = k*S*(H+e)/e where Q is the volume of water passed in unit
          time, S is the area of the bed, e is the thickness of the bed, H is the
          height of the water on top of the bed, and "k is a coefficient depending
          on the nature of the sand" and for cases where the pressure "under the filter
          is equal to the weight of the atmosphere." (2) Generalization for three
          dimensions: The rate of viscous flow of water in isotropic porous media
          is proportionai to, and in the direction of, the hydraulic gradient. (3)
          Generalization for other fluids: The rate of viscous flow of homogeneous
          fluids through isotropic porous media is proportional to, and in the direction
          of, the driving force'
      Dark Brown:
        description: A great group of soils in the Chernozemic order. The soils occur
          in the cool to cold, semiarid grassland regions and have a dark brown surface
          (Ah or Ap) horizon on a lighter colored brownish B (Bm, Btj, or Bt) horizon,
          which may be absent, over a highly base saturated, usually calcareous C
          horizon.
      Dark Gray:
        description: A great group of soils in the Chernozemic order. The soils occur
          in the cool to cold subhumid grassland-forest transitional regions, and
          have a dark gray partially eluviated surface (Ahe or Ap) horizon and a brownish
          B (Bm, Btj, or Bt) horizon which may be absent over a highly base saturated
          usually calcareous C horizon.
      Dark Gray Gleysolic:
        description: See Humic Gleysol.
      deflation:
        description: The removal of fine soil particles from the soil by wind.
      deflocculate:
        description: (1) To separate the individual components of compound particles
          by chemical or physical means or both. (2) To cause the particles of the
          disperse phase of a colloidal system to become suspended in the dispersion
          medium.
      degradation:
        description: The changing of a soil to a more highly leached and weathered
          state, usually accompanied by morphological changes such as the development
          of an eluviated, light-colored A (Ae) horizon.
      dehydrogenase:
        description: An enzyme that accelerates oxidation of a substrate by removing
          hydrogen from it.
      dehydrogenation:
        description: Removal of hydrogen as from a molecule.
      delta:
        description: A fan-shaped area at the mouth of a river formed by deposition
          of successive layers of sediments brought down from the land and spread
          out on the bottom of a basin. Where the stream current reaches quiet water,
          the bulk of the coarser load is dropped and the finer material is carried
          farther out. Deltas are recognized by nearly horizontal beds, termed bottomset
          beds, overlain by more steeply inclined and coarser-textured beds called
          foreset beds.
      denitrification:
        description: The gaseous loss of nitrogen by either biological or chemical
          mechanisms but exclusive of ammonia volatilization.
      depleted soil:
        description: Soil that has lost most of its available nutrients.
      deposit:
        description: Material left in a new position by a natural transporting agent
          such as water, wind, ice or gravity or by human activity.
      diatomaceous earth:
        description: An earthy deposit of fine, grayish, siliceous material composed
          chiefly or wholly of the remains of diatoms. It may occur as a powder or
          as a porous, rigid material.
      diatoms:
        description: Algae having siliceous ceil walls that persist as a skeleton
          after death. These microscopic unicellular or colonial algae belong to the
          class Bacillariophyceae. They are abundant in both fresh and salt waters
          and their remains are widely distributed in soils.
      differential water capacity:
        description: See water; soil.
      diffusivity:
        description: See water; soil.
      direct count:
        description: In soil microbiology any one of several methods for estimating
          by direct microscopic examination the total number of microorganisms in
          a given mass of soil.
      discharge velocity:
        description: The rate of discharge of water through a porous medium per unit
          of total area perpendicular to the direction of flow.
      disintegration:
        description: The breakdown of rock and mineral particles into smaller particles
          by physical forces such as frost action. See also weathering.
      disperse:
        description: (1) To break up compound particles such as aggregates into the
          individual component particles. (2) To distribute or suspend fine particles
          such as clay in or throughout a dispersion medium such as water.
      dispersion medium:
        description: The portion of a colloidal system in which the disperse phase
          is distributed.
      diversion dam:
        description: A structure or barrier that diverts part of or all the water
          of a stream to a different course.
      double layer:
        description: In colloid chemistry, the electric charges on the surface of
          the disperse phase, usually negative and the adjacent diffuse layer, usually
          positive, of ions in solution.
      drag:
        description: The force retarding the flow of water or wind over the surface
          of the ground.
      drain:
        description: (1) To provide channels, such as open ditches or drain tile,
          so that excess water can be removed by surface or by internal flow. (2)
          To lose water from the soil by percolation.
      drain tile:
        description: Pipe used to conduct drainage water from the soil.
      drumlin:
        description: An elongate or oval hill of glacial drift, commonly glacial till,
          deposited by glacier ice and having its long axis parallel to the direction
          of ice movement.
      dry aggregate:
        description: A compound or secondary soil particle that is not broken down
          by dry sieving.
      dry weight percentage:
        description: The ratio of the weight of any constituent of a soil to the ovendry
          weight of the soil. See also ovendry soil.
      dryland farming:
        description: The practice of growing crops in areas of low rainfall without
          irrigation.
      dunes:
        description: Wind-built ridges and hills of sand formed in the same manner
          as snowdrifts. They are started by some obstruction, such as a bush, boulder
          or fence, that causes an eddy or otherwise thwarts the sand-laden wind.
          Once begun, the dunes themselves offer further resistance and they grow
          to form various shapes.
      duric:
        description: A Bc horizon that is strongly cemented and usually has an abrupt
          upper boundary and a diffuse lower boundary. Cementation is usually strongest
          near the upper boundary. Ordinarily the color is similar to that of the
          parent material and the structure is amorphous or coarse platy. Air-dried
          clods do not slake when immersed in water. The duric horizon does not meet
          the requirements of a podzolic B horizon but may meet those of a Bt horizon.
      dust mulch:
        description: A loose, finely granular, or powdery layer on the surface of
          the soil, usually produced by shallow cultivation, and also by deposition.
      dy:
        description: Finely divided, partly decomposed organic material accumulated
          in peat soils in the transition zone between the peat and the underlying
          mineral material. Dy-peat also refers to amorphous material formed from
          humus soils that have settled in lake waters. Dy is poorer in nutrients
          than gyttja and is characterized by a high C:N ratio.
      dynamometer:
        description: An instrument for measuring draft of tillage implements, and
          for measuring resistance of soil to penetration by tillage implements.
      Dystric Brunisol:
        description: A great group of soils in the Brunisolic order. The soils may
          have mull Ah horizons less than 5 cm (2 inches) thick. They have Bm horizons
          in which the base saturation (NaCI) is usually 65% to 100% and the pH (CaCI2)
          is usually 5.5 or lower
      ecology:
        description: The study of the relationship between organisms and their environment.
      ectotrophic mycorrhiza:
        description: A mycorrhizal association in which the fungal hyphae form a compact
          mantle on the surface of the roots. Mycelial strands extend inward between
          cortical cells and outward from the mantle to the surrounding soil.
      edaphic:
        description: (1) Of or pertaining to the soil. (2) Resulting from or influenced
          by factors inherent in the soil or other substrate rather than by climatic
          factors.
      edaphology:
        description: "The science that deals with the influence of soils on living\
          \ things, particularly plants including man's use of land for plant growth."
      effective cation exchange capacity:
        description: The sum of cations that a soil can adsorb in its natural state.
      effective precipitation:
        description: The portion of the total precipitation that becomes available
          for plant growth.
      electrokinetic potential:
        description: (1) In a colloidal system, the difference in potential between
          the immovable layer attached to the surface of the dispersed phase and the
          dispersion medium. (2) The work done in bringing a unit charge from infinity
          to a reference point in the liquid layer attached to the solid phase in
          a colloidal system.
      eluvial horizon:
        description: A soil horizon that has been formed by the process of eluviation.
          See also illuvial horizon.
      eluviation:
        description: The transportation of soil material in suspension or in solution
          within the soil by the downward or lateral movement of water.
      end moraine or terminal moraine:
        description: A ridgelike accumulation of drift built chiefly along the terminal
          margin of a valley glacier or the margin of an ice sheet. It is mainly the
          result of deposition by ice or deformation by ice thrust, or both.
      endoenzyme or intracellular enzyme:
        description: An enzyme formed within the cell and not excreted into the medium.
      endotrophic:
        description: Nourished or receiving nourishment from within; for example,
          fungi or their hyphae receiving nourishment from plant roots in a mycorrhizal
          association.
      endotrophic mycorrhiza:
        description: A mycorrhizal association in which the fungal hyphae are present
          on root surfaces as individual threads that may penetrate directly into
          root hairs, other epidermal cells, and occasionally into cortical cells.
          Individual threads extend from the root surface outward into the surrounding
          soil.
      engineering (soil):
        description: See mechanics and engineering, soil.
      enrichment culture:
        description: A technique in which environmental, including nutritional, conditions
          are controlled to favor the development of a specific organism or group
          of organisms.
      enzyme:
        description: A proteinaceous organic substance, produced within an organism,
          that acts like a catalyst. See also adaptive enzyme, constitutive enzyme,
          endoenzyme, and exoenzyme.
      eolian deposit:
        description: Sand, or silt, or both, deposited by the wind. See also loess
          and dunes.
      equivalent diameter:
        description: In sedimentation analysis, the diameter assigned to a nonspherical
          particle. It is numerically equal to the diameter of a spherical particle
          having the same density and velocity of fall.
      equivalent weight of a soil colloid:
        description: The weight of clay or organic colloid that has a combining power
          equal to 1 gram-atomic weight of hydrogen.
      erode:
        description: To wear away or remove the land surface by wind, water or other
          agents.
      erodible:
        description: Susceptible to erosion. It is expressed by terms such as highly
          erodible and slightly erodible.
      erosion:
        description: "The wearing away of the land surface by running water, wind,\
          \ ice or other geological agents including such processes as gravitational\
          \ creep. Detachment and movement of soil or rock by water, wind, ice or\
          \ gravity. The following terms are used to describe different types of water\
          \ erosion: accelerated erosion Erosion much more rapid than normal, natural,\
          \ geological erosion, primarily as a result of the influence of the activities\
          \ of man or animals. geological erosion The normal or natural erosion caused\
          \ by geological processes acting over long geologic periods and resulting\
          \ in the wearing away of mountains, the dissection of plains, and the building\
          \ up of floodplains and coastal plains. Synonymous with natural erosion.\
          \ gully erosion The erosion process whereby water accumulates in narrow\
          \ channels and, over short periods, removes the soil from this narrow area\
          \ to various depths, from about 0.3 m (1 ft) to as much as 30 m (100 ft).\
          \ natural erosion Wearing away of the earth's surface by water, ice, or\
          \ other natural agents under natural environmental conditions such as climate\
          \ and vegetation, undisturbed by man. Synonymous with geological erosion.\
          \ normal erosion The gradual erosion of land used by man. It does not greatly\
          \ exceed natural erosion. See natural erosion. rill erosion An erosion process\
          \ in which many small channels a few centimetres deep are formed; it occurs\
          \ mainly on recently cultivated soils. See also rill. sheet erosion The\
          \ removal of a fairly uniform layer of soil from the land surface by runoff\
          \ water. splash erosion The spattering of small soil particles caused by\
          \ the impact of raindrops on very wet soils. The loosened and spattered\
          \ particles may, or may not, be subsequently removed by surface runoff."
      erosion classes:
        description: A grouping of erosion conditions based on the degree of erosion
          or on the characteristic patterns. The classes apply to accelerated erosion
          but not to normal, natural or geological erosion. Four erosion classes are
          recognized for water erosion anq three for wind erosion. (For details see
          The Canadian System of Soil Classification.)
      erosion pavement:
        description: A layer of coarse fragments such as sand, gravel, cobbles, or
          stones that remains on the surface of the ground after the removal of fine
          particles by eroslon.
      erratic:
        description: A transported rock fragment different from the bedrock where
          it lies. The term is generally applied to fragments transported by glacier
          ice or by floating ice.
      esker:
        description: A winding ridge of irregularly stratified sand, gravel, and cobbles
          deposited under the ice by a rapidly flowing glacial stream.
      eubacteriales:
        description: An order of the class Schizomycetes. True bacteria.
      Eutric Brunisol:
        description: A great group of soils in the Brunisolic order. The soils may
          have mull Ah horizons less than 5 cm (2 inches) thick, and they have Bm
          horizons in which the base saturation (NaCI) is l00%.
      eutrophic:
        description: Having concentrations of nutrients optimal or nearly so for piant
          or animal growth. It is used to describe nutrient or soil solutions.
      evapotranspiration:
        description: The loss of water from a given area during a specified time by
          evaporation from the soil surface and by transpiration from the plants.
          Potential evapotranspiration is the maximum transpiration that can occur
          in a given weather situation with a low-growing crop that is not short of
          water and does not completely shade the ground.
      excessive drainage:
        description: Too great or too rapid a loss of water from soils, either by
          percolation or by surface flow. The loss is greater than that necessary
          to prevent the development of an anaerobic condition for an appreciable
          length of time.
      exchange acidity:
        description: The titratable hydrogen and aluminum that can be replaced from
          the adsorption complex by a neutral sait solution. It is usually expressed
          as milliequivalents per 100 g of soil (meq/ 100 g soil).
      exchange capacity:
        description: The total ionic charge of the adsorption complex that is active
          in the adsorption of ions. See also anion exchange capacity and cation exchange
          capacity.
      exchangeable cation percentage:
        description: 'The extent to which the adsorption complex of a soil is occupied
          by a particular cation. It is expressed as: ECP = [exchangeable cation (meq/100
          g soil) / cation exchange capacity (meq/100 g soil)] x 100.'
      exchangeable phosphate:
        description: The phosphate anion reversibly attached to the surface of the
          solid phase of the soil in such form that it may go into solution by anionic
          equilibrium reactions with isotopes of phosphorus or with other anions of
          the liquid phase without solution of the colloid phase to which it was attached.
      exchangeable potassium:
        description: The potassium that is held by the adsorption complex of the soil
          and is easily exchanged with the cation of neutral nonpotassium salt solutions.
      exchangeable sodium percentage:
        description: 'The extent to which the adsorption complex of a soil is occupied
          by sodium. It is expressed as: ESP= [exchangeable sodium (meq/ 100 g soil)
          / cation exchange capacity (meq/ 100 g soil)] x 100.'
      exoenzyme or extracellular enzyme:
        description: An enzyme excreted by a microorganism into the environment. An
          enzyme that acts outside the cell.
      external drainage:
        description: The natural elimination or accumulation of precipitation water
          on the soil surface.
      extract (soil):
        description: The solution separated from a soil suspension or from a soil
          by filtration, centrifugation, suction or pressure.
      F layer:
        description: See horizon; soil
      fabric (soil):
        description: The physical constitution of a soil material expressed by the
          spatial arrangement of the solid particles and associated voids.
      facultative anaerobe:
        description: A microorganism that lives under either aerobic or anaerobic
          conditions.
      fallow land:
        description: Cultivated land that is not being used for a crop.
      family; soil:
        description: A category in the Canadian system of soil classification. Differentiae
          are primarily texture, drainage, thichness of horizons, permeability, mineralogy,
          consistence and reaction.
      fermentation:
        description: Anaerobic oxidation of carbohydrates and carbohydratelike compounds
          by enzyme action of microorganisms; gaseous oxygen is not involved in this
          energy-yielding process.
      Ferro-Humic Podzol:
        description: A great group of soils in the Podzolic order. The upper 10 cm
          (4 inches) of the Bhf horizon contain 5% or more organic carbon, 0.6% or
          more pyrophosphate-extractable Al and Fe, and either a ratio of organic
          carbon to pyrophosphate-extractable Fe of less than 20 or a percentage of
          pyrophosphate-extractable Fe greater than 0.3 or both. The B horizon is
          usually overlain by a light-colored, eluviated horizon (Ae) and a mor humus
          layer.
      fertility (soil):
        description: The status of a soil in relation to the amount and availability
          to plants of elements necessary for plant growth.
      fertilizer:
        description: Any organic or inorganic material of natural or synthetic origin
          that is added to a soil to supply certain elements essential to the growth
          of plants.
      fertilizer grade:
        description: The guaranteed minimum analysis in percent of the major plant
          nutrient elements contained in a fertilizer material or in a mixed fertilizer.
          The analysis usually gives the percentages of N, P2O5 and K2O but proposals
          have been made to change the designation to the percentages of N, P and
          K.
      fertilizer requirement:
        description: The quantity of certain plant nutrient elements needed in addition
          to the amount supplied by the soil to increase plant growth to a designated
          optimum.
      fibric layer:
        description: A layer of organic soil material containing large amounts of
          weakly decomposed fiber whose botanical origin is readily identifiable.
      Fibrisol:
        description: A great group of soils in the Organic order that are saturated
          for most of the year. The soils have a dominantly fibric middle tier or
          middle and surface tiers if a terric, lithic, hydric or cryic contact occurs
          in the middle tier.
      field capacity:
        description: The percentage of water remaining in the soil 2 or 3 days after
          the soil has been saturated and free drainage has practically ceased. The
          percentage may be expressed in terms of weight or volume. See also moisture
          tension, soil
      fifteen-atmosphere percentage:
        description: fifteen-atmosphere percentage See moisture tension; soil.
      fifteen-bar percentage:
        description: fifteen-bar percentage See moisture tension; soil.
      film water:
        description: film water A layer of water that surrounds soil particles and
          varies in thickness from 1 or 2 to 100 or more molecular layers. Usually
          it is considered to be the water that remains after drainage, because it
          is not distinguishable in saturated soils.
      fine clay:
        description: A clay fraction of specified size less than 2 um usually less
          than 0.2 or 0.08 um.
      fine earth:
        description: The fraction of mineral soil consisting of particles less than
          2 mm in diameter.
      fine sand:
        description: (1) A soil separate. See also separates, soil. (2) A soil textural
          class. See also texture, soil.
      fine sandy loam:
        description: See texture; soil.
      fine texture:
        description: 'Consisting of or containing large quantities of the fine fractions,
          particularly of silt and clay. It includes all the textural classes of clay
          loams and clays: clay loam, sandy clay loam, silty clay loam, sandy clay,
          silty clay, and clay. Sometimes it is subdivided into clayey texture and
          moderately fine texture. See also texture, soil.'
      fines:
        description: A term used in soil mechanics for the portion of a soil finer
          than a No. 200 (74- µm) U.S. standard sieve.
      firm:
        description: A term describing the consistence of a moist soil that offers
          distinctly noticeabie resistance to crushing, but can be crushed with moderate
          pressure between the thumb and forefinger. See also consistence.
      first bottom:
        description: The normal floodplain of a stream.
      fixation:
        description: The process or processes in a soil by which certain chemical
          elements essential for plant growth are converted from a soluble or exchangeable
          form to a much less soluble or nonexchangeable form, for example, phosphate
          fixation. See also nitrogen fixation.
      fixed phosphorus:
        description: (1) Phosphorus that has been changed to a less soluble form as
          a result of reaction with the soil; moderately unavailable phosphorus. Specifically,
          it is the quantity of soluble phosphorus compounds that, when added to soil,
          becomes chemically or biologically attached to the solid phase of soil and
          cannot be recovered by extracting the soil with a specified extractant under
          specified conditions. Some of these extractants are water, carbonated water,
          and dilute solutions of strong mineral acids with or without fluoride or
          other exchangeable anion. (2) Applied phosphorus that is not absorbed by
          plants during the first cropping year. (3) Soluble phosphorus that has become
          attached to the solid phase of the soil in forms highly unavailable to crops;
          unavailable phosphorus; or phosphorus in other than readily or moderately
          available forms.
      flagellum:
        description: A flexible, whiplike, appendage on cells used as an organ of
          locomotion.
      flaggy:
        description: See coarse fragments.
      flagstone:
        description: A thin fragment of sandstone, limestone, slate, shale, or rarely
          of schist, 15 to 37 cm (6 to 15 inches) long. See also coarse fragments.
      flooding:
        description: See irrigation methods.
      floodplain:
        description: The land bordering a stream, built up of sediments from overflow
          of the stream and subject to inundation when the stream is at flood stage.
          See also first bottom.
      flow velocity:
        description: The volume of water transferred per unit of time and per unit
          of area in the direction of the net flow of water in soil.
      fluvial deposits:
        description: All sediments, past and present, deposited by flowing water,
          including glaciofluvial deposits. Wave-worked deposits and deposits resulting
          from sheet erosionand mass wasting are not included.
      fluvioglacial:
        description: See glaciofluvial deposits.
      foliar diagnosis:
        description: An estimation of the extent to which plants are getting certain
          necessary chemical elements from the soil based on an examination of the
          color and the growth habits of the foliage of the plants.
      Folisol:
        description: A great group of soils in the Organic order. The soils are not
          usually saturated for more than a few days a year and consist of 10 cm (4
          inches) or more of L-H horizons derived from leaf litter, twigs, branches
          and mosses. A lithic contact or fragmented material occurs at a depth of
          less than 160 cm (64 inches). Mineral layers less than 10 cm (4 inches)
          thich may lie above the lithic contact.
      forest floor:
        description: All dead vegetable and organic matter including litter and unincorporated
          humus on the mineral soil surface under forest vegetation.
      forest soils:
        description: (1) Soils developed under forest vegetation. (2) (European usage)
          Soils formed in temperate climates under forest vegetation.
      fragic:
        description: A Bx or BCx horizon of high bulk density and consistence that
          is firm and brittle when moist and hard to extremely hard when dry. Commonly
          it has bleached fracture planes separating very coarse prismatic units and
          frequently the secondary structure is platy. Usually the fragic horizon
          is similar in color to the parent material but differs from it in structure,
          consistence and bulk density. Air-dried clods slake when immersed in water.
          The upper boundary is usually abrupt and clear but the lower boundary is
          diffuse. The fragic horizon does not meet the criteria of a podzolic B horizon
          but may meet those of a Bt (Btx) horizon. See fragipan.
      fragipan:
        description: A natural subsurface horizon having a higher bulk density than
          the solum above, seemingly cemented when dry but showing moderate to weak
          brittleness when moist. The layer is low in organic matter, mottled and
          slowly or very slowly permeable to water. It usually has some polygon-shaped
          bleached cracks. It is found in profiles of either cultivated or virgin
          soils but not in calcareous material.
      fragmental:
        description: Rock and mineral particles larger than 2 mm occupy 90% or more
          of the soil (by volume).
      free acidity:
        description: The titratable acidity in the aqueous phase of a soil. It may
          be expressed in milliequivalents per unit mass of soil or in other suitable
          units.
      free oxides:
        description: Oxides and hydroxides of iron, aluminum, silicon, manganese,
          and titanium, usually of fine particle size, that occur uncombined with
          other elements and often as coatings on primary and secondary minerals.
      freezing index; F degree-days:
        description: The number of degree-days between the highest and lowest points
          on the cumulative degree-days - time curve for one freezing season. It is
          used as a measure of the combined duration and magnitude of below-freezing
          temperature occurring during any given freezing season. The index determined
          for air temperatures 137.3 cm (4.5 ft) above the ground is commonly designated
          as the air freezing index, whereas that determined for temperatures immediately
          below a surface is called the surface freezing index.
      friable:
        description: A consistence term pertaining to the ease of crumbling of soils.
          See also consistence.
      frost action:
        description: Freezing and thawing of moisture in materials and the resultant
          effects on these materials and on the structures of which they are a part
          or with which they are in contact.
      frost heave:
        description: The raising of a surface caused by ice in the underlying soil.
      fulvic acids:
        description: A term with various meanings that usually refers to the mixture
          of organic substances that remains in solution when a dilute alkali extract
          from the soil has been acidified.
      fungi:
        description: The allophytic plants that lack chlorophyll and are filamentous
          in structure; molds.
      furrow irrigation:
        description: See irrigation methods.
      genesis (soil ):
        description: (1) The mode of origin of the soil, especially the processes
          or soil-forming factors responsible for the development of the solum, the
          true soil, from unconsolidated parent material. (2) The division of soil
          science dealing with soil genesis (1).
      genetic:
        description: Resulting from or produced by soil-forming processes, for example,
          a genetic soil profile or a genetic horizon.
      genetic pan:
        description: A natural subsurface soil layer of low or very low permeability
          having a high concentration of small particles and differing in certain
          physical and chemical properties from the soil immediately above or below
          the pan. See also claypan and fragipan.
      genus:
        description: A group of very closely related species.
      geography (soil):
        description: Geography dealing with the areal distribution of soil types.
      geological erosion:
        description: The normal or natural erosion caused by geological processes
          acting over long geologic periods and resulting in the wearing away of mountains,
          the dissection of plains, and the building up of floodplains and coastal
          plains. Synonymous with natural erosion.
      germicide:
        description: An agent capable of killing germs, usually pathogenic microorganisms.
      gilgai:
        description: The microrelief of soils produced by expansion and contraction
          caused by changes in moisture. Gilgai is found in soils that contain large
          amounts of clay, which swells and shrinks noticeably with wetting and drying.
          It usually occurs as a succession of microbasins and microknolls in nearly
          level areas or as microvalleys and microridges parallel to the direction
          of the slope. See also microrelief.
      GIS:
        description: 'Geographic Information System (GIS): a set of tools for collecting,
          storing, retrieving, transforming and displaying spatial referenced data.
          CanSIS uses a GIS called ARC/INFO.'
      glacial drift:
        description: All rock material carried by glacier ice and glacial meltwater
          or rafted by icebergs. This term includes till, stratified drift and scattered
          rock fragments.
      glacial till:
        description: See till.
      glaciofluvial deposits:
        description: Material moved by glaciers and subsequently sorted and deposited
          by streams flowing from the melting ice. The deposits are stratified and
          may occur in the form of outwash plains, deltas, kames eskers, and kame
          terraces. See also glacial drift and till.
      gleyed soil:
        description: Soil affected by gleysation.
      gleysation:
        description: A soil-forming process, operating under poor drainage conditions,
          which results in the reduction of iron and other elements and in gray colors,
          and mottles. See also Gleysolic and Gleysol.
      Gleysol:
        description: A great group of soils in the Gleysolic order. A thin (less than
          8 cm, or 3 inches) Ah horizon is underlain by mottled gray or brownish gleyed
          material, or the soil has no Ah horizon. Up to 40 cm (16 inches) of mixed
          peat (bulk density 0.1 or more) or 60 cm (24 inches) of fibric moss peat
          (bulk density less than 0.1) may occur on the surface.
      Gleysolic:
        description: 'An order of soils developed under wet conditions and permanent
          or periodic reduction. These soils have low chromas, or prominent mottling,
          or both, in some horizons. See also: Gleysolic Soil Classification.'
      glycophytes:
        description: Nonhalophytic plants or plants that do not grow well when the
          osmotic pressure of the soil solution rises above 2 bars.
      grain density:
        description: See particle density.
      grain-size analysis (mechanical analysis):
        description: See particle-size analysis.
      grain-size distribution:
        description: See particle size distribution.
      granular:
        description: See structure / soil and structure types / soil.
      granule:
        description: Spheroidal soil aggregate.
      gravel:
        description: Rock fragments 2 mm to 7.5 cm (3 inches) in diameter.
      gravelly:
        description: Containing appreciable or significant amounts of gravel. The
          term is used to describe soils or lands. See also coarse fragments.
      gravitational potential:
        description: See water / soil.
      gravitational water:
        description: Water that moves into, through or out of the soil by gravity.
      Gray Brown Luvisol:
        description: A great group of soils in the Luvisolic order occurring in a
          moderate climate, higher than 5.5°C (42°F) mean annual temperature, and
          developed under deciduous and coniferous forest cover. These soils have
          a dark-colored mull-like surface (Ah) horizon, a light-colored eluviated
          (Ae) horizon, a brownish illuvial B (Bt) horizon, and a basic or calcareous
          C horizon. The solum is highly base saturated (NaCI extraction). This group
          includes soils formerly called Gray Brown Podzolic.
      Gray Luvisol:
        description: A great group of soils in the Luvisolic order occurring in moderately
          cool climates, where the mean annual temperature is usually lower than 5.5°C
          (42°F). The soils have developed under deciduous and coniferous forest cover,
          and have an eluviated light-colored surface (Ae) horizon, a brownish illuvial
          B (Bt) horizon, and usually a calcareous C horizon. The solum is base saturated
          (NaCI extraction). The Ahe horizon, if present, is less than 5 cm (2 inches)
          thick. This group includes soils formerly called Gray Wooded.
      great group:
        description: A category in the Canadian system of soil classification. It
          is a taxonomic group of soils having certain morphological features in common
          and a similar pedogenic environment. Examples are Black, Solonetz, Gray
          Brown Luvisol, Humic Podzol, Melanic Brunisol, Regosol, Gleysol, and Fibrisol.
      green manure:
        description: Plant material incorporated into the soil to improve it, while
          the plant material is still green.
      green-manure crop:
        description: A crop grown for use as green manure. See also green manure.
      ground fire (Forestry):
        description: A fire that consumes all the organic material of the forest floor
          and also burns into the underlying soil, for example, a peat fire. It differs
          from a surface fire by being invulnerable to wind. in a surface fire the
          flames are visible and burning is accelerated by wind whereas in a ground
          fire wind is not generally a serious factor.
      ground moraine:
        description: An unsorted mixture of rocks boulders, sand, silt, and clay deposited
          by glacial ice. The predominant material is till, but some stratified drift
          is present. Most of the till is thought to have accumulated under the ice
          by lodgment, but some till has been let down from the upper surface of the
          ice by ablation. Ground moraine is usually in the form of undulating plains
          having gently sloping swells, sags, and enclosed depressions.
      groundwater:
        description: Water that is passing through or standing in the soil and the
          underlying strata. It is free to move by gravity. See also water table.
      gully:
        description: A channel caused by erosion and the concentrated but intermittent
          flow of water during and immediately after heavy rains. It is deep enough
          to interfere with and not be removed by tillage operations.
      gully erosion:
        description: See erosion (2.).
      gyttja:
        description: 'A Swedish word, pronounced ""yut-tya."" A nutrient-rich sedimentary
          peat consisting mainly of plankton, other plant and animal residues, and
          mud. It is deposited in water in a finely divided condition.'
      H layer:
        description: See horizon; soil.
      habitat:
        description: The natural environment of an organism.
      halomorphic soil:
        description: A general term for saline and alkali soils.
      halophytic vegetation:
        description: Vegetation that grows naturally in soils having a high content
          of various salts. It usually has fleshy leaves or thorns and resembles desert
          vegetation.
      hardpan layer:
        description: See pans.
      heat capacity (volume):
        description: The amount of heat required to raise the temperature of a unit
          volume of soil by one degree. It may also be expressed in terms of weight.
      heat flux density:
        description: The quantity of heat flowing per unit of time across a unit area.
      heavy clay:
        description: A textural class. See also texture, soil.
      heavy soil:
        description: A soil having a high content of the fine separates, particularly
          clay, or a soil having a high drawbar pull and therefore hard to cultivate.
          See also fine texture.
      heterotrophic:
        description: Capable of deriving energy for life processes only from the decomposition
          of organic compounds and incapable of using inorganic compounds as sole
          sources of energy or for organic synthesis. See also autotrophic.
      honeycomb frost:
        description: Ice in the soil in insufficient quantity to be continuous, thereby
          giving the soil an open, porous structure that readily permits water to
          enter.
      horizon, soil:
        description: "A layer of soil or soil material approximately parallel to the\
          \ iand surface; it differs from adjacent genetically related layers in properties\
          \ such as color, structure, texture, consistence, and chemical, bioiogical,\
          \ and mineralogical composition. A list of the designations and some of\
          \ the properties of soil horizons and layers foilows. More detailed definitions\
          \ of some horizons and layers may be found in The Canadian System of Soil\
          \ Classification Organic layers contain 17% or more organic carbon. Two\
          \ groups of these layers are recognized: O An organic layer developed mainly\
          \ from mosses, rushes, and woody materials. Of least decomposed organic\
          \ layer, containing large amounts of well-preserved fiber, and called the\
          \ fibric layer. Om An intermediately decomposed organic layer containing\
          \ less fiber than an Of layer and called the mesic layer. Oh The most decomposed\
          \ organic layer, containing only small amounts of raw fiber and calied the\
          \ humic layer. L-F-H Organic layers developed primarily from leaves, twigs,\
          \ and woody materials, with a minor component of mosses. L The original\
          \ structures of the organic material are easily recognized. F The accumulated\
          \ organic material is partly decomposed . H The original structures of the\
          \ organic material are unrecognizable. Mineral horizons and layers contain\
          \ less than 17% organic carbon . A A mineral horizon formed at or near the\
          \ surface in the zone of removal of materiais in solution and suspension,\
          \ or maximum in situ accumulation of organic carbon, or both. B A mineral\
          \ horizon characterized by one or more of the following: An enrichment in\
          \ silicate clay, iron, aluminum, or humus. A prismatic or columnar structure\
          \ that exhibits pronounced coatings or stainings associated with significant\
          \ amounts of exchangeable sodium. An alteration by hydrolysis, reduction,\
          \ or oxidation to give a change in color or structure from the horizons\
          \ above or below, or both. C A mineral horizon comparatively unaffected\
          \ by the pedogenic processes operative in A and B, except gleying, and the\
          \ accumulation of carbonates and more soluble salts. R Underlying consolidated\
          \ bedrock that is too hard to break with the hands or to dig when moist.\
          \ Roman numerals are prefixed to horizon designations to indicate unconsolidated\
          \ lithologic discontinuities in the profile. Roman numeral I is understood\
          \ for the uppermost material and usually is not written. Subsequent contrasting\
          \ materials are numbered consecutively in the order in which they are encountered\
          \ downward, that is, II, III, and so on. Lowercase Suffixes b A buried soil\
          \ horizon. c A cemented (irreversible) pedogenic horizon. Ortstein, placic,\
          \ and duric horizons are examples. ca A horizon of secondary carbonate enrichment\
          \ where the concentration of lime exceeds that in the unenriched parent\
          \ material. e horizon characterized by removal of clay, iron, aluminum,\
          \ or organic matter alone or in combination and higher in color value by\
          \ one or more units when dry than an underlying B horizon. It is used with\
          \ A (Ae). f A horizon enriched with amorphous material, principally Fe and\
          \ Al combined with organic matter. It usually has a chroma of 3 or more.\
          \ The criteria for an f horizon except for Bgf are: it contains 0.6% or\
          \ more pyrophosphate-extractable Fe plus Al in textures finer than sand\
          \ and 0.4% or more in sands; the ratio of pyrophosphate-extractable Fe plus\
          \ Al to clay (less than 2 Fm) is greater than 0.5; and organic carbon exceeds\
          \ 0.5%. These horizons are differentiated on the basis of organic carbon\
          \ content into: Bf, 0.5% to 5% organic carbon Bhf, more than 5% organic\
          \ carbon. g A horizon characterized by gray colors, or prominent mottling\
          \ indicative of permanent or periodic intense reduction, or both; for example,\
          \ Aeg, Btg, Bg, and Cg. gf (used with B)-The dithionite-extractable Fe of\
          \ this horizon exceeds that of the IC by 1% or more and the dithionite-extractable\
          \ Al does not exceed that of the IC by more than 0.5%. h A horizon enriched\
          \ with organic matter. Ah An A horizon of organic matter accumulation. It\
          \ contains less than 17% organic carbon. It is one Munsell unit of color\
          \ value darker than the layer immediately below, or it has at least 0.5%\
          \ more organic carbon than the IC, or both. Ahe This horizon has been degraded,\
          \ as evidenced by streaks and splotches of light and dark gray material\
          \ and often by platy structure. Bh This horizon contains more than 1% organic\
          \ carbon and less than 0.3% pyrophosphate-extractable Fe; the ratio of organic\
          \ carbon to pyrophosphate-extractable Fe is 20 or more. j This is used as\
          \ a modifier of suffixes e, g, n, and t to denote an expression of, but\
          \ failure to meet, the specified limits of the suffix it modifies; for example,\
          \ Aej is an eluvial horizon that is thin, discontinuous, or faintly discernible.\
          \ k Presence of carbonate. m A horizon slightly altered by hydrolysis, oxidation,\
          \ or solution, or all three, to give a change in color, or structure, or\
          \ both. n A horizon in which the ratio of exchangeable Ca to exchangeable\
          \ Na is 10 or less. p A layer disturbed by man's activities, for example,\
          \ Ap. s A horizon containing detectable soluble salts. sa A horizon of secondary\
          \ enrichment of salts more soluble than Ca and Mg carbonates, where the\
          \ concentration of salts exceeds that present in the unenriched parent material\
          \ . t A horizon enriched with silicate clay, as indicated by a higher clay\
          \ content (by specified amounts) than the overlying eluvial horizon, a thickness\
          \ of at least 5 cm, oriented clay in some pores, or on ped surfaces, or\
          \ both, and usually a higher ratio of fine (less than 0.2 um) to total clay\
          \ than in the IC horizon. x A horizon of fragipan character. y A horizon\
          \ affected by cryoturbation. z A perennially frozen layer."
        see_also: https://sis.agr.gc.ca/cansis/publications/manuals/1998-cssc-ed3/index.html
      hue:
        description: The aspect of color that is determined by the wavelengths of
          light, and changes with the wavelength. Munsell hue notations indicate the
          visual relationship of a color to red, yellow, green, blue, or purple, or
          an intermediate of these hues. See also Munsell color system; chroma; and
          value, color.
      humic acids:
        description: A mixture of various dark-colored organic substances precipitated
          by acidifying a dilute alkali extract from the soil. The term is used by
          some workers to designate only the alcohol-insoluble part of this precipitate.
      Humic Gleysol:
        description: A great group of soils in the Gleysolic order. A dark-colored
          A (Ah or Ap) horizon more than 8 cm (3 inches) thick is underlain by mottled
          gray or brownish gleyed mineral material. It may have up to 40 cm (16 inches)
          of mixed peat (bulk density 0.1 or more) or up to 60 cm (24 inches) of fibric
          moss peat (bulk density less than 0.1) on the surface. This group includes
          soils formerly classified as Dark Gray Gleysolic and Meadow.
      humic layer:
        description: A layer of highly decomposed organic soil material containing
          little fiber.
      Humic Podzol:
        description: A great group of soils in the Podzolic order occurring in cool
          humid coastal regions, cool humid inland locations at higher altitudes,
          and some peaty depressions. The soils have a dark brown to black Bh horizon
          at least 10 cm (4 inches) thick, having rriore than 1% organic carbon, less
          than 0.3% pyrophosphate-extractable Fe, a ratio of organic carbon to pyrophosphate-extractable
          Fe of 20 or more, and a very low base saturation (NaCi extraction). A thin
          iron pan or a series of very thin (totaling less than 2.5 cm or 1 inch)
          iron pans may be present.
      humification:
        description: The processes by which organic matter decomposes to form humus.
          In humus the initial structures or shapes can no longer be recognized. See
          also humus.
      humin:
        description: The fraction of the soil organic matter that is not dissolved
          when the soil is treated with dilute alkali.
      Humisol:
        description: A great group of soils in the Organic order that are saturated
          for most of the year. The soils have a dominantly humic middle tier, or
          middle and surface tiers if a terric, lithic, hydric, or cryic contact occurs
          in the middle tier.
      Humo-Ferric Podzol:
        description: A great group of soils in the Podzolic order. The upper 10 cm
          (4 inches) of the B horizon (Bf) contains between 0.5% and 5% organic carbon
          and 0.6% or more pyrophosphate-extractable Al and Fe (0.4% for sands). The
          ratio of organic carbon to pyrophosphate-extractable Fe is less than 20.
          Most of the typical Podzols are classified as Humo-Ferric Podzols.
      humus:
        description: (1) The fraction of the soil organic matter that remains after
          most of the added plant and animal residues have decomposed. It is usualiy
          dark colored. (2) Humus is also used in a broader sense to designate the
          humus forms referred to as forest humus. They include principally mor, moder
          and mull. See also organic matter / soil; mor; moder; mull; and horizon/
          soil. (3) All the dead organic material on and in the soil that undergoes
          continuous breakdown, change and synthesis.
      hydration:
        description: Chemical combination of water with another substance.
      hydraulic conductivity:
        description: See water / soil.
      hydraulic gradient:
        description: See water/ soil.
      hydraulic head:
        description: See water/ soil.
      hydric layer:
        description: A layer of water in the control section of Organic soils, extending
          from a depth of not less than 40 cm (16 inches) to a depth of more than
          160 cm (64 inches).
      hydrogenic soil:
        description: Soil developed under the influence of water standing within the
          profile for prolonged periods; it is formed mainly in cold, humid regions.
      hydrologic cycle:
        description: The conditions through which water naturally passes from the
          time of precipitation until it is returned to the atmosphere by evaporation
          and is again ready to be precipitated.
      hydrolysis:
        description: The process by which a substrate is split to form two end products
          by the intervention of a molecule of water.
      hydromorphic soil:
        description: A general term for soils that develop under conditions of poor
          drainage in marshes, swamps, seepage areas, or flats. See also Gleysolic.
      hydrous mica:
        description: 'A term used in two different ways: (1) The groups of clay-sized
          micas that have a higher lattice water content and lower potassium content
          than ideal mica (illite). (2) Interstratified montmorillonite- and vermiculite-mica
          minerals in which mica predominates.'
      hygroscopic coefficient (Obsolete):
        description: The weight percentage of water held by, or remaining in, the
          soil (1) After the soil has been air-dried. (2) After the soil has reached
          equilibrium with an unspecified environment of high relative humidity, usually
          near saturation, or with a specified relative humidity at a specified temperature.
      hygroscopic water:
        description: Water adsorbed by a dry soil from an atmosphere of high relative
          humidity; water lost from an air-dry soil when it is heated to 105°C water
          held by the soil when it is at equilibrium with an atmosphere of a specified
          relative humidity at a specified temperature, usually 98% relative humidity
          at 25°C.
      hymatomelanic acid:
        description: The fraction of humus that is soluble in alcohol after having
          been extracted with alkali and precipitated with acid and when the alcohol
          is distilled, forms a brittle mass that is insoluble in alcohol.
      igneous rock:
        description: Rock formed by the cooling and solidification of magma. It has
          not been changed appreciably since its formation.
      illite:
        description: A hydrous mica. See also hydrous mica.
      illuvial horizon:
        description: A soil horizon in which material carried from an overlying layer
          has been precipitated from solution or deposited from suspension as a layer
          of accumulation. See also eluvial horizon.
      illuviation:
        description: The process of depositing soil material removed from one horizon
          in the soil to another, usually from an upper to a lower horizon in the
          soil profile. Illuviated substances include silicate clay, hydrous oxides
          of iron and aluminum, and organic matter.
      immature soil:
        description: A soil having indistinct or only slightly developed horizons.
          Also called juvenile soil.
      immobilization:
        description: The conversion of an element from the inorganic to the organic
          form in microbial tissues so that the element is not readily available to
          other organisms or plants.
      impeded drainage:
        description: A condition that hinders the movement of water by gravity through
          soils.
      impervious:
        description: Resistant to penetration by fluids or roots.
      impoverishment ( soil):
        description: The process or the result of making the soil less productive.
      improvement / soil:
        description: The processes for or the results of making the soil more productive
          for growing plants by drainage, irrigation, addition of fertilizers and
          soil amendments and so on.
      indicator plants:
        description: Plants that are characteristic of specific soil or site conditions.
      induced pan:
        description: See pressure or induced pan.
      indurated layer:
        description: A soil layer that has become hardened, generally by cementation
          of soil particles.
      infiltration:
        description: The downward entry of water into the soil.
      infiltration capacity (Obsolete):
        description: See infiltration rate.
      infiltration rate:
        description: A soil characteristic determining or describing the maximum rate
          at which water can enter the soil under specified conditions including the
          presence of excess water. It has the dimensions of velocity (i.e. cm³ cm-²
          sec-¹ = cm sec-¹). It was formerly called infiltration capacity. See also
          infiltration velocity.
      infiltration velocity:
        description: The actual rate at which water is entering the soil at a given
          time. It may be less than the maximum (the infiltration rate) because of
          a limited supply of water (rainfall or irrigation). It is expressed in the
          same units that are used for the infiltration rate. See also infiltration
          rate.
      infiltrometer:
        description: A device for measuring the rate of entry of fluid into a porous
          body, for example, water into soil.
      inhibition:
        description: The prevention of growth or multiplication of organisms.
      inoculation:
        description: The artificial introduction of microorganisms into a habitat
          or their introduction into a culture medium.
      inorganic soil:
        description: A soil made up mainly of mineral particles. See mineral soil.
      intergrade (soil):
        description: A soil that possesses moderately well-developed distinguishing
          characteristics of two or more genetically related taxa.
      interstratified clay mineral:
        description: An aggregation composed of random or regular intergrowths of
          two or more clay minerals.
      intrazonal soil:
        description: A soil having a morphology that shows the influence of some local
          factor of relief parent material or age rather than of climate and vegetation.
      intrinsic permeability:
        description: 'The property of a porous material that is related to the ease
          with which gases or liquids can pass through it. The Darcy ""k"" multiplied
          by n/pg where: n is the viscosity of the fluid in poises p is the density
          of the fluid in g cm-³ and g is the acceleration of gravity in cm sec-².
          See also permeability of soil; and water / soil.'
      ion:
        description: Atom or group of atoms or compound that is electrically charged
          as a result of the loss of electrons (cation) or the gain of electrons (anion).
      ion activity:
        description: 'The effective concentration of a particular ion in a solution
          or soil-water system. It is expressed analogously to pH as ""pCa"" or ""pNa""
          and so forth.'
      iron pan:
        description: 'A thin indurated soil horizon in which iron is a major constituent
          of the cementing material. Several kinds of cementing materials occur: I
          - iron - organic matter complexes II - hydrous oxides of manganese and iron
          III - hydrous iron oxides'
      irrigation:
        description: The artificial application of water to the soil for the benefit
          of growing crops.
      irrigation efficiency:
        description: The ratio of the water actually consumed by crops on an irrigated
          area to the amount of water diverted from the source onto the area.
      irrigation methods:
        description: 'The manner in which water is artificially applied to an area.
          The methods and the manner of applying the water follow: border-strip Water
          is applied at the upper end of a strip having earthen dikes to confine the
          water to the strip. check-basin Water is applied rapidly to fairly level
          plots surrounded by levees. The basin is a small check. corrugation Water
          is applied to small closely spaced furrows in grain and forage crops to
          confine the flow of irrigation water to one direction. flooding Water is
          released from field ditches and allowed to flood over the land. furrow Water
          is applied to row crops in ditches between the rows made by tiilage implements.
          sprinkler Water is sprayed over the soil surface through nozzles from a
          pressure system. subirrigation Water is applied to open ditches or tile
          lines until the water table is high enough to wet the soil. wild flooding
          Water is released at high points in the field and distribution is uncontrolled.'
      isodyne:
        description: Points of a cultivating implement having equal dynamometer pull;
          a line on a map of a cultivated field connecting points of equal dynamometer
          pull.
      isomorphous substitution:
        description: The replacement of one atom by another of similar size in a crystal
          lattice without disrupting or changing the crystal structure of the mineral.
      kame:
        description: An irregular ridge or hill of stratified glacial drift deposited
          by glacial meltwater.
      kaolin group:
        description: Hydrous aluminosilicates having a 1:1 phyllosilicate structure
          and no permanent charge.
      kettle:
        description: Depression left after the melting of a detached mass of glacier
          ice buried in drift.
      L layer:
        description: See horizon / soil.
      lacustrine deposit:
        description: Material deposited in lake water and later exposed either by
          lowering of the water level or by uplifting of the land. These sediments
          range in texture from sands to clays.
      lagg:
        description: The depressed margin of a raised bog.
      lamina:
        description: A unit layer less than 1 cm thick in a stratified sequence.
      land:
        description: "The solid part of the earth's surface or any part thereof. A\
          \ tract of land is defined geographically as a specific area of the earth's\
          \ surface. Its characteristics embrace all reasonably stable, or predictably\
          \ cyclic, attributes of the biosphere vertically above and below this area,\
          \ including those of the atmosphere, the soil and the underlying geology,\
          \ the hydrology, the plant and animal populations, and the results of past\
          \ and present human activity to the extent that these attributes exert a\
          \ significant influence on the present and future uses of land by man."
      land classification:
        description: The arrangement of land units into various categories based on
          the properties of the land or its suitability for some particular purpose.
      land type:
        description: See association/ soil.
      landforms:
        description: The various shapes of.the land surface resulting from a variety
          of actions such as deposition or sedimentation (eskers, lacustrine basins),
          erosion (gullies, canyons) and earth crust movements (mountains).
      landscape:
        description: "All the natural features such as fields, hills, forests, and\
          \ water that distinguish one part of the earth's surface from another part.\
          \ Usually it is the portion of land or territory that the eye can see in\
          \ a single view, including all its natural characteristics."
      landslide (landslip):
        description: (1) A mass of material that has slipped downhill by gravity,
          often assisted by water when the material is saturated. (2) Rapid movement
          of a mass of soil, rock, or debris down a slope.
      latitude zonation:
        description: Latitudinal (normal) zonation of soils. See also vertical zonation.
      lattice energy:
        description: The energy required to separate the ions of a crystal to an infinite
          distance from each other.
      lattice structure:
        description: The orderly arrangement of atoms in a crystalline material.
      leaching:
        description: The removal from the soil of materials in solution. See also
          eluviation.
      levee:
        description: A natural or artificial embankment along a river or stream.
      lichen:
        description: A symbiotic, mutualistic association of an algal type and a fungal
          type.
      lime concretion:
        description: An aggregate of precipitated calcium carbonate or other material
          cemented by precipitated calcium carbonate.
      lime potential:
        description: The negative logarithm of the ratio of the hydrogen ion activity
          to the square root of the sum of the activities of calcium and magnesium
          in the soil solution. It is generally written as pH - 1/2p(Ca + Mg). It
          can also be written as 1/2 log [(Ca + Mg)(OH)2] + pKw, where Kw is the ionic
          product of water. Lime potential is an expression of the sum of the activities
          of calcium and magnesium hydroxides in the soil solution. See also corrected
          lime potential.
      lime requirement:
        description: The amount of agricultural limestone, or the equivalent of another
          liming material, required per hectare to a soil depth of 15 cm (or for 2240
          t of soil) to raise the pH of the soil to a specific value under field conditions.
      lime, agricultural:
        description: A soil amendment consisting principally of calcium carbonate,
          and including magnesium carbonate and perhaps other materials. It is used
          to supply calcium and magnesium as essential elements for growth of plants
          and to neutralize soil acidity.
      limno layer:
        description: In organic soil, a layer at least 5 cm (2 inches) thick composed
          of marl, diatomaceous earth, or coprogenous earth (sedimentary peat).
      liquefaction (spontaneous liquefaction):
        description: The sudden large decrease of the shearing resistance of a cohesionless
          soil. It is caused by a collapse of the structure by shock or other strain
          and is associated with a sudden, temporary increase of the interstitial
          water pressure. It involves a temporary transformation of the material into
          a fluid mass. See also quick clay.
      liquid limit:
        description: (upper plastic limit, Atterberg limit) (1) The water content
          corresponding to an arbitrary limit between the liquid and plastic states
          of consistence of a soil. (2) The water content at which a pat of soil,
          cut by a standard-sized groove, will flow together for a distance of 12
          mm under the impact of 25 blows in a standard liquid-limit apparatus.
      lithic layer:
        description: Bedrock under the control section of a soil. In Organic soils,
          bedrock occurring within a depth of between 10 cm (4 inches) and 160 cm
          (64 inches) from the surface.
      lithosequence:
        description: A group of related soils that differ from each other in certain
          properties primarily because of differences in the parent rock.
      loam:
        description: A soil textural class. See also texture, soil.
      loamy:
        description: 'Intermediate in texture and properties between fine-textured
          and coarse-textured soils. It includes all textural classes having ""loam""
          or ""loamy"" as a part of the class name, such as clay loam or loamy sand.
          See also loam and texture, soil.'
      loamy fine sand:
        description: See texture / soil.
      loamy sand:
        description: See texture/ soil.
      loamy very fine sand:
        description: See texture, soil.
      loess:
        description: Material transported and deposited by wind and consisting of
          predominantly silt-sized particles.
      loose:
        description: A soil consistence term. See also consistence.
      lower plastic limit:
        description: See plastic limit.
      Luvic Gleysol:
        description: A great group of soils in the Gleysolic order developed under
          wet conditions, under grass or forest or both. The soils have Aeg and Btg
          horizons.
      Luvisolic:
        description: 'An order of soils that have eluvial (Ae) horizons, and illuvial
          (Bt) horizons in which silicate clay is the main accumulation product. The
          soils developed under forest or forest-grassland transition in a moderafe
          to cool climate. See also: Luvisolic Soil Classification.'
      lysimeter:
        description: (1) A device for measuring percolation and leaching losses of
          water and solutes from a column of soil under controlled conditions. (2)
          A device for measuring gains (precipitation and condensation) and losses
          (evapotranspiration) of water by a column of soil.
      macronutrient:
        description: A chemical element necessary in large amounts, usually greater
          than 1 ppm in the plant, for the growth of plants and usually applied artificially
          in fertilizer or liming materials. Macro refers to the quantity and not
          to the essentiality of the element to the plant.
      macroscopic velocity:
        description: See flow velocity.
      made land:
        description: Areas filled with earth, or earth and trash mixed, usually by
          or under the control of man. A miscellaneous land type.
      management / soil:
        description: (1) The total of all tillage operations, cropping practices,
          fertilizer, lime, and other treatments conducted on or applied to a soil
          for the production of plants. (2) The division of soil science dealing with
          the items listed in 1.
      management groups / soil:
        description: Groups of soil units having similar adaptations or management
          requirements for one or more specific purposes such as adapted crops or
          crop rotations, drainage practices, fertilization, forestry and highway
          engineering.
      manure:
        description: The excreta of animals with or without the admixture of bedding
          or litter in varying stages of decomposition. It is also called barnyard
          manure or stable manure. This is the usual meaning in North America. In
          some countries manure is used to refer to any fertilizer.
      map / soil (Pedology):
        description: "A map showing the distribution of soil types or other soil mapping\
          \ units related to the prominent physical and cultural features of the earth's\
          \ surface. Descriptions of five kinds of soil maps follow: detailed soil\
          \ map A soil map showing the boundaries between soil types or complexes\
          \ of intimately associated soil types. The scale of the map depends on the\
          \ purpose of the map, the intensity of land use, the pattern of soils, and\
          \ the scale of other cartographic materials available. Traverses are usually\
          \ made at 1/2-km (1/4-mile) intervals, or more frequently. The scale commonly\
          \ used for field mapping is l:10,000 to 1:25,000. detailed reconnaissance\
          \ soil map A map showing the distribution of soils and physical features\
          \ as determined by traversing the area at intervals of 1 to 2 km ( 'M2 to\
          \ 1 mile). The scale, depending on the detail required, is 1:50,000 to 1:125,000.\
          \ generalized soil map A small-scale soil map showing the general distribution\
          \ of soils within a large area in less detail than on a detailed soil map.\
          \ reconnaissance soil map A map, with less detail than the detailed reconnaissance\
          \ map, showing the general distribution of soils determined by traverses\
          \ at intervals of 2 to 4 km (1 to 2 miles). The scale is generally 1:125,000\
          \ to 1:250,000. schematic soil map A soil map compiled from scant knowledge\
          \ of the soils of new and undeveloped regions by applying available information\
          \ about the soil-formation factors of the area. The scale is usually 1:500,000\
          \ or smaller."
      map unit:
        description: "Map unit is a generalization concept used in soil mapping to\
          \ identify polygons with similar combinations of soils and landscapes. Each\
          \ map unit consists of one or more polygons on a soil map. The degree of\
          \ generalization employed when developing map units is the soil surveyor's\
          \ perogative, and varying degrees of generalization were employed when mapping\
          \ Canada's land resources."
      marl:
        description: A soft, unconsolidated earthy deposit consisting of calcium carbonate
          or magnesium carbonate, or both, and often shells, usually mixed with varying
          amounts of clay or other impurities.
      marsh:
        description: Periodically flooded or continually wet areas having the surface
          not deeply submerged. It is covered dominantly with sedges, cattails, rushes,
          or other hydrophytic plants. Subclasses include freshwater and saltwater
          marshes. See also swamp.
      mass wasting:
        description: A general term for a variety of processes by which large masses
          of earth material are moved by gravity from one place to another.
      matric potential:
        description: See water / soil.
      matrix; soil:
        description: The main soil constituent or material that encloses other soil
          features, for example, concretions embedded in a fine-grained matrix.
      mature soil:
        description: A soil having well-developed soil horizons produced by the natural
          processes of soil formation.
      maximum water-holding capacity:
        description: The average moisture content of a disturbed sample of soil 1
          cm high that is at equilibrium with a water table at its lower surface.
      mechanical analysis:
        description: See particle-size analysis and particle-size distribution.
      mechanics and engineering / soil:
        description: The subspecialization of soil science dealing with the effect
          of forces on the soil and the application of engineering principles to problems
          involving the soil.
      medium texture:
        description: 'Intermediate between fine-textured and coarse-textured soils.
          It includes the following textural classes: very fine sandy loam, loam,
          silt loam and silt.'
      Melanic Brunisol:
        description: A great group of soils in the Brunisotic order. The soils have
          mull Ah horizons thicker than 5 cm (2 inches) and base-saturated Bm horizons.
          This group includes soils formerly classified as Brown Forest.
      mellow soil:
        description: A very soft and very friable and porous soil having no tendency
          toward hardness or harshness. See also consistence.
      mesa:
        description: A rather flat-topped, steep-sided hill or mountain that is usually
          composed of nearly horizontal strata of bedrock.
      mesic layer:
        description: A layer of organic material at a stage of decomposition between
          that of the fibric and humic layers.
      Mesisol:
        description: A great group of soils in the Organic order that are saturated
          for most of the year. The soils have a dominantly mesic middle tier, or
          middle and surface tiers if a terric, lithic, hydric, or cryic contact occurs
          in the middle tier.
      mesophile:
        description: An organism growing best at moderate temperatures of 25 to 40°C.
      metamorphic rock:
        description: Rock derived from preexisting rocks but differing from them in
          physical, chemical and mineralogical properties as a result of natural geological
          processes, principally heat and pressure, originating within the earth.
          The preexisting rocks may have been igneous, sedimentary or another form
          of metamorphic rock.
      mica:
        description: A mineral group consisting of phyllosilicates having sheetlike
          2:1 lattice structures generally with potassium in the interlayer position.
      microaerophile:
        description: A microorganism growing best in the presence of small amounts
          of atmospheric oxygen.
      microbiology / soil:
        description: The subspecialization of soil science dealing with soil-inhabiting
          microorganisms and their relationship to agriculture including both plant
          and animal growth.
      microclimate:
        description: (1) The climate of a small area resulting from the modification
          of the general climate by local differences in elevation or exposure. (2)
          The sequence of atmospheric changes within a very small region.
      microfauna:
        description: The part of the animal population consisting of individuals that
          are too small to be clearly distinguished without the use of a microscope.
          It includes protozoa and nematodes.
      microflora:
        description: The part of the plant population consisting of individuals that
          are too small to be clearly distinguished without the use of a microscope.
          It includes algae and bacteria and fungi.
      micronutrient:
        description: 'A chemical element necessary in only small amounts usually less
          than 1 ppm in the plant and for the growth of plants and the health of animals.
          Examples of these elements are boron, molybdenum, copper, iron, manganese
          and zinc. ""Micro"" refers to the amount, not the essentiality of the element
          to the organism. See also macronutrient.'
      microorganism:
        description: A form of life of microscopic size.
      microrelief:
        description: microrelief Small-scale, local differences in relief, including
          mounds, swales, or hollows. See also cradle knoll and gilgai.
      midden:
        description: A refuse heap marking the site of previous habitation.
      mine dump:
        description: Area covered with overburden and other waste materials from ore
          and coal mines, quarries, and smelters, and usually having little or no
          vegetative cover. A miscellaneous land type.
      mine wash:
        description: Water-deposited accumulations of sandy, silty, or clayey material
          recently eroded in mining operations. It may clog streams and channels,
          and damage land on which it is deposited. A miscellaneous land type.
      mineral:
        description: A homogeneous naturaily occurring phase, sometimes restricted
          to inorganic, crystalline phases.
      mineral (soil ):
        description: mineral, soil (1) Any mineral occurring as a part of or in the
          soil. (2) A natural inorganic compound with definite physical, chemical,
          and crystalline properties (within the limits of isomorphism) occurring
          in the soil. See also clay mineral.
      mineral soil:
        description: A soil consisting predominantly of, and having its properties
          determined predominantly by, mineral matter. It contains less than 17% organic
          carbon except for an organic surface layer that may be up to 40 cm (16 inches)
          thick if formed of mixed peat (bulk density 0.1 or more) or 60 cm (24 inches)
          if of fibric moss peat (bulk density less than 0.1).
      mineralization:
        description: The conversion of an element from an organic form to an inorganic
          state as a result of microbial decomposition.
      mineralogical analysis:
        description: The estimation or determination of the kinds or amounts of minerals
          present in a rock or a soil.
      mineralogy /soil:
        description: "The subspecialization of soil science dealing with the homogeneous\
          \ inorganic materials found in the earth's crust to the depth of weathering\
          \ or sedimentation."
      minor element:
        description: See micronutrient.
      miscellaneous land type:
        description: A mapping unit for areas of land that have little or no natural
          soil or that are inaccessible for orderly examination or where for some
          reason it is not feasible to classify the soil. For example rough mountainous
          land, eroded slopes and marshes.
      moder:
        description: A zoogenous forest humus form made up of plant remains partly
          disintegrated by the soil fauna (F layer) but not matted as in raw humus.
          It is transitional to a zone of spherical or cylindrical microdejections
          of arthropods that is permeated by loose mineral particles in its lower
          part and often throughout. Although incorporation of organic matter is intense
          it is shallow because none of the organisms concerned with moder formation
          have important burrowing activity. The mixing of organic and mineral particles
          is purely mechanical. Organic carbon under the F layer varies from 23% to
          29%, but may exceed 35%. The C:N ratio is 20 to 25 and sometimes lower.
          Various subgroups can be recognized by their morphoiogy and chemical characteristics.
      moderately coarse texture:
        description: Consisting predominantly of coarse particles. In soil textural
          classification it includes all the sandy loams except the very fine sandy
          loam. See also coarse texture
      moderately fine texture:
        description: Consisting predominantly of intermediate-sized soil particles
          with or without small amounts of fine or coarse particles. In soil textural
          classification, it includes clay loam, sandy clay loam and silty clay loam.
          See also fine texture.
      moisture (soil):
        description: Water contained in the soil.
      moisture equivalent:
        description: The weight percentage of water retained by a previously saturated
          sample of soil 1 cm thick after it has been subjected to a centrifugal force
          of 1000 times gravity for 30 min.
      moisture tension / soil:
        description: 'In soils partially saturated with water there is moisture tension,
          which is equal in magnitude but opposite in sign to the soil water pressure.
          Moisture tension is equal to the pressure that must be applied to the soil
          water to bring it to a hydraulic equilibrium, through a porous permeable
          wall or membrane, with a pool of water of the same composition. The pressures
          used and the corresponding percentages most commonly determined are: 15-atmosphere
          percentage (pourcentage &agrave; atmosph&egrave;res) The percentage of water
          contained in a soil that has been saturated, subjected to, and is in equilibrium
          with, an applied pressure of 15 atm. Pressure is applied in a pressure membrane
          or ceramic pressure plate apparatus. It is usually expressed as a weight
          percentage, but may be expressed as a volume percentage. It is approximately
          the same as 15-bar percentage. 15-bar percentage (pourcentage &agrave; 15
          bars) The percentage of water contained in a soil that has been saturated,
          subjected to, and is in equilibrium with an applied pressure of 15 bars.
          Pressure is applied in a pressure membrane or ceramic plate apparatus. It
          is usually expressed as a weight percentage, but may be expressed as a volume
          percentage. It is approximately the same as 15-atmosphere percentage. 1/3-atmosphere
          percentage (pourcentage &agrave; 1/3 atmosph&egrave;res) The percentage
          of water contained in a soil that has been saturated, subjected to, and
          is in equilibrium with an applied pressure of l/3 atm. Pressure is applied
          in a ceramic plate apparatus. It is usually expressed as a weight percentage,
          but may be expressed as a volume percentage. It is approximately the same
          as l/3-bar percentage. Also, for medium- to coarse-textured soils it is
          approximately numerically equal to moisture equivalent. 1/3-bar percentage
          (pourcentage &agrave; 1/3 bar) The percentage of water contained in a soil
          that has been saturated, subjected to, and is in equilibrium with an applied
          pressure of l/3 bar. Pressure is applied in a ceramic plate apparatus. It
          is usually expressed as a weight percentage and is approximately the same
          as l/3-atmosphere percentage. Also, for medium- to coarse-textured soils
          it is approximately numerically equal to moisture equivalent. 60-centimetre
          percentage (pourcentage &agrave; 60 centim&egrave;tres) The percentage of
          water contained in a soil that has been saturated, subjected to, and is
          in equilibrium with an applied pressure or tension equivalent to a column
          of water 60 cm high. Pressure may be applied in a pressure plate apparatus
          or, as a tension, on a tension table. It may be expressed on a weight or
          volume basis and is considered by many to approximate the "field capacity,"
          especially in medium- to coarse-textured soils.'
      moisture-release curve:
        description: See moisture-retention curve.
      moisture-retention curve:
        description: A graph showing the soil-moisture percentage (by weight or by
          volume) versus applied tension or pressure. Points on the graph are usually
          obtained by increasing or decreasing the applied tension or pressure over
          a specified range.
      moisture-volume percentage:
        description: The ratio of the volume of water in a soil to the total bulk
          volume of the soil.
      moisture-weight percentage:
        description: The moisture content expressed as a percentage of the ovendry
          weight of soil. See also dry-weight percentage.
      monolith (soil):
        description: A vertical section of a soil profile removed from the soil and
          mounted for display or study.
      montmorillonite:
        description: A specific aluminous member of the smectite group.
      montmorillonite group:
        description: Clay minerals having a 2:1 expanding crystal lattice. Isomorphous
          substitution gives the various types and causes a net permanent charge balanced
          by cations in such a manner that water may move between the sheets, giving
          reversible cation exchange and very plastic properties. Synonymous with
          smectite.
      mor (or raw humus):
        description: A nonzoogenous forest humus form distinguished by a matted F
          layer and a holorganic H layer with a sharp delineation from the A horizon.
          It is generally acid, having high organic carbon content (52% or more) and
          a high C:N ratio (25-35, sometimes higher). Various subgroups can be recognized
          by the morphology, and chemical and biological properties.
      moraine:
        description: An accumulation of earth, generally with stones, carried and
          finally deposited by a glacier. Several kinds of moraines are distinguished,
          such as ground moraine and end moraine.
      morphology (soil):
        description: 1. The physical constitution, particularly the structural properties,
          of a soil profile as exhibited by the kinds, thickness, and arrangement
          of the horizons in the profile, and by the texture, structure, consistence,
          and porosity of each horizon. 2. The structural characteristics of the soil
          or any of its parts.
      mottled zone:
        description: A layer that is marked with spots or blotches of different color
          or shades of color. The pattern of mottling and the size, abundance, and
          color contrast of the mottles may vary markedly and should be specified
          in the soil description.
      mottles:
        description: Spots or blotches of different color or shades of color interspersed
          with the dominant color.
      mottling:
        description: Formation or presence of mottles in the soil.
      muck soil:
        description: An organic soil consisting of highly decomposed materials. Mucky
          peat and peaty muck are terms used to describe increasing stages of decomposition
          between peat and muck.
      mudflow slide:
        description: 'Movement of large masses of ""quick clay.""'
      mulch:
        description: Any material such as straw, sawdust, leaves, plastic film, or
          loose soil that is spread on the surface of the soil to protect the soil
          and the plant roots from the effects of raindrops, soil crusting, freezing,
          and evaporation.
      mulch (to):
        description: To apply a mulch to the surface of the soil.
      mulch farming:
        description: A system of farming in which the organic residues are not plowed
          into or mixed with the soil but are left on the surface as a mulch.
      mull:
        description: A zoogenous forest humus form consisting of an intimate mixture
          of well-humified organic matter and mineral soil that makes a gradual transition
          to the horizon underneath. It is distinguished by its crumb or granular
          structure, and because of the activity of the burrowing microfauna (mostly
          earthworms), partly decomposed organic debris does not accumulate as a distinct
          layer (F layer) as in mor and moder. The organic matter content is 5-20%
          and the C:N ratio is 10-15. Various subgroups can be distinguished by the
          morphology and chemical characteristics. Ah horizon.
      Munsell color system:
        description: 'A color designation system specifying the relative degrees of
          the three simple variables of color: hue, value and chroma. For example:
          10YR 6/4 is the color of a soil having a hue of 10YR, value of 6 and chroma
          of 4. These notations can be translated into several different systems of
          color names. See also chroma, hue and value, color.'
      mycelium:
        description: A mass of threadlike filaments, branched or composing a network,
          that constitutes the vegetative structure of a fungus.
      mycorrhiza:
        description: The association usually symbiotic of fungi with the roots of
          seed plants. See also ectotrophic mycorrhiza and endotrophic mycorrhiza.
      natural erosion:
        description: "Wearing away of the earth's surface by water, ice or other natural\
          \ agents under natural environmental conditions such as climate and vegetation,\
          \ undisturbed by man. Synonymous with geological erosion."
      neutral soil:
        description: A soil in which the surface layer to plow depth is neither acid
          nor alklaine in reaction. See also acid soil; alkaline soil; pH, soil; and
          reaction, soil.
      nitrate reduction:
        description: The biochemical reduction of nitrate.
      nitrification:
        description: The biochemical oxidation of ammonium to nitrate.
      nitrogen assimilation:
        description: The incorporation of nitrogen into organic cell substances by
          living organisms.
      nitrogen cycle:
        description: The sequence of biochemical changes by which nitrogen is used
          by a living organism, liberated upon the death and decomposition of the
          organism, and converted to its original state of oxidation.
      nitrogen fixation:
        description: The conversion of elemental nitrogen (N2) to organic combinations
          or to forms readily utilizable in biological processes.
      nodule (soil):
        description: A rounded unit within the soil matrix that differs from the surrounding
          material because of the concentration of some constituent or a change in
          fabric.
      noncapillary porosity (Obsolete):
        description: (obsolete) See air porosity.
      nonsoil:
        description: Nonsoil is the collection of soil material or soil-like material
          that does not meet the definition of soil. It includes soil displaced by
          unnatural processes and unconsolidated material unaffected by soil-forming
          processes, except for the material that occurs within 15 cm (6 inches) below
          soil as defined. Nonsoil also includes unconsolidated mineral or organic
          material thinner than 10 cm (4 inches) overlying bedrock; organic material
          thinner than 40 cm (16 inches) overlying a hydric layer; and soil covered
          by more than 60 cm (24 inches) of water in the driest part of the year.
          See soil.
      normal erosion:
        description: The gradual erosion of land used by man. It does not greatly
          exceed natural erosion. See natural erosion.
      Oil wasteland:
        description: Land on which oily wastes have accumulated, including slush pits
          and adjacent areas affected by oil waste. A miscellaneous land type.
      one-third atmosphere percentage:
        description: See moisture tension / soil.
      one-third bar percentage:
        description: See 1/3-atmosphere percentage
      order; soil:
        description: 'A category in the Canadian system of soil classification. All
          the soils of Canada have been divided into ten orders: Chernozemic, Solonetzic,
          Luvisolic, Podzolic, Brunisolic, Regosolic, Gleysolic, Vertisolic, Cryosolic,
          and Organic. All the soils within an order have one or more characteristics
          in common.'
      Organic:
        description: 'An order of soils that have developed dominantly from organic
          deposits. The majority of Organic soils are saturated for most of the year,
          unless artificially drained, but some of them are not usually saturated
          for more than a few days. They contain 17% or more organic carbon, and:
          (1) if the surface layer consists of fibric organic material and the bulk
          density is less than 0.1 [with or without a mesic or humic Op less than
          15 cm (6 inches) thick], the organic material must extend to a depth of
          at least 60 cm (24 inches); or (2) if the surface layer consists of organic
          material with a bulk density of 0.1 or more, the organic material must extend
          to a depth of at least 40 cm (16 inches); or (3) if a lithic contact occurs
          at a depth shallower than stated in 1) or 2) above, the organic material
          must extend to a depth of at least 10 cm (4 inches). See also: Organic Soil
          Classification.'
      organic matter (soil ):
        description: The organic fraction of the soil includes plant and animal residues
          at various stages of decomposition, cells and tissues of soil organisms
          and substances synthesized by the soil population. It is usually determined
          on soils that have been sieved through a 2.0-mm sieve.
      organic phosphorus:
        description: Phosphorus present as a constituent of an organic compound or
          a group of organic compounds such as glycerophosphoric acid, inositol phosphoric
          acid and cytidylic acid.
      ortstein:
        description: (1) An indurated layer in the B horizon of Podzols in which the
          cementing material consists of illuviated sesquioxides and organic matter.
          (2) As a subgroup of Podzolic soils, Ortstein indicates a Bhfc or Bfc horizon
          that is strongly cemented, occurs over at least one-third of the exposure,
          and is at least 2.5 cm (1 inch) thick.
      osmotic potential:
        description: See water/ soil.
      Osmotic pressure:
        description: See water; soil.
      Outwash:
        description: Sediments washed out by flowing water beyond the glacier and
          laid down as stratified drift in thin foreset beds. The particle size may
          vary from boulders to silt.
      ovendry soil:
        description: Soil that has been dried at 105°C until it has reached constant
          weight.
      Overconsolidated soil deposit:
        description: A soil deposit that has been subjected to an effective pressure
          greater than the present overburden pressure.
      pans:
        description: Horizons or layers in soils that are strongly compacted, indurated,
          or very high in clay content. See also caliche, claypan, fragipan, genetic
          pan, iron pan, and pressure or induced pan.
      parent material:
        description: The unconsolidated and more or less chemically weathered mineral
          or organic matter from which the solum of a soil has developed by pedogenic
          processes.
      parent rock:
        description: The rock from which the parent materials of soils are formed.
      partial sterilization:
        description: The elimination of a portion of a population of microorganisms,
          usually by heat or chemical treatment. The process is selective, and certain
          organisms or groups of organisms are destroyed to a greater extent than
          others.
      particle density:
        description: The mass per unit volume of the soil particles. It is usually
          expressed in grams per cubic centimetre. Has been called grain density.
      particle size:
        description: 'See: bulk density, soil.'
      particle-size analysis:
        description: The determination of the various amounts of the different separates
          in a soil sample, usually by sedimentation, sieving, micrometry, or combinations
          of these methods. Has been called grain-size analysis or mechanical analysis.
      particle-size distribution:
        description: particle-size distribution
      parts per million (ppm):
        description: Weight units of any given substance per one million equivalent
          weight units of ovendry soil; or, for soil or other solutions, the weight
          units of solute per million weight units of solution.
      peat:
        description: Unconsolidated soil material consisting iargely of undecomposed
          or only slightly decomposed organic matter.
      peat soil:
        description: An organic soil having no, or only slight, decomposition.
      ped:
        description: A unit of soil structure such as a prism, block, or granule,
          which is formed by natural processes, in contrast with a clod, which is
          formed artificially.
      pedogenesis:
        description: See genesis, soil(1.)
      pedology:
        description: The aspects of soil science dealing with the origin, morphology,
          genesis, distribution, mapping, and taxonomy of soils, and classification
          in terms of their use. See also science, soil.
      peneplain:
        description: A rugged area that was high at one time, but has been reduced
          by erosion to a low gently rolling surface resembling a plain.
      penetrability:
        description: The ease with which a probe can be pushed into the soil. It may
          be expressed in units of distance speed, force, or work, depending on the
          type of penetrometer used.
      perched water table:
        description: 'A water table due to the ""perching"" of water on a relatively
          impermeable layer at some depth within the soil. The soil within or below
          the impermeable layer is not saturated with water.'
      percolation (of soil water):
        description: The downward movement of water through soil; specifically, the
          downward flow of water in saturated or nearly saturated soil at hydraulic
          gradients of 1.0 or less.
      periglacial:
        description: Indicative of all cold-climate processes, whether or not they
          occur in the immediate vicinity of glaciers.
      permafrost:
        description: (1) Perennially frozen material underlying the solum. (2) A perennially
          frozen soil horizon.
      permafrost table:
        description: The upper boundary of permafrost, usually coincident with the
          lower limit of seasonal thaw. See also permafrost (1.).
      permanent charge:
        description: The net negative or positive charge of clay particles inherent
          in the crystal lattice of the particle. It is not affected by changes in
          pH or by ion-exchange reactions.
      permeability (soil ):
        description: '(1) The ease with which gases and liquids penetrate or pass
          through a bulk mass of soil or a layer of soil. Because different soil horizons
          vary in permeability, the specific horizon should be designated. (2) The
          property of a porous medium that relates to the ease with which gases or
          liquids can pass through it. Previously, it was considered to be the ""k""
          in Darcy''s law. It is the ""K"" in intrinsic permeability. See also intrinsic
          permeability, Darcy''s law and water / soil.'
      pesticides:
        description: Chemicals that kill organisms that are injurious to man or to
          the crops and animals upon which he depends for food, fiber and shelter.
          These organisms include insects, mites, microorganisms, weeds and rodents.
          Pesticides include insecticides, fungicides, herbicides and others.
      pF (Obsolete):
        description: The logarithm of the soil-moisture tension measured by the height
          in centimetres of a column of water that produces a tension of equal force.
      pH (soil):
        description: The negative logarithm of the hydrogen-ion activity of a soil.
          The degree of acidity or alkalinity of a soil as determined by means of
          a glass, quinhydrone, or other suitable electrode or indicator at a specified
          moisture content or soil-water ratio, and expressed in terms of the pH scale.
      pH-dependent cation exchange capacity:
        description: The difference between the effective cation exchange capacity
          and the cation exchange capacity of a soil measured at a pH higher than
          that of its natural value.
      phase (soil):
        description: A subdivision of a soil type or other unit of classification
          having characteristics that affect the use and management of the soil, but
          that do not vary sufficiently to differentiate it as a separate type. A
          variation in a property or characteristic such as degree of slope, degree
          of erosion, or content of stones.
      photomap:
        description: A mosaic map made from aerial photographs showing physical and
          cultural features as on a planimetric map. See also planisaic and toposaic.
      phyllosilicates:
        description: Silicate structures in which the SiO4 tetrahedra are linked together
          in infinite two-dimensional sheets and are condensed with layers of AlO
          or MgO octahedra in the ratio 2:1 or 1:1. Isomorphous substitution of certain
          elements often occurs.
      physical properties of soils:
        description: 'The characteristics, processes or reactions of a soil that are
          caused by physical forces, and are described by, or expressed in physical
          terms or equations. Sometimes physical properties are confused with and
          hard to separate from chemical properties; hence the terms "physical-chemical"
          or "physicochemical". Examples of physical properties are bulk density,
          water-holding capacity, hydraulic conductivity, porosity and pore-size distribution.'
      physical weathering:
        description: The breakdown of rock and mineral particles into smaller particles
          by physical forces such as frost action and wind. See also weathering.
      physiosorption:
        description: The process of attachment of nonionic substances such as polar
          water molecules or acetic acid molecules or nucleic acids to clays or other
          solid-phase surfaces. The attachment of large molecules to clay particles
          by ionic processes is not physiosorption.
      phytogenic soils (Obsolete):
        description: Soils developed under the dominant influence of natural vegetation,
          mainly in temperate regions.
      phytometer:
        description: A piant or group of plants used to measure the physical factors
          of the habitat in terms of physiological activities.
      phytomorphic soils:
        description: Well-drained soils of an association that have developed under
          the dominant influence of the natural vegetation characteristic of a region.
          The zonal soils of an area.
      piedmont:
        description: At or near the foot of a mountain.
      piezometer:
        description: An instrument for measuring the pressure head of liquids.
      piezometric surface:
        description: The surface at which water will stand in a series of piezometers.
      pile:
        description: A slender structural element that is driven or introduced by
          other means into the soil usually to provide vertical or lateral support.
      placic:
        description: This layer (commonly <5 mm thick) or series of thin layers is
          irregular or involuted, hard, impervious, commonly vitreous and dark reddish
          brown to black; placic horizons may be cemented by Fe, Al-organic complexes
          (Bhfc or Bfc), hydrated Fe oxides (Bgfc) or a mixture of Fe and Mn oxides.
      planisaic:
        description: A photomap in which the planimetric detail is shown by overprints
          in color. See also photomap and toposaic.
      plastic limit:
        description: (Atterberg limit) (1) The water content corresponding to an arbitrary
          limit between the plastic and the semisolid states of consistence of a soil.
          (2) The water content at which a soil will just begin to crumble when rolled
          into a thread approximately 3 mm in diameter.
      plastic soil:
        description: A soil capable of being molded or deformed continuously and permanently
          into various shapes by moderate pressure. See also consistence.
      plasticity constants:
        description: plasticity constants See liquid limit, plastic limit and plasticity
          number.
      plasticity number:
        description: 'The numerical difference between the liquid limit and the plastic
          limit, or, synonymously, between the lower plastic limit and the upper plastic
          limit. Sometimes called ""plasticity index"".'
      plasticity range:
        description: The range of moisture weight percentage within which a small
          sample of soil exhibits plastic properties.
      plate count:
        description: A count of the number of colonies formed on a culture medium
          that has been inoculated with a small amount of soil in order to estimate
          the number of certain organisms present in the soil sample.
      platy:
        description: Consisting of soil aggregates that have developed predominantly
          along the horizontal axes; laminated; flaky. See also structure types, soil.
      plow pan (plow sole):
        description: See pressure or induced pan.
      Podzol:
        description: Before 1968 Podzol was a great group in the Podzolic order that
          included soils having Ae and podzolic B horizons. See also Podzolic.
      Podzolic:
        description: 'An order of soils having podzolic B horizons (Bh, Bhf or Bf)
          in which amorphous combinations of organic matter dominantly fulvic acid,
          Al and usually Fe are accumulated. The sola are acid and the B horizons
          have a high pH-dependent charge. See also: Podzolic Soil Classification.'
      podzolic B:
        description: Consists of one or more of Bf, Bhf, and Bh. See also horizon,
          soil.
      podzolization:
        description: A process of soil formation resulting in the genesis of Podzolic
          soils.
      population / soil:
        description: All the organisms living in the soil including plants and animals.
      pore space:
        description: The total space not occupied by soil particles in a bulk volume
          of soil.
      pore-size distribution:
        description: The volume of the various sizes of pores in a soil. They are
          expressed as percentages of the buik voiume (soil plus pore space).
      pores (soil):
        description: The part of the bulk volume of soil not occupied by soil particles.
          Interstices or voids.
      porosity:
        description: The volume percentage of the total bulk not occupied by solid
          particles.
      potassium fixation:
        description: The process of converting exchangeable or water-soluble potassium
          to moderately soluble potassium; that is, to a form not easily exchanged
          from the adsorption compiex with a cation of a neutral salt solution.
      potassium-supplying power of soils:
        description: The capacity of soil to supply potassium to growing plants from
          both the exchangeable and the moderately available forms.
      potential acidity:
        description: In a soil, the amount of exchangeable hydrogen ion that can be
          made free or active in the soil solution by cation exchange. It is usually
          expressed in milliequivalents per unit mass of soil.
      potential cation exchange capacity:
        description: The total number of cations that a soil can adsorb at a specified
          pH.
      potential evapotranspiration:
        description: See evapotranspiration.
      precipitation interception:
        description: The stopping, interrupting, and temporary holding of precipitation
          in any form by a vegetative canopy or vegetation residue.
      preconsolidation pressure (or prestress):
        description: The greatest effective pressure to which a soil has been subjected.
      pressure membrane:
        description: A membrane, permeable to water and onliy very slightly permeable
          to gas when wet through which water can escape from a soil sample in response
          to a pressure gradient.
      pressure or induced pan:
        description: A subsurface horizon or soil layer having a higher bulk density
          and a lower total porosity than the soil directly above or below it, as
          a result of pressure that has been applied by normal tillage operations
          or other artificial means. it is also referred to as plow pan, plow sole,
          or traffic pan.
      primary mineral:
        description: A mineral that has not been altered chemically since deposition
          and crystallization from molten lava. See also secondary mineral.
      primary particles:
        description: Individual soil particles after a standard dispersion treatment.
      prismatic:
        description: A soil structure type having prismlike aggregates that have vertical
          axes much longer than the horizontal axes. See also structure types, soil.
      productive soil:
        description: A soil in which the chemical, physical and biological conditions
          are favorable for the economical production of crops suited to a particular
          area.
      productivity (soil):
        description: 'The capacity of a soil in its normal environment to produce
          a specified plant or sequence of plants under a specified system of management.
          The ""specified"" limitations are needed because no soil can produce all
          crops with equal success and a single system of management cannot produce
          the same effect on all soils. Productivity means the capacity of soil to
          produce crops and is expressed in terms of yields.'
      profile (soil):
        description: A vertical section of the soil through all its horizons and extending
          into the parent material.
      protozoa:
        description: Unicellular organisms belonging to the animal kingdom.
      psammophytes:
        description: Plants that grow best in or tolerate sand particularly fine to
          medium sand.
      psychrophile:
        description: A microorganism capable of thriving at temperatures as low as
          0°C.
      pure culture:
        description: A nutrient medium containing the growth of a single strain of
          an organism free from other living species or strains.
      quick clay:
        description: Clayey material having the tendency to change from a relatively
          stiff condition to a liquid mass when it is disturbed. See also liquefaction
          (spontaneous liquefaction).
      quicksand:
        description: Sand of low bearing capacity caused by the upward flow of water
          and the resultant decrease in intergranular pressure.
      R layer:
        description: Underlying consolidated bedrock. See also horizon (soil).
      rainfall interception:
        description: See precipitation interception.
      rawhumus:
        description: See mor.
      reaction (soil):
        description: 'The degree of acidity or alkalinity of a soil, usually expressed
          as a pH value. Descriptive terms commonly associated with certain ranges
          in pH are: - extremely acid, &lt;4.5 - very strongly acid, 4.5-5.0 - strongly
          acid, 5.1-5.5 - moderately acid, 5.6-6.0 - slightly acid, 6.1-6.5 - neutral,
          6.6-7.3 - slightly alkaline, 7.4-7.8 - moderately alkaline, 7.9-8.4 - strongly
          alkaline, 8.5-9.0 - very strongly alkaline, &gt;9.0'
      regolith:
        description: The unconsolidated mantle of weathered rock and soil material
          overlying solid rock.
      Regosol:
        description: The only great group in the Regosolic order. The soils in the
          group have insufficient horizon development to meet the requirements of
          the other orders.
      Regosolic:
        description: 'An order of soils having no horizon development or development
          of the A and B horizons insufficient to meet the requirements of the other
          orders. See also: Regosolic Soil Classification.'
      relief:
        description: Elevations or inequalities of a land surface, considered collectively.
          Land having no unevenness or differences of elevation is called level; gentle
          relief is called undulating, strong relief, rolling, and very strong relief,
          hilly. See also microrelief.
      rendzina:
        description: A group of soils having brown to black surface horizons, which
          have developed on parent material that contains more than 40% calcium carbonate
          equivalent. Not used in Canadian taxonomy.
      residual material:
        description: Unconsolidated and partly weathered mineral materials formed
          by the disintegration of consolidated rock in place.
      residual shrinkage:
        description: The decrease in volume after the proportionality between water
          loss and volume change ceases.
      residual soil:
        description: Soil formed from, or resting on, consolidated rock of the same
          kind as that from which it was formed and in the same location.
      retentivity profile (soil):
        description: A graph showing the retaining capacity of a soil as a function
          of depth. The retaining capacity may be for water, for water at any given
          tension, for cations, or for any other substances held by soils.
      reversion:
        description: Changing of essential plant nutrient elements from soluble to
          less soluble forms by interaction with or reactions in the soil. Reversion
          is usually restricted to the conversion of monocalcium phosphate to the
          less soluble dicalcium phosphate.
      reworked:
        description: Descriptive of material modified after its preliminary deposition,
          commonly by water or wind.
      rhizobia:
        description: Small heterotrophic bacteria of the genus Rhizobium capable of
          forming symbiotic noduies on the roots of leguminous plants. In the nodules
          the bacteria fix atmospheric nitrogen that is used by the plants. The bacteria
          receive their energy from the plants.
      rhizoid:
        description: In the lower plants, one of the unicellular or multicellular
          rootlike filaments that serve for attachment and absorption.
      rhizoplane:
        description: The external surface of roots and of the soil particles and debris
          adhering to them.
      rhizosphere:
        description: The soil surrounding and directly influenced by plant roots.
      rill:
        description: A narrow, very shallow, intermittent water course having steep
          sides. It presents no obstacle to tilling.
      rill erosion:
        description: An erosion process in which many small channels a few centimetres
          deep are formed; it occurs mainly on recently cultivated soils. See also
          rill.
      riverwash:
        description: Barren, usually coarse-textured, alluvial soil in and along waterways,
          exposed at low water levels and subject to shifting during flood periods.
          A miscellaneous land type.
      roche moutonnée:
        description: A rounded hummock (boss) of rock smoothed and striated by glacial
          action and often showing evidence of plucking on the lee side.
      rock drumlin:
        description: An elongated hill having a veneer of glacial drift over a rock
          core.
      rockland:
        description: An area of which usually 25% to 90% is occupied by rock outcrops
          and most of the remainder by shallow soils. A miscellaneous land type.
      rough broken land:
        description: An area having steep slopes and many intermittent drainage channels,
          but usually covered with vegetation. See also miscellaneous land type.
      runoff:
        description: The portion of the total precipitation on an area that flows
          away through stream channels. Surface runoff does not enter the soil. Groundwater
          runoff or seepage flow from groundwater enters the soil before reaching
          the stream.
      saline alkali soil:
        description: (1) A soil containing enough exchangeable sodium to interfere
          with the growth of most crop plants, and containing appreciable quantities
          of soluble salts. The exchangeable-sodium percentage is greater than 15,
          the conductivity of the saturation extract is greater than 4 mmhos/cm at
          25øC, and the pH is usually 8.5 or less in the saturated soil. (2) A saline-alkali
          soil has a combination of harmful quantities of salts and either a high
          alkalinity or high content of exchangeable sodium, or both, so distributed
          in the profile that the growth of most crop plants is reduced. It is also
          called saline-sodic soil.
      saline soil:
        description: A nonalkali soil that contains enough soluble salts to interfere
          with the growth of most crop plants. The conductivity of the saturation
          extract is greater than 4 mmhos/cm, the exchangeable-sodium percentage is
          less than 15, and the pH is usually less than 8.5.
      salinity  soil:
        description: The amount of soluble salts in a soil, expressed in terms of
          percentage, parts per million or other convenient ratios.
      salinization:
        description: The process of accumulation of salts in soil.
      salt-affected soil:
        description: Soil that has been adversely modified for the growth of most
          crop plants by the presence of certain types of exchangeable ions or of
          soluble salts. It includes soils having an excess of salts, or an excess
          of exchangeable sodium or both. See also saline-alkali soil, saline soil
          and sodic soil.
      sand:
        description: 'A soil particle between 0.05 and 2.0 mm in diameter. Any one
          of five soil separates: very coarse sand, coarse sand, medium sand, fine
          sand or very fine sand. See also separates / soil. A soil textural class.
          See also texture, soil.'
      sandy:
        description: Containing a large amount of sand. It may be applied to any one
          of the soil classes that contains a large percentage of sand. See also class,
          soil and texture, soil.
      sandy clay:
        description: A soil textural class. See also class, soil and texture, soil.
      sandy clay loam:
        description: A soil textural class. See also class, soil and texture, soil.
      sandy loam:
        description: A soil textural class. See also class, soil and texture, soil.
      saturate:
        description: (1) To fill all the voids between soil particles with a liquid.
          (2) To form the most concentrated solution possible under a given set of
          physical conditions in the presence of an excess of the solute. (3) To fill
          to capacity, as the adsorption complex with a cation species; for example,
          H-saturated .
      saturation extract:
        description: The extract from a soil sample that has been saturated with water.
      science; soil:
        description: 'The science dealing with soil as a natural resource. It includes:
          soil formation, classification and mapping; the physical, chemical and biological
          properties of soils and the management of soils for various purposes such
          as the production of agricultural and forest crops, the construction of
          roads and others.'
      second bottom:
        description: The first terrace above the normal flood plain of a stream.
      secondary mineral:
        description: A mineral resulting from the decomposition of a primary mineral
          or from the precipitation of the products of decomposition of a primary
          mineral. See also primary mineral.
      sedimentary rock:
        description: A rock formed from materials deposited from suspension or precipitated
          from solution and usually more or less consolidated. The principal sedimentary
          rocks are sandstones, shales, limestones and conglomerates.
      seepage:
        description: (1) The escape of water downward through the soil. (2) The emergence
          of water from the soil along an extensive line of surface in contrast to
          a spring where the water emerges from a local spot.
      self-mulching soil:
        description: A soil in which the surface layer becomes so well aggregated
          that it does not crust and seal under the impact of rain but instead serves
          as a surface mulch when it dries.
      sensitivity:
        description: The effect of remolding on the shear strength of an undrained
          cohesive soil.
      separates (soil):
        description: 'Mineral particles, less than 2.0 mm in equivalent diameter,
          ranging between specified size limits. The names and size limits of separates
          recognized by pedologists in Canada and the United States are: (1) very
          coarse sand, 2.0 to 1.0 mm; (2) coarse sand, 1.0 to 0.5 mm; (3) medium sand,
          0.5 to 0.25 mm; (4) fine sand, 0.25 to 0.10 mm; (5) very fine sand, 0.10
          to 0.05 mm; (6) silt,0.05 to 0.002 mm; (7) clay, less than 0.002 mm; and
          (8) fine clay, less than 0.0002 mm. The separates recognized by the International
          Society of Soil Science are: (1) coarse sand, 2.0 to 0.2 mm; (2) fine sand,
          0.2 to 0.02 mm; (3) silt, 0.02 to 0.002 mm; and (4) clay, less than 0.002
          mm.'
      sequum:
        description: A sequence of an eluvial horizon and its related illuvial horizon
          in a soil.
      serial dilution:
        description: Successive dilution of a specimen, for example, 1:10 dilution
          equals 1 ml of a specimen plus 9 ml of diluent (e.g., sterile water); 1:100
          dilution equals 1 ml of a 1:10 dilution plus 9 ml of diluent.
      series (soil):
        description: A category in the Canadian system of soil classification. This
          is the basic unit of soil classification and consists of soils that are
          essentially alike in all major profile characteristics except the texture
          of the surface.
      shaly:
        description: (1) Containing a large amount of shale fragments. (2) A soil
          phase; for example shaly phase. (3) Kind of fragment see coarse fragments.
      shear stress:
        description: The force per unit area acting tangentially to a given plane
          within a soil mass.
      sheet erosion:
        description: The removal of a fairly uniform layer of soil from the land surface
          by runoff water.
      silica-alumina ratio:
        description: The molecules of silicon dioxide (SiO2) per molecule of aluminum
          oxide (Al203) in clay minerals or soils.
      silica-sesquioxide ratio:
        description: The molecules of silicon dioxide (SiO2) per molecule of aluminum
          oxide (Al203) plus ferric oxide (Fe203) in clay minerals or soils.
      silt:
        description: (1) A soil separate consisting of particles between 0.05 and
          0.002 mm in equivalent diameter. See also separates, soil. (2) A soil textural
          class. See also texture, soil.
      silt loam:
        description: A soil textural class. See also texture, soil and class, soil.
      silting:
        description: The deposition of water-borne sediments in stream channels, lakes,
          reservoirs or on floodplains usually resulting from a decrease in the velocity
          of the water.
      siltstone:
        description: A very fine grained, consolidated. clastic rock composed predominantly
          of particles of silt grade.
      silty clay:
        description: A soil textural class. See also texture / soil and class / soil.
      silty clay loam:
        description: A soil textural class. See also texture, soil and class, soil.
      single-grain structure:
        description: A soil structure in which the soil particles occur almost completely
          as individual or primary particles; secondary particles or aggregates are
          seldom present. It is usually found only in extremely coarse-textured soils.
      site:
        description: (1) In ecology, an area described or defined by its biotic, climatic,
          and soil conditions in relation to its capacity to produce vegetation. (2)
          An area sufficiently uniform in biotic, climatic and soil conditions to
          produce a particular vegetation.
      site index:
        description: (1) A quantitative evaluation of the productivity of a soil for
          forest growth under the existing or specified environment. (2) The height
          in feet of the dominant forest vegetation taken at or calculated to an index
          age usually 50 or 100 years.
      sixty-centimetre tension:
        description: See moisture tension, soil.
      skeletal:
        description: Rock and mineral particles larger than two mm occupy 35% or more
          but less than 90% (by volume)
      slaking (soil):
        description: The breakdown of aggregates resulting from the addition of water
          to soil.
      slaty:
        description: Containing a considerable quantity of slate fragments. It is
          used to modify soil texture class names such as slaty clay loam. See also
          coarse fragments.
      slick spots:
        description: Small areas in a field that are slick when wet, because of a
          high content of alkali or exchangeable sodium.
      slickens:
        description: Fine-textured materials separated in placer mining and in ore-mill
          operations; the materials may be detrimental to plant growth and so should
          be confined in specially constructed basins. A miscellaneous land type.
      slickenside:
        description: Smoothed surfaces along planes of weakness resulting from the
          movement of one mass of soil against another in soils dominated by swelling
          clays.
      smectite:
        description: See montmorillonite group.
      sodic soil:
        description: (1) A soil containing sufficient sodium to interfere with the
          growth of most crop plants. (2) A soil having an exchangeable-sodium percentage
          of 15 or more.
      soil (1):
        description: (1) The unconsolidated material on the immediate surface of the
          earth that serves as a natural medium for the growth of land plants.
      soil (2):
        description: (2) The naturally occurring unconsolidated material on the surface
          of the earth that has been influenced by parent material, climate (including
          the effects of moisture and temperature), macro- and micro-organisms and
          relief all acting over a period of time to produce soil that may differ
          from the material from which it was derived in many physical, chemical,
          mineralogical, biological and morphological properties.
      soil (3):
        description: "(3) For the purpose of the Canadian taxonomic system, the earth's\
          \ surface (the material that is to be classified) is divided into soil and\
          \ nonsoil. Soil is the naturally occurring unconsolidated mineral or organic\
          \ material at the earth's surface that is capable of supporting plant growth.\
          \ It extends from the surface to 15 cm (6 inches) below the depth at which\
          \ properties produced by soil-forming processes can be detected. These properties\
          \ differ from those found in any underlying unconsolidated material. The\
          \ soil-forming processes are defined as an interaction between climate,\
          \ living organisms and relief acting on soil and soil parent material. Unconsolidated\
          \ material includes material cemented or compacted by soil-forming processes.\
          \ Soil may have water covering its surface to a depth of 60 cm (24 inches)\
          \ or less in the driest part of the year. See also nonsoil."
      soil moisture tension:
        description: 'In soils partially saturated with water there is moisture tension,
          which is equal in magnitude but opposite in sign to the soil water pressure.
          Moisture tension is equal to the pressure that must be applied to the soil
          water to bring it to a hydraulic equilibrium through a porous permeable
          wall or membrane with a pool of water of the same composition. See also
          water / soil The pressures used and the corresponding percentages most commonly
          determined are: - 15-atmosphere percentage, - 15-bar percentage, - 1/3-atmosphere
          percentage, - 1/3-bar percentage, - 60-centimetre percentage.'
      soil-formation factors:
        description: 'The variable, usually interrelated natural agencies that are
          responsible for the formation of soil. The factors are: parent rock, climate,
          organisms, relief, and time.'
      solclime:
        description: The temperature and moisture conditions of the soil; the soil
          climate.
      solifluction:
        description: A type of creep that takes place in regions where the ground
          freezes to a considerable depth and as it thaws during the warm seasons
          the upper thawed position creeps downhill over the frozen material. The
          soil moves as a viscous liquid down slopes of as little as 2 or 3 degrees
          and may carry rocks of considerable size in suspension.
      Solod:
        description: A great group of soils in the Solonetzic order occurring most
          commonly in the grassland and parkland regions. The soils have a dark-colored
          surface (Ah) horizon; a prominent eluvial (Ahe or Ae) horizon at least 5
          cm (2 inches) thick, a prominent transitional (AB) horizon that breaks readily
          into blocky aggregates and a darkly stained B (Bnt) horizon over a C horizon
          that is saline and usually calcareous.
      solodized soil:
        description: A soil that has been subjected to the processes responsible for
          the development of a Solod and has at least some of the characteristics
          of a Solod.
      Solodized Solonetz:
        description: A great group of soils in the Solonetzic order, occurring most
          commonly in the grassland and parkland regions and consisting of soils with
          a variable surface (Ah, Ahe, or Ae) horizon that is underlain by a well-developed
          Ae horizon, a compact prismatic or columnar Bnt horizon, and a C horizon
          that is saline and usually calcareous.
      Solonetz:
        description: A great group of soils in the Solonetzic order, occurring most
          commonly in the grassland and parkland regions and consisting of soils with
          a variable surface (Ah, Ahe, or Ae) horizon that breaks abruptly into a
          hard, compact prismatic or columnar B (Bnt, rarely a Bn) horizon underlain
          by one or more saline and usually calcareous (Bs, Cs, Csa, Csk, Cca) horizons.
          They lack a continuous Ae horizon 2.5 cm (1 inch) or more thick.
      Solonetzic:
        description: 'An order of soils developed mainly under grass or grass-forest
          vegetative cover in semiarid to subhumid climates. The soils have a stained
          brownish solonetzic B (Bnt or Bn) horizon and a saline C horizon. The surface
          may be one or more of Ap, Ah or Ae horizons. See also: Solonetzic Soil Classification.'
      soluble-sodium percentage (SSP):
        description: 'The proportion of sodium ions in solution in relation to the
          total cation concentration, defined as follows: SSP = [soluble sodium concentration
          (meq/litre) / total cation concentration (meq/litre)] x 100'
      solum (plural sola):
        description: The upper horizons of a soil in which the parent material has
          been modified and in which most plant roots are contained. It usually consists
          of A and B horizons.
      solution; soil:
        description: The aqueous liquid phase of the soil and its solutes consisting
          of ions dissociated from the surfaces of the soil particles and of other
          soluble materials.
      Sombric Brunisol:
        description: A great group of soils in the Brunisolic order. The soils have
          moder Ah horizons more than 5 cm (2 inches) thick and Bm horizons in which
          the base saturation (NaCl) is usually 65% to 100% and the pH (CaCl2) is
          usually about 5.5.
      splash erosion:
        description: The spattering of small soil particles caused by the impact of
          raindrops on very wet soils. The loosened and spattered particles may or
          may not be subsequently removed by surface runoff.
      spoil bank:
        description: Rock waste, banks, and dumps, from the excavation of ditches.
      sprinkler irrigation:
        description: See irrigation methods.
      stabilization (soil):
        description: Chemical or mechanical treatment designed to increase or maintain
          the stability of a mass of soil or otherwise to improve its engineering
          properties.
      sterilization:
        description: The process of making sterile, the killing of all forms of life.
      sticky point:
        description: (1) A condition of consistence at which the soil barely fails
          to stick to a foreign object. (2) Specificaliy and numerically, the weight
          moisture percentage of a well-mixed, kneaded soil that barely fails to adhere
          to a polished nickel or stainless steel surface when the shearing speed
          is 5 cm/sec. The measurement is made rarely now.
      Stokes law:
        description: 'An equation relating the terminal settling velocity of a smooth,
          rigid sphere in a viscous fluid of known density and viscosity to the diameter
          of the sphere when subjected to a known force field. It is used in the particle-size
          analysis of soils by the pipette, hydrometer, or centrifuge methods. The
          equation is: V = (2gr²)(d1-d2)/9µ where V = velocity of fall (cm sec-¹),
          g = acceleration of gravity (cm sec-²), r = ""equivalent"" radius of particle
          (cm), dl = density of particle (g cm -³), d2 = density of medium (g cm-³),
          and µ = viscosity of medium (dyne sec cm-²).'
      stones:
        description: Rock fragments greater than 25 cm (10 inches) in diameter if
          rounded and greater than 38 cm (15 inches) along the greater axis if flat.
          See also coarse fragments. In engineering practice these fragments are included
          with boulders, which are considered to be greater than 20 cm (8 inches)
          in diameter.
      stoniness:
        description: The relative proportion of stones in or on the soil. This term
          is used in the classification of soils. See also coarse fragments.
      stony:
        description: Containing sufficient stones to interfere with or prevent tillage.
          To be classified as stony, more than 0.1% of the surface of the soil must
          be covered with stones. The term is used to modify soil class, as stony
          clay loam or clay loam, stony phase. See also coarse fragments.
      stony land:
        description: Areas containing sufficient stones to make the use of machinery
          impractical; usually 15% to 90% of the surface soil is covered with stones.
          See also stoniness.
      stratification:
        description: The arrangement of sediments in layers or strata marked by a
          change in color, texture, dimension of particies and composition. Stratification
          usually means layers of sediments that separate readily along bedding planes
          because of different sizes and kinds of material or some interruption in
          deposition that permitted changes to take place before more material was
          deposited.
      stratified drift (or sorted drift):
        description: Materials that are distinctly sorted according to size and weight
          of their component fragments indicating a medium of transport (water or
          wind) more fluid than glacier ice.
      stratum (plural strata):
        description: A layer characterized by certain unifying characteristics, properties,
          or attributes distinguishing it from adjacent layers.
      stress:
        description: A directional force acting within a material.
      strip cropping:
        description: The practice of growing crops that require different types of
          tillage, such as row and sod, in alternate strips along contours or across
          the prevailing direction of wind.
      structure classes (soil):
        description: A grouping of soil structural units or peds on the basis of size.
          These are tabulated under structure types, soil (Table 3).
      structure grades (soil):
        description: 'A grouping or classification of soil structure on the basis
          of inter- and intra- aggregate adhesion, cohesion, or stability within the
          profile. Three grades of structure designated from 1 to 3 are: (1) weak
          (structure faible): poorly formed, indistinct peds barely evident in place.
          (2) moderate (structure modérée): well-formed distinct peds, moderately
          durable and evident but not distinct in undisturbed soil. (3) strong (structure
          forte): durable peds that are quite evident in undisturbed soil, adhere
          weakly to one another, withstand displacement and become separated when
          the soil is disturbed.'
      structure index:
        description: Any measurement of a soil physical property, such as aggregation,
          porosity, permeability to air or water or bulk density that denotes or indicates
          the structural condition of a soil.
      structure,  soil:
        description: The combination or arrangement of primary soil particles into
          secondary particles, units, or peds. These peds may be, but usually are
          not, arranged in the profile in such a manner as to give a distinctive characteristic
          pattern. The peds are characterized and classified on the basis of size,
          shape, and degree of distinctness into classes, types, and grades. See also
          structure classes, soil; structure grades, soil; and structure types, soil.
          These are defined and tabulated under structure types, soil ( Table 3 ).
        see_also: https://sis.agr.gc.ca/cansis/glossary/table-3.html
      stubble mulch:
        description: The stubble of crops or crop residues left essentially in place
          on the land as a surface cover before and during the preparation of the
          seedbed and at least partly during the growing of a succeeding crop. Synonymous
          with trash cover.
      subgroup, soil:
        description: A category in the Canadian classification system. These soils
          are subdivisions of the great groups and therefore each soil is defined
          more specifically.
      subirrigation:
        description: See irrigation methods.
      subsoiling:
        description: The breaking of compact subsoils, without inverting them, with
          a special knifelike instrument (chisel), which is pulled through the soil
          usually at depths of 30 to 60 cm (12 to 24 inches) and spacings of 60 to
          150 cm (2 to 5 ft). Also called chiseling.
      substrate:
        description: (1) That which is laid or spread under; an underlying layer,
          such as the subsoil. (2) The substance, base, or nutrient on which an organism
          grows. (3) Compounds or substances that are acted upon by enzymes or catalysts
          and changed to other compounds in the chemical reaction.
      subsurface tillage:
        description: Tillage with a special sweeplike plow or blade, which is drawn
          beneath the surface at depths of several centimetres and cuts plant roots
          and loosens the soil without inverting it or incorporating the surface cover.
      sulfofication (Obsolete):
        description: The biological oxidation of sulfur and sulfur compounds in the
          soil.
      summation curve (of particle sizes):
        description: A curve showing the accumulative percentage by weight of particles
          within increasing or decreasing size limits as a function of diam¿ter; the
          percentage by weight of each size fraction is plotted accumulatively on
          the ordinate as a function of the total range of diameters represented in
          the sample plotted on the abscissa.
      surface runoff:
        description: See runoff.
      surface sealing:
        description: The orientation and packing of dispersed soil particles in the
          immediate surtace layer of the soil to render the surface fairly impermeable
          to water.
      surface soil:
        description: 'The uppermost part of the soil that is ordinarily moved in tillage,
          or its equivalent in uncultivated soils. It ranges in depth from 7.5 to
          25 cm (3 to 10 inches) and is frequently designated as the ""plow layer""
          the ""Ap layer"" or the ""Ap horizon.""'
      survey soil:
        description: The systematic examination, description, classification, and
          mapping of soils in an area. Soil surveys are classified according to the
          kind and intensity of the field examination.
      sustained yield:
        description: A continual annual or perlodic yield of plants or plant material
          from an area; implies management practices that maintain the productive
          capacity of the land.
      swamp:
        description: An area saturated with water throughout much of the year, but
          with the surface of the soil usually not deeply submerged, It Is generally
          characterized by tree or shrub vegetation. See also marsh and miscellaneous
          land type.
      symbiosis:
        description: The living together in intimate association of two dissimllar
          organisms, so that the cohabitation is mutually beneficial.
      symmetry concentration:
        description: The quantity of cations or anions equivalent to the exchange
          capacity of a soil, For example, if the cation exchango capacity of a soil
          is 10 meq/l00 g of soil, then 1 symmetry concontration is 10 meq of any
          cation.
      symmetry value:
        description: The percentage of the adsorbed ion released when one symmetry
          concontration of another ion is added.
      synergism:
        description: The ability of two or more organisms to bring about changes (usually
          chemical) that neither can accomplish alone.
      talud:
        description: A short steep slope formed gradually at the downslope margin
          of a field by deposition against a hedge, a stone wall or other similar
          barrier.
      talus:
        description: A sloping heap of loose rock fragments Iying at the foot of a
          cliff or steep slope.
      taxon (plural taxa):
        description: A class at any categorical level of a taxonomic system of classification.
      tensiometer:
        description: A device for measuring the negative pressure or tension, of water
          in soil in situ; a porous permeable ceramic cup connected through a tube
          to a manometer or vacuum gauge.
      terrace:
        description: A nearly level usually narrow plain bordering a river, lake or
          sea. Rivers sometimes are bordered by a number of terraces at different
          levels. There are also manmade terraces.
      terric layer:
        description: An unconsolidated mineral substratum underlying organic soil
          material.
      textural classification:
        description: See texture (soil).
      texture (soil):
        description: 'The relative proportions of the various soil separates in a
          soil as described by the classes of soil texture. The names of textural
          soil classes may be modified by adding suitable adjectives when coarse fragments
          are present in substantial amounts; for example, "Gibraltar stony sandy
          loam," or "Saint-Jovite silt loam, stony phase." The sand, loamy sand, and
          sandy loam are further subdivided on the basis of the proportions of the
          various sand separates present. The limits of the various classes and subclasses
          are: sand (sable) Soil material that contains 85% or more sand; the percentage
          of silt plus 1.5 times the percentage of clay does not exceed 15. coarse
          sand (sable grossier) 25% or more very coarse and coarse sand, and less
          than 50% any other one grade of sand. sand (sable) 25% or more very coarse,
          coarse, and medium sand, and less than 50% fine or very fine sand. fine
          sand (sable fin) 50% or more fine sand or less than 25% very coarse, coarse,
          and medium sand and less than 50% very fine sand. very fine sand (sable
          tr&egrave;s fin) 50% or more very fine sand. loamy sand (sable loameux)
          Soil material that contains at the upper limit 85 to 90% sand, and the percentage
          of silt plus 1.5 times the percentage of clay is not less than 15, at the
          lower limit it contains not less than 70 to 85% sand, and the percentage
          of silt plus twice the percentage of clay does not exceed 30. loamy coarse
          sand (sable grossier loameux) 25% or more very coarse and coarse sand and
          less than 50% any other one grade of sand. loamy sand (sable loameux) 25%
          or more very coarse, coarse, and medium sand and less than 50% fine or very
          fine sand. loamy fine sand (sable fin loameux) 50% or more fine sand or
          less than 25% very coarse, coarse, and medium sand and less than 50% very
          fine sand. loamy very fine sand (sable tr&egrave;s fin loameux) 0% or more
          very fine sand. sandy loam (loam sableux) Soil material that contains either
          20% or less clay, with a percentage of silt plus twice the percentage of
          clay that exceeds 30, and 52% or more sand; or less than 7% clay, less than
          50% silt, and between 43% and 52% sand. coarse sandy loam (loam sableux
          grossier) 25% or more very coarse and coarse sand and less than 50% any
          other one grade of sand. sandy loam (loam sableux) 30% or more very coarse,
          coarse, and medium sand, but less than 25% very coarse sand, and less than
          30% very fine or fine sand. fine sandy loam (loam sableux fin) 30% or more
          fine sand and less than 30% very fine sand or between 15 and 30% very coarse,
          coarse, and medium sand. very fine sandy loam (loam sableux tr&egrave;s
          fin) 30% or more very fine sand or more than 40% fine and very fine sand,
          at least half of which is very fine sand, and less than 15% very coarse,
          coarse, and medium sand. loam (loam) Soil material that contains 7 to 27%
          clay, 28 to 50% silt, and less than 52% sand. silt loam (loam limoneux)
          Soil material that contains 50% or more silt and 12 to 27% clay, or 50 to
          80% silt and less than 12% clay. silt (limon) Soil material that contains
          80% or more silt and less than 12% clay. sandy clay loam (loam sablo-argileux)
          Soil material that contains 20 to 35% clay, less than 28% silt, and 45%
          or more sand. clay loam (loam argileux) Soil material that contains 27 to
          40% clay and 20 to 45% sand. silty clay loam (loam limono-argileux) Soil
          material that contains 27 to 40% clay and less than 20%sand. sandy clay
          (argile sableuse) Soil material that contains 35% or more clay and 45% or
          more sand. silty clay (argile limoneuse) Soil material that contains 40%
          or more clay and 40% or more silt. clay (argile) Soil material that contains
          40% or more clay, less than 45% sand, and less than 40% silt. heavy clay
          (argile lourde) Soil material that contains more than 60% clay.'
      thermal analysis (or differential thermal analysis):
        description: A method ot analyzing a soil sample for constituents, based on
          the differential rate of heating of the unknown and standard samples when
          a uniform source of heat is applied.
      thermal conductivity:
        description: The rate of transfer of heat to or from a point in the soil.
      thermogenic soils:
        description: Soils with properties that have been influenced primarily by
          high soil temperature as the dominant soil-formation tactor developed in
          subtropical and equatorial regions.
      thermophile:
        description: An organism that grows best at temperatures of 50°C or higher.
      thermosequence:
        description: A sequence of related soils that differ, one from the other,
          primariiy as a result of temperature as a soil-formation factor.
      threshold moisture content:
        description: The minimum moisture condition measured in terms of either moisture
          content or moisture stress, at which biological activity just becomes measurable.
      tidal flats:
        description: Areas of nearly flat, barren mud periodically covered by tidal
          waters. Normally these materials have an excess of soluble salt. A miscellaneous
          land type.
      tier:
        description: 'A depth subdivision used in the classification of Organic soils.
          (1) surface tier: The upper 40 cm (16 inches) of peat. (2) middle tier:
          The tier just below the surface tier. It is 80 cm (32 inches) thick or extends
          to a lithic or hydric contact. The great group classification of Organic
          soils is usually based on this tier. (3) bottom tier: The tier below the
          middle tier. It is 40 cm (16 inches) thick or extends to a lithic or hydric
          contact. The subgroup classification of Organic soils is based partly on
          this tier.'
      tight soil:
        description: A compact, relatively impervious and tenacious soil or subsoil
          which may or may not be plastic.
      tile drain:
        description: Pipe piaced at suitable depths and spacings in the soil or subsoil
          to provide water outlets from the soil. The pipe may be concrete, ceramic,
          fiber, plastic or any other suitable material.
      till:
        description: Unstratified glacial drift deposited directly by the ice and
          consisting of clay, sand, gravel, and boulders intermingled in any proportion.
      till  (to):
        description: To plow and prepare for seeding; to seed or cultivate the soil.
      tillage:
        description: The operation, practice, or art of tilling land to improve it
          for agricultural purposes.
      tilth:
        description: The physical condition of soil as related to its ease of tillage,
          fitness as a seedbed, and impedance to seedling emergence and root penetration.
      topography:
        description: The physical features of a district or region, such as those
          represented on a map, taken collectively; especially the relief and contours
          of the land.
      toposaic:
        description: A photomap on which topographic or terrain-form lines are shown
          as on topographic quadrangles. See also photomap and planisaic.
      toposequence:
        description: toposequence toposequence A sequence of related soils that differ
          one from the other primarily because of topography as a soil-formation factor.
          See also clinosequence.
      topsoil:
        description: (1) The layer of soil moved in cultivation. See also surface
          soil. (2) The A horizon. (3) The Ah horizon. (4) Presumably fertile soil
          material used to topdress road-banks, gardens, and lawns.
      total potential (of soil water):
        description: See water / soil.
      total pressure:
        description: See water, soil.
      trace element (Obsolete):
        description: See micronutrient.
      traffic pan:
        description: See pressure or induced pan.
      transitional soil:
        description: A soil with properties intermediate between those of two different
          soils and genetically related to them. See also intergrade / soil.
      truncated:
        description: Having lost all or part of the upper soil horizon or horizons.
      tuff:
        description: Volcanic ash usually more or less stratified and in various states
          of consolidation.
      tundra:
        description: A level or undulating treeless plain characteristic of arctic
          regions.
      tundra soil:
        description: Any soil in the tundra region.
      type; soil:
        description: (1) A unit in the natural system of soil classification; a subdivision
          of a soil series consisting of or describing soils that are alike in all
          characteristics including the texture of the A horizon. (2) In Europe the
          term is roughly equivalent to a great soil group.
      underground runoff (or seepage):
        description: Water flowing toward stream channels after infiltration into
          the ground.
      undifferentiated soil map unit:
        description: Soil mapping unit in which two or more soil units occur but not
          in a regular geographic association. For example the steep phases of two
          or more soils might be shown as a unit on a map because slope is the prime
          characteristic. See also association / soil and complex / soil.
      unsaturated flow:
        description: The movement of water in a soil that is not filled to capacity
          with water.
      upper plastic limit:
        description: See liquid limit.
      urban land:
        description: Areas so altered or obstructed by urban works or structures that
          identification of soils is not feasible. A miscellaneous land type.
      valley train:
        description: An outwash terrace extending down a valley away from the ice
          front.
      value color:
        description: The relative lightness of color, which is approximately a function
          of the square root of the total amount of light. See also Munsell color
          system, hue and chroma.
      variant ( soil):
        description: A soil whose properties are believed to be sufficiently different
          from other known soils to justify a new series name, but comprising such
          a limited geographic area that creation of a new series is not justified.
      varve:
        description: A distinct band representing the annual deposit of sedimentary
          materials regardless of origin. It usually consists of two layers; a thick
          light-colored layer of silt and fine sand laid down in the spring and summer
          and a thin dark-colored layer of clay laid down in the fall and winter.
          Because low temperatures are important in delaying the settling of the clay
          particles it is assumed that varve formation can occur only with glacial
          waters. The salts of seawater prevent the formation of varves of this kind.
          The electrolytes in seawater cause flocculation resulting in a homogeneous
          mass.
      vermiculite group:
        description: A group of hydrous platy clay minerals similar to the smectite
          group but having a higher net permanent charge and often larger particle
          size.
      vertical zonation:
        description: Altitudinal zonation of soils. See also latitude zonation.
      very coarse sand:
        description: See separates, soil and texture, soil.
      very fine sand:
        description: See separates, soil and texture, soil.
      very fine sandy loam:
        description: See texture / soil.
      void:
        description: Space in a soil mass not occupied by solid mineral matter. This
          space may be occupied by air, water or other gaseous or liquid material.
      void ratio:
        description: The ratio of the volume of void space to the volume of solid
          particles in a given soil mass.
      volume weight (Obsolete):
        description: See bulk density.
      wasteland:
        description: Land not suitable for, or capable of, producing materials or
          services of value. A miscellaneous land type.
      water table (groundwater surface):
        description: Free water surtace; groundwater elevation Elevation at which
          the pressure in the water is zero with respect to the atmospheric pressure.
          See also perched water table.
      water, soil:
        description: "Soil water is understood to be the equilibrium solution in the\
          \ soil; pure water refers to the chemically pure compound H20. Water in\
          \ soil is subject to several force fields originating from the presence\
          \ of the soil solid phase, the dissolved salts, the action of external gas\
          \ pressure, and the gravitational field. These effects may be quantitatively\
          \ expressed by assigning an individual component potential to each (below\
          \ and Table 4 ). The sum of these potentials is called the total potential\
          \ of soil water. total potential of soil water (potentiel total de l'eau\
          \ du sol) The amount of work that must be done per unit quantity of pure\
          \ water in order to transport reversibly and isothermally an infinitesimal\
          \ quantity of water from a pool of pure water, at a specified eievation\
          \ and at atmospheric pressure, to the soil water at the point under consideration.\
          \ The total potential of soil water consists of: osmotic potential (potentiel\
          \ osmotique) The amount of work that must be done per unit quantity of pure\
          \ water in order to transport reversibly and isothermally an infinitesimal\
          \ quantity of water from a pool of pure water, at a specified elevation\
          \ and at atmospheric pressure, to a pool of water identical in composition\
          \ with the soil water at the point under consideration, but in all other\
          \ respects being identical with the reference pool. gravitational potential\
          \ (potentiel de gravit&eacute;) The amount of work that must be done per\
          \ unit quantity of pure water in order to transport reversibly and isothermally\
          \ an infinitesimal quantity of water, identical in composition with the\
          \ soil water, from a pool at a specified elevation and at atmospheric pressure,\
          \ to a similar pool at the elevation of the point under consideration. matric\
          \ potential (capillary potential) (potentiel capillaire, de matrice) The\
          \ amount of work that must be done per unit quantity of pure water in order\
          \ to transport reversibly and isothermally an infinitesimal quantity of\
          \ water, identical in composition with the soil water, from a pool at the\
          \ elevation and the external gas pressure of the point under consideration,\
          \ to the soil water. gas pressure potential (potentiel &agrave; la pression\
          \ ext&eacute;rieure des gaz) This potential component is to be considered\
          \ only when external gas pressure differs from atmospheric pressure as in\
          \ a pressure membrane apparatus. A specific term and definition are not\
          \ given. water pressure, soil tension (pression de l'eau du sol) The pressure\
          \ (positive or negative), in relation to the external gas pressure on the\
          \ soil water, to which a solution identical in composition with the soil\
          \ water must be subjected in order to be in equilibrium through a porous\
          \ permeable wall with the soil water. It may be identified with the matric\
          \ potential defined above. Osmotic pressure (pression osmotique) The pressure\
          \ to which a pool of water, identical in composition with the soil water,\
          \ must be subjected in order to be in equilibrium, through a semipermeable\
          \ membrane, with a pool of pure water (semipermeable means permeable only\
          \ to water). It may be identified with the osmotic potential defined above.\
          \ total pressure (pression totale) The pressure (positive or negative),\
          \ in relation to the external gas pressure on the soil water, to which a\
          \ pool of pure water must be subjected in order to be in equilibrium through\
          \ a semipermeable membrane with the soil water. Total pressure is therefore\
          \ equal to the sum of soil water pressure and osmotic pressure. Total pressure\
          \ may also be derived from the measurement of the partial pressure of the\
          \ water vapor in equilibrium with the soil water. It may be identified with\
          \ the total potential defined above when gravitational and external gas\
          \ pressure potentials can be neglected. hydraulic head (charge hydraulique)\
          \ The elevation with respect to a specified reference level at which water\
          \ stands in a piezometer connected to the point in question in the soil.\
          \ Its definition can be extended to soil above the water table if the piezometer\
          \ is replaced by a tensiometer. The hydraulic head in systems under atmospheric\
          \ pressure may be identified with a potential expressed in terms of the\
          \ height of a water column. More specifically, it can be identified with\
          \ the sum of gravitational and matric potentials and may be called the hydraulic\
          \ potential. water content (teneur en eau) The amount of water lost from\
          \ the soil when it is dried to constant weight at 105oC; expressed either\
          \ as the weight of water per unit weight of dry soil or as the volume of\
          \ water per unit bulk volume of soil. The relationship between water content\
          \ and soil water pressure is called the soil moisture retention curve, or\
          \ sometimes the soil water (moisture) characteristic. Depending upon whether\
          \ the curve is determined with decreasing or increasing water content, it\
          \ is a desorption or adsorption curve respectively. differential water capacity\
          \ (capacit&eacute; diff&eacute;rentielle de r&eacute;tention d'eau) The\
          \ absolute value of the rate of change of water content with soil water\
          \ pressure. The water capacity at a given water content will depend on the\
          \ particular desorption or adsorption curve used. Distinction should be\
          \ made between volumetric and specific water capacity. Experimentally it\
          \ has been established that generally the flow of a fluid in a porous medium\
          \ can be described by Darcy's law, which states that the flux of fluid is\
          \ proportional to the driving force. In viscous flow of water in soils,\
          \ the driving force equals the negative gradient of the hydraulic potential.\
          \ hydraulic conductivity (conductivit&eacute; hydraulique) The proportionality\
          \ factor in Darcy's law as applied to the viscous flow of water in soil,\
          \ that is, the flux of water per unit gradient of the hydraulic potential.\
          \ if conditions require that the viscosity of the fluid be separated from\
          \ the conductivity of the medium, it is convenient to define the permeability\
          \ (or intrinsic permeability) of the soil as the conductivity (expressed\
          \ in g&shy;&sup1; cm &sup3; sec) multiplied by the viscosity (in poises).\
          \ For the purpose of solving the partial differential equation of the nonsteady-state\
          \ flow in unsaturated soil it is often convenient to introduce a variable\
          \ called the soil water diffusivity. soil water diffusivity (capacit&eacute;\
          \ de diffusion de l'eau dans le sol ) The hydraulic conductivity divided\
          \ by the differential water capacity (using consistent units), or the flux\
          \ of water per unit gradient of moisture content in the absence of other\
          \ force fields."
        see_also: https://sis.agr.gc.ca/cansis/glossary/table-4.html
      water-retention curve:
        description: See moisture-retention curve.
      water-stable aggregate:
        description: A soil aggregate that is stable to the action of water, such
          as falling drops or agitation as in wet-sieving analysis.
      waterlogged:
        description: Saturated with water.
      weathering:
        description: "The physical and chemical disintegration alteration, and decomposition\
          \ of rocks and minerals at or near the earth's surface by atmospheric agents."
      wild flooding:
        description: See irrigation methods.
      wild land:
        description: Uncultivated land. It may or may not be maintained by the owner
          for its productive vegetative cover or for wood, forage production, recreation
          or wildlife.
      wilting coefficient (Obsolete):
        description: 'A calculated value of the approximate wilting point or permanent
          wilting percentage. Calculated as follows: (1) wilting coefficient = hygroscopic
          coefficient/0.68 or (2) wilting coefficient = moisture equivalent/1.84'
      wilting point (permanent wilting:
        description: The moisture content of a soil at which plants (specifically
          sunflower plants) wilt and fail to recover their turgidity when placed in
          a dark, humid atmosphere. The wilting point is commonly estimated by measuring
          the 15-bar percentage of a soil.
      windbreak:
        description: A planting of trees, shrubs or other vegetation usually perpendicular
          or nearly so to the principal wind direction to protect such things as soil,
          crops, homesteads and roads against the effects of winds such as wind erosion
          and the drifting of soil and snow.
      xerophytes:
        description: Plants that grow in or on extremely dry soils or soil materials.
      young soil:
        description: Soil beginning to form.
      zeta potential:
        description: See electrokinetic potential.
      zonal soil:
        description: Any one of the great groups of soils having well-developed soil
          characteristics that reflect the zonal influence of climate and living organisms,
          mainly vegetation, as active factors of soil genesis. The zonal great soil
          group was the name of a former taxon that was similar to the present Canadian
          concept of the great group for example Gray Brown Luvisol
      zone soil:
        description: Area in which the dominant or zonal soils reflect the zonal influence
          of climate and vegetation, and form a natural land pattern with other soils
          that exhibit the zonal influence only weakly or not at all. The soil zone
          is not a taxonomic unit but may be used as a cartographic unit.
      zymogenous flora:
        description: Organisms found in soils in large numbers immediately after the
          addition of readily decomposable organic materials.
      1/3-bar percentage:
        description: The percentage of water contained in a soil that has been saturated
          subjected to and is in equilibrium with an applied pressure of l/3 bar.
          Pressure is applied in a ceramic plate apparatus. It is usually expressed
          as a weight percentage and is approximately the same as l/3-atmosphere percentage.
          Also for medium- to coarse-textured soils it is approximately numerically
          equal to moisture equivalent.
      15-atmosphere percentage:
        description: The percentage of water contained in a soil that has been saturated
          subjected to and is in equilibrium with an applied pressure of 15 atm. Pressure
          is applied in a pressure membrane or ceramic pressure plate apparatus. It
          is usually expressed as a weight percentage but may be expressed as a volume
          percentage. It is approximately the same as 15-bar percentage.
      15-bar percentage:
        description: The percentage of water contained in a soil that has been saturated
          subjected to and is in equilibrium with an applied pressure of 15 bars.
          Pressure is applied in a pressure membrane or ceramic plate apparatus. It
          is usually expressed as a weight percentage but may be expressed as a volume
          percentage. It is approximately the same as 15-atmosphere percentage.
      60-centimetre percentage.:
        description: 'The percentage of water contained in a soil that has been saturated,
          subjected to, and is in equilibrium with an applied pressure or tension
          equivalent to a column of water 60 cm high. Pressure may be applied in a
          pressure plate apparatus or as a tension on a tension table. It may be expressed
          on a weight or volume basis and is considered by many to approximate the
          ""field capacity"" especially in medium- to coarse-textured soils.'
slots: {}
extensions:
  locales:
    tag: locales
    value:
      fr:
        id: https://sis.agr.gc.ca/siscan/glossary/
        name: CANSIS_GLOSSARY
        version: '2026'
        in_language: fr
        enums:
          CANSIS_GLOSSARY:
            permissible_values:
              amino acid:
                title: acide aminé
                description: 'Nom générique des acides organiques contenant à la fois
                  le groupement amine (-NH2) et le groupement carboxyle(-COOH),de
                  formule générale: R-CH-COOH I NH2'
              hymatomelanic acid:
                title: acide hymatomélanique
                description: "Fraction d'humus qui, après extration en milieu alcalin\
                  \ et précipitation en milieu acide est soluble dans l'alcool et\
                  \ après distillation de l'alcool forme un résidu fragile insoluble\
                  \ dans l'alcool."
              fulvic acids:
                title: acides fulviques
                description: "Ce terme a plusieurs sens mais désigne généralement\
                  \ un mélange de composés organiques qui restent en solution après\
                  \ acidification d'un extrait alcalin, dilué, de sol."
              humic acids:
                title: acides humiques
                description: "Mélange de diverses substances organiques de couleur\
                  \ foncée, précipitées du sol par acidification d'un extrait alcalin\
                  \ dilué. Pour certains, ce terme ne désigne que la fraction de ce\
                  \ précipité qui est insoluble dans l'alcool."
              active acidity:
                title: acidité active
                description: "Acidité correspondent aux ions d'hydrogène actifs de\
                  \ la phase aqueuse d'un sol. On l'exprime en unité de pH."
              exchange acidity:
                title: acidité d&#39;éhange
                description: "Dans le complexe d'adsorption du sol, hydrogène et alumnium\
                  \ titrables et remplaçables par les cations d'une solution d'un\
                  \ sel neutre. S'exprime généralement en milliéquivalents par 100\
                  \ g de sol (méq/100g)."
              free acidity:
                title: acidité libre
                description: "Acidité de titration de la phase aqueuse d'un sol. Peut\
                  \ s'exprimer en milliéquivalents par poids unitaire de sol ou dans\
                  \ toutes autres unités de mesure convenables."
              potential acidity:
                title: acidité¿ potentielle
                description: "Dans un sol, quantité d'ions échangeables d'hydrogène\
                  \ qui peuvent être libérés dans la solution de sol, par échange\
                  \ cationique. On l'exprime généralement en milliéquivalents par\
                  \ poids unitaire de sol."
              actinomycetes:
                title: actinomycète
                description: "Micro-organismes uniceilulaires, filamenteux, à ramifications\
                  \ monopodes ou plus rarement dichotomes, formant des colonies de\
                  \ structure rayonnante; la plupart d'entre eux vivent dars le sol\
                  \ et lui donnent son odeur caractéristique."
              ion activity:
                title: activité ionique
                description: "Concentration réelle d'un ion donné dans une solution\
                  \ ou un système sol-eau. Par analogie avec le pH on l'exprirne en\
                  \ termes de «pCa» ou «pNa» etc."
              adaptation:
                title: adaptation
                description: "Appropriation d'un organisme à son milieu, résultant\
                  \ de modifications opérées par sélection naturelle des variations\
                  \ qui favoriseraient son existence dans le milieu."
              void ratio:
                title: aération du sol
                description: "Processus par lequel l'air du sol est remplacé par de\
                  \ l'air atmosphérique. Dans un sol bien aéré, la composition de\
                  \ l'air du sol est semblable à celle de l'atmosphère au niveau du\
                  \ sol. Les sols rnal aérés contienent généralement un pourcentage\
                  \ nettement plus élevé de gaz carbonique et un pourcentage proportionnellement\
                  \ plus faible d'oxygène, que l'atmosphére. Le taux d'aération est\
                  \ en grande partie fonction du volume et de la continuité des pores\
                  \ du sol."
              aerobic:
                title: aérobie
                description: "(1) Don't le milieu contient de I'oxygène moléculaire.\
                  \ (2) Ne se développant qu'en présence d'oxygène moléculaire comme\
                  \ les organismes aérobies. (3) Se dit d'un processus chimique ou\
                  \ biochimique ne se produisant qu'en présence d'oxgène moléculaire,\
                  \ comme la décomposition aérobie."
              aggregate:
                title: agrégat
                description: Assemblage de particules de sol adhérant entre elles
                  et formant du point de vue de la mécanique une unité.
              dry aggregate:
                title: ped, agrégat naturel
                description: "Unité structurale du sol, comme le prisme, le polyèdre\
                  \ ou le granule, formée sous l'action de processus naturels, par\
                  \ opposition à motte, formée artificiellement."
              water-stable aggregate:
                title: agrégat stable à l&#39;eau
                description: "Agrégat de sol qui résiste à l'action de l'eau, par\
                  \ exemple aux effets des gouttes tombantes ou à l'agitation telle\
                  \ que subie en analyse granulométrique par voie de tamisage à l'eau."
              agronomy:
                title: agronomie
                description: "Domaine des sciences agricoles qui a pour object l'étude\
                  \ théorique et pratique de la production des cultures de plein champ\
                  \ et l'aménagement scientifique du sol."
              soil (1):
                title: pH du sol
                description: "Logarithme négatif de l'activité des ions d'hydrogène\
                  \ d'un sol. Degré d'acidité ou d'alcalinité, mesuré au moyen d'une\
                  \ électrode en verre, d'une électrode à quinhydrone ou de tout autre\
                  \ électrode ou indicateur approprié, d'un sol ayant une teneur en\
                  \ eau ou un rapport sol/eau déterminé; s'exprime en unités de l'échelle\
                  \ des pH."
              alkalinity; soil:
                title: alcalinité du sol
                description: "Degré d'alcalinité ou de basicité d'un sol, qui s'exprime\
                  \ par une valeur supérieure à 7.0 à l'échelle des pH."
              allophane:
                title: allophane
                description: Alumino-silicate hydraté, amorphe, de composition non
                  déterminée.
              alluvial fan:
                title: alluvion
                description: "Argile, limon, sable, gravier, cailloux ou autres matériaux\
                  \ détritiques déposés par l'eau des rivières et des ruisseaux modernes."
              infiltration:
                title: vitesse d&#39;infiltration
                description: "Taux réel d'infiltration de l'eau à un temps donné.\
                  \ Peut être inférieure au taux d'infiltration maximal si l'apport\
                  \ d'eau est limité (précipitations ou irrigation). S'exprime dans\
                  \ les mêmes unités que le d'infiltration. Voir aussi taux d'infiltration."
              physical weathering:
                title: altération physique
                description: "Fragmentation des roches et des particules minérales\
                  \ en éléments plus petits sous l'action d'agents physiques comme\
                  \ le gel et le vent. Voir aussi altération."
              improvement / soil:
                title: amélioration du sol
                description: "Techniques ou réalisations dont le but est d'accroître\
                  \ la productivité d'un sol agricole, par drainage, irrigation, fumure,\
                  \ amendement et autres moyens."
              ammonification:
                title: ammonification
                description: "Processus biochimique par lequel les substances organiques\
                  \ azotées libèrent de l'azote ammoniacal."
              anaerobic:
                title: anaérobie
                description: "(1) Dont le millieu ne contient pas d'oxygène moléculaire.\
                  \ (2) Se développant en l'absence d'oxygène moléculaire comme les\
                  \ bactéries anaérobies. (3) Se dit d'un processus par exemple biochimique\
                  \ se produisant en l'absence d'oxygène moléculaire."
              facultative anaerobe:
                title: anaérobie facultatif
                description: Micro-organisme qui peut vivre soil en aérobie soit en
                  anaérobie.
              particle-size analysis:
                title: analyse granulométrique
                description: "Détermination, par sédimentation, tamisage, micrométrie\
                  \ ou une combinaison de ces méthodes, des quantités des diverses\
                  \ fractions d'un échantillon de sol. Parfois appelée analyse mécanique."
              mechanical analysis:
                title: analyse mécanique
                description: Voir analyse granulométrique.
              mineralogical analysis:
                title: analyse minéralogique
                description: Évaluation ou détermination du genre ou de la quantité
                  de minéraux présents dans une roche ou un sol.
              thermal analysis (or differential thermal analysis):
                title: analyse thermique ( analyse thermique différentielle)
                description: "Méthode d'analyse d'un échatillon du sol pour établir\
                  \ ses constituants, basée sur le taux différentiel de chauffage\
                  \ de l'échantillon inconnu et du standard sous une appication uniforme\
                  \ de chaleur."
              antagonism:
                title: antagonisme
                description: Destrution, lésion ou inhibition de croissance réciproques
                  que subissent des organismes différents occupant la même niche écologique
              antibiotic:
                title: antibiotique
                description: "Substance produite par une espèce de micro-organismes\
                  \ et qui, en solution diluée, possède la propriété de détruire certains\
                  \ sautres organismes ou d'en inhiber la croisssance."
              serial dilution:
                title: solution du sol
                description: "Phase liquide et aqueuse du sol et ses solutés constitués\
                  \ d'ions dissociés des surface des particules du sol et d'autres\
                  \ matériaux solubles."
              slaty:
                title: dalle
                description: "Mince fragment de grès, de calcaire. d'ardoise, de schiste\
                  \ argileux, rarement de schiste, de 15 à 37 cm (6 à 15 po) de longueur.\
                  \ Voir aussi fragments grossiers."
              clay:
                title: argile
                description: "(1) Granulométrie: fraction granulométrique formée de\
                  \ particules de diamètre équivalent de moins de 0.002 mm ou d'autres\
                  \ dimensions (géologues et ingénieurs). (2) Minéralogie: matériau\
                  \ naturel, terreux, microgrenu, qui devient plastique par addition\
                  \ d'une faible quantité d'eau. (3) Pédologie: classe texturale.\
                  \ Voir texture de sol. (4) Fraction granulométrique: matériau généralement\
                  \ formé surtout de minéraux agrileux mais aussi habituellement d'oxydes\
                  \ libres amorphes et de minéraux primaires."
              fine clay:
                title: argile fine
                description: "Fraction argileuse d'un calibre spécifique de moins\
                  \ de 2 m, généralement de moins de 0.2 ou 0.08 um."
              silty clay:
                title: classe de sol
                description: "Groupe de sols présentant des limites définies de variations\
                  \ d'une propriété donnée, comme l'acidité, la pente, la texture,\
                  \ la structure, les possibilités d'utilisation, le degré d'érosion\
                  \ ou de drainage."
              heavy clay:
                title: argile lourde
                description: Classe de texture. voir aussi texture du sol.
              sandy clay:
                title: argile sableuse
                description: Classe de texture du sol. voir aussi classe de sol et
                  texture du sol.
              sensitivity:
                title: sensibilité
                description: "Résultat du remoulage en ce qui concerne la résistance\
                  \ au cisaillement d'un sol cohésif non drainé."
              clayey:
                title: argileux
                description: "Contenant de grandes quantités d'argile ou possédant\
                  \ les propriétés de l'argile."
              arthropod:
                title: arthropode
                description: Invertébré à membres articulés comme les insectes et
                  les crustacés.
              nitrogen assimilation:
                title: assimilation de l&#39;azote
                description: Incorporation, par des organismes vivants, de léazote
                  dans les constituants organiques des cellules.
              silting:
                title: assise
                description: "Couche d'un matériau spécifié ou choisi d'une épaisseur\
                  \ calculée et déposée sur la surface d'application du revêtement\
                  \ et remplissant une ou plusieurs fonctions comme la distribution\
                  \ de la charge et le drainage et la diminution des effets du gel."
              association (soil):
                title: sol d&#39;association
                description: Groupe cartographique et non taxonomique de sols ou de
                  secteurs du terrain, dans lequel les sols apparentés se combinent
                  en unités suivant la ressemblance de leurs situations géomorphiques,
                  des formes du terrain, de leurs caractères édaphiques et mécaniques
                  (climat, drainage, granulométrie, etc.) et suivant à un certain
                  point la correspondance de la nature géologique des matériaux du
                  sol ainsi que des classes taxonomiques. Voir aussi association de
                  sols.
              autotrophic:
                title: autotrophe
                description: "Qui peut utiliser le carbone minéral comme source principale\
                  \ de carbone et qui peut tirer de l'énergie pour l'entretien de\
                  \ la vie, de l'oxydation d'éléments minéraux (chimiotrophe) ou de\
                  \ l'énergie lumineuse (phototrophe)."
              podzolic B:
                title: B podzolique
                description: "Formé d'un ou de plusieurs des horizons Bf, Bhf et Bh.\
                  \ Voir aussi horizon du sol."
              badland:
                title: lame
                description: "Couche isolée de moins de 1 cm d'épaisseur dans une\
                  \ coupe stratifiée."
              bar:
                title: bar
                description: Unité de pression égale à un million de dynes par centimètre
                  carré.
              floodplain:
                title: plaine d&#39;inondation
                description: "Terre bordant un cours d'eau, faite des sédiments déposés\
                  \ lors de débordements du cours d'eau et sujette à l'inondation\
                  \ au moment de la crue. Voir aussi fond alluvial, plaine alluviale."
              lime requirement:
                title: besoin en chaux
                description: "Quantité de chaux. ou quantité équivalente d'un autre\
                  \ matériau de chaulage, qu'il faut incorporer sur 1 ha de sol et\
                  \ sur une épaisseur de 15 cm (soit 2240 tonnes métriques de sol)\
                  \ pour élever le pH de ce sol à une valeur déterminée par la condition\
                  \ du terrain."
              fertilizer requirement:
                title: besoin en engrais
                description: "Quantité de certains éléments nutritifs dont les plantes\
                  \ ont besoin en supplément de ceux que fournit le sol afin d'accélérer\
                  \ la croissance des plantes jusqu'à un optimum établi."
              biosequence:
                title: bioséquence
                description: "Succession de sols apparentés qui se distinguent les\
                  \ uns des autres principalement par le genre et le normbre d'organismes\
                  \ qui jouent un rôle dans la formation des sols."
              bisect:
                title: bisect
                description: Coupe des plantes et du sol montrant la distribution
                  verticale et horizontale des racines et des tiges aériennes, dans
                  leur position naturelle.
              sequum:
                title: sequum
                description: "Dans un sol la séquence d'un horizon éluvial et de son\
                  \ horizon illuvial correspondant."
              erratic:
                title: bloc erratique
                description: "Fragment rocheux déplacé et dont la nature diffère de\
                  \ celle du roc sous-jacent environnant. S'applique généralement\
                  \ aux fragments transportés par la glace, soit des glaciers, soit\
                  \ flottante."
              boulders:
                title: blocs rocheux/ blocs
                description: Fragments de roches de plus de 60 cm (2 pi) de diamètre.
                  En génie les blocs ont un diamètre supérieur à 20 cm (8 po).
              Brown:
                title: Brun
                description: "Grand groupe de sols de l'ondre chernozémique que l'on\
                  \ rencontre dans les régions de prairie de climat frais, subaride\
                  \ ou semi-aride et formés d'un horizon de surtace (Ah ou Ap) brun\
                  \ (sec) et généralement d'un horizon B (Bm, Btj ou Bt) brunâtre\
                  \ moins foncé qui peut cependant manquer recouvrant un horizon C\
                  \ généralement calcaire à degré élevé de saturation en bases."
              Dark Brown:
                title: brunisol sombrique
                description: "Grand groupe de sol de l'ordre brunisolique. Ces sols\
                  \ ont un horizon Ah de moder de plus de de 5 cm (2 po) d'épaisseur\
                  \ et un horizons Bm dont le pourcentage de saturation en bases (NaCl)\
                  \ est généralement de 65 à 100% et le pH (CaCI2}est généralement\
                  \ d'environ 5,5."
              Dystric Brunisol:
                title: brunisol dystrique
                description: "Grand groupe de sol de l'ordre brunisolique. Ces sols\
                  \ peuvent avoir des horizon de mull Ah de moins de 5 cm (2 po) d'épaisseur.\
                  \ lls ont aussi des horizons Bm dont la saturation en bases (NaCI)\
                  \ varie géréralement de 65 à 100% et dont le pH (CaCI2) est géréralement\
                  \ égal ou inférieur à 5.5."
              Eutric Brunisol:
                title: brunisol eutrique
                description: "Grand groupe de sols de l'ordre brunisolique. Ces sols\
                  \ peuvent avoir des horizon Ah de mull de moins de 5 cm (2 po) d'épaisseur,\
                  \ et ont des horizons Brn dont la saturation en bases (NaCI) est\
                  \ de 100%."
              Melanic Brunisol:
                title: brunisol mélanique
                description: "Grand groupe de sols de l'ordre brunisolique. Ces sols\
                  \ ont des horizons de mull Ah de plus de 5 cm (2 po) d'épaisseur\
                  \ et des honizons Bm saturés en bases. Ce groupe comprend les sols\
                  \ anciennement appelés bruns forestiers."
              Brunisolic:
                title: brunisolique
                description: "Désigne un ordre de sols dont la formation des horizons\
                  \ est assez avancée pour les exclure de l'ordre régosolique mais\
                  \ dont les stades ou les types de formation des horizons ne correspondent\
                  \ pas à ceux des autres ordres de sols. Ces sols que l'on retrouve\
                  \ dans des régions aux conditions climatiques et de végétation très\
                  \ variées ont tous des horizons Bm ou Btj. Les grands groupes des\
                  \ brunisols mélaniques des brunisols eutriques des brunisols sombriques\
                  \ et des brunisols dystriques appartiennent à cet ordre."
              cobble:
                title: caillou
                description: Voir caillou roulé; galet.
              stony land:
                title: terrain pierreux
                description: "Endroit contenant suffisamment de pierres pour rendre\
                  \ impraticable l'emploi de machines aratoires; la surface d'un tel\
                  \ terrain est généralement recouverte de 15 à90% de pierres. Voir\
                  \ aussi pierrosité."
              calciphytes:
                title: calciphytes
                description: "Plantes qui ont besoin ou qui peuvent tolérer des concentrations\
                  \ assez élevées en calcium. ou que l'on associe à des sols riches\
                  \ en calcium."
              caliche:
                title: caliche
                description: "(1) Couche située près de la surface, plus ou moins\
                  \ cimemtée par des carbonates secondaires de calcium ou de magnésium\
                  \ provenant d'une précipitation de ces corps en solution dans le\
                  \ sol. Le caliche peut former un horizon mince et tendre, un lit\
                  \ épais et dur immédiatement sous le solum, ou une couche de surface\
                  \ exposée par l'érosion. Le caliche n'est pas une formation géologique.\
                  \ (2) Alluvions cimentées par des sels comme le nitrate de sodium,\
                  \ le chlorure de sodium ou d'autres sels solubles, dans les gisements\
                  \ de nitrate du Chili et du Pérou."
              field capacity:
                title: capacité au champ
                description: "Pourcentage de l'eau demeurée dans le sol au bout de\
                  \ deux ou trois jours après que le sol a été saturé et que le drainage\
                  \ naturel s'est pratiquement terminé. Peut se calculer au poids\
                  \ ou au volume. Voir aussi tension de l'eau du sol."
              heat capacity (volume):
                title: capacité calorifique
                description: "Quantité de chaleur qu'il faut fournir pour élever d'un\
                  \ degré la température d'un volume unitaire de sol. On peut l'exprimer\
                  \ en fonction du poids."
              exchange capacity:
                title: capacité d&#39;échange
                description: "Charge ionique totale du complexe d'adsorption qui joue\
                  \ un rôle dans l'adsorption d'ions. Voir aussi capacité d'échange\
                  \ anionique et capacité d'échange cationique."
              anion exchange capacity:
                title: capacité d&#39;échange anionique
                description: "Quantité total d'anions échangeables que le sol peut\
                  \ adsorber. S'exprime en milliéquivalents par 100 g de sol ou d'une\
                  \ autre matière adsorbante comme l'argile."
              cation exchange capacity:
                title: capacité d&#39;échange cationique
                description: "Quantité totale de cations échangeables que le sol peut\
                  \ adsorber. Se dit parfois: capacité totale échange; pouvoir d'échange\
                  \ de cations; ou capacité d'adsorption de cations. Elle s'exprime\
                  \ en milliéquivalents par 100 g de sol ou de toute autre substance\
                  \ adsorbante, comme l'argile."
              pH-dependent cation exchange capacity:
                title: capacité d&#39;échange cationique dépendant du pH
                description: "Différence entre la capacité d'échange cationigue effective\
                  \ et la capacité d'échange cationique d'un sol mesurée à un pH plus\
                  \ élevé que le pH du sol à l'état naturel."
              effective cation exchange capacity:
                title: capacité d&#39;échange cationique effective
                description: "Quantité de cations qu'un sol peut adsorber dans so\
                  \ état naturel."
              potential cation exchange capacity:
                title: capacité d&#39;échange cationique potentielle
                description: "Nombre total de cations qu'un sol peut adsorber à un\
                  \ pH donné."
              infiltration capacity (Obsolete):
                title: capacité d&#39;infiltration (désuet)
                description: "Voir taux d'infiltration."
              differential water capacity:
                title: capacité différentielle de rétention d&#39;eau
                description: Voir eau du sol.
              maximum water-holding capacity:
                title: capacité maximale de rétention d&#39;eau
                description: "Teneur moyenne en humidité d'un échantillon de sol perturbé\
                  \ de 1 cm de hauteur en équilibre hydraulique avec l'eau qui le\
                  \ baigne par sa base."
              category:
                title: catégorie
                description: "Groupe de sols apparentés définis suivant un niveau\
                  \ d'abstraction relativement uniforme. Les catégories de la classification\
                  \ canadienne sont l'ordre, le grand groupe, le sous-groupe, la famille\
                  \ et la série."
              ground moraine:
                title: variante du sol
                description: "Sol dont on pense que les propriétés sont suffisamment\
                  \ différentes de celles des autres sols connus pour justifier un\
                  \ nouveau nom de série, mais qui s'étend sur une région géographique\
                  \ tellement limitée que la création d'une nouvelle série n'est pas\
                  \ justifiée."
              hydraulic head:
                title: charge hydraulique
                description: Voir eau du sol.
              permanent charge:
                title: charge permanente
                description: "Charge nette, négative ou positive, des particules d'argile,\
                  \ propre au réseau cristallin de la particule. Elle est indépendante\
                  \ des variations du pH et des réactions d'échange ionique."
              solclime:
                title: chaux
                description: "Amendement du sol consistant principalement en carbonate\
                  \ de calcium, contenant aussi du carbonate de rnagnésium et parfois\
                  \ d'autres substances. Utilisé comme source de calcium et de magnésium\
                  \ qui sont deux éléments essentiels dans la croissance des plantes,\
                  \ et pour neutraliser l'acidité du sol."
              Chernozemic:
                title: chernozémique
                description: "Se dit d'un ordre de sols se développant sous une végétation\
                  \ xérophile ou mésophile de graminées et de dicotylédones herbacées\
                  \ ou une végétation de transition prairie-forêt dans les régions\
                  \ à climat frais ou froid et variant de subaride à subhumide. Ces\
                  \ sols sont formés d'un horizon de surface (Ah ou Ahe ou Ap) de\
                  \ couleur foncée et d'un horizon B ou C ou des deux à degré élevé\
                  \ de saturation en bases. L'ordre chernozémique est formé des grands\
                  \ groupes de sols bruns, brun foncé, noirs et gris foncé."
              chitin:
                title: chitine
                description: Polysaccharide azoté présent dans la cuticule des insectes
                  et les membranes cellulaires de nombreux champignons.
              chronosequence:
                title: chronoséquence
                description: "Succession de sols apparentés qui ne diffèrent les uns\
                  \ des autres que par certaines propriétés pricipalement à cause\
                  \ de l'action du temps agissant comme facteur pédogénétique."
              textural classification:
                title: classement textural
                description: Voir texture du sol.
              management groups / soil:
                title: classes (groupes) de gestion des sols
                description: "Classes ou groupes d'unités de sols ayant les mêmmes\
                  \ possibilités ou exigences de gestion à des fins spécifiques comme\
                  \ l'adaptabilité ou l'assolement des cultures, les techniques de\
                  \ drainage, l'amendement, l'exploitation forestière et l'aménagement\
                  \ de routes."
              erosion classes:
                title: érosion en ravins
                description: Voir érosion (2).
              structure classes (soil):
                title: classes structurales du sol
                description: "Regroupement d'unités ou d'agrégats naturels par ordre\
                  \ de taille. Les classes sont énumérés sous la rubrique structure\
                  \ du sol. (Types de-Tableau 4)."
              land classification:
                title: classification des terres
                description: Répartition de sections de terrain en différentes catégories
                  basées sur les propriétés de ce terrain ou sur ses aptitudes pour
                  un emploi particulier.
              climax:
                title: climax
                description: Association de végétaux évoluée au plus haut degré possible
                  sous les conditions du milieu dominant, et demeurant en équilibre
                  dynamique avec ce milieu.
              climosequence:
                title: climoséquence
                description: "Succession de sols apparentés qui ne diffèrent les uns\
                  \ des autres que par certaines propriétés principalement à cause\
                  \ de l'action du climat, agissant comme facteur pédogénétique."
              clinosequence:
                title: clinoséquence
                description: "Succession de sols apparentés qui ne diffèrent les uns\
                  \ des autres que par certaines propriétés principalement à cause\
                  \ de l'eflet du degré de la pente sur laquelle ils se sont formés.\
                  \ Voir aussi toposéquence."
              Munsell color system:
                title: code de couleurs Munsell
                description: "Système d'indices de couleurs désignant les trois variables\
                  \ simples, qui sont la teinte, la luminosité et la saturation («hue»,\
                  \ «value» et «chroma»). Par exemple, 10YR 6/4 est la couleur d'un\
                  \ sol ayant une teinte de 10YR, une luminosité de 6 et une saturation\
                  \ de 4. Ce code peut être traduit dans plusieurs systèmes différents\
                  \ de nomenclature de couleurs."
              wilting coefficient (Obsolete):
                title: coefficient de flétrissement (désuet)
                description: 'Valeur calculée du point de flétrissement approximatif,
                  ou pourcentage de flétrissement permanent. On le calcule comme il
                  suit: (1) coefficient de flétrissement = coefficient hygroscopique/0.68
                  ou (2) coefficient de flétrissement = humidité équivalente/1.84.'
              hygroscopic coefficient (Obsolete):
                title: coefficient hygroscopique
                description: "(désuet) Poids, en pourcentage, d'eau retenue par le\
                  \ sol (1) après séchage à l'air, ou (2) après équilibre dans un\
                  \ milieu non spécifié d'une humidité relative élevée, généralement\
                  \ près de la saturation, ou dans un milieu d'une humidité relative\
                  \ déterminée à une température déterminée."
              colloid:
                title: colloïde
                description: Substance finement dispersée, formée de particules de
                  diamètres compris entre 10-4 et 10-7 cm.
              colluvium:
                title: colluvion
                description: "Mélange hétérogène de matériaux qui, sous I'action de\
                  \ la force gravitationnelle a été entraîné le long d'une pente et\
                  \ s'est accumulé à sa base. Voir aussi reptation."
              coating:
                title: colmatage
                description: "Nivelage d'un terrain par voie de déposition."
              colony:
                title: colonie
                description: "Développement visible à l'oeil nu de micro-organismes\
                  \ sur un milieu de culture solide."
              columnar:
                title: colonnaire
                description: columnar
              commensalism:
                title: commensalisme
                description: "Relation existant entre deux espèces d'organismes vivant\
                  \ dans le même milieu sans que I'une nuise à l'autre et où, parfois,\
                  \ I'une des espèces, sinon les deux, se procure de la nourriture,\
                  \ une protection ou d'autres avantages."
              adsorption complex:
                title: courbe de désorption
                description: "Voir courbe de rétention d'eau."
              buffer compounds/ soil:
                title: complexe tampon
                description: Argile, matières organiques et matières minérales comme
                  les carbonates et les phosphates, qui empêchent les variations notables
                  du pH du sol.
              compost:
                title: compost
                description: "Débris organiques ou mélange de débris organiques et\
                  \ de sol mis en tas, arrosés et qu'on laisse se décomposer. On y\
                  \ ajoute parfois des engrais minéraux. Lors-qu'il est formé en grande\
                  \ partie de débris végétaux, le compost est souvent appelé «fumier\
                  \ artificiel» ou «fumier synthétique»."
              compressibility:
                title: compressibilité
                description: "Propriété que possède un sol de diminuer de volume sous\
                  \ l'effet d'une pression."
              symmetry concentration:
                title: concentration symétrique
                description: "Quantité de cations ou d'anions correspondant à la capacité\
                  \ d'échange d'un sol. Par exemple, si la capacité d'échange cationique\
                  \ d'un sol est de 10 meq/100 g de sol, une concentration symétrique\
                  \ de 1 vaut 10 meq pour tout cation. Voir aussi valeur symétrique."
              concretion:
                title: concrétion
                description: "Masse ou concentration d'un composé chimique, comme\
                  \ le carbonate de calcium ou un oxyde de per sous forme de granule\
                  \ ou de nodule de taille, de forme, de dureté et de couleur diverses\
                  \ se formant dans le sol ou la roche. L'acception du terme est parfois\
                  \ limitée aux granules formés par apports concentriques. La composition\
                  \ de certaines concrétions diffère de celle des matériaux environnants."
              calcareous soil:
                title: concrétion calcaire
                description: "Agrégation de carbonate de calcium précipité ou d'autres\
                  \ substances cimentées par le carbonate de calcium précipité."
              thermal conductivity:
                title: conductibilité thermique
                description: "Taux de transfert de la chaleur transmise à ou reçue\
                  \ d'un point dans le sol."
              capillary conductivity:
                title: conductivité capillaire
                description: '(désuet) Voir eau du sol: conductivilté hydraulique.'
              hydraulic conductivity:
                title: conductivité hydraulique
                description: Voir eau du sol.
              conservation (soil):
                title: conservation du sol
                description: "(1) Lutte contre l'érosion ou la dégradation chimique;\
                  \ en d'autres termes, la lutte contre une trop forte diminution\
                  \ naturelle ou artificielle de la fertilité du sol. (2) Ensemble\
                  \ de méthodes d'aménagement et de mise en valeur du sol employées\
                  \ afin de prévenir l'épuisement ou la dégradation sous l'effet de\
                  \ facteurs naturels ou anthropiques. (3) Domaine de la science des\
                  \ sols qui a pour objet la conservation des sols, définie en (1)\
                  \ et en (2)."
              consistence:
                title: consistance
                description: "Résistance d'un matériau à la déformation ou à la rupture.\
                  \ Degré de cohésion cu d'adhésion d'une masse de sol. Les termes\
                  \ employés pour définir la consistance d'un sol à diverses teneurs\
                  \ en eau sont : sol trempé: non collant, peu collant, collant et\
                  \ très collant; non plastique, peu plastique, plastique et très\
                  \ plastique. sol humide: meuble, très friable, friable, ferme et\
                  \ très ferme; compact, très conpact et extrêmement cornpact. sol\
                  \ sec: meuble, tendre, peu dur, dur, très dur et extrêmement dur.\
                  \ sol cimenté: peu cimenté, fortement cimenté et induré."
              consolidation:
                title: consolidation
                description: "Diminution progressive du volume d'une masse de sol\
                  \ sous l'effet d'un accroissement des forces de compression."
              plasticity constants:
                title: constantes de plasticité
                description: Voir limite de liquidité, limite de plasticité et indice
                  de plasticité.
              coprolite:
                title: coprolithe
                description: Granule de matières fécales.
              topsoil:
                title: couche arable
                description: (1) Couche du sol remuée au labourage. Voir aussi sol
                  de surface. (2) Horizon A. (3) Horizon Ah. (4) Substance du sol
                  supposément fertile dont on se sert pour recouvrir les bas-côtés
                  des routes, les jardins et les pelouses.
              cryic layer:
                title: couche cryique
                description: "Couche glée d'une année à l'autre."
              cumulo layer:
                title: couche cumulique
                description: Couche de matériau sableux, limoneux ou argileux dans
                  un sol organique.
              hardpan layer:
                title: couche durcie/ cuirasse
                description: Voir pans.
              fibric layer:
                title: couche fibrique
                description: "Couche d'une matière organique de sol contenant de grandes\
                  \ quantités de fibres peu décomposées dont l'origine botanique est\
                  \ facilement reconnaissable."
              humic layer:
                title: couche humique
                description: Couche de matériaux organiques très décomposés contenant
                  peu de fibres végétales.
              terric layer:
                title: couche terrique
                description: Substrat minéral non consolidé sous-jacent à des matériaux
                  organiques du sol.
              indurated layer:
                title: couche indurée
                description: Couche de sol durcie, généralement à cause de la cimentation
                  des particules du sol.
              limno layer:
                title: couche limnique
                description: "Dans un sol organique, couche d'au moins 5 cm (2 po)\
                  \ d'épaisseur composée de marne, de terre de diatomées ou de terre\
                  \ coprogène (tourbe sédimentaire)."
              lithic layer:
                title: couche lithique
                description: "Assise rocheuse située sous la coupe témoin d'un sol.\
                  \ Dans les sols organiques, assise rocheuse se recontrant à une\
                  \ profondeur allant de 10 cm (4 po) à 160 cm (64 po) à partir de\
                  \ la surface."
              mesic layer:
                title: couche mésique
                description: Couche de matières organiques parvenue à un stade de
                  décomposition situé entre ceux des couches fibrique et humique.
              R layer:
                title: couche R
                description: Roc sous-jacent consolidé. Voir aussi horizon du sol.
              mudflow slide:
                title: coulée de boue (d&#39;argile)
                description: "Déplacement en masse d'argile sensible."
              color:
                title: couleur
                description: Voir Munsell (code de couleurs).
              water-retention curve:
                title: courbe de rétention d&#39;eau
              summation curve (of particle sizes):
                title: courbe de sommation (de dimensions des particules)
                description: "Courbe du pourcentage cumulatif, en poids, des particules\
                  \ comprises dans des limites granulométriques, croissantes ou décroissantes,\
                  \ en fonction du diamètre des pariticules. Le pourcentage en poids\
                  \ de chaque fraction granulométrique est porté, de façon cumulative,\
                  \ en ordonnée, en fonction de l'intervalle total des diamètres présents\
                  \ dans l'échantillon et portés en abscisse."
              crag and tail:
                title: crag et tail
                description: "Colline allongée dont l'une des extrémités est formée\
                  \ de roche polie par les glaces et l'autre extrémité d'une traînée\
                  \ en pente de till."
              crystal:
                title: cristal
                description: Substance minérale homogène de composition chimique définie
                  limitée par des surfaces plannes formant des angles précis ente
                  elles lui donnant une forme géométrique définie.
              crotovina:
                title: crotovine
                description: 'Ancienne galerie creusée par un animal dans un horizon
                  du sol et qui s''est remplie de matières organiques ou de matériaux
                  d''un autre horizon. S''écrit aussi: ""krotovine"".'
              crust:
                title: croûte
                description: "Couche de sol superficiel d'une épaisseur allant de\
                  \ quelques millimètres à 2.5 cm (1 po) qui à l'état sec est beaucoup\
                  \ plus compacte, dure et fragile que les matériaux immédiatement\
                  \ sous-jacents."
              cryology:
                title: cryologie
                description: Étude des propriétés de la neige de la glace et des sols
                  gelés.
              Cryosolic:
                title: cryosolique
                description: "Ordre de sols qu'on se propose d'admettre au syst&egrave;me\
                  \ taxonomique canadien. Les sols cryosoliques, de nature min&eacute;rale\
                  \ ou organique, contiennent du mat&eacute;riau gel&eacute; d'une\
                  \ ann&eacute;e &agrave; l'autre qui se pr&eacute;sente &agrave;\
                  \ moins de 1 m (3 pi) de la surface, dans une certaine portion du\
                  \ corps de sol, ou p&eacute;don. La temp&eacute;rature annuelle\
                  \ moyenne de ces sols est inf&eacute;rieure &agrave; 0&deg;C (32&deg;F).\
                  \ lls dominent dans la zone de perg&eacute;lisol continu pour devenir\
                  \ moins r&eacute;pandus au sud, dans la zone de perg&eacute;lisol\
                  \ discontinu; les plus grandes superticies se sont d&eacute;velopp&eacute;es\
                  \ a partir de mat&eacute;riaux organiques, ou de mat&eacute;riaux\
                  \ min&eacute;raux de texture fine et de mauvais drainage. La v&eacute;g&eacute;tation\
                  \ associ&eacute;e aux sols cryosoliques varie du couvert v&eacute;g&eacute;tal\
                  \ clairsem&eacute; de la haute arctique &agrave; celui de la toundra,\
                  \ puis &agrave; la for&ecirc;t subarctique et la for&ecirc;t bor&eacute;ale\
                  \ du nord. La couche active de ces sols, surtout &agrave; proximit&eacute;\
                  \ des couches gel&eacute;es, est souvent satur&eacute;e d'eau de\
                  \ sorte que les sols min&eacute;raux, m&ecirc;me sur les terrains\
                  \ bien drain&eacute;s, pr&eacute;sentent ordinairement les couleurs\
                  \ &agrave; la gleyification. Les effets d'une forte cryoturbation\
                  \ peuvent ou non s'y manifester. L'ordre comprend trois grands groupes:\
                  \ les cryosols turbiques, sols min&eacute;raux qui r&eacute;v&egrave;lent\
                  \ les effets d'une forte cryoturbation et qui se situent en g&eacute;n&eacute;ral\
                  \ dans les terrains &agrave; surface r&eacute;ticul&eacute;e; les\
                  \ cryosols stables, sols min&eacute;raux sans indices de cryoturbation,\
                  \ et les cryosols organiques, sols organiques."
              cryoturbation:
                title: cryoturbation
                description: "Modification du sol sous l'effet du gel par gélivation\
                  \ soulèvement etc."
              cuesta:
                title: cuesta
                description: "Colline ou butte formée d'une paroi abrupte d'un côté\
                  \ (front) et d'une pente plus douce de l'autre (revers) dont I'inclinaison\
                  \ est plus ou moins liée à l'attitude des strates."
              green-manure crop:
                title: culture d&#39;engrais vert
                description: Culture destinée à être utilisée comme engrais vert.
                  Voir aussi engrais vert
              strip cropping:
                title: culture en bandes
                description: Technique de culture suivant des types différents de
                  procédés culturaux, comme la culture en lignes et b gazonnement
                  en bandes successives, le long des courbes de niveau ou perpendiculairement
                  à la direction du vent dominant.
              Cultivation:
                title: culture par paillis
                description: Méthode de culture dans laquelle les débris organiques
                  ne sont pas incorporés ou mélangés au sol mais sont laissés à la
                  surface du sol pour servir de paillis.
              pure culture:
                title: culture pure
                description: A nutrient medium containing the growth of a single strain
                  of an organism free from other living species or strains.
              Cutan:
                title: cutane
                description: Matériau de texture de structure ou de fabrique modifiée
                  situé sur les surfaces naturelles des matériau du sol et résultant
                  de la concentration de certains composants du sol ou de la modification
                  sur place de la matrice. Les cutanes peuvent se composer de toute
                  substance que comporte le matériau du sol.
              deflation:
                title: terrain de déflation
                description: "Terrain dénudé de la totalité ou presque de son sol\
                  \ et de ses matériaux d'origine, par l'érosion éolienne. ll forme\
                  \ généralement une dépression peu profonde nue de surface plane\
                  \ ou irrégulière formée d'une couche assez résistante ou d'une accumulation\
                  \ de cailloux ou des deux ou d'une zone humide recouvrant la nappe\
                  \ phréatique. Ces terrains sont généralement impropres à la culture.\
                  \ Type de terrains divers."
              nitrogen cycle:
                title: cycle de l&#39;azote
                description: "Succession de changements biochimique par laquelle l'azote\
                  \ est utilisé par un organisme vivant, puis libéré au moment de\
                  \ la mort et de la décomposition de cet organisme, puis enfin retourné\
                  \ à son état original d'oxydation."
              carbon cycle:
                title: cycle du carbone
                description: "Cycle dans lequel le gaz carbonique est fixé, par photosynthèse\
                  \ ou par chimiosynthèse, par des organismes vivants, consommé sous\
                  \ forme d'hydrates de carbone, de protéines et de lipides par la\
                  \ plupart des animaux et des plantes non chlorophylliennes, et finalement\
                  \ retourne à son état originel par la respiration des êtres vivants\
                  \ et la putréfaction des plantes et des animaux morts."
              hydrologic cycle:
                title: cycle hydrologique
                description: "États par lesquels l'eau passe naturellement, du moment\
                  \ de sa précipitation jusqu'à son retour, par évaporation, à l'atmosphère,\
                  \ d'où elle peut être de nouveau précipitée."
              erosion pavement:
                title: dallage d&#39;érosion
                description: "Couche de fragments grossiers (sable, gravier, cailloux\
                  \ ou pierres) qui reste à la surface du sol après l'érosion des\
                  \ particules fines."
              direct count:
                title: décompte direct; numération
                description: "En microbiologie des sols méthode d'estimation du nombre\
                  \ total de micro- organismes dans une masse donnée de sol, par examen\
                  \ direct au microscope."
              deflocculate:
                title: défloculer
                description: "(1) Séparer les différents composants des particules\
                  \ complexes par des moyens chimiques ou physiques ou physico-chimiques.\
                  \ (2) Mettre en suspension dans un milieu de dispersion les particules\
                  \ d'un système colloïdal à la phase dispersée."
              degradation:
                title: dégradation
                description: "Évolution d'un sol vers un état plus fortement lessivé\
                  \ et altéré, généralement accompagnée de transformations morphologiques,\
                  \ comme la genèse d'un horizon A (Ae) éluvié décoloré."
              delta:
                title: delta
                description: "Surface triangulaire formée à l'embouchure d'un cours\
                  \ d'eau par l'accumulation au fond d'un bassin, de couches successives\
                  \ de sédiments apportés des hautes terres. En eau calme, le cours\
                  \ d'eau abandonne la plupart des éléments les plus grossiers, les\
                  \ éléments plus fins étant charriés plus en aval. Les deltas sont\
                  \ caractérisés par les strates presque horizontales, appelées lits\
                  \ subhorizontaux, s'étendant sous des couches de texture plus grossière\
                  \ et de pente plus inclinée, appelées talus ou front."
              denitrification:
                title: dénitrification
                description: "Perte d'azote sous forme gazeuse sous l'effet de mécanismes\
                  \ biologiques ou chimiques; ce terme exclut la volatilisation de\
                  \ l'ammoniac."
              apparent density:
                title: densité apparente
                description: "Masse de sol sec par unité de volume brut. Le volume\
                  \ brut est calcuté avant séchage du sol par étuvage à 105 ° C jusqu'au\
                  \ poids constant."
              critical density:
                title: densité critique
                description: "Poids unitaire d'un matériau granuleux saturé au-dessous\
                  \ duquel sa résistance subit une baisse et au-dessus duquel sa résistance\
                  \ connaît un accroissement, lorqu'il est soumis à une déformation\
                  \ brusque. La densité critique d'un matériau est fonction de nombreux\
                  \ facteurs."
              heat flux density:
                title: densité du flux thermique
                description: Quantité de chaleur qui traverse une surface unitaire
                  par unité de temps.
              particle density:
                title: densité particulaire
                description: "Mesure de la masse par volume unitaire de particules\
                  \ du sol. On l'exprime généralement en grammes par centimètre cube.\
                  \ Voir aussi densité apparente."
              deposit:
                title: dépôt
                description: "Matériau abandonné dans un endroit autre que son lieu\
                  \ d'origine, par un agent naturel, comme l'eau, le vent, la glace,\
                  \ par la force de gravité ou par l'activité humaine."
              Overconsolidated soil deposit:
                title: dépôt de sol surcompacté
                description: Couche de sol qui a été soumise à une pression réelle
                  supérieure à celle exercée par les dépôts de surface actuels.
              eolian deposit:
                title: dépôt lacustre
                description: "Matériaux déposés dans l'eau d'un lac, puis laissés\
                  \ à sec soit par une baisse du niveau de l'eau, soit par un soulèvement\
                  \ de terrain. Leur texture peut aller du sable à l'argile."
              beach deposits:
                title: dépôts fluviaux
                description: "Tous les sediments, passés et présents, déposés par\
                  \ les cours d'eau, y compris les dépôts fluvio-glaciaires. Ce terme\
                  \ exclut cependant les dépôts transformés par les vagues et ceux\
                  \ qui proviennent de l'erosion en nappe ou des mouvements en masse\
                  \ de débris terreux."
              fluvial deposits:
                title: dépõts fluvio-glaciaires
                description: "Detris transportés par les glaciers, puis triés et déposés\
                  \ par les cours d'eau de fonte. Les dépôts sont stratifiés et se\
                  \ présentent sous forme de plaines d'épandage fluvio glaciaire,\
                  \ de deltas, de kames, d'eskers et de terrasses de harne. Voir aussi\
                  \ drift glaciare et till."
              aggradation:
                title: désagrégation
                description: "Rupture des agrégats résultant de l'addition d'eau au\
                  \ sol."
              dehydrogenase:
                title: déshydrogénase
                description: "Enzyme qui accélère le processus d'oxydation d'un substrat\
                  \ en en retirant l'hydrogène."
              dehydrogenation:
                title: déshydrogénation
                description: "Retrait de l'hydrogène d'une molécule par exemple."
              disintegration:
                title: fraction fine
                description: "Terme employé en mécanique du sol pour désigner la portion\
                  \ d'un sol qui passe à travers les mailles (74 µm) d'un tamis standard\
                  \ n°200 (U.S)."
              foliar diagnosis:
                title: diagnostic foliaire
                description: "Étude par laquelle on estime jusqu'à quel point les\
                  \ plantes reçoivent du sol certains éléments chimiques qui leur\
                  \ sont nécessaires d'après la couleur et la croissance du feuillage."
              equivalent diameter:
                title: humidité équivalente
                description: "Le pourcentage, en poids, de l'eau retenue par un échantillon\
                  \ de sol préalablement saturé, d'une épaisseur de 1 cm après exposition\
                  \ à une force centrifuge de 1000 gravités pendant 30 minutes."
              diatoms:
                title: diatomées
                description: Algues à coquille siliceuse qui persiste après la mort
                  de la cellule. Ces algues microscopiques, unicellulaires ou organisées
                  en colonies appartiennent à la classe des Bacillariophycées et croissent
                  en abondance dans les eaux douces et salées; leurs débris sont largement
                  répandus dans les sols.
              diversion dam:
                title: digue (barrage de dérivation)
                description: "Ouvrage destiné à dériver vers un nouveau cours une\
                  \ partie ou la totalité des eaux d'un cours d'eau."
              disperse:
                title: disperser
                description: "(1) Diviser des particules complexes, comme les agrégats,\
                  \ en leurs composants. (2) Répartir ou mettre en suspension des\
                  \ éléments fins, comme l'argile, dans un milieu de dispersion, comme\
                  \ l'eau."
              double layer:
                title: double couche
                description: "En chimie des collödes, I'ensemble des deux couches\
                  \ de charges électriques entourant les molécules colloïdales de\
                  \ la phase dispersée, la première, généralement négative, correspondant\
                  \ aux charges des molécules proprement dites, et la seconde, diffuse,\
                  \ de signe opposé, correspondant aux ions en solution."
              excessive drainage:
                title: drainage excessif
                description: "Pertes d'eau trop grandes ou trop rapides, soit par\
                  \ infiltration. soit par écoulement en surface. La perte d'eau est\
                  \ plus grande qu'il ne faut pour empêcher l'établissement d'un état\
                  \ d'anaérobie pendant un temps notable."
              surface sealing:
                title: imperméabilisation (obturation de surface)
                description: "Orientation et tassement de particules dispersées à\
                  \ la surface immédiate du sol de façon à la rendre assez imperméable\
                  \ à l'eau."
              drain:
                title: drainer
                description: "(1) Évacuer l'eau en excès par écoulement en surface,\
                  \ dans des fossés, ou par écoulement souterrain dans des tuyaux\
                  \ de drainage. (2) Perdre de l'eau par infiltration."
              stratified drift (or sorted drift):
                title: drift stratifié (drift trié)
                description: "Matériaux formés de fragments visiblement triés suivant\
                  \ leur taille et leur poids sous l'action d'un agent de transport\
                  \ {eau ou vent} plus fluide que les glaciers."
              drumlin:
                title: drumlin
                description: Colline allongée ou ovale, constitusée de débris glaciaires,
                  généralement de till glaciaire, déposés par less glaciers et dont
                  le grand axe est parallèle à la direction du mouvement des glaces.
              dunes:
                title: dunes
                description: Buttes ou collines de sable formées par le vent de la
                  même façon que les congères. Elles sont amorcées par un obstacle,
                  comme un buisson, un bloc rocheux ou une clôture, qui provoque un
                  tourbillon ou gêne le mouvement du vent chargé de sable. Une fois
                  amorcées, les dunes offrent toujours plus de résistance au vent
                  et évoluent suivant diverses formes.
              duric:
                title: durique
                description: "Terme désignant un horizon Bc fortement cimenté dont\
                  \ la limite supérieure est habituellement abrupte et la limite inférieure,\
                  \ diffuse. La cimentation est généralement au plus fort près de\
                  \ la limite supérieure. D'ordinaire, cet horizon est d'une couleur\
                  \ semblable à celle du matériau originel et d'une structure amorphe\
                  \ ou lamellaire grossière. Les mottes séchées à l'air ne s'émiettent\
                  \ pas lorsqu'elles sont trempées d'eau. L'horizon durique ne répond\
                  \ pas aux critères d'un horizon B podzolique mais il peut répondre\
                  \ à ceux d'un horizon Bt."
              dy:
                title: dy
                description: "Débris organiques partiellement décomposés, finement\
                  \ divisés, accumulés dans les sols tourbeux dans la zone de transition\
                  \ entre la tourbe et les matériaux minéraux sous jacents. La tourbe\
                  \ lacustre dy-peat, d'autre part, est un matériau amorphe constitué\
                  \ de sols humiques déposés au fond des eaux lacustres. Le dy est\
                  \ plus pauvre en éléments nutritifs que le gyttja, et est caractérisé\
                  \ par un rapport C / N élevé."
              dynamometer:
                title: dynamomètre
                description: "Instrument de mesure de l'effort de traction des instrument\
                  \ de culture, et de la résistance des sols à la pénétration de ces\
                  \ mêmes instruments."
              water, soil:
                title: eau absorbée
                description: "Eau retenue mécaniquement par un sol et qui possède\
                  \ des propriétés physiques sembables à celles de l 'eau ordinaire,\
                  \ dans les mêmes conditions de température et de pression."
              adsorbed water:
                title: eau adsorbée
                description: "Eau retenue par un sol sous l'action de forces physico-chimniques\
                  \ et qui possède des propriétés physiques très différentes de l'eau\
                  \ absorbée ou de l'eau liée par réaction chimnique dans les mêmes\
                  \ conditions de température et de pression."
              capillary water (Obsolete):
                title: eau capillaire
                description: "(désuet) L'eau retenue dans les micropores d'un sol.\
                  \ généralement par une tension supérieure à 60 cm (24 po) d'eau."
              available water:
                title: eau disponible
                description: "Fraction de l'eau du sol qui peut être absorbée facilement\
                  \ par les racines des plantes. Pour la plupart des chercheurs, ce\
                  \ terme désigne l'eau retenue par le sol jusqu'à une pression maximale\
                  \ d'environ 15 bars. Voir aussi - capacité au champ - tension de\
                  \ l'eau du soil."
              film water:
                title: eau pelliculaire
                description: "Couche d'eau entourant les particules du sol et dont\
                  \ l'épaisseur varie de 1 ou 2 à 100 ou plus de couches moléculaires.\
                  \ On la considère généralement comme l'eau qui demeure après le\
                  \ drainage, car on ne peut pas l'identifier en sol saturé."
              hygroscopic water:
                title: eau hygroscopique
                description: "Eau adsorbée par un sol sec dans une atmosphère d'une\
                  \ humidité relative élevée; eau perdue par un sol séché à l'air\
                  \ lorsqu'il est chauffé à 105°C eau retenue par le sol lorsque ce\
                  \ dernier est en équilibre hygroscopique avec une atmosphère d'une\
                  \ humidité relative déterminée à une température déterminée, généralement\
                  \ de 98% à 25°C."
              groundwater:
                title: phase du sol
                description: "Subdivision d'un type de sol ou autre unité de classification\
                  \ ayant des caractéristiques qui influent sur l'utilisation et l'exploitation\
                  \ de ce sol, mais que ne sont pas assez différentes pour former\
                  \ un type distinct. Variante d'une propriété ou d'une caractéristique,\
                  \ comme la pente, le degré d'érosion et l'état pierreux."
              cation exchange:
                title: échange cationique
                description: "Échange de cations entre une solution et la surface\
                  \ de toute substance surfactive comme les colloïdes de l'argile\
                  \ et les colloïdes organiques."
              ecology:
                title: écologie
                description: Étude des rapports entre les organismes et leur milieu.
              unsaturated flow:
                title: écoulement à non-saturation
                description: "Écoulement de l'eau dans un sol quin'est pas saturé."
              concentrated flow:
                title: écoulement concentré
                description: "Écoulement dans un lit relativement étroit d'une quantité\
                  \ assez importante d'eau d'accumulation. ll provoque souvent une\
                  \ forte érosion et un fort ravinement."
              edaphic:
                title: édaphique
                description: "(1) Qui a rapport au sol. (2) Résultant ou ayant subi\
                  \ l'influence de facteurs inhérents au sol ou à d'autres substrats,\
                  \ par opposition aux facteurs climatiques."
              edaphology:
                title: édaphologie
                description: "Science qui a pour objet l'étude de l'influence des\
                  \ sols sur les organismes vivants, en particulier les plantes, et\
                  \ de l'utilisation agricole du sol par l'homme."
              irrigation efficiency:
                title: efficacité d&#39;irrigation, rendement de l&#39;irrigation
                description: "Rapport de la quantité d'eau réellement absorbée par\
                  \ les plantes cultivées sur une surface irriguée à la quantité d'eau\
                  \ dérivée de la source d'alimentation pour l'irrigation de cette\
                  \ même surface."
              minor element:
                title: élément mineur
                description: Voir oligo-élément.
              available nutrient:
                title: élément nutritif assimilable
                description: "Fraction d'un corps simple ou d'un composé du sol qui\
                  \ peut être tacilement absorbée et assimilée par les plantes. (Ne\
                  \ pas confondre «assimilable» avec «échangeable».)"
              trace element (Obsolete):
                title: oligo-élément
                description: "Élément chimique nécessaire en faible quantité seulement,\
                  \ généralement moins de 1 ppm chez les plantes et à la croissance\
                  \ des plantes et la santé des animaux. Par exemple, le bore, le\
                  \ molybdène, le cuivre, le fer, le manganèse et le zinc sont des\
                  \ oligo-éléments. Le préfixe «oligo » (i.e. petit, peu nombreux)\
                  \ se rapporte à la quantité requise et non à la nécessité de l'élément\
                  \ pour l'organisme. Voir aussi élément majeur."
              eluviation:
                title: éluviation
                description: "Transport des matériaux du sol, en suspension ou en\
                  \ solution dans le sol, sous l'action de l'écoulement descendant\
                  \ ou latéral de l'eau."
              enzyme:
                title: exoenzyme
                description: "Enzyme qui est diffusée par un micro-organisme dans\
                  \ son milieu de croissance. Enzyme qui agit à l'extérieur de la\
                  \ cellule."
              endotrophic:
                title: endotrophe
                description: "Qui se nourrit ou qui reçoit de la nourriture de l'intérieur.\
                  \ Par exemple, dans le cas d'une mycorhize, les champignons ou leurs\
                  \ hyphes qui reçoivent de la nourriture des racines des plantes."
              fertilizer:
                title: engrais
                description: "Tout matériau organique ou minéral, d'origine naturelle\
                  \ ou synthétique, qu'on ajoute à un sol pour compenser les carences\
                  \ de certains éléments essentiels à la croissance des plantes."
              green manure:
                title: fumier / fumure
                description: "Excréments d'animaux mélangés ou non à des litières\
                  \ et ayant atteint divers stades de d'écomposition. Dans certains\
                  \ pays le terme « fumier» s'applique à tout type d'engrais."
              siltstone:
                title: envasement
                description: "Dépôt de sédiments portés par l'eau dans les cours d'eau,\
                  \ les lacs, les réservoirs et les plaines d'inondation, résultant\
                  \ généralement du ralentissement du courant d'eau."
              constitutive enzyme:
                title: enzyme de constitution
                description: "Enzyme dont la synthèse est indépendante de la présence\
                  \ d'un substrat spécifique."
              fluvioglacial:
                title: trainée fluvio-glaciaire de vallée
                description: "Terrasse d'épandage qui s'étend dans une vallée en partant\
                  \ du front glaciaire."
              erodible:
                title: érodable
                description: "Qui peut être érodé. Cette qualité s'exprime par des\
                  \ termes comme très érodable et peu érodable."
              erode:
                title: éroder
                description: "Dégrader ou réduire le relief terrestre par l'action\
                  \ du vent, de l'eau ou d'autres agents."
              erosion:
                title: érosion
                description: "Usure du relief terrestre par les eaux courantes, le\
                  \ vent, la glace ou d'autres agents géologiques y compris des processus\
                  \ comme la reptation gravitationnelle. Décollment et transport du\
                  \ sol ou de la roche par l'eau, le vent, la glace ou la gravité.\
                  \ Les termes suivants décrivent les différents types d'érosion hydrique\
                  \ : &eacute;rosion acc&eacute;l&eacute;r&eacute;e &Eacute;rosion\
                  \ beaucoup plus rapide que l'&eacute;rosion g&eacute;ologique normale,\
                  \ due surtout aux activit&eacute;s de l'homme et des animaux. &eacute;rosion\
                  \ g&eacute;ologique &Eacute;rosion normale ou naturelle, due &agrave;\
                  \ des processus g&eacute;ologiques &eacute;tal&eacute;s sur de longues\
                  \ p&eacute;riodes g&eacute;ologiques et dont le r&eacute;sultat\
                  \ est une usure des montagnes, la dissection des plaines et la construction\
                  \ de plaines d'inondation et de plaines littorales. Synonyme d'&eacute;rosion\
                  \ naturelle. &eacute;rosion en ravins Processus d'&eacute;rosion\
                  \ dans lequel l'eau s'accumule dans des sillons et, dans des p&eacute;riodes\
                  \ tr&egrave;s courtes, emporte le sol des sillons et creuse des\
                  \ ravins de profondeurs variables, allant d'environ 0,3 m (1 pi)\
                  \ &agrave; 30 m (100 pi). &eacute;rosion naturelle Usure du relief\
                  \ terrestre par l'action de l'eau, de la glace ou d'autres agents\
                  \ naturels, dans des conditions &eacute;cologiques, comme le climat\
                  \ et la v&eacute;g&eacute;tation, naturelles, non modifi&eacute;es\
                  \ par l'homme. Synonyme d'&eacute;rosion g&eacute;ologique. &eacute;rosion\
                  \ normale &Eacute;rosion progressive et lente des terres utilis&eacute;es\
                  \ par l'homme; elle n'exc&egrave;de que de peu l'&eacute;rosion\
                  \ naturelle. Voir &eacute;rosion naturelle . &eacute;rosion en rigoles\
                  \ Formation de nombreux petits sillons de quelques centim&egrave;tres\
                  \ de profondeur; cette forme d'&eacute;rosion se rencontre surtout\
                  \ sur les sols cultiv&eacute;s depuis peu. Voir aussi rigole . &eacute;rosion\
                  \ en nappe Enl&egrave;vement d'une couche plus ou moins uniforme\
                  \ de sol de surface par l'eau de ruissellement. &eacute;rosion par\
                  \ &eacute;claboussement Rebondissement de petites particules du\
                  \ sol provoqu&eacute; par le choc des gouttes de pluie sur des sols\
                  \ tr&egrave;s humides. Ces particules peuvent ensuite &ecirc;tre\
                  \ transport&eacute;es par ruissellement en surface."
              accelerated erosion:
                title: érosion accélérée
                description: "Érosion beaucoup plus rapide que l'érosion géologique\
                  \ normale due surtout aux activités de l'homme et des animaux."
              sheet erosion:
                title: érosion en rigoles
                description: "Formation de nombreux petits sillons de quelques centimètres\
                  \ de profondeur; cette forme d'érosion se rencontre surtout sur\
                  \ les sols cultivés depuis peu. Voir aussi rigole."
              geological erosion:
                title: érosion géologique
                description: "Érosion normale ou naturelle, due à des processus géologiques\
                  \ étalés sur de longues périodes géologiques et dont le résultat\
                  \ est une usure des montagnes, la dissection des plaines et la construction\
                  \ de plaines d'inondation et de plaines littorales. Synonyme d'érosion\
                  \ naturelle."
              natural erosion:
                title: érosion naturelle
                description: "Usure du relief terrestre par l'action de l'eau, de\
                  \ la glace ou d'autres agents naturels, dans des conditions écologiques\
                  \ comme le climat et la végétation, naturelles, non modifiées par\
                  \ l'homme. Synonyme d'érosion géologique."
              normal erosion:
                title: érosion normale
                description: "Érosion progressive et lente des terres utilisées par\
                  \ l'homme; elle n'excède que de peu l'érosion naturelle. Voir érosion\
                  \ naturelle."
              splash erosion:
                title: érosion par éclaboussement
                description: Rebondissement de petites particules du sol provoqué
                  par le choc des gouttes de pluie sur des sols très humides. Ces
                  particules peuvent ensuite être transportées par ruissellement en
                  surface.
              esker:
                title: esker
                description: "Remblai étroit et sinueux formé de strates irrégulières\
                  \ de sables, de graviers et de cailloux déposés sous les glaciers\
                  \ par un cours d'eau de fonte à débit rapide."
              pore space:
                title: espace porifère
                description: "Quantité totale d'espace qui n'est pas occupée par les\
                  \ particules de sol, dans un volume brut donné de sol."
              eubacteriales:
                title: eubatéciales
                description: Ordre de la classe des Schizomycètes. Bactéries vraies.
              eutrophic:
                title: eutrophe
                description: Dont les concentrations en éléments nutritifs sont optimales
                  ou presque optimales pour la croissance des plantes et des animaux.
                  Se dit des solutions nutritives ou de sols.
              evapotranspiration:
                title: évapotranspiration
                description: "Pertes d'eau sur une surface donnée et en un temps donné,\
                  \ par évaporation à la surface du sol et par transpiration des plantes.\
                  \ L'évapotranspiration potentielle est la transpiration maximale,\
                  \ dans des conditions atmosphériques données, sur un sol portant\
                  \ une végétation basse bien pourvue d'eau et ne recouvrant pas entièrement\
                  \ le sol."
              potential evapotranspiration:
                title: évapotranspiration potentielle
                description: Voir évapotranspiration.
              saturation extract:
                title: saturation pureté
                description: "Pureté ou saturation relatives d'une couleur. Se rapporte\
                  \ directement à la dominance de l'onde lumineuse dont la longueur\
                  \ établit l'identité de la teinte. Une des trois caractéristiques\
                  \ des couleurs; indice de chroma du code Munsell."
              soil-formation factors:
                title: facteurs de formation du sol, facteurs pédogénétiques
                description: "Agents naturels variables, généralement liés entre eux,\
                  \ auxquels on attribue la formation d'un sol. Ces facteurs sont:\
                  \ la roche-mère, le climat, les organismes, le relief et le temps."
              swamp:
                title: marécage
                description: "Étendue de terre saturée d'eau pendant la plus grande\
                  \ partie de l'année, et dont la surface du sol n'est généralement\
                  \ resouverte que d'une faible profondeur d'eau. ll est caractérisé\
                  \ par une végétation d'arbres et d'arbustes. Voir aussi marais et\
                  \ type de terrains divers."
              loess:
                title: loess
                description: Matériaux transportés et déposés par le vent et constitués
                  surtout de particules de la taille du limon.
              fermentation:
                title: fermentation
                description: "Oxydation en anaérobie des hydrates de carbone et des\
                  \ composés apparentés par l'activité enzymatique des micro-organismes;\
                  \ l'oxygène gazeux ne joue aucun rôle dans ce processus énergétique."
              Fibrisol:
                title: fibrisol
                description: "Grand groupe de sols de l'ordre organique saturés d'eau\
                  \ pendant la plus grande partie de l'année. L'étage intermédiaire\
                  \ de ces sols est à dominance fibrique; cette dominance se retrouvera\
                  \ dans les étages intermédiaire et supérieur s'il se produit un\
                  \ contact terrique, lithique, hydrique ou cryique dans l'étage intermédiaire."
              fixation:
                title: fixation
                description: "Processus dans un sol par lequel certains éléments chimiques\
                  \ essentiels à la croissance des plantes sont convertis d'un état\
                  \ soluble ou échangeable à un état beaucoup moins soluble ou non\
                  \ échageable, par exemple la fixation du phosphate."
              ammonium fixation:
                title: fixation d&#39;ammonium
                description: "Absorption ou adsorption d'ions d'ammonium par les fractions\
                  \ minérales ou organiques du sol de telle sorte que les ions sont\
                  \ relativement insolubles dans l'eau et relativement non échangeables\
                  \ suivant les méthodes habituelles d'échange cationique."
              nitrogen fixation:
                title: fixation de l&#39;azote
                description: "Conversion de l'azote élémentaire (N2) en combinaisons\
                  \ organiques ou dans des formes directement utilisables dans les\
                  \ processus biologiques."
              potassium fixation:
                title: fixation du potassium
                description: "Processus de conversion du potassium échangeable ou\
                  \ soluble dans l'eau, en potassium modérément soluble, c'est-à-dire\
                  \ en une forme de potassium fixé au complexe d'adsorption et qui\
                  \ s'échange difficilement avec un cation d'une solution de sel neutre."
              flagellum:
                title: flagelle
                description: "Appendice flexible des cellules ressemblant à un fouet\
                  \ et servant d'organe de locomotion."
              zymogenous flora:
                title: flore zymogène
                description: "Organismes présents en grand nombre dans les sols auxquels\
                  \ on vient d'ajouter des matières organiques facilement décomposables."
              Folisol:
                title: folisol
                description: "Grand groupe de sols de l'ordre organique. D'habitude,\
                  \ ces sols ne sont saturés que pendant quelques jours de l'année\
                  \ et sont constitués d'horizons L-H, d'une épaisseur de 10 cm (4\
                  \ po) ou plus, formés de la litière de feuilles de brindilles, de\
                  \ braches et de mousses. Un contact lithique ou des matériaux fragmentaires\
                  \ se rencontrent à une profondeur de moins de 160 cm (64 po). Une\
                  \ couche minérale d'une épaisseur inférieure à 10 cm (4 po) recouvre\
                  \ parfois le contact lithique."
              shear stress:
                title: force de cisaillement
                description: Force par unité de surface agissant de façon oblique
                  sur un plan donné dans une masse de sol.
              fertilizer grade:
                title: formule d&#39;engrais
                description: "Analyse minimale garantie en pourcentage des principaux\
                  \ éléments nutritifs contenus dans un engrais simple ou composé.\
                  \ L'analyse s'exprime généralement en pourcentages de N, P2O5 et\
                  \ K2O, mais on propose d'adopter la désignation en pourcentages\
                  \ de N, P et K."
              solifluction:
                title: solifluxion
                description: "Type de reptation du sol qu'on rencontre dans les régions\
                  \ où la terre gèle à une très grande profondeur; lors de la saison\
                  \ chaude, la partie superficielle du sol en fondant chemine vers\
                  \ le bas des pentes sur les matériaux toujours gelés. Ce sol en\
                  \ état de liquide visqueux peut des-cendre une pente aussi faible\
                  \ que de 2 ou 3 degrés et transporter des roches d'une taille considérable\
                  \ qu'il tient en suspension."
              fragipan:
                title: fragipan
                description: "Horizon naturel sous-jacent dont la densité apparente\
                  \ est plus élevée que celle du solum qui le recouvre; d'aspect cimenté\
                  \ à l'état sec mais modérément à légèrement fragile à l'état humide.\
                  \ Possède une faible teneur en matière organique présente des marbrures\
                  \ et n'est que peu ou très peu perméable à l'eau; présent généralement\
                  \ des fissures décolorées de forme polygonale. On le rencontre dans\
                  \ des profils de sols cultivés ou vierges mais pas dans les sols\
                  \ calcaires."
              fragic:
                title: fragique
                description: "Terme désignant un horizon Bx ou BCx d'une densité apparente\
                  \ élevée et dont la consistance est ferme et fragile à l'état humide\
                  \ et varie de dure à extrêmement dure à l'état sec. D'ordinaire\
                  \ des surfaces de clivage décolorées séparent les agrégats prismatiques\
                  \ très grossiers et la structure secondaire en est lamellaire. L'horizon\
                  \ fragique est d'ordinaire d'une couleur semblable à celle du matériau\
                  \ originel mais en diffère en termes de la structure, de la consistance\
                  \ et de la densité apparente. Les mottes séchées à l'air s'émiettent\
                  \ lorsqu'elles sont trempées d'eau. La limite supérieure est généralement\
                  \ abrupte et nette et la limite inférieure, diffuse. L'horizon fragique\
                  \ ne répond pas aux critères d'un horizon B podzolique mais il peut\
                  \ répondre à ceux d'un horizon Bt (Btx)."
              coarse fragments:
                title: fragments grossiers
                description: Fragments de roche ou de minéral de diamètre supéieur
                  à 2.0 mm. Le tableau 2 indique les termes emoloyés en granulométrie.
              friable:
                title: friable
                description: "Terme qualifiant la consistance d'un sol facile à écraser.\
                  \ Voir aussi consistance"
              artificial manure:
                title: fumier artificiel engrais
                description: En Europe ce terme peut désigner les engrais commerciaux.
              genetic:
                title: génétique
                description: "Qui résulte d'un processus pédogénétique; par exmple,\
                  \ un profil génétique ou un horizon génétique."
              engineering (soil):
                title: génie des sols
                description: Voir mécanique et génie du sol.
              topography:
                title: topographie
                description: "Caratéristiques physiques d'une région ou d'un secteur,\
                  \ telles que représentées sur une carte, prises au collectif; spécialement,\
                  \ le relief et les contours du terrain."
              germicide:
                title: germicide
                description: Agent qui tue les germes, généralement les micro-organismes
                  pathogènes.
              management / soil:
                title: gestion du sol
                description: "(1) Ensemble des façons culturales, des techniques de\
                  \ culture, de fumure et de chaulage, de même que des autres traitements\
                  \ effectués sur un sol en vue de la production de végétaux. (2)\
                  \ Partie de la science des sols ayant pour objet l'étude de l'exploitation\
                  \ des sols."
              gilgai:
                title: gilgai
                description: "Microrelief des sols produit par le gonflement et la\
                  \ contraction, dus à des variations de l'humidité. On rencontre\
                  \ des gilgaï dans les sols riches en argile, qui gonfle et se contracte\
                  \ de façon notable sous l'effet de l'humidification ou de la dessication.\
                  \ lls se présentent généralement comme une alternance de microcuvettes\
                  \ et de microbuttes dans les terrains presque plans, ou de microvallées\
                  \ et de microcollines parallèles à la pente du terrain. Voir aussi\
                  \ microrelief."
              gleysation:
                title: gleyification
                description: "Processus pédogénétique se produisant en station mal\
                  \ drainée et dont le résultat est la réduction du fer et d'autres\
                  \ éléments et l'apparition de couleurs grisâtres et de marbrures.\
                  \ Voir aussi gleysolique et gleysol."
              Gleysol:
                title: gleysol
                description: "Grand groupe de sols de l'ordre gleysolique. Ils sont\
                  \ formés d'un horizon Ah mince (moins de 8 cm, ou 3 po) recouvrant\
                  \ un matériau gleyifié, gris ou brunâtre, marbré; I'horizon Ah peut\
                  \ être absent. Le sol peut être recouvert en surface d'une couche\
                  \ de tourbes mixtes (densité apparente 0,1 ou plus) allant jusqu'à\
                  \ 40 cm (16 po), ou de tourbe de mousses fibrique (densité apparente\
                  \ inférieure à 0.1) de 60 cm (24 po)."
              Humic Gleysol:
                title: gleysol humique
                description: "Grand groupe de sols de l'ordre gleysolique, constitués\
                  \ d'un horizon A (Ah ou AP1 foncé de plus de 8 cm (3 po) d'épaisseur\
                  \ recouvrant un matériau minéral gleyifié, marbré, gris au brunâtre.\
                  \ Ces sols peuvent être recouverts en surface d'ure couche de tourbes\
                  \ mixtes (densité apparente 0.1 ou plus) allant jusqu'à 40 cm (16\
                  \ po) ou de tourbe de mousses fibrique (densité apparente inférieure\
                  \ à 0.1 ) allant jusqu'à 60 cm (24 po). Ce groupe comprend les sols\
                  \ anciennement classés dans les sols gleysoliques gris foncé et\
                  \ les sols de prairie"
              Luvic Gleysol:
                title: gleysol luvique
                description: "Grand groupe de sols de l'ordre glesolique qui se forment\
                  \ dans des terrains humides, sous couvert prairial ou forestier\
                  \ ou les deux. Ces sols ont des horizons Aeg et Btg."
              Gleysolic:
                title: gleysolique
                description: "Ordre de sols se formant dans des conditions d'humidité\
                  \ et de réduction permanentes ou périodiques. Certains horizons\
                  \ de ces sols ont des couleurs peu saturées ou des marbrues très\
                  \ marquées, ou les deux à la fois. Les grandes groupes de cet ordre\
                  \ sont les gleysols, les gleysols humiques et les gleysols luviques."
              Dark Gray Gleysolic:
                title: gleysolique gris foncé
                description: Voir gleysol humique.
              landscape:
                title: paysage
                description: "Tous les éléments naturels tels que champs, collines,\
                  \ forêts et cours d'eau qui distinguent une région d'une autre sur\
                  \ la surface de la terre. Comprend généralement la portion de terrain\
                  \ ou de territoire visible en un seul coup d'oeil, ainsi que toutes\
                  \ ses caractéristiques naturelles."
              glycophytes:
                title: glycophytes
                description: "Plantes non halophiles ou plantes qui croissent mal\
                  \ lorsque la pression osmotique de la solution du sol s'élève à\
                  \ plus de 2 bars."
              hydraulic gradient:
                title: gradient hydraulique
                description: Voir eau du sol.
              chlorite group:
                title: groupe des chlorites
                description: "Groupe de minéraux argileux à feuillets non expansibles,\
                  \ chimiquement semblables aux minéraux du groupe des vermiculites\
                  \ mais comportant une couche simple d'hydroxdes entre les feuillets,\
                  \ au lieu de cations échangeables et d'eau."
              granular:
                title: granulaire
                description: Voir structure du sol et structure du sol (type de -
                  ).
              granule:
                title: granule
                description: Agrégat arrondi.
              particle size:
                title: granulométrie
                description: "Diamètre réel d'une particule, mesuré par sédimentation,\
                  \ tamisage ou micrométrie."
              gravel:
                title: gravier
                description: Fragments rocheux de diamètre allant de 2mm à 7.5 cm
                  (3 po).
              Dark Gray:
                title: gris foncé
                description: "Grand groupe de sols de l'ordre chernozémique. On les\
                  \ recontre dans les régions de transition prairie-forêt au climat\
                  \ subhumide, frais ou froid; ils sont formés d'un horizon de surface\
                  \ (Ahe ou Ap) partiellement éluvié, gris froncé et d'un horizon\
                  \ B (Bm, Btj ou Bt) brunâtre (ce dernier peut être absent) et d'un\
                  \ horizon C généralernent calcaire fortement saturé en bases."
              kaolin group:
                title: groupe de la kaolinite
                description: "Silicates d'aluminium hydratés ayant la structure 1:1\
                  \ des phyllosilicates et ne possédant aucune charge permanente."
              montmorillonite group:
                title: groupe de la montmorillonite
                description: "Minéraux argileux ayant un réseau cristallin 2:1 expansible.\
                  \ La substitution isomorphe donne naissance aux divers types de\
                  \ montmollonite et crée une charge nette permanente équilibrée par\
                  \ des cations, de telle sorte que l'eau peut s'infiltrer entre les\
                  \ feuillets, produisant un échange réversible de cations et lui\
                  \ donnant des propriétés notables de plasticité. Synonyme de smectite."
              vermiculite group:
                title: groupe de la vermiculite
                description: "Groupe de minéraux d'argile hydratée et lamellaire semblable\
                  \ au groupe de la smectite mais dont la charge permanente nette\
                  \ est plus forte et les particules souvent plus grosses."
              gyttja:
                title: gyttja
                description: "Mot suédois (à prononcer «yut-tya»). Tourbe sédimentaire\
                  \ riche en éléments nutritifs, constitué surtout de débris de plancton\
                  \ et d'autres plantes et animaux, et de vase. ll est déposé dans\
                  \ l'eau à l'état finement divisé."
              habitat:
                title: habitat
                description: "Millieu naturel d'un organisme."
              heterotrophic:
                title: hétérotrophe
                description: "Qui ne peut tirer de l'énergie, pour l'entretien de\
                  \ la vie, que de la décomposition des matières organiques et qui\
                  \ ne peut utiliser les composés minéraux comme seule source d'énergie\
                  \ ou pour effectuer la synthèse de matières organiques. Voir aussi\
                  \ autotrophe."
              A horizon:
                title: horizon H
                description: Voir horizon du sol.
              C horizon:
                title: horizon C
                description: Voir horizon du sol.
              eluvial horizon:
                title: horizon éluvial
                description: "Horizon du sol formé par un processus d'éluviation."
              illuvial horizon:
                title: horizon illuvial
                description: "Horizon du sol dans lequel s'accumulent par précipitation\
                  \ des matériaux dissous ou en suspension provenant d'un horizon\
                  \ supéneur. Voir aussi horizon éluvial."
              soil moisture tension:
                title: tension de l&#39;eau du sol
                description: "Dans les sols partiellement satur&eacute;s en eau, il\
                  \ existe une tension de l'eau &eacute;gale mais de signe contraire\
                  \ &agrave; la pression de l'eau du sol. La tension de l'eau du sol\
                  \ est &eacute;gale &agrave; la pression qu'il faut exercer sur l'eau\
                  \ du sol pour l'amener en &eacute;quilibre hydraulique, &agrave;\
                  \ travers une paroi ou une membrane perm&eacute;able et poreuse,\
                  \ avec un r&eacute;servoir d'eau de m&ecirc;me composition. Voir\
                  \ aussi eau du sol. Les pressions exerc&eacute;es et les pourcentages\
                  \ correspondants les plus couramment utilis&eacute;s sont: pourcentage\
                  \ &agrave; 15 atmosph&egrave;res (15-atmosphere percentage) Pourcentage\
                  \ d'eau contenue dans un sol qui a &eacute;t&eacute; satur&eacute;\
                  \ en eau, soumis &agrave; une pression de 15 atmosph&egrave;res\
                  \ et qui se maintient en &eacute;quilibre sous cette pression. La\
                  \ pression est exerc&eacute;e dans un tensiom&egrave;tre &agrave;\
                  \ membrane ou &agrave; plaque de c&eacute;ramique. Ce pourcentage\
                  \ s'exprime g&eacute;n&eacute;ralement en poids, mais on peut aussi\
                  \ l'exprimer en volume. ll correspond &agrave; peu pr&egrave;s au\
                  \ pourcentage &agrave; 15 bars. pourcentage &agrave; 15 bar (15-bar\
                  \ percentage) Pourcentage d'eau contenue dans un sol qui a &eacute;t&eacute;\
                  \ satur&eacute; en eau, soumis &agrave; une pression de 15 bars\
                  \ et qui se maintient en &eacute;quilibre sous cette pression. La\
                  \ pression est exerc&eacute;e dans un tensiom&egrave;tre &agrave;\
                  \ membrane ou &agrave; plaque de c&eacute;ramique. Ce pourcentage\
                  \ s'exprime g&eacute;n&eacute;ralement en poids, mais aussi en volume.\
                  \ ll correspond &agrave; peu pr&egrave;s au pourcentage &agrave;\
                  \ 15 atmosph&egrave;re. pourcentage &agrave; 1/3 atmosph&egrave;res\
                  \ (1/3-atmosphere percentage) Pourcentage d'eau contenue dans un\
                  \ sol qui a &eacute;t&eacute; satur&eacute; en eau, soumis &agrave;\
                  \ une pression de 1/3 atmosph&egrave;re et qui se maintient en &eacute;quilibre\
                  \ sous cette pression. La pression est exerc&eacute;e dans un tensiom&egrave;tre\
                  \ &agrave; plaque de c&eacute;ramique. Ce pourcentage s'exprime\
                  \ g&eacute;n&eacute;ralement en poids, mais aussi en volume. ll\
                  \ correspond &agrave; peu pr&egrave;s au pourcentage &agrave; 1/3\
                  \ bar. De plus, pour les sols &agrave; texture moyenne &agrave;\
                  \ grossi&egrave;re, il est &agrave; peu pr&egrave;s &eacute;gal,\
                  \ num&eacute;riquement, &agrave; l'humidit&eacute; &eacute;quivalente.\
                  \ pourcentage &agrave; 1/3 bar (1/3-bar percentage) Pourcentage\
                  \ d'eau contenue dans un sol qui a &eacute;t&eacute; satur&eacute;\
                  \ en eau, soumis &agrave; une pression de 1/3 bar et qui se maintient\
                  \ en &eacute;quilibre sous cette pression. La pression est exerc&eacute;e\
                  \ dans un tensiom&egrave;tre &agrave; plaque de c&eacute;ramique.\
                  \ Ce pourcentage s'exprime g&eacute;n&eacute;ralement en poids et\
                  \ est &agrave; peu pr&egrave;s &eacute;quivalent au pourcentage\
                  \ &agrave; 1/3 atmosph&egrave;re. De plus, pour les sols &agrave;\
                  \ texture moyenne &agrave; grossi&egrave;re, il est &agrave; peu\
                  \ pr&egrave;s &eacute;gal, num&eacute;riquement, &agrave; l'humidit&eacute;\
                  \ &eacute;quivelente. pourcentage &agrave; 60 centim&egrave;tres\
                  \ (60-centimetre percentage) Pourcentage d'eau contenue dans un\
                  \ sol qui a &eacute;t&eacute; satur&eacute; en eau, soumis &agrave;\
                  \ un pression ou une tension &eacute;quivalente &agrave; une colonne\
                  \ d'eau de 60 cm de hauteur. La pression peut &ecirc;tre exerc&eacute;e\
                  \ dans un tensiom&egrave;tre &agrave; plague ou, s'il s'agit d'une\
                  \ tension, sur un plateau &agrave; tension. Ce pourcentage peut\
                  \ s'exprimer en poids ou en volume; selon plusieurs, il est approximativement\
                  \ &eacute;gal &agrave; la capacit&eacute; au champ, sp&eacute;cialement\
                  \ dans le cas des sols &agrave; texture moyenne ou grossi&egrave;re."
              humification:
                title: humification
                description: "Processus par lequel la matière organique en se décomposant\
                  \ devient l'humus. Dans l'humus ou les formes ou la structure du\
                  \ matériau originel ne sont plus perceptibles."
              humin:
                title: humine
                description: "Fraction de la matière organique du sol qui n'est pas\
                  \ soluble dans une solution alcaline diluée."
              Humisol:
                title: humisol
                description: "Grand groupe de sols de l'ordre organique, saturés d'eau\
                  \ pendant presque toute l'année. Ces sols ont une prédominance de\
                  \ matières humiques à l'étage intermédiaire, ou aux étages intermédiaire\
                  \ et supérieur si un contact terrique, lithique, hydrique ou cryique\
                  \ se présente dans l'étage intermédiaire."
              humus:
                title: humus
                description: "(1) Fraction des matières organiques qui reste dans\
                  \ le sol après décomposition de la plus grande partie des débris\
                  \ végétaux et animaux ircorporés dans le sol. Ces matières ont généralement\
                  \ une couleur foncée. (2) Le terme humus est aussi employé dans\
                  \ une acception plus large pour désigner les divers types d'humus\
                  \ forestiers dont les principaux sont le mor (humus brut) le moder\
                  \ et le mull. Voir aussi matière organique du sol / mor / moder\
                  \ / mull et horiron du sol. (3) Matière organique morte à la surface\
                  \ et dans le sol subissant un processus permanent de décompostion\
                  \ de transformation et de synthèse."
              rawhumus:
                title: humus brut
                description: Voir mor.
              hydration:
                title: hydratation
                description: "Cominaison chimique de l'eau et de quelque autre substance."
              hydrolysis:
                title: hydrolyse
                description: "Processus par lequel les molécules d'un substrat sont\
                  \ dédoublées en deux nouvelles molécules sous l'action d'une molécule\
                  \ d'eau."
              illite:
                title: illite
                description: Type de mica hydraté. Voir aussi mica hydraté.
              illuviation:
                title: illuviation
                description: "Processus d'accumulation dans un horizon du sol de matériaux\
                  \ provenant d'un autre horiz0, le transport se faisant généralement\
                  \ d'un horizon supérieur vers un horizon sous-ajcent. Les matériaux\
                  \ illuviés comprennent l'argile silicatée, les oxydes de fer et\
                  \ d'aluminium hydratés et les matières organiques."
              immobilization:
                title: immobilisation
                description: "Conversion d'un élément de l'état minéral à l'état organique\
                  \ dans les tissus microbiens de sorte que cet élément n'est pas\
                  \ facilement assimilable par d'autres organismes végétaux ou animaux."
              climatic index:
                title: indice des pores critique
                description: Indice des pores correspondant à la densité critique.
              freezing index; F degree-days:
                title: indice de gel; F degrés-jours
                description: "Nombre de degrés-jours entre les points le plus haut\
                  \ et le plus bas de la courbe cumulative degrés-jours-temps, établie\
                  \ pour une saison de gel. On s'en sert comme mesure de la combinaison\
                  \ durée-amplitude des températures au-dessous du point de congélation\
                  \ d'une saison donnée. On désigne communément l'indice déterminé\
                  \ pour les températures de l'air à 137.3 cm (4.5 pi) au-dessus du\
                  \ sol par l'expression indice de gel en atmosphère, tandis que celle\
                  \ qui est déterminée pour les températures prises juste au-dessous\
                  \ de la surface est appelée indice de gel à la surface."
              plasticity range:
                title: indice de plasticité
                description: "Écart numérique entre la limite de liquidié et la limite\
                  \ de plasticité ou, en d'autres termes, entre la limite inférieure\
                  \ de plasticité et la limite supérieure de plasticité."
              structure index:
                title: indice de structure
                description: "Toute mesure d'une propriété physique d'un sol, comme\
                  \ l'agrégation, la porosité, la permébilité à l'air et à l'eau,\
                  \ ou la densité apparente, qui donne quelque indication de l'état\
                  \ structural d'un sol."
              infiltration rate:
                title: infiltration (irrigation par-)
                description: "Voir irrigation (méthodes d'-)."
              infiltrometer:
                title: infiltromètre
                description: "Appareil servant à mesurer le taux de pénétration d'un\
                  \ fluide dans un corps poreux; par exemple, l'eau dans le sol."
              inhibition:
                title: inhibition
                description: "Opposition au dévéloppement ou à la multiplication d'organismes."
              inoculation:
                title: inoculation
                description: Introduction artificielle de micro-organismes dans un
                  habitat ou dans un milieu de culture.
              rainfall interception:
                title: interception de la pluie
                description: Voir interception des précipitations.
              precipitation interception:
                title: interception des précipitations
                description: Captage, interception et rétention temporaire des précipitations
                  sous une forme ou une autre, par le couvert végétal ou les débris
                  végétaux.
              transitional soil:
                title: sol de transition
                description: Sol dont les propriétés sont intermédiaires entre celles
                  de deux sols différents et qui leur est génétiquement relié. Voir
                  aussi intergrade / sol de transition.
              ion:
                title: ion
                description: "Atome ou groupement d'atomes ou composé électriquement\
                  \ chargés par suite d'une perte d'électrons (cation) ou d'un gain\
                  \ d'électrons (anion)."
              sprinkler irrigation:
                title: irngation par aspersion
                description: "Voir irrigation (méthodes d'-)."
              irrigation:
                title: irrigation
                description: "Application volontaire de l'eau aux terres en culture."
              furrow irrigation:
                title: irrigation souterraine
                description: "Voir irrigation (méthodes d'-)."
              check-basin irrigation:
                title: irrigation par rigoles
                description: "Voir irrigation (méthodes d'-)."
              isodyne:
                title: isodyne
                description: "Points d'un instrument agricole ayant une même force\
                  \ dynamométrique. Courbe de la carte d'un champ cultivé reliant\
                  \ tous les points d'égale force dynamométrique."
              fallow land:
                title: terrain en friche; friche
                description: "Terrain non cultivé, entretenu ou non par le propriétaire\
                  \ afin d'y maintenir un couvert végétal utile pour la production\
                  \ forestière ou fourragère ou aux fins de la récréation ou de la\
                  \ faune."
              kame:
                title: kame
                description: "Tertre ou colline de forme irrégulière constitué de\
                  \ drift glaciaire stratifié déposé par l'eau de fonte des glaces."
              leaching:
                title: lessivage
                description: Évacuation des matières dissoutes du sol.
              levee:
                title: levée (digue)
                description: "Remblai naturel ou artificiel le long d'une rivière\
                  \ ou d'un cours d'eau."
              lichen:
                title: lichen
                description: "Association symbiotique et mutuelle d'un type d'algue\
                  \ et d'un type de champignon."
              permafrost:
                title: pergélisol
                description: "(1) Matériau au-dessous du solum. gelé d'une année à\
                  \ l'autre. (2) Horizon de sol gelé d'une année à l'autre."
              lower plastic limit:
                title: limite inférieure de plasticité
                description: Voir limite de plasticité.
              upper plastic limit:
                title: limite supérieure de plasticité
                description: Voir limite de liquidité.
              Atterberg limits:
                title: limites d&#39;Atterberg
                description: Voir - limite de liquidité - limite de plasticité.
              silt:
                title: limon
                description: "(1) Fraction du sol consistant en particules d'un diamètre\
                  \ équivalent de 0.05 à 0.002 mm. Voir aussi fractions du sol. (2)\
                  \ Classe de texture du sol. Voir aussi texture du sol."
              liquefaction (spontaneous liquefaction):
                title: liquéfaction spontanée
                description: "Baisse importante et soudaine de la résistance au cisaillement\
                  \ d'un sol sans cohésion. Cette baisse est due à un effondrement\
                  \ de la structure causé par un choc ou une autre force, et est associée\
                  \ à un accroissement subit et temporaire de la pression de l'eau\
                  \ interstitielle. Ce phénomène comporte une transformation temporaire\
                  \ de la matière en une masse fluide. Voir aussi argile sensible."
              bed:
                title: lit
                description: "Dans les matériaux stratifiés couche visuellement ou\
                  \ physiquement plus ou moins distincte des autres couches inférieures\
                  \ et supérieures et atteignant au moins 1 cm (0.4 po) d'épaisseur."
              lithosequence:
                title: lithoséquence
                description: "Groupe de sols apparentés qui différent l'un de l'autre\
                  \ par certains aspects principalement par les caractéristiques de\
                  \ la roche-mère."
              loam:
                title: loam
                description: Classe de texture des sols. Voir aussi texture du sol.
              clay loam:
                title: loam argileux
                description: "Matériau contenant de 27 à 40% d'argile et de 20 à 45%\
                  \ de sable."
              silt loam:
                title: loam limoneux
                description: Classe de texture des sols. Voir aussi texture du sol.
                  et classe de sols.
              silty clay loam:
                title: loam limono-argileux
                description: Classe de texture des sols. Voir aussi texture du sol.
                  et classe de sols.
              sandy loam:
                title: loam sableux
                description: Classe de texture des sols. Voir aussi classe de sols
                  et texture du sol.
              fine sandy loam:
                title: loam sableux fin
                description: Voir aussi texture du sol.
              coarse sandy loam:
                title: loam sableux grossier
                description: Voir texture du sol.
              very fine sandy loam:
                title: loam sableux très fin
                description: Voir texture du sol.
              sandy clay loam:
                title: loam sablo-argileux
                description: Classe de texture des sols. Voir aussi classe de sols
                  et texture du sol.
              loamy:
                title: loameux
                description: Texture et propriétés des sols se situant entre les textures
                  fine et grossière. Cela comprend toutes les classes de texture dont
                  le nom inclut le mot « loam» ou « loameux», tels que le loam argileux
                  ou le sable loameux. Voir aussi loam et texture du sol.
              Darcy&#39;s law:
                title: loi de Darcy
                description: "(1) Loi de la vitesse d'écoulement de l'eau dans un\
                  \ corps poreux, formulée en 1856 par Henri Darcy à la suite de travaux\
                  \ approfondis sur l'écoulement de l'eau dans une couche filtrante\
                  \ de sable. D'après Darcy cette loi se traduit par l'équation: Q\
                  \ = k*S*(H+e)/e dans laquelle: Q est le volume d'eau écoulée par\
                  \ unité de temps (débit). S la surface de la couche filtrante e\
                  \ l'épaisseur de couche H hauteur de la colonne d'eau au -dessus\
                  \ de la couche filtrante et k «coefficient lié à la nature du sable»\
                  \ lorsque la pression «sous le filtre est égale au poids de l'atmosphère.»\
                  \ (2) Généralisation à un modèle à trois dimensions: La vitesse\
                  \ d'écoulement visqueux de l'eau dans un corps poreux isotrope est\
                  \ proportionnelle au gradient hydraulique et dirigée dans le même\
                  \ sens. (3) Généralisation aux autres fluides: La vitesse d'écoulement\
                  \ visqueux des fluides homogènes dans un corps poreux isotrope est\
                  \ proportionnelle à la force de pénétration et dirigée dans le même\
                  \ sens."
              Stokes law:
                title: loi de Stokes
                description: "Équation établissant une relation entre la vitesse finale\
                  \ de descente d'une sphère lisse et rigide dans un fluide visqueux,\
                  \ de densité et de viscosité connues, et le diamètre de la sphère\
                  \ soumise à un champ de force connue. Sert dans l'analyse granulométrique\
                  \ des sols selon la méthode de la pipette, de l'hydromètre ou du\
                  \ centrifuge. L'équation est: V = (2gr²)(d1-d2)/9µ dans laquelle\
                  \ V = vitesse de chute (cm sec-¹), g = accélération due à la gravité\
                  \ (cm sec-²), r = rayon équivalent de la particule (cm), dl = densité\
                  \ de la particule (g cm -³), d2 = densité du fluide (g cm-³), et\
                  \ µ = viscosité du fluide (dyne sec cm-²)."
              Luvisolic:
                title: luvisolique
                description: "Ordre de sols ayant des horizons éluviaux (Ae), et des\
                  \ horizons illuviaux (Bt) dans lesquels l'argile siliceuse est l'élément\
                  \ d'accumulation principal. Ces sols se sont formés dans des régions\
                  \ forestières ou de transition forêt-prairie sous climat modéré\
                  \ à frais."
              lysimeter:
                title: lysimètre
              marl:
                title: marne
                description: "Dépôt terreux, tendre et non consolidé, formé de carbonate\
                  \ de calcium ou de carbonate de magnésium, ou d'un mélange des deux,\
                  \ et souvent de coquillages, généralement mêlés à des quantités\
                  \ variables d'argile ou d'autres impuretés."
              anisotropic mass:
                title: masse anisotrope
                description: "Masse dont les propriétés, établies à partir de n'importe\
                  \ quel point, varient selon qu'elles sont mesurées dans différentes\
                  \ directions."
              residual material:
                title: matériau résiduel
                description: Substances minérales non consolidées et partiellement
                  altérées, issues de la désintégration sur place de la roche consolidée.
              organic matter (soil ):
                title: matière organique du sol
                description: "Fraction organique du sol; comprend les résidus de plantes\
                  \ et d'animaux à diverses phases de décomposition, ainsi que les\
                  \ cellules et les tissus des organismes du sol et les substances\
                  \ qu'ils ont synthétisées. Cette fraction est généralement déterminée\
                  \ sur l'échantillon de sol passé à travers un tamis à mailles de\
                  \ 2 mm."
              mechanics and engineering / soil:
                title: mécanique et génie du sol, mécanique des sols
                description: "Secteur de la science des sols étudiant l'action des\
                  \ forces sur les sols et l'application de principes de la mécanique\
                  \ dans la résolution de problèmes impliquant le sol."
              pressure membrane:
                title: membrane de tensiomètre
                description: "Membrane perméable à l'eau et très peu perméable aux\
                  \ gaz à l'état humide et qui laisse passer l'eau d'un échantillon\
                  \ de sol soumis à un gradient de pression."
              mesa:
                title: mesa
                description: Colline ou montagne aux pentes raides et à sommet presque
                  plat, formée généralement de strates rocheuses pres-que horizontales.
              Mesisol:
                title: mésisol
                description: "Grand groupe de sols de l'ordre organique saturés d'eau\
                  \ pendant la plus grande partie de l'année. Ces sols ont un étage\
                  \ intermédiaire principalement mésique, ou des étages supérieur\
                  \ et intermédiaire principalement mésiques s'il y a présence d'un\
                  \ contact terrique, lithique, hydrique ou cryique dans l'étage intermédiaire."
              mesophile:
                title: mésophile
                description: Organisme dont la croissance est favorisée par des températures
                  modérées comprises entre 25° et 40°C.
              irrigation methods:
                title: Méthodes d&#39;irrigation
                description: "Système ou mode de distributon de l'eau d'irrigation\
                  \ sur une surface. Voici quelques systèmes et modes d'irrigation:\
                  \ par calants, à la planche L'eau est déversée à partir du côté\
                  \ supérieur d'une planche limitée par des diguettes en terre destinées\
                  \ à retenir l'eau sur la planche. par bassin de retenue L'eau est\
                  \ déversée rapidement sur des parcelles presque de niveau, entourées\
                  \ de digues. Le bassin est une petite parcelle de terre. par infiltration,\
                  \ par billons L'eau est amenée dans de petites rigoles rappochées,\
                  \ dans les cultures céréalires et fourragères, de façon à limiter\
                  \ l'écoulement de l'eau d'irrigation à une seule direction. par\
                  \ inondation L'eau, amenée dans de petits fossés, submerge la terre.\
                  \ par rigoles L'eau est amenée dans des sillons creusés par les\
                  \ instruments aratoires entre les lignes de culture. par aspersion\
                  \ L'eau est pulvérisée sur le terrain par un système de rampes sous\
                  \ pression et de buses. souterraine L'eau est amenée dans des fossés\
                  \ ouverts ou des canalisations jusqu'à ce que la nappe phréatique\
                  \ soit assez remontée pour humecter le sol. par submersion (wild\
                  \ flooding) L'eau est déversée des points les plus élevés d'un champ,\
                  \ sans régler sa distribution."
              mica:
                title: mica
                description: Groupe de minéraux formé de phyllosilicates ayant une
                  structure cristalline feuilletée 2:1 et renfermant généralement
                  du potassium entre leurs feuillets.
              hydrous mica:
                title: mica hydraté
                description: 'Ce terme a deux acceptions: (1) groupes de micas à granulométrie
                  argileuse ayant une plus forte teneur en eau interstitielle et une
                  plus faible teneur en potassium que le mica normal (illite). (2)
                  micas-montmorillonites et micas-vermiculites interstratifiés dans
                  lesquels le mica domine.'
              microaerophile:
                title: micro-aérophile
                description: "Micro-organisme dont la croissance est favorisée en\
                  \ présence de faibles quantités d'oxygène almosphérique."
              microorganism:
                title: micro-organisme
                description: "Forme de vie à l'échelle microscopique."
              microbiology / soil:
                title: microbiologie du sol
                description: "Secteur spécialisé de la science des sols ayant pour\
                  \ objet l'étude des micro-organismes vivant dans le sol et de leurs\
                  \ relations avec la production agricole y compris la croissance\
                  \ des plantes et des animaux."
              microclimate:
                title: microclimat
                description: "(1) Climat d'une étendue limitée résultant de la modification\
                  \ du climat général sous l'effet de différences locales d'altitude\
                  \ et d'exposition. (2) Série de variations climatiques à l'intérieur\
                  \ d'une très petite région."
              microfauna:
                title: microfaune
                description: "Partie de la faune comprenant les êtres vivants qui\
                  \ ne sont nettement visibles qu'à l'aide d'un microscope. La microfaune\
                  \ comprend les protozaires et les nématodes."
              microflora:
                title: microflore
                description: "Partie de la flore comprenant les organismes qui ne\
                  \ sont nettement visibles qu'à l'aide d'un microscope. La microflore\
                  \ comprend certaines algues, les bactéries et certains champignons."
              microrelief:
                title: microrelief
                description: Variations locates du relief, à petite échelle, comme
                  les bosses, les dépressions ou les creux. Voir aussi butte de chablis
                  et gilgaï.
              dispersion medium:
                title: milieu de dispersion
                description: "Fraction d'un système colloïdal dans laquelle la phase\
                  \ dispersée est en suspension."
              mineral:
                title: minéral
                description: Phase homogène se produisant naturellement; terme parfois
                  limité aux phases cristallines, inorganiques.
              amorphous mineral:
                title: minéral amorphe
                description: (1) Minéral qui ne possède aucune structure cristalline
                  définie. (2) Minéral qui possède une structure cristalline définie
                  mais qui a un aspect amorphe à cause de la petite taille des cristaux.
              clay mineral:
                title: minéralogie du sol
                description: "Secteur spécialisé de la science des sol ayant pour\
                  \ objet l'étude des matériaux inorganiques homogènes rencontrés\
                  \ dans l'écorce terrestre à la profondeur où prennent lieu les processus\
                  \ d'altération ou de sédimentation."
              primary mineral:
                title: minéral primaire
                description: "Minéral qui n'a pas été altéré chimiquement depuis le\
                  \ dépôt et la cristallisation de la lave en fusion. Voir aussi minéral\
                  \ secondaire."
              secondary mineral:
                title: minéral secondaire
                description: "Minéral résultant de la décompostion d'un minéral primaire\
                  \ ou de la précipitation des produits de la décompostion d'un minéral\
                  \ primaire. Voir aussi minéral primaire."
              mineralization:
                title: minéralisation
                description: "Passage d'un élément de l'état organique à l'état inorganique\
                  \ sous l'action de la décomposition microbienne."
              moder:
                title: moder
                description: "Humus forestier zoogène formé de débris végétaux partiellement\
                  \ décomposés par la faune du sol (horizon F), mais non feutrés comme\
                  \ les humus bruts. ll fait transition avec une zone de microdéjections\
                  \ sphériques ou cylindriques d'arthropodes, semée de paticules minérales\
                  \ dans sa partie inférieure et souvent sur toute son épaisseur.\
                  \ Bien que l'incorporation de matières organiques soit intense,\
                  \ elle se fait à faible profondeur, car aucun des organismes présidant\
                  \ à la formation d'un moder n'est fouisseur. Le brassage de particules\
                  \ organiques et minérales est purement mécanique. La teneur en carbone\
                  \ organique sous l'horizon F varie de 23 à 29%, et peut même excéder\
                  \ 35%. Le rapport C/N est de l'ordre de 20 à 25, parfois plus faible.\
                  \ On distingue les divers sous-groupes selon leur morphologie et\
                  \ leurs propriétés physiques."
              monolith (soil):
                title: monolithe
                description: "Tranche verticale du profil d'un sol, prélevée à même\
                  \ le sol et montée en vue d'exposition ou d'étude."
              montmorillonite:
                title: montmorillonite
                description: Un des alumino-silicates du groupe de la smectite. Voir
                  aussi groupe de la montmorillonite.
              mor (or raw humus):
                title: mor (humus brut)
                description: "Humus forstier non zoogène caractérisé par un horizon\
                  \ F feutré et un horizon H holorganique, présentant une nette démarcation\
                  \ avec l'horizon A. Le mor est généralement acide et a une forte\
                  \ teneur en carbone organique (au moins 52%), et un rapport C/N\
                  \ élevé (de 25 à 35, parfois plus). On distingue divers sous-groupes\
                  \ définis suivant leur morphologie et leurs propriétés chimiques\
                  \ et biologiques."
              moraine:
                title: ravin
                description: "Canal creusé par l'érosion et l'écoulement intermittent\
                  \ d'un volume d'eau, pendant et après de fortes pluies. Les ravins\
                  \ sont assez profonds pour ne pas être comblés par les opérations\
                  \ culturales et pour nuire aux travaux du sol."
              external drainage:
                title: moraine terminale
                description: "Accumulation de matériau de transport glaciaire formant\
                  \ une colline allongée en bordure du front d'un glacier de vallée\
                  \ ou en bordure d'un calotte glaciaire. Elle provient surtout de\
                  \ l'accumulation de débris déposés des glaces ou poussés par le\
                  \ glacier en progression, ou d'une association de ces deux formes\
                  \ d'accumulation."
              map / soil (Pedology):
                title: morphologie du sol
                description: "1. Compostion physique, particulièrement les propriétés\
                  \ structurales, du profil d'un sol telles que révélées par la nature,\
                  \ l'épaisseur et la disposition des horizons du profil, et par la\
                  \ texture, la structure, la consistance et la porosité de chaque\
                  \ horizon. 2. Les caractéristiques structurales d'un sol de chacun\
                  \ de ses composants."
              clod:
                title: motte
                description: "Masse compacte et cohérente produite par le bêchage\
                  \ ou le labourage du sol. Généralement, les mottes s'émiettent facilement\
                  \ avec l'alternance de l'humidification et du séchage."
              mulch:
                title: pailler
                description: "Recouvrir la surface du sol d'un paillis."
              dust mulch:
                title: mulch de poussière
                description: Couche superficielle meuble, à granulométrie fine ou
                  pulvérulente, généralement produite par des façon culturales à faible
                  profondeur et aussi par le dépôt des poussières.
              mull:
                title: mull
                description: "Humus forestier zoogène constitué d'un mélange homogène\
                  \ de matières organiques bien humifiées et de sol minéral faisant\
                  \ une transition graduelle avec l'horizon sous-jacent. On le reconnaît\
                  \ à sa structure granulaire et à cause de l'activité de la microfaune\
                  \ fouissante (surtout des vers de terre) par le fait que les débris\
                  \ organiques partiellement décomposés ne s'accumulent pas en un\
                  \ horizon distinct (horizon F) comme c'est le cas dans le mor et\
                  \ le moder. La teneur en matières organiques varie de 5 à 20% et\
                  \ le rapport C/N, de 10 à 15. On distingue plusieurs sous-groupes\
                  \ de mull établis suivant leur morphologie et leurs caractéristiques\
                  \ chimiques. Horizon Ah."
              mycelium:
                title: mycélium
                description: Masse de filaments filiformes, ramifiés ou réticulés,
                  formant la structure végétative des champignons.
              mycorrhiza:
                title: mycorhize
                description: Association généralement symbiotique de champignons et
                  des racines de plantes à graines. Voir aussi mycorhize ectotrophe
                  et mycorhize endotrophe.
              ectotrophic mycorrhiza:
                title: mycorhize ectotrophe
                description: "Association en mycorhize dans laquelle les hyphes des\
                  \ champignons forment une couche serré à la surface des racines\
                  \ d'une plante. Les filaments mycéliens s'étendent à l'intérieur\
                  \ des racines, entre les cellules corticales, et à l'extérieur,\
                  \ dans le sol environnant."
              endotrophic mycorrhiza:
                title: mycorhize endotrophe
                description: "Association en mycorhize dans laquelle les hyphes des\
                  \ champignons se fixent sur la surface des racines sous forme de\
                  \ filaments isolés qui peuvent pénétrer directement dans les radicelles,\
                  \ d'autres cellules épidermiques et, parfois, dans les cellules\
                  \ corticales. Des filaments isolés s'étendent de la surface des\
                  \ racines dans le sol environnant."
              nitrification:
                title: nitrification
                description: "Oxydabtion biochimique de l'ammonium en nitrate."
              Black:
                title: Noir
                description: "Grand groupe de sols de l'ordre chernozémique que l'on\
                  \ rencontre dans les régions de prairie et de parc de climat frais\
                  \ ou froid et subhumide. lls sont formés d'un horizon de surface\
                  \ (Ah ou Ap) très foncé et ordinairement d'un horizon B (Bm, Btj\
                  \ ou Bt) brunâtre qui peut cependant manquer recouvrant un horizon\
                  \ C généralement calcaire à degré élevé de saturation en bases."
              plate count:
                title: numération sur plaque
                description: "Comptage du nombre de colonies qui se sont développées\
                  \ sur un milieu de culture auquel on a inoculé une petite quantité\
                  \ de sol, dans le but d'évaluer le nombre de certains organismes\
                  \ présents dans l'échantillon de sol."
              forest floor:
                title: ordre de sols
                description: "Catégorie de la classification canadienne des sols.\
                  \ Les sols du Canada ont élé divisés en dix ordres: chernozémique,\
                  \ solonetzique, luvisolique, podzolique, brunisolique, régosolique,\
                  \ gleysolique, vertisolique, cryosolique, et organique. Tous les\
                  \ sols d'un ordre ont au moins une caractéristique en commun."
              Organic:
                title: Organique
                description: "Ordre de sols formés principalement de dépôts organiques.\
                  \ La plupart des sols organiques sont saturés pendant presque toute\
                  \ l'année, à moins d'être drainés artificiellement, mais certains\
                  \ d'entre eux ne sont saturés que pendant quelques jours. lls contiennent\
                  \ au moins 17% de carbone organique; de plus, (1) si la couche de\
                  \ surface est composée de matériaux organiques fibriques, d'une\
                  \ densité apparente de moins de 0,1 [n'importe si une couche Op\
                  \ mésique ou humique de moins de 15 cm (6 po) est présente ou non],\
                  \ les matières organiques doivent descendre à une profondeur d'au\
                  \ moins 60cm (24 po): ou (2) si la couche de surface est composée\
                  \ de matériaux organiques d'une densité apparente de 0.1 ou plus,\
                  \ les matières organiques doivent descendre à une profondeur d'au\
                  \ moins 40cm (16 po): ou (3) si un contact lithique se présente\
                  \ à une profondeur inférieure à celle indiquée en 1) ou en 2) ci-dessus,\
                  \ les matières organiques doivent descendre à une profondeur d'au\
                  \ moins 10cm (4 po)."
              ortstein:
                title: ortstein
                description: "(1) Couche indurée de l'horizon B de certains podzols,\
                  \ dans laquelle le ciment est constitué de sesquioxydes illuviés\
                  \ et de matières organiques. (2) Comme nom de sous-groupe de sols\
                  \ podzoliques, désigne un horizon Bhfc ou Bfc fortement cimenté,\
                  \ visible sur au moins un tiers de la surface exposée et ayant une\
                  \ épaisseur d'au moins 2,5 cm (1 po)."
              free oxides:
                title: oxydes libres
                description: "Oxydes et hydroxydes de ler, d'aluminium, de silicium,\
                  \ de manganèse et de titanium, dont les particules sont d'ordinaire\
                  \ fines, non combinées avec d'autres éléments et enrobant souvent\
                  \ les minéraux primaires et secondaires."
              pressure or induced pan:
                title: pan de pression (pan induit)
                description: "Horizon ou couche du sol non superficiel ayant une densité\
                  \ apparente plus élevée et une porosité totale moins grande que\
                  \ le sol immédiatement sus-jacent ou sous-jacent, résultant de la\
                  \ compaction exercée par les instruments agricoles ou d'autres moyens\
                  \ artificiels. On dit aussi semelle de labour et pan de trafic."
              traffic pan:
                title: pan de trafic
                description: Voir pan de pression / pan induit.
              genetic pan:
                title: pan génétique
                description: Couche naturelle souterraine, à perméabilité faible ou
                  très faible, à forte concentration de -particules fines, et dont
                  certaines propriétés physiques et chimiques sont différentes de
                  celles de la couche sus-jacente ou sous jacente. Voir aussi pan
                  argileux et fragipan.
              induced pan:
                title: pan induit
                description: Voir pan de pression, pan induit.
              pesticides:
                title: pesticides
                description: "Produits chimiques qui détruisent les organismes nuisibles\
                  \ à l'homme ou aux cultures et aux animaux qui lui fournissent nourriture,\
                  \ vêtement et abri. Ces organismes comprennent les insectes, les\
                  \ acariens, les micro-organismes, les mauvaises herbes et les rongeurs.\
                  \ Les pesticides comprennent les insecticides, les fongicides, les\
                  \ herbicides etc."
              primary particles:
                title: particules primaires (élémentaires)
                description: Particules de sol isolées par un traitement standard
                  de dispersion.
              parts per million (ppm):
                title: parties par million (ppm)
                description: "Unités de poids de toute substance donnée par million\
                  \ d'unités équivalentes de poids d'un sol séché à l'étuve; ou, pour\
                  \ une solution de sol ou d'autres substances, unités de poids du\
                  \ soluté par million d'unités de poids de solution."
              pedogenesis:
                title: pédogénèse
                description: "Région accidentée et autrefois élevée qui sous l'action\
                  \ de l'érosion est devenue une région basse légèrement ondulée ressemblant\
                  \ à une plaine."
              pedology:
                title: pédologie
                description: "Ensemble des aspects de la science des sols ayant pour\
                  \ objet l'étude de l'origine, de la morphologie, de la genèse, de\
                  \ la répartition, de la cartographie et de la taxonomie des sols,\
                  \ ainsi que de la classification en termes de leur utilisation.\
                  \ Voir aussi science des sols."
              clay films (skins):
                title: pellicules argileuses (enrobements argileu)
                description: "Revêtements d'argile à molécules orientées qui se déposent\
                  \ à la surface des agrégats naturels, des granules de minéraux et\
                  \ sur les parois des pores du sol."
              penetrability:
                title: pénétrabilité
                description: "Facilité avec laquelle on peut introduire une sonde\
                  \ dans un sol. Elle s'exprime en unités de distance, de vitesse,\
                  \ de force ou de travail, suivant le type du pénétromètre."
              percolation (of soil water):
                title: percolation (de l&#39;eau du sol)
                description: "Mouvement descendant de l'eau dans le sol, et spécifiquement,\
                  \ l'écoulement descendant de l'eau dans un sol, saturé ou presque\
                  \ saturé, à des gradients hydrauliques d'au plus 1.0."
              periglacial:
                title: périglaciaire
                description: Se dit de tout processus dû au climat froid, agissant
                  en bordure des glaciers ou ailleurs.
              intrinsic permeability:
                title: perméabilité intrinsèque
                description: "Propriété d'un corps poreux de se laisser traverser\
                  \ par les gaz ou les liquides. Coefficient « k » de la loi de Darcy\
                  \ multiplié par le facteur n/pg dans lequel n est la viscosité du\
                  \ fluide exprimée en poises. p la densité du fluide exprimée en\
                  \ g cm-³ et g l'accélération due à la gravité exprimée en g cm-².\
                  \ Voir aussi perméabilité du sol et eau du sol."
              pF (Obsolete):
                title: pF (Désuet)
                description: "Logarithme de la tension de l'eau du sol, mesurée par\
                  \ la hauteur, en centimètres, d'une colonne d'eau exerçant un tention\
                  \ de force égale."
              exchangeable phosphate:
                title: phosphate échangeable
                description: "Anion de phosphate accolé de façon réversible à la surface\
                  \ de la phase solide d'un sol, de sorte qu'il peut être mis en solution\
                  \ par des réactions d'équilibre anionique avec de isotopes du phosphore\
                  \ ou d'autres anions de la phase liquide, sans qu'il y ait mise\
                  \ en solution de la phase colloïdale à laquelle il est accolé."
              fixed phosphorus:
                title: phosphore fixé
                description: "(1) Phosphore qui a été changé en un état moins soluble\
                  \ par réaction avec le sol; phosphore modérément inassimilable.\
                  \ Plus précisément, c'est la quantité de composés solubles du phosphore\
                  \ ajouté au sol qui devient chimiquement ou biologiquement attachée\
                  \ à la phase solide d'un sol et ne peut pas être récupérée par extraction\
                  \ au moyen d'un solvant spécifié dans certaines conditions précises.\
                  \ Certains de ces solvants sont l'eau, I'eau carbonatée et des solutions\
                  \ diluées d'acides minéraux forts contenant ou non du fluorure ou\
                  \ d'autres anions échangeables. (2) Phosphore ajouté au sol et qui\
                  \ n'est pas absorbé par les plantes au cours de la première année\
                  \ de culture. (3) Phosphore soluble qui a été adsorbé par la phase\
                  \ solide du sol sous des formes extrêmement résistantes à l'assimilation\
                  \ par les plantes; phosphore non assimilable ou sous des formes\
                  \ qui ne sont pas immédiatement ou modérément assimilables."
              organic phosphorus:
                title: phosphore organique
                description: "Phosphore sous forme d'un composé organique ou d'un\
                  \ groupe de composés organiques tels que l'acide glycérophosphorique,\
                  \ l'acide inositol phosphorique et l'acide cytidylique."
              photomap:
                title: photo-carte
                description: "Carte formée d'un montage de photographies aériennes\
                  \ montrant les caractéristiques physiques et culturales d'un terrain,\
                  \ comme sur une carte planimétrique. Voir aussi photo carte planimétrique\
                  \ et photo-carte topographique."
              phyllosilicates:
                title: phyllosilicates
                description: Silicates dans lesquels les tétraèdres de SiO4 sont liés
                  les uns aux autres et forment des feuillets infinis bi-dimensionnels,
                  et sont condensés avec des octaèdres de AlO ou de MgO dans un rapport
                  2:1 ou 1:1. ll se produit souvent une substitution isomorphe de
                  certains éléments.
              physiosorption:
                title: physisorption
                description: "Fixation de substances non ioniques comme les molécules\
                  \ polaires d'eau et les molécules d'acide acétique ou les acides\
                  \ nucléiques à la surface des particules d'argile ou d'un autre\
                  \ solide. La fixation de grosses molécules à des particules d'argile\
                  \ par une action ionique n'est pas un phénomène de physiorption."
              phytometer:
                title: phytomètre
                description: "Plante ou groupe de plantes dont on se sert pour mesurer\
                  \ les facteurs physiques de l'habitat en termes d'activités physiologiques."
              piedmont:
                title: piémont
                description: "Situé au pied ou près du pied d'une montagne."
              stones:
                title: pierres
                description: "Fragments de roches de diamètre supérieur à 25 cm (10\
                  \ po) s'ils sont arrondis et de longueur supérieure à 38 cm (15\
                  \ po), sur l'axe majeur, s'ils sont aplatis. Voir aussi fragments\
                  \ grossiers. En génie, ces fragments sont inclus parmi les blocs,\
                  \ que l'on comprend avoir un diamètre de plus de 20 cm (8 po)."
              stony:
                title: pierreux
                description: "Contient suffisamment de pierres pour empêcher ou gêner\
                  \ le travail du sol. Pour être qualifiée de pierreuse, la surface\
                  \ d'un sol doit être recouverte au moins à 0,1% de pierres. Ce terme\
                  \ sert à modifier les classes de sols, par exemple dans les expressions\
                  \ loam argileux pierreux, ou loam argileu, phase pierreuse. Voir\
                  \ aussi fragments grossiers."
              stoniness:
                title: pierrosité
                description: Proportion relative des pierres dans ou sur le sol. Utilisé
                  en classification des sols. Voir aussi fragments grossiers.
              site:
                title: pieu
                description: "Longue pièce de bois ou de métal enfoncé de quelque\
                  \ façon dans le sol servant généralement d'appui contre les poussées\
                  \ verticales ou latérales."
              piezometer:
                title: piézomètre
                description: Instrument de mesure de la pression hydrostatique.
              placic:
                title: placique
                description: "Se dit d'un pan ou d'un horizon mince, noir ou rouge\
                  \ foncé, censément cimenté par le fer."
              indicator plants:
                title: plantes indicatrices
                description: Plantes caractéristiques de condition spécifiques de
                  sol ou de localité.
              Podzol:
                title: podzol
                description: "Avant 1968 le podzol était un grand groupe de l'ordre\
                  \ podzolique qui comprenait les sols ayant un horizon Ae et un horizon\
                  \ B podzolique. Voir aussi podzotique."
              Ferro-Humic Podzol:
                title: podzol ferro-humique
                description: "Grand groupe de sols de l'ordre podzolique. Les 10 cm\
                  \ supérieurs (4 po) de l'horizon Bhf ont 5% ou plus de carbone organique,\
                  \ 0.6% ou plus d'AI et de Fe extractibles au pyrophosphate et soit\
                  \ un rapport de carbone organique à Fe extractible au pyrophosphate\
                  \ inférieur à 20 soit un pourcentage de Fe extractible au pyrophosphate\
                  \ supérieur à 0.3 ou ces deux caractères à la fois. L'horizon B\
                  \ est généralement recouvert d'un horizon (Ae) éluvié de couleur\
                  \ claire et d'une couche d'humus brut (mor)."
              Humic Podzol:
                title: podzol humique
                description: "Grand groupe de sols de l'ordre podzolique, que l'on\
                  \ rencontre dans les régions côtières fraîches et humides, les régions\
                  \ intérieures fraîches et humides de plus grande altitude, et certaines\
                  \ dépressions tourbeuses. Ces sols possèdent un horizon Bh d'une\
                  \ épaisseur d'au moins 10 cm (4 po) allant de brun foncé à noir\
                  \ et contenant plus de 1% de carbone organique, moins de 0.3% de\
                  \ Fe extractible au pyrophosphate, un rapport de carbone organique\
                  \ à Fe extractible au pyrophosphate d'au moins 20 et une saturation\
                  \ en bases très faible (extraction au NaCI). lls peuvent présenter\
                  \ un mince alios ou une série d'alios très minces (2.5 cm ou 1 po\
                  \ au total)."
              Humo-Ferric Podzol:
                title: podzol humo-ferrique
                description: "Grand groupe de sols de l'ordre podzolique. Les 10 cm\
                  \ (4 po) supérieurs de l'horizon B (Bf) contiennent entre 0.5% et\
                  \ 5% de carbone organique et 0.6% ou plus d'AI et de Fe extractibles\
                  \ au pyrophosphate (0.4% dans les sables). Le rapport de carbone\
                  \ organique à Fe extractible au pyrophosphate est inférieur à 20.\
                  \ La plupart des podzols typiques sont classés dans les podzols\
                  \ humo-ferriques."
              Podzolic:
                title: podzolique
                description: "Ordre de sols ayant des horizons B podzoliques (Bh,\
                  \ Bhf ou Bf) dans lesquels sont accumulés en associations amorphes,\
                  \ des matières organiques (principalement acides fulviques), de\
                  \ l'Al et généralement du Fe. Leurs solums sont acides et leurs\
                  \ horizons B possèdent une forte charge dépendant du pH. Les grands\
                  \ groupes de cet ordre sont: podzol humique, podzol ferro-humique\
                  \ et podzol humo-ferrique."
              podzolization:
                title: podzolisation
                description: Processus de formation des sols dont le résultat est
                  la genèse des sols podzoliques.
              equivalent weight of a soil colloid:
                title: poids équivalent d&#39;un colloïde du sol
                description: "Poids d'un colloïde argileux ou organique ayant un pouvoir\
                  \ combinant égal au poids d'un atome-gramme d'hydrogène."
              apparent specific gravity:
                title: poids spécifique apparent
                description: "Rapport de la densité apparente d'un sol à la masse\
                  \ d'un volume unitaire d'eau."
              volume weight (Obsolete):
                title: poids volumétrique
                description: Voir densité apparente.
              population / soil:
                title: population du sol
                description: Ensemble des organismes vivant dans le sol y compris
                  la flore et la faune.
              porosity:
                title: porosité en air
                description: "Par rapport au volume brut de sol volume occupé par\
                  \ de l'air à un moment donné ou dans des conditions spécifiées,\
                  \ par exemple, à un potentiel déteminé de l'eau du sol. Généralement\
                  \ ce volume est formé de pores grossiers. C'est-à-dire ceux dont\
                  \ la tension est inférieure à environ 100 cm (39.4 po) d'eau. On\
                  \ dit aussi: porosité non capillaire, capacité en air, macroporosité.\
                  \ Voir aussi tension de l'eau du sol."
              capillary porosity:
                title: porosité non capillaire
                description: (désuet) Voir porosité en air.
              exchangeable potassium:
                title: potassium échangeable
                description: "Potassium adsorbé par le complexe d'adsorption du sol\
                  \ et qui est facilement remplaçable par les cations d'une solution\
                  \ d'un sel neutre ne contenant pas de potassium."
              capillary potential:
                title: potentiel capillaire (de matrice)
                description: Voir eau du sol.
              lime potential:
                title: potentiel de chaux
                description: "Logarithme négatif du rapport de l'activité ionique\
                  \ de l'hydrogène à la racine carrée de la somme des activités des\
                  \ ions de calcium et de magnésium de la solution du sol. Exprimé\
                  \ algébriquement par la formule pH - 1/2 p(Ca + Mg). Une autre forme\
                  \ de cette formule est 1/2 log [(Ca + Mg)(OH)2] + pKw, où Kw est\
                  \ le produit ionique de l'eau. Le potentiel de chaux exprime la\
                  \ somme des activités des hydroxydes de calcium et de magnésium\
                  \ dans la solution du sol. Voir aussi potentiel de chaux corrigé."
              corrected lime potential:
                title: potentiel de chaux corrigé
                description: "Se définit par l'équation PCC = pH - 1/2p(Ca + Mg) -\
                  \ 1/3(pKg - pY), dans laquelle Kg est le produit de solubilité de\
                  \ la gibbsite et Y le produit ionique (Al) (OH)3 dans la solution\
                  \ de sol. Le potentiel de chaux corrigé (PCC) est aussi égal à 1/6\
                  \ log [(Ca + Mg) (OH)2]3/[(Al) (OH)3]2 + KPCC dans laquelle KPCC\
                  \ est une constante qui n'est fonction que de la température. Le\
                  \ PCC est donc le rapport du cube de la somme des activités des\
                  \ hydroxydes de Ca et de Mg au carré de l'activité ionique de l'hydroxyde\
                  \ d'Al dans la solution de sol. ll existe une relation entre le\
                  \ PCC et le degré de saturation en bases établi d'après la capacité\
                  \ effective d'échange cationique mais pas entre le degré de saturation\
                  \ en bases et le pH ni le potentiel de chaux. Voir aussi potentiel\
                  \ de chaux."
              electrokinetic potential:
                title: potentiel électrocinétique
                description: "(1) Dans un système colloïdal, différence de potentiel\
                  \ entre la couche non dissociable accolée à la surface de la phase\
                  \ dispersée, et le miilieu de dispersion. (2) Travail fourni pour\
                  \ porter une charge unitaire de l'infini à un point de référence\
                  \ dans la couche liquide accolée à la phase solide d'un système\
                  \ colloïdal."
              osmotic potential:
                title: potentiel osmotique
                description: Voir eau du sol
              total potential (of soil water):
                title: potentiel total (de l&#39;eau du sol)
                description: Voir eau du sol.
              zeta potential:
                title: potentiel zêta
                description: Voir potentiel électrocinétique.
              base saturation percentage:
                title: pourcentage; taux de saturation en bases
                description: "Degré de saturation du complexe d'adsorption d'un sol\
                  \ en cations échangeables autres que l'hydrogène et l'aluminium.\
                  \ On l'exprime en pourcentage de la capacité totale d'échange cationique."
              potassium-supplying power of soils:
                title: pouvoir de libération de potassium du sol
                description: "Capacité d'un sol de libérer, pour les besoins des plantes,\
                  \ du potassium à l'état échangeable ou modérément assimilable."
              effective precipitation:
                title: précipitation effective
                description: Fraction des précipitations totales qui devient accessible
                  aux plantes.
              total pressure:
                title: pression totale
                description: Voir eau du sol.
              Osmotic pressure:
                title: Pression osmotique
                description: Voir eau du sol.
              prismatic:
                title: prismatique
                description: "Type de structure du sol formé d'agrégats dont l'axe\
                  \ vertical est beaucoup plus long que l'axe horizontal. Voir aussi\
                  \ structure du sol (types de--)."
              productivity (soil):
                title: productivité du sol
                description: "Aptitude d'un sol à produire, dans son millieu naturel,\
                  \ une plante ou une série de plantes spécifiées suivant une méthode\
                  \ spécifiée d'exploitation. ll est nécessaire de spécifier ces limites\
                  \ car aucun sol ne peut porter toutes les cultures avec une égale\
                  \ productivité et une méthode unique d'exploitation ne peut donner\
                  \ ies mêmes résultats sur tous les sols. Productivité signifie l'aptitude\
                  \ d'un sol à produire des cultures; elle s'exprime en termes de\
                  \ rendement."
              physical properties of soils:
                title: propriétés physiques du sol
                description: "Caractéristiques, processus ou réactions d'un sol provoqués\
                  \ par des forces physiques et qui sont décrites ou qui s'expriment\
                  \ en termes ou en équations physiques. ll est parfois difficile\
                  \ de distinguer les propriétés physiques des propriétés chimiques:\
                  \ d'où l'emploi du terme «physico-chimique ». Des exemples de propriétés\
                  \ physiques sont la densité apparente, la capacité de rétention\
                  \ d'eau, la conductivité hydraulique, la porosité et la répartition\
                  \ volumétrique des pores."
              protozoa:
                title: protozoaires
                description: Organismes unicellulaires appartenant au règne animal.
              psammophytes:
                title: psammophytes
                description: Plantes qui croissent mieux dans le sable articulièrement
                  le sable fin ou moyen ou qui tolèrent sa présence.
              psychrophile:
                title: psychrophile
                description: "Micro-organisme pouvant survivre à des températures\
                  \ descendant jusqu'à 0° C."
              carbon-nitrogen ratio:
                title: rapport carbone/azote
                description: "Rapport du poids de carbone organique au poids total\
                  \ d'azote, dans un sol ou une substance organique. On l'obtient\
                  \ en divisant le pourcentage de carbone organique (C) par celui\
                  \ de l'azote total (N)."
              silica-alumina ratio:
                title: rapport silice-alumine
                description: "Nombre de molécules de silice (SiO2) par molécule d'oxyde\
                  \ d'aluminium (Al2O3) dans les minéraux argileux ou les sols."
              silica-sesquioxide ratio:
                title: rapport silice-sesquioxyde
                description: "Nombre de molécules de silice (SiO2) par molécule d'oxyde\
                  \ d'aluminium (Al2O3) et d'oxyde ferrique (Fe203) dans les minéraux\
                  \ argileux ou les sols."
              nitrate reduction:
                title: réduction des nitrates
                description: Réduction biochimique des nitrates.
              regolith:
                title: régolithe
                description: Couche non consolidée de roches altérées et de matériaux
                  du sol recouvrant la roche consolidée.
              Regosol:
                title: régosol
                description: "Seul grand groupe de l'ordre régosolique. Les sols de\
                  \ ce groupe ont des horizons insuffisamment formés pour répondre\
                  \ aux exigences des autres ordres."
              Regosolic:
                title: régosolique
                description: "Ordre de sols n'ayant pas d'horizons constitués ou ayant\
                  \ des horizons A et B insuffisamment formés pour répondre aux critères\
                  \ des autres ordres. Le régosol est le seul grand groupe dans cet\
                  \ ordre."
              relief:
                title: relief
                description: "Ensemble des élévations ou inégalités de la surface\
                  \ terrestre. Une terre sans inégalités ou variations d'élévation\
                  \ s'appelle terrain uni; le relief en pentes douces se qualifie\
                  \ d'ondulé, le relief en pentes fortes, de vallonné, et le relief\
                  \ en pentes très abruptes, de montueux. Voir aussi microrelief."
              reworked:
                title: remanié
                description: "Se dit des matériaux modifiés, d'ordinaire par les eaux\
                  \ ou parle vent, après leur dépôt préliminaire."
              crevasse fillings:
                title: remplissage de crevasse
                description: "Coteaux ou buttes formés de sédiments glaciaires déposés\
                  \ par l'eau de fonte dans les failles et les crevasses des glaciers."
              sustained yield:
                title: rendement soutenu
                description: "Rendement continuel, annuel ou périodique, d'une surface\
                  \ en plantes ou en matières végétales; il exige des techniques d'exploitation\
                  \ qui permettent de maintenir la capacité de production de la terre."
              rendzina:
                title: rendzine
                description: "Groupe de sols dont l'horizon de surface est brun ou\
                  \ noir et qui se sont formés sur des matériaux originels contenant\
                  \ plus de 40% d'équivalent de carbonate de calcium. Pas utilisé\
                  \ en taxonomie canadienne."
              particle-size distribution:
                title: répartition granulométrique
                description: "Répartition des diverses fractions d'un échantillon\
                  \ de sol; elle s'exprime généralement en pourcentage par rapport\
                  \ au poids."
              creep:
                title: reptation
                description: "Mouvement en masse du sol et de ses matériaux en une\
                  \ descente lente le long des pentes relativement abruptes, principalement\
                  \ sous l'influence de la gravité mais aussi sous l'effet de la saturation\
                  \ en eau et de l'alternance du gel et du dégel. Pour les ingénieurs\
                  \ le terme signifie tout déplacement lent et général sous l'effet\
                  \ d'une charge."
              crystal lattice:
                title: réseau cristallin
                description: Voir structure maillée; réticulée en grille.
              residual shrinkage:
                title: retrait résiduel
                description: "Baisse de volume après que la perte d'eau et le changement\
                  \ de volume ont cessé d'être proportionnels."
              rhizobia:
                title: rhizobium(s)
                description: "Petites bactéries hétérotrophes du genre Rhizobium capables\
                  \ de former des nodosités symbiotiques sur les racines des légumineuses.\
                  \ Dans les nodosités les bactéries fixent l'azote atmosphérique\
                  \ qui est utilisé par les plantes; en retour les plantes leur fournissent\
                  \ de l'énergie."
              rhizoid:
                title: rhizoïde
                description: "Dans les plates inférieures, un des filaments rhizoformes\
                  \ unicellulaires ou multicellulaires qui servent à la fixation et\
                  \ à l'absorption."
              rhizoplane:
                title: rhizoplan
                description: Surface extérieure des racines et des particules et débris
                  de sol qui y adhèrent.
              rhizosphere:
                title: rhizosphère
                description: Sol entourant les racines des plantes et qui en est directement
                  influencé.
              igneous rock:
                title: roche ignée
                description: "Roche formée par refroidissement et solidification du\
                  \ magma, et qui n'a pas subi d'altérations notables depuis sa formation."
              metamorphic rock:
                title: roche métamorphique
                description: "Roche formée à partir de roches préexistantes, mais\
                  \ qui en diffère par ses propriétés physiques, chimiques et minéralogiques,\
                  \ par suite de processus géologiques naturels, principalement la\
                  \ chaleur et la pression, provenant de l'intérieur du globe. Ces\
                  \ roches préexistantes ont pu être des roches ignée, sédimentaires\
                  \ ou d'autres formes de roches métamorphiques."
              roche moutonnée:
                title: roche moutonnée
                description: "Saillie rocheuse arrondie (bosse), polie et striée par\
                  \ l'action glaciaire et dont le versant montre souvent des signes\
                  \ d'une perte de matériaux rocheux arrachés par les glaces."
              sedimentary rock:
                title: roche sédimentaire
                description: "Roche formée de matériaux déposés après suspension ou\
                  \ précipités d'une solution et généralement plus ou moins consolidés.\
                  \ Les principales roches sédimentaires sont les grès, les schistes\
                  \ argileux, les calcaires et les conglomérats."
              bedrock:
                title: roche-mère
                description: "Roche à partir de laquelle s'est formé le matériau originel\
                  \ des sols."
              runoff:
                title: ruissellement
                description: "Portion de la précipitation totale sur une région, qui\
                  \ se déverse par canaux d'écoulement. Les ruissellements de surface\
                  \ ne pénètrent pas dans le sol. L'eau d'écoulement ou de suintement\
                  \ souterrains pénètre dans le sol avant d'atteindre les cours d'eau."
              surface runoff:
                title: ruissellement de surface
                description: Voir ruissellement.
              sand:
                title: sable
                description: '(1) Particule du sol dont le diamètre peut aller de
                  0.05 à 2.0 mm. (2) Une de cinq fractions du sol: sable très grossier,
                  sable grossier, sable moyen, sable fin et sable très fin. Voir aussi
                  fractions du sol. (3) Classe de texture du sol. Voir aussi texture
                  du sol.'
              fine sand:
                title: sable fin
                description: (1) Fraction du sol. Voir aussi fractions du sol. (2)
                  Classe de la texture des sols. Voir aussi texture du sol.
              loamy sand:
                title: sable loameux
                description: Voir texture du sol.
              coarse sand:
                title: sable grossier
                description: Voir fractions du sol et texture du sol.
              quicksand:
                title: sable mouvant
                description: "Sable dont la faible capacité portante est causée par\
                  \ une remontée de l'eau; il en résulte une baisse de la pression\
                  \ intergranulaire."
              very fine sand:
                title: sable très fin loameux
                description: Voir texture du sol.
              very coarse sand:
                title: sable très grossier
                description: Voir fractions du sol et texture du sol.
              sandy:
                title: sableux
                description: "Contenant une grande quantité de sable. Peut s'appliquer\
                  \ à n'importe laquelle classes du sol qui contiennent un haut pourcentage\
                  \ de sable. Voir classe de sols et texture du sol."
              salinization:
                title: salinisation
                description: "Processus d'accumulation des sels dans le sol."
              saturate:
                title: strate
                description: Couche possédant certaines caractéristiques ou propriétés
                  homogènes qui la distinguent des couches adjacentes.
              air-dry:
                title: sec à l&#39;air
                description: "(1) État de siccité d'un sol dont la teneur en eau est\
                  \ en équilibre avec l'humidité spécifique de l'atmosphère ambiante.\
                  \ L'humidité spécifique est fonction de l'humidité relative et de\
                  \ la température de l'atmosphère. (2) A l'infinitif: Laisser s'établir\
                  \ un équilibre entre la teneur en eau d'un sol et l'humidité spécifique\
                  \ de l'atmosphère ambiante."
              blowing sand:
                title: semelle de labour
                description: Voir pan de pression / pan induit.
              GIS:
                title: SIG
                description: "Système d'Information Géographique (SIG) est un ensemble\
                  \ d'outils pour collectionner, ranger, recouvrir, transformer et\
                  \ exposer des données à référence spatiale. SISCan se sert d'un\
                  \ SIG du nom de ARC/INFO."
              smectite:
                title: smectite
                description: Voir groupe de la montmorillonite.
              alkaline soil:
                title: sol alcalin
                description: Tout sol dont le pH est supérieur à 7.0.
              self-mulching soil:
                title: sol à mulching spontané
                description: "Sol dans lequel la couche de surface devient si bien\
                  \ agrégé qu'il ne forme pas de croûte et ne s'obture pas sous le\
                  \ choc des gouttes de pluie mais sert plutôt de paillis de surface\
                  \ quand il sèche."
              acid soil:
                title: sol acide
                description: "Matériau du sol d'un pH inférieur à 7.0."
              alpine soil:
                title: sol calcaire
                description: "Sol contenant assez de carbonate de calcium souvent\
                  \ associé à du carbonate de magnésium pour provoquer une effervescence\
                  \ visible au contact de l'acide chlorhydrique 0.1 N froid."
              arable soil:
                title: sol arable
                description: Sol adapté au labour et aux cultures.
              azonal soil:
                title: sol azonal
                description: "Sol ne possédant pas d'horizons génétiques définis.\
                  \ De tels sols peuvent avoir des horizons Ah non chernozémiques\
                  \ ou des horizons Ah chernozémiques peu épais mais pas d'horizon\
                  \ B. Au Canada ils se classent parmi les sols régosoliques."
              compact soil:
                title: sol compact (tenace)
                description: Sol ou sous-sol compact relativement imperméable et tenace
                  qui peut être plastique ou non.
              surface soil:
                title: sol de surface
                description: "Couche supérieure d'un sol qui est ordinairement travaillée\
                  \ par les instruments agricoles, ou partie équivalente d'un sol\
                  \ non cultivé. Elle varie de 7.5 à 25 cm (3 à 10 po) en profondeur\
                  \ et est souvent appelée «couche arable», «couche Ap» ou «horizon\
                  \ Ap»."
              tundra soil:
                title: sol de toundra
                description: Tout sol de la région de la toundra.
              phase (soil):
                title: sol épuisé
                description: Sol qui a perdu la plupart de ses éléments nutritifs
                  assimilables.
              gleyed soil:
                title: sol gleyifié
                description: "Sol qui a subi l'influence de la gleyification."
              halomorphic soil:
                title: sol halomorphe
                description: Terme général regroupant les sols salins et les sol à
                  alcalis.
              hydrogenic soil:
                title: sol hydrgénique
                description: "Sol formé sous l'action de l'eau se maintenant dans\
                  \ le profil pendant de longues périodes, on le rencontre surtout\
                  \ dans les régions froides et humides."
              hydromorphic soil:
                title: sol hydromorphe
                description: "Terme général désignant les sols qui se forment dans\
                  \ des conditions de mauvais drainage, dans les marais, les marécages,\
                  \ les zones où l'eau converge par infiltration, ou les bas-fonds.\
                  \ Voir aussi gleysolique."
              inorganic soil:
                title: sol inorganique
                description: Sol constitué en grande pratie de particules minérales.
                  Voir sol minéral.
              intrazonal soil:
                title: sol intrazonal
                description: "Sol dont la morphologie présente des caractères dus\
                  \ à quelque facteur local de relief de matériau originel ou d'âge\
                  \ plutôt qu'aux facteurs de climat et de végétation."
              heavy soil:
                title: sol lourd
                description: "Sol à forte teneur en éléments fins, surtout d'argile,\
                  \ ou sol exigeant un grand effort de traction et donc difficile\
                  \ à travailler. Voir aussi texture fine."
              zone soil:
                title: sol meuble
                description: "Sol poreux et très tendre et très friable n'ayant aucune\
                  \ propension au durcissement ni à l'affermissement."
              mineral (soil ):
                title: sol minéral
                description: "Sol formé surtout de matières minérales, celles-ci déterminant\
                  \ en grande partie ses propriétés. Ces sols contiennent moins de\
                  \ 17% de carbone organique, à l'exception de l'horizon organique\
                  \ de surface qui peut atteindre une épaisseur de 40 cm (16 po) de\
                  \ tourbes mixtes (densité apparente 0,1 ou plus) ou de 60 cm (24\
                  \ po) de tourbe de mousses fibrique (densité apparente inférieure\
                  \ à 0,1)."
              neutral soil:
                title: sol neutre
                description: "Sol dans lequel la couche de surface ou couche de labour,\
                  \ n'est ni acide ni alcaline. Voir aussi sol acide / sol alcalin\
                  \ / pH du sol et réaction du sol."
              plastic soil:
                title: sol plastique
                description: "Sol que l'on peut mouler ou déformer continuellement\
                  \ et de façon permanente, pour lui donner diverses formes, en exerçant\
                  \ une pression modérée. Voir aussi consistance."
              productive soil:
                title: sol productif
                description: Sol ayant des propriétés physiques, chimiques et biologiques
                  favorables à la production économique de cultures adaptées à une
                  région donnée.
              residual soil:
                title: sol résiduel
                description: "Sol reposant sur de la roche consolidée de la même espèce\
                  \ que celle dont il s'est formé, et située au même endroit."
              saline soil:
                title: sol salin
                description: "Sol non alcalin, contenant suffisamment de sels solubles\
                  \ pour nuire à la croissance de la plupart des plantes cultivées.\
                  \ La conductivité de l'extrait de saturation est supérieure à 4\
                  \ mmhos/cm, le pourcentage de sodium échangeable est inférieur à\
                  \ 15 et le pH est généralement inférieur à 8,5."
              saline alkali soil:
                title: sol salin à alcalis
                description: "(1) Sol contenant suffisamment de sodium échangeable\
                  \ pour nuire à la croissance de la plupart des plantes cultivées,\
                  \ et contenant des quantités appréciables de sels solubles. Le pourcentage\
                  \ de sodium échangeable est supérieur à 15, la conductivité de l'extrait\
                  \ de saturation est supérieur à 4 mmhos/com à 25°C, et le pH du\
                  \ sol saturé est généralement égal ou inférieur à 8,5. (2) Un sol\
                  \ salin à alcalis réunit des quantités dangereuses de sels soit\
                  \ à une forte alcalinité ou à un taux élévé de sodium échangeable,\
                  \ soit aux deux, répartis dans le sol de façon que la croissance\
                  \ de la plupart des plantes cultivées en soit réduite. Également\
                  \ appelé sol salin sodique."
              ovendry soil:
                title: sol séché à l&#39;étuve
                description: "Sol séché à 105°C jusqu'à ce qu'il ait atteint un poids\
                  \ constant."
              sodic soil:
                title: sol sodique
                description: (1) Sol contenant assez de sodium pour nire à la croissance
                  de la plupart des plantes cultivées. (2) Sol dont le pourcentage
                  en sodium échangeable est égal ou supérieur à 15.
              solodized soil:
                title: sol solodisé
                description: "Sol soumis aux processus qm entraînent la formation\
                  \ d'un solod, et ayant au moins certaines caractéristiques d'un\
                  \ solod."
              peat soil:
                title: sol tourbeux
                description: Sol organique légèrement ou non décomposé.
              zonal soil:
                title: sol zonal
                description: "Tout grand groupe de sols à caractères bien évolués\
                  \ et révélateurs de l'influence zonal du climat et des organismes\
                  \ vivants (surtout de la végétation) en tant que facteurs actifs\
                  \ dans la genèse des sols. Le grand groupe zonal de sols est la\
                  \ désignation d'un taxon désuet aujourd'hui, semblable à ce concept\
                  \ du système canadien actuel dénommé la grand groupe; par exemple\
                  \ le luvisol brun gris."
              Solod:
                title: solod
                description: "Grand groupe de sols de l'ordre solonetzique, que l'on\
                  \ rencontre surtout dans les régions de prairie et de parc. Ces\
                  \ sols ont un horizon de surface (Ah) de couleur foncée; un horizon\
                  \ éluvial (Ahe ou Ae) marqué d'une épaisseur d'au moins 5 cm (2\
                  \ po), un horizon de transition (AB) marqué qui se brise facilement\
                  \ en agrégats polyédriques, ainsi qu'un horizon B à taches foncées\
                  \ (Bnt) sur un horizon C salin et généralement calcaire."
              Solonetz:
                title: zone de sols
                description: "Région dans laquelle les sols dominants c'est-à-dire\
                  \ zonaux révèlent l'influence zonal du climat et de la végétation\
                  \ et réunis à d'autres sols qui ne présentent que peu ou pas de\
                  \ caractères zonaux forment un ensemble naturel de terres. La zone\
                  \ de sols n'est pas une unité taxonomique reconnue mais on s'en\
                  \ sert parfois comme unité cartographique."
              Solonetzic:
                title: solonetzique
                description: "Ordre de sols formés généralement sous végétation de\
                  \ prairie ou de prairie-parc dans un climat semi-aride ou subhumide.\
                  \ Ces sols ont un horizon B solonetzique (Bnt ou Bn) taché, de couleur\
                  \ brunâtre, et un horizon C salin. L'horizon de surface peut être\
                  \ constitué d'un ou de plusieurs des horizons Ap, Ah ou Ae. L'ordre\
                  \ solonetzique comprend les grands groupes des solonetz, des solonetz\
                  \ solodisés et des solods."
              forest soils:
                title: sols forestiers
                description: (1) Sol formé sous végétation forestière. (2) (Sens européen)
                  Sol formé en climat tempéré sous végétation forestière.
              phytogenic soils (Obsolete):
                title: sols phytogéniques sols phytogènes
                description: "(désuet) Sol formé sous l'influence dominante de la\
                  \ végétation naturelle, surtout dans les régions tempérées."
              phytomorphic soils:
                title: sols phytomorphes
                description: "Sol bien drainé d'une association, qui s'est formé sous\
                  \ l'influence dominante de la végétation naturelle, caractéristique\
                  \ d'une région. Sol zonal d'une région."
              thermogenic soils:
                title: sols thermogénétiques
                description: Sol dont les propriétés ont été in fluencées principalement
                  par de hautes températures du sol comme facteur dominant dans sa
                  formation; ces sols se sont développés dans les régions subtropicales
                  et équatoriales.
              frost heave:
                title: soulèvement par le gel
                description: "Soulèvement d'une surface provoqué par la glace contenue\
                  \ dans le sol sous-jacent."
              subgroup, soil:
                title: sous groupe de sols
                description: Catégorie de la classification canadienne des sols. Les
                  sous-groupes sont une subdivision des grands groupes et définissent
                  plus spécifiquement chacun des sols.
              subsoiling:
                title: sous-soleuse
                description: "Instrument aratoire muni d'un ou de plusieurs étançons\
                  \ de type cultivateur auxquels sont fixées des lames résistantes\
                  \ servant à briser ou à ameublir les couches dures et compactes,\
                  \ généralement en sous-sol, à des profondeurs supérieures à la profondeur\
                  \ normale de labour."
              stabilization (soil):
                title: stabilisation du sol
                description: "Traitement chimique ou mécanique servant à augmenter\
                  \ ou à maintenir la stabilité d'une masse de sol ou à améliorer\
                  \ ses qualités techniques."
              frost action:
                title: station
                description: "(1) En écologie, région décrite ou définie par ses conditions\
                  \ biotiques et climatiques, ainsi que par l'état du sol, en ce qui\
                  \ a trait à sa capacité de porter de la végétation. (2) Région dont\
                  \ les conditions biotiques et climatiques, ainsi que l'état du sol,\
                  \ sont assez uniformes pour produire une végétation particulière."
              sterilization:
                title: stérilisation
                description: Action de rendre stérile, élimination de toute forme
                  de vie.
              partial sterilization:
                title: stérilisation partielle
                description: "Destruction d'une partie d'une population de micro-organismes,\
                  \ généralement sous l'action d'un traitement chimique ou thermique.\
                  \ Le traitement est sélectif et certains organismes ou groupes d'organismes\
                  \ sont plus touchés que d'autres."
              stratification:
                title: stratification
                description: "Disposition des sédiments en couches ou strates séparées\
                  \ par un changement de couleurs, de texture, de dimensions des particules\
                  \ et de composition. La stratification sous-entend généralement\
                  \ que les couches de sédiments se détachent facillement sur les\
                  \ plans de stratification à cause de la taille et le genre de matériaux\
                  \ ou une certaine interruption dans la déposition qui a permis des\
                  \ changements avan le dépôt d'autres substances."
              stress:
                title: stress
                description: Force directionnelle exeçant une action dans un matériau
                  quelconque.
              single-grain structure:
                title: structure du sol
                description: "Combinaison ou disposition des particules primaires\
                  \ du sol en particules, unité ou agrégats secondaires appelés peds.\
                  \ Ces peds peuvent être, encore qu'exceptionnellement, disposés\
                  \ dans le profil de manière à lui donner une forme caractéristique.\
                  \ Les peds sont classés suivant la taille, la forme et la netteté.\
                  \ Voir aussi classes structura-les du sol, degrés d'agrégation du\
                  \ sol et structure du sol. Ceux-ci sont définis et présentés sous\
                  \ forme de tableau à la rubrique structure du sol ( Tableau 3 )."
              lattice structure:
                title: structure particulaire
                description: "Structure du sol dans laquelle les particules sont pratiquement\
                  \ toutes individuelles ou primaires; les particules secondaires\
                  \ et les agrégats ne sont que rarement présents. Cette structure\
                  \ ne se trouve qu'en sol de texture extrêmement grossière."
              isomorphous substitution:
                title: substitution isomorphe
                description: "Dans un réseau cristallin, substitution d'un atome par\
                  \ un autre de même taille, sans briser ni modifier la structure\
                  \ cristalline du minéral."
              substrate:
                title: substrat
                description: "(1) Matériau déposé ou s'étendant sous un autre; couche\
                  \ sous-jacente, comme le sous sol. (2) Substance milieu ou élément\
                  \ nutritif sur lequel croît un organisme. (3) Composés ou substances\
                  \ qui, sous l'action d'enzymes ou de catalyseurs, forment d'autres\
                  \ composés au cours de réactions chimiques."
              loose:
                title: suintement
                description: "(1) Écoulement de l'eau vers les profondeurs du sol.\
                  \ (2) Échappement de l'eau du sol sur une très grande surface, à\
                  \ la différence de la résurgence qui jaillit d'un point précis."
              sulfofication (Obsolete):
                title: sulfofication (Obsolete)
                description: (désuet) Oxydation biologique du sou-fre et des composés
                  sulfurés du sol.
              piezometric surface:
                title: surface piézométrique
                description: "Niveau auquel l'eau se maintient dans une série de piézomètres."
              symbiosis:
                title: symbiose
                description: Association intime de deux organismes dissemblables,
                  vivant ensemble de façon à se fournir des avantages réciproques.
              synergism:
                title: synergie
                description: "Capacité de deux ou de plusieurs organismes d'effectuer\
                  \ des transformations (généralement chimiques) qu'ils ne peuvent\
                  \ accomplir isolément."
              auger (soil):
                title: tarière
                description: "Un appareil qui sert à faire des forages dans le sol\
                  \ pour en extraire de petits échantillons pour fins d'observation\
                  \ sur le terrain ou en laboratoire. Les tarières peuvent être munies\
                  \ de forets de formes diverses qui permettent d'extraire du sol\
                  \ des échantillons de couches ou de niveaux déterminés."
              urban land:
                title: terrain urbain
                description: "Terrain que les construction et travaux urbains ont\
                  \ modifié ou dérangé à un point tel que l'identification des sols\
                  \ est impossible. Type the terrains divers."
              terrace:
                title: terrasse
                description: Plaine généralement étroite presque plate bordant une
                  rivière, un lac ou une mer. Les rivières sont parfois bordées de
                  plusieurs terrasses à des niveaux différent. ll existe également
                  des terrasses artificielles.
              fine earth:
                title: terre fine
                description: "Fraction de sol minéral composée de particules d'un\
                  \ diamètre de moins de 2 mm."
              coprogenous earth:
                title: terre coprogène
                description: "Matériau de certains sols organiques, contenant au moins\
                  \ 50% en volume de granules de matières fécales d'un diamètre inférieur\
                  \ à 0.5 mm."
              diatomaceous earth:
                title: terre de diatomées
                description: "Dépôt d'un matériau silliceux terreux, grisâtre, à structure\
                  \ fine, constitué principalement ou entièrement de débris de diatomées.\
                  \ On le rencontre dans la nature sous forme de corps pulvérulent,\
                  \ ou poreux et rigide. Voir aussi diatomées."
              fine texture:
                title: texture fine
                description: "Constituée en tout ou en partie de grandes quantités\
                  \ de fractions fines, surtout de limon et d'argile. Comprend toutes\
                  \ les classes de texture du loam argileux et de l'argile : loam\
                  \ argileux, loam sablo-argileux, loam limono-argileux, argile sableuse,\
                  \ argile limoneuse, argile et argile lourde. Se subdivise parfois\
                  \ en texture très fine et en texture modérément fine. Voir aussi\
                  \ texture du sol."
              coarse texture:
                title: texture grossière
                description: "Texture des sables, des sables loameux et des loams\
                  \ sableux, à l'exception des loams sableux très fins. Sol contenant\
                  \ de grandes quantités de matériaux de ces classes texturales. Voir\
                  \ aussi sable, sableux et texture modérément grossière."
              moderately fine texture:
                title: texture modérément fine
                description: Texture formée surtout de particules de calibre moyen
                  et renfermant ou non de faibles quantités de particules fines ou
                  grossières. Dans la classification granulométrique des sols, elle
                  comprend le loam argileux, le loam sablo-argileux et le loam limono-argileux.
                  Voir aussi texture fine.
              moderately coarse texture:
                title: texture modérément grossière
                description: "Texture formée surtout d'éléments grossiers. Dans la\
                  \ classification granulométrique des sols elle comprend tous les\
                  \ loams sableux à l'exception du loam sableux très fin. Voir aussi\
                  \ texture grossière."
              medium texture:
                title: texture moyenne
                description: 'Texture intermédiaire entre la texture fine et la texture
                  grossière des sols. Comprend les classes de texture suivantes: loam
                  sableux très fin, loam, loam limoneux et limon.'
              thermophile:
                title: thermophile
                description: Organisme dont la croissance est favorisée à des température
                  égales ou supérieures à 50°C.
              thermosequence:
                title: thermoséquence
                description: "Succession de sols apparentés qui diffèrent l'un de\
                  \ l'autre principalement par suite des variantes de température,\
                  \ considérées comme facteur de formation du sol."
              till:
                title: till
                description: "Dépôt glaciaire (drift) non stratifié, laissé directement\
                  \ par la glace et consistant en argile, sable, gravier et blocs\
                  \ rocheux mélangés dans n'importe quelle proportion."
              till  (to):
                title: till d&#39;ablation
                description: Dépôt superficiel de till glaciaire meuble / perméable
                  / légèrement stratifié / sableux et pierreux / reposant sur un till
                  plus dense.
              glacial till:
                title: till glaciaire
                description: Voir till.
              toposequence:
                title: toposéquence
                description: "Succession de sols apparentés qui diffèrent l'un de\
                  \ l'autre surtout par leur topographie considérée comme facteur\
                  \ de formation du sol. Voir clinoséquence."
              tundra:
                title: toundra
                description: "Plaine plate ou ondulante dénuée d'arbres caractéristique\
                  \ des régions arctiques."
              peat:
                title: tourbe
                description: Matériau du sol non consolidé formé en grande partie
                  de matières organiques non décomposées ou légèrement décomposées.
              bog:
                title: tourbière
                description: "Terrain imbibé d'eau de façon permanente et de faible\
                  \ portance."
              tillage:
                title: travail du sol
                description: "Labour et entretien du sol pour l'amélioration de ses\
                  \ propiétés agricoles."
              truncated:
                title: tronqué
                description: "Se dit d'un sol qui a perdu totalement ou partiellement\
                  \ un ou plusieurs de ses horizons supérieurs."
              tuff:
                title: tuf
                description: Cendres volcaniques généralement plus ou moins stratifiés
                  et en divers états de consolidation.
              land type:
                title: type de terrain
                description: Voir association de sols.
              symmetry value:
                title: valeur symétrique
                description: "Pourcentage d'ions adsorbés qui sont libérés lorsqu'on\
                  \ ajoute une concentration symétrique d'un autre ion. Voir aussi\
                  \ concentration symétrique."
              varve:
                title: varve
                description: "Bande distincte représentant le dépôt annuel de sédiments\
                  \ indépendamment de leur origine. Généralement constituée de deux\
                  \ couches, l'une épaisse, de couleur claire, formée de limon et\
                  \ de sable fin déposés au printemps et en été, l'autre mince, de\
                  \ couleur foncée, formée d'argile déposée en automne et en hiver.\
                  \ Vu l'effet retardant des basses températures sur la sédimentation\
                  \ de l'argile, on croit que la formation des varves ne peut se produire\
                  \ qu'en eaux glaciaires. Les sels de l'eau de mer empêchent la formation\
                  \ de varves de ce genre. Les électrolytes de l'eau de mer causent\
                  \ la floculation, qui provoque la formation d'une masse homogène."
              halophytic vegetation:
                title: végétation halophile
                description: Végétation qui croît naturellement sur des sols à forte
                  teneur en divers sels. Les plantes de ce type ont généralement des
                  feuilles charnues ou des épines, et ressemblent aux plantes des
                  déserts.
              macroscopic velocity:
                title: vélocité macroscopique
                description: "Voir vitesse d'écoulement."
              flow velocity:
                title: vitesse d&#39;éoulement, débit
                description: "Volume de l'eau transférée par unité de temps et unité\
                  \ de surface dans la direction du mouvement d'ensemble de l'eau\
                  \ dans le sol."
              xerophytes:
                title: xérophytes
                description: Plantes qui crossent sur des sols ou des matériaux du
                  sol extrêmement secs.
