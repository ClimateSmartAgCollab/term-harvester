id: https://term-harvester.example.org/synonymy-scale
name: SynonymyScale
description: >-
  Rating-scale synonym clusters for intermediate label generation in term_harvester.
  Each enum is one semantic dimension ordered negative to positive. The permissible_value
  key is the canonical (preferred) label; aliases on each PV are synonyms used for
  dimension detection via case-insensitive substring matching against anchor labels.
  Enum-level aliases are true thesaurus synonyms of the dimension name itself.
  is_midpoint: "true" marks the neutral central position.
  Users may extend this file with additional dimensions; updates here take effect
  immediately without code changes.

enums:

  QualityPerformanceScale:
    description: General quality or performance, from unsatisfactory to excellent.
    aliases:
      - quality
      - performance
      - rating
      - grade
      - standard
    permissible_values:
      Unsatisfactory:
        description: Negative extreme
        aliases:
          - unacceptable
          - poor quality
          - inadequate
          - deficient
          - failing
          - very poor
          - very bad
      Poor:
        aliases:
          - bad
          - substandard
          - below par
          - weak
      Fair:
        aliases:
          - below average
          - mediocre
          - passable
          - marginal
      Acceptable:
        description: Neutral midpoint
        annotations:
          is_midpoint: "true"
        aliases:
          - adequate
          - average
          - satisfactory
          - ok
          - okay
          - neutral
          - sufficient
      Good:
        aliases:
          - above average
          - decent
          - solid
          - sound
      Very Good:
        aliases:
          - great
          - notable
          - commendable
          - impressive
      Excellent:
        description: Positive extreme
        aliases:
          - outstanding
          - exceptional
          - superb
          - exemplary
          - distinguished

