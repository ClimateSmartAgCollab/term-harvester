http://rs.tdwg.org/dwc/terms/projectID:
  cs:
    comments: ''
    description: Seznam (spojený a oddělený) identifikátorů projektů, které přispěly
      k dwc:Event.
    label: ID Projektu
  es:
    comments: Un projectID puede compartirse entre varios conjuntos de datos distintos.
      La naturaleza de dicha asociación puede describirse en el elemento de metadatos
      correspondiente a la descripción del proyecto. Este campo debe utilizarse para
      proporcionar un identificador único global (GUID) del proyecto, si se dispone
      de él. Puede tratarse de un DOI, un URI o cualquier otro identificador persistente
      que permita distinguir el proyecto de forma unívoca frente a otros. La práctica
      recomendada consiste en separar los valores de una lista mediante la secuencia
      espacio-barra vertical-espacio (` | `).
    description: Una lista (concatenada y separada) de identificadores de proyectos
      que contribuyeron a un dwc:Event.
    label: Identificación del Proyecto
  fr:
    comments: ''
    description: "Une liste (concaténée et séparée) d'identifiants pour les projets\
