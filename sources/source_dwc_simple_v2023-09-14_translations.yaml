    label: Примечания к событию
  zh:
    comments: ''
    description: 可註記天氣或調查狀況等任何文字資訊。
    label: 調查活動註記
http://rs.tdwg.org/dwc/terms/eventTime:
  cs:
    comments: Doporučeným osvědčeným postupem je používat denní dobu, která odpovídá
      normě ISO 8601-1:2019.
    description: Čas nebo interval, během kterého došlo k události dwc:Event.
    label: Čas události
  es:
    comments: La práctica recomendada es utilizar una fecha en el esquema de codificación
      ISO 8601.
    description: La hora o el intervalo de horas en la cual se produjo el evento (dwc:Event).
    label: Hora del evento
  fr:
    comments: "La pratique optimale recommandée est d'utiliser une heure conforme\
      \ à la norme ISO 8601-1:2019."
    description: "Le moment ou l'intervalle de temps pendant lequel un dwc:Event s'est\
      \ produit."
    label: "Heure de l'événement"
  ru:
    comments: Рекомендуемой практикой является использование времени суток, соответствующего
