http://rs.tdwg.org/dwc/terms/feedbackURL:
  cs:
    comments: Doporučeným osvědčeným postupem je volitelně zahrnout řetězce dotazů,
      které slouží k předvyplnění prvků formuláře webové stránky a sdělují kontext.
    description: Unifikovaný lokátor zdroje (URL), který odkazuje na webovou stránku,
      na níž lze odeslat formulář pro získání zpětné vazby k záznamu.
    label: URL pro zpětnou vazbu
  es:
    comments: La mejor práctica recomendada es incluir opcionalmente cadenas de consulta
      que actúen para rellenar previamente los elementos del formulario de la página
      web y comunicar el contexto.
    description: Un localizador uniforme de recursos (URL) que apunta a una página
      web en la que se puede enviar un formulario para recopilar comentarios sobre
      el registro.
    label: URL de comentarios
  fr:
    comments: "La pratique optimale recommandée est d'inclure facultativement des\
      \ éléments de requête qui servent à pré-remplir les éléments du formulaire de\
      \ la page web et à communiquer le contexte."
    description: "Un localisateur de ressources uniforme (URL) qui pointe vers une\
      \ page web sur laquelle un formulaire peut être soumis pour recueillir des commentaires\
      \ sur l'enregistrement."
    label: "URL du Retour d'Information"
  ru:
    comments: Рекомендуется включать в состав Url строку запроса, которая позволит
      заполнить веб страницу элементами, передающими контекст.
    description: Унифицированный указатель ресурса (URL), ведущий на веб-страницу
      с формой для сбора отзывов о записи.
    label: URL для обратной связи
http://rs.tdwg.org/dwc/terms/fieldNotes:
  cs:
    comments: Tento termín má ekvivalent ve jmenném prostoru dwciri:, který jako hodnotu
      umožňuje pouze IRI, zatímco tento termín umožňuje zadat jakoukoli řetězcovou
      literální hodnotu.
    description: 'Jeden z těchto údajů: a) indikátor existence, b) odkaz na (publikace,
      URI) nebo c) text poznámek pořízených v terénu o dwc:Event.'
    label: Poznámky z terénu
  es:
    comments: 'Este elemento tiene un equivalente en el dwciri: namespace que permite
      solamente un IRI como valor, mientras que este elemento permite cualquier cadena
      de texto libre.'
    description: Un indicador sobre la existencia o referencia (publicación URI) a
      las notas de campo; o el texto de las notas tomadas en campo sobre el evento
      (dwc:Event).
    label: Notas de campo
  fr:
    comments: "Ce terme a un équivalent dans le dwciri: namespace qui n'autorise qu'une\
      \ IRI comme valeur, alors que ce terme autorise n'importe quelle valeur sous\
      \ forme de chaîne de caractères."
    description: "L'un des éléments suivants : a) un indicateur de l'existence de,\
      \ b) une référence à (publication, URI), ou c) les notes prises sur le terrain\
      \ concernant le dwc:Event."
    label: Notes de terrain
  ru:
    comments: Этот термин имеет эквивалент в пространстве имён dwciri:, который допускает
      только IRI в качестве значения, в то время как данный термин допускает использование
      любой строки в качестве литерала.
    description: 'Один из следующих вариантов: а) указание на существование, б) ссылка
      (публикация, URI) или в) текст заметок, сделанных в полевых условиях о dwc:Event.'
    label: Полевые заметки
  zh:
    comments: ''
    description: ''
    label: 野外調查註記
http://rs.tdwg.org/dwc/terms/fieldNumber:
