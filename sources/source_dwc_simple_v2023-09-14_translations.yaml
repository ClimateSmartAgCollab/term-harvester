http://purl.org/dc/elements/1.1/language:
  cs:
    comments: Doporučeným osvědčeným postupem je použití řízeného slovníku, například
      RFC 5646. Tento termín má ekvivalent ve jmenném prostoru dcterms:, který umožňuje
      jako hodnotu pouze IRI, zatímco tento termín umožňuje jakoukoli řetězcovou literální
      hodnotu.
    description: Jazyk zdroje.
    label: Jazyk
  es:
    comments: Buena práctica recomendada es usar un vocabulario controlado como RFC
      5646. Este término tiene una equivalencia en el dcterms:namespace que permite
      solo un IRI como valor, mientras que este término permite cualquier valor de
      literal de string.
    description: Un idioma del recurso.
    label: Idioma
  fr:
    comments: "La pratique optimale recommandée est d'utiliser un vocabulaire contrôlé\
      \ tel que RFC 5646. Ce terme a un équivalent dans le dcterms: namespace qui\
      \ n'autorise qu'un IRI comme valeur, alors que ce terme autorise n'importe quelle\
      \ valeur sous forme de chaîne de caractères."
    description: Une langue de la ressource.
    label: Langue
  ru:
    comments: Рекомендуется применять контролируемый словарь, например, RFC 5646.
      У этого термина есть эквивалент в пространстве имен dcterms:, разрешающий только
      значения в формате IRI, тогда как данный термин принимает любое строковое значение.
    description: Язык ресурса.
    label: Язык
http://purl.org/dc/elements/1.1/type:
  cs:
    comments: Musí být vyplněn hodnotou ze slovníku typů DCMI (https://www.dublincore.org/specifications/dublin-core/dcmi-type-vocabulary/2010-10-11/).
    description: Povaha nebo druh zdroje.
    label: Typ
  es:
    comments: Debe completarse con un valor del vocabulario de tipo DCMI (https://www.dublincore.org/specifications/dublin-core/dcmi-type-vocabulary/2010-10-11/).
    description: La naturaleza o género del recurso.
    label: Tipo
  fr:
    comments: Doit être rempli avec une valeur issue du vocabulaire DCMI type (https://www.dublincore.org/specifications/dublin-core/dcmi-type-vocabulary/2010-10-11/).
    description: La nature ou le genre de la ressource.
    label: Type
  ru:
    comments: Должен быть заполнен значением из словаря типов DCMI (https://www.dublincore.org/specifications/dublin-core/dcmi-type-vocabulary/2010-10-11/).
    description: Характер или жанр ресурса.
    label: Тип
http://purl.org/dc/terms/accessRights:
  cs:
    comments: Přístupová práva mohou zahrnovat informace týkající se přístupu nebo
      omezení na základě zásad ochrany osobních údajů, bezpečnosti nebo jiných zásad.
    description: Informace o tom, kdo má ke zdroji přístup, nebo údaj o jeho stavu
      zabezpečení.
    label: Přístupová práva
  es:
    comments: Derechos de Acceso puede incluir información acerca del acceso o restricciones
      basadas en privacidad, seguridad u otras políticas.
    description: Información sobre quién puede acceder al recurso o una indicación
      de su estado de seguridad.
    label: Derechos de Acceso
  fr:
    comments: "Les droits d'accès peuvent inclure des informations concernant l'accès\
      \ ou les restrictions basées sur la confidentialité, la sécurité ou d'autres\
      \ politiques."
    description: Informations sur les personnes autorisées à accéder à la ressource
      ou indication de son statut de sécurité.
    label: "Droits d'accès"
  ru:
    comments: Права доступа могут включать информацию о доступе или ограничениях,
      основанных на конфиденциальности, безопасности или иных правилах (политиках).
    description: Информация о правах доступа к ресурсу или указание его уровня защищённости.
    label: Права доступа
http://purl.org/dc/terms/bibliographicCitation:
  cs:
    comments: 'Dublin Core: „Doporučeným postupem je uvést dostatečné bibliografické
      údaje, aby bylo možné zdroj co nejjednoznačněji identifikovat.“ Záměrem použití
      tohoto termínu v Darwin Core je poskytnout preferovaný způsob citování samotného
      zdroje - „jak citovat tento záznam“. Všimněte si, že zamýšleným použitím dcterms:references
      v Darwin Core je naopak poukázat na definitivní reprezentaci zdroje - „kde najít
      co nejbližší originální odkaz“, pokud je k dispozici.'
    description: Bibliografický odkaz na zdroj.
    label: Bibliografická citace
  es:
    comments: 'Desde Dublin Core, "Práctica recomendada es incluir suficientes detalles
      biobliográficos para identificar el recurso evitando toda posible ambiguedad"
      [traducción libre]. El uso previsto de este término en Darwin Core es proveer
      la forma preferente para citar lo recursos en sí mismos - "cómo citar este registro".
      Notar que el uso previsto de dcterms:references en Darwin Core, en contraste,
      es para señalar la definitiva representación de la fuente del recurso - "dónde
      encontrar la referencia más cercana a la original", si ésta está disponible.'
    description: Una referencia bibliográfica del recurso.
    label: Citación Bibliográfica
  fr:
    comments: "D'après le Dublin Core, « la pratique recommandée est d'inclure suffisamment\
      \ de détails bibliographiques pour identifier la ressource de la manière la\
      \ moins ambiguë possible ». L'usage prévu de ce terme dans le Darwin Core est\
      \ de fournir la méthode privilégiée pour citer la ressource elle-même - « comment\
      \ citer cet enregistrement ». Notez que l'usage prévu de dcterms:references\
      \ dans le Darwin Core, par contre, est de pointer vers la représentation de\
      \ la source définitive de la ressource - « où trouver la référence la plus proche\
      \ de l'original », s'il y en a une."
    description: Une référence bibliographique pour la ressource.
    label: Référence Bibliographique
  ru:
    comments: 'Цитата из Dublin Core: «Рекомендуемой практикой является включение
      достаточных библиографических подробностей для максимально однозначной идентификации
      ресурса». Предполагаемое использование данного термина в Darwin Core — предоставить
      предпочтительный способ цитирования самого ресурса — «как процитировать данный
      ресурс». Обратите внимание, что в отличие от этого, предполагаемое использование
      термина dcterms:references в Darwin Core — указать на ресурс-первоисточник "где
      найти, так близко к оригинальной ссылке, как это только возможно", если таковая
      доступна.'
    description: Библиографическое описание ссылки на ресурс.
    label: Библиографическая ссылка
http://purl.org/dc/terms/license:
  cs:
    comments: ''
    description: Právní dokument, který dává úřední povolení k určité činnosti se
      zdrojem.
    label: Licence
  es:
    comments: ''
    description: Un documento legal dando permiso oficial para hacer algo con el recurso.
    label: Licencia
  fr:
    comments: ''
    description: "Document juridique donnant l'autorisation officielle de faire quelque\
      \ chose avec la ressource."
    label: Licence
  ru:
    comments: ''
    description: Правовой документ, дающий официальное разрешение на совершение определённых
      действий с ресурсом.
    label: Лицензия
http://purl.org/dc/terms/modified:
  cs:
    comments: Doporučeným osvědčeným postupem je používat datum, které je v souladu
      s normou ISO 8601-1:2019.
    description: Datum, kdy byl zdroj změněn.
    label: Datum změny
  es:
    comments: Buena práctica recomendad es usar una fecha conforme con ISO 8601-1:2019.
    description: Fecha en la que se modificó el recurso.
    label: Fecha de modificación
  fr:
    comments: "La pratique optimale recommandée est d'utiliser une date conforme à\
      \ la norme ISO 8601-1:2019."
    description: Date à laquelle la ressource a été modifiée.
    label: Date de Modification
  ru:
    comments: Рекомендуется использовать дату в формате, соответствующем стандарту
      ISO 8601-1:2019.
    description: Дата изменения ресурса.
    label: Дата изменения
http://purl.org/dc/terms/references:
  cs:
    comments: ''
    description: Související zdroj, na který popisovaný zdroj odkazuje, který je citován
      nebo na který jinak odkazuje.
    label: Odkazy
  es:
    comments: 'Según Dublin Core: "Esta propiedad está destinada a utilizarse con
      valores no literales. Es la propiedad inversa de Is Referenced By". El uso previsto
      de este término en Darwin Core es señalar la representación de la fuente definitiva
      del recurso (p. ej., dwc:Taxon, dwc:Occurrence, dwc:Event), si existe alguna
      disponible. Cabe señalar que, por el contrario, el uso previsto de dcterms:bibliographicCitation
      en Darwin Core es proporcionar la forma preferente de citar el propio recurso.'
    description: Un recurso relacionado que es referenciado, citado o señalado de
      alguna forma por el recurso descrito.
    label: Referencias
  fr:
    comments: ''
    description: "Une ressource apparentée qui est référencée, citée ou pointée d'une\
      \ autre manière par la ressource décrite."
    label: Références
  ru:
    comments: ''
    description: Ресурс, имеющий отношение к описываемому ресурсу, на который ссылается,
      который цитируется или на который иным образом указывает описываемый ресурс.
    label: Ссылки
http://purl.org/dc/terms/rightsHolder:
  cs:
    comments: ''
    description: Osoba nebo organizace, která vlastní nebo spravuje práva k danému
      zdroji.
    label: Držitel práv
  es:
    comments: ''
    description: Una persona u organización dueña o gerente de derechos sobre el recurso.
    label: Titular de Derechos
  fr:
    comments: ''
    description: Personne ou organisation possédant ou gérant des droits sur la ressource.
    label: Titulaire des Droits
  ru:
    comments: ''
    description: Физическое или юридическое лицо, обладающее правами на ресурс или
      управляющее ими.
    label: Правообладатель
http://rs.tdwg.org/ac/terms/fundingAttribution:
  cs:
    comments: ''
    description: Textový popis organizací nebo jednotlivců, kteří financovali vytvoření
      zdroje.
    label: Přidělení finančních prostředků
  es:
    comments: Indique el nombre oficial completo del organismo financiador. Debe incluirse
      el nombre íntegro, sin abreviaturas, a menos que la abreviatura sea una forma
      oficial y comúnmente reconocida (por ejemplo, NSF para la National Science Foundation).
      La práctica recomendada consiste en separar los valores de la lista mediante
      un espacio, una barra vertical y otro espacio (` | `).
    description: Descripción textual de las organizaciones o personas que financiaron
      la creación del recurso.
    label: Atribución de Financiamiento
  fr:
    comments: ''
    description: Description textuelle des organisations ou des personnes qui ont
      financé la création de la ressource.
    label: Source du Financement
http://rs.tdwg.org/dwc/terms/acceptedNameUsage:
  cs:
    comments: Úplný vědecký název s údaji o autorství a datu, pokud jsou známy, přijatého
      (botanického) nebo platného (zoologického) názvu v případech, kdy je uvedený
      dwc:scientificName považován odkazem uvedeným ve vlastnosti dwc:nameaccordingTo
      nebo poskytovatelem obsahu za synonymum nebo nesprávně použitý název. Při použití
      pro dwc:Organism nebo dwc:Occurrence by měl být tento termín použit v případech,
      kdy poskytovatel obsahu považuje poskytnutý dwc:scientificName za neslučitelný
      s taxonomickým pohledem poskytovatele obsahu. Například v rámci sbírek exemplářů
      a datových sad pozorování existuje mnoho rozporů mezi zaznamenaným názvem (např.
      nejnovější identifikací od odborníka, který zkoumal exemplář, nebo terénní identifikací
      pozorovaného dwc:Organism) a názvem, o kterém poskytovatel obsahu tvrdí, že
      je taxonomicky přijatelný.
    description: Úplný název aktuálně platného (zoologického) nebo přijatého (botanického)
      dwc:Taxon s uvedením autorství a data, pokud je známo.
    label: Užití přijatého názvu
  es:
    comments: El nombre científico completo, con información sobre la autoría y la
      fecha si se conoce, del nombre aceptado (botánico) o válido (zoológico) en los
      casos en que el dwc:scientificName proporcionado se considera, por la referencia
      indicada en la propiedad dwc:nameAccordingTo, o del proveedor de contenido,
      un sinónimo o un nombre mal aplicado. Cuando se aplica a un dwc:Organism o dwc:Occurrence,
      este término debe usarse en los casos en que un proveedor de contenido considera
      que el dwc:scientificName proporcionado es inconsistente con la perspectiva
      taxonómica del proveedor de contenido. Por ejemplo, existen muchas discrepancias
      dentro de las colecciones de especímenes y los conjuntos de datos de observación
      entre el nombre registrado (p. ej., la identificación más reciente de un experto
      que examinó un espécimen, o una identificación de campo para un dwc:Organism
      observado) y el nombre que el proveedor de contenido afirma que es taxonómicamente
      aceptado.
    description: El nombre completo, con autoría e información de fecha si se conoce,
      del taxón actualmente válido (zoológico) o aceptado (botánico) dwc:Taxon.
    label: Nombre aceptado en uso
  fr:
    comments: "Le nom scientifique complet, avec les informations sur l'auteur et\
      \ la date si elles sont connues, du nom accepté (botanique) ou valide (zoologie)\
      \ dans les cas où le dwc:scientificName fourni est considéré par la référence\
      \ indiquée dans la propriété dwc:nameAccordingTo, ou par le fournisseur de données\
      \ comme un synonyme ou un nom mal appliqué. Lorsqu'il est appliqué à un dwc:Organism\
      \ ou à une dwc:Occurrence, ce terme doit être utilisé dans les cas où un fournisseur\
      \ de données considère que le dwc:scientificName fourni n'est pas cohérent avec\
      \ l'opinion taxonomique du fournisseur de données. Par exemple, il existe de\
      \ nombreuses divergences dans les collections et les ensembles de données d'observation\
      \ entre le nom indiqué (par exemple, l'identification la plus récente d'un expert\
      \ qui a examiné un spécimen, ou une identification sur le terrain pour un dwc:Organism\
      \ observé) et le nom avancé par le fournisseur de données comme étant valable\
      \ sur le plan taxonomique."
    description: "Le nom complet, avec les informations relatives à l'auteur et à\
      \ la date si elles sont connues, du dwc:Taxon actuellement considéré valide\
      \ (en zoologie) ou accepté (en botanique)."
    label: Usage du nom accepté
  ru:
    comments: Полное научное название, включающее авторство и дату (при их наличии),
      для правильного (ботанического) или валидного (зоологического) названия. Используется
      в ситуациях, когда первоначально предоставленное название таксона в dwc:scientificName
      признаётся источником, ссылка на который указана в dwc:nameAccordingTo, или
      поставщиком данных синонимичным или ошибочно применённым. При использовании
      для dwc:Organism или dwc:Occurrence данный термин следует применять, если поставщик
      данных намерен указать на несоответствие между названием таксона, предоставленным
      dwc:scientificName и своей таксономической трактовкой. Так, в коллекциях образцов
      и наборах данных наблюдений часто фиксируются несовпадения между первоначально
      зафиксированным названием (например, по результатам экспертизы образца или полевого
      определения) и названием, которое поставщик данных считает таксономически корректным.
    description: Полное название, с автором и датой описания, если известны, текущего
      валидного (в зоологии) или правильного (в ботанике) dwc:Taxon.
    label: Правильное (валидное) название
  zh:
    comments: 植物學的接受名或動物學的有效名，包含已知的作者、年代的完整學名字串，用在當參考自 dwc:nameAccordingTo 屬性或內容提供者認為所提供的
      dwc:scientificName 為同物異名或誤拼時。當應用在 dwc:Organism 或 dwc:Occurrence，此詞彙應在內容提供者認為
      dwc:scientificName 與其分類觀點不一致的情況下使用。例如，標本蒐藏和觀測的資料集所記載的學名（最近一次專家對標本的鑑定，或針對 dwc:Organism
      的野外觀測辨認），與內容提供者所認為在分類學上的接受的學名之間，常有許多差異。
    description: 目前有效（動物）或接受（植物）並包含命名作者及年代（若已知）的完整學名。
    label: 有效學名使用
http://rs.tdwg.org/dwc/terms/acceptedNameUsageID:
  cs:
    comments: Tento termín by se měl používat pro synonyma nebo nesprávně použité
      názvy, aby odkazoval na dwc:taxonID záznamu dwc:Taxon, který představuje přijatý
      (botanický) nebo platný (zoologický) název. V případě Darwin Core Archives by
      měl být související záznam přítomen lokálně ve stejném archivu.
    description: Identifikátor pro použití názvu (doložený význam názvu podle zdroje)
      aktuálně platného (zoologického) nebo přijatého (botanického) taxonu.
    label: ID užití přijatého názvu
  es:
    comments: Este término debe usarse para sinónimos o nombres mal aplicados, para
      hacer referencia al dwc:taxonID de un registro dwc:Taxon que representa el nombre
      aceptado (en botánica) o válido (en zoología). En los Archivos Darwin Core,
      el registro relacionado debe estar presente localmente en el mismo archivo.
    description: Un identificador para el nombre científico aceptado en uso (significado
      documentado del nombre según una fuente) del taxón actualmente válido (en zoología)
      o aceptado (en botánica).
    label: ID del Nombre Aceptado en Uso
  fr:
    comments: "Ce terme devrait être utilisé pour les synonymes ou les noms mal appliqués\
      \ pour se référer au dwc:taxonID d'un enregistrement dwc:Taxon qui représente\
      \ le nom accepté (botanique) ou valide (zoologie). Pour les Archives Darwin\
      \ Core, l'enregistrement correspondant doit être présent dans la même archive."
    description: "Un identifiant pour l'usage du nom (signification documentée du\
      \ nom selon une source) du taxon actuellement valide (zoologie) ou accepté (botanique)."
    label: "Identifiant de l'usage du nom accepté"
  ru:
    comments: Данный термин должен использоваться для синонимов или ошибочно применяемых
      названий для ссылки на dwc:taxonID записи dwc:Taxon, которая представляет правильное
      (ботаническое) или валидное (зоологическое) название. Для архивов Darwin Core
      соответствующая запись должна присутствовать локально в том же архиве.
    description: Идентификатор употребления названия (документированного статуса названия
      согласно источнику) для валидного (зоологического) или правильного (ботанического)
      названия таксона.
    label: ID принятого (правильного, валидного) научного названия
  zh:
    comments: 此詞應使用在同物異名或誤拼學名，以指向一分類群記錄的 dwc:taxonID；該分類群代表植物學的接受名或動物學的有效名。在達爾文核心集檔案中，相關的記錄應該包含在檔案本身內部。
    description: 目前動物學有效或植物學接受的學名使用（根據來源所記載的學名涵義）識別碼。
    label: 有效學名使用識別碼
http://rs.tdwg.org/dwc/terms/associatedMedia:
  cs:
    comments: ''
    description: Seznam (spojený a oddělený) identifikátorů (publikace, globální jedinečný
      identifikátor, URI) médií spojených s dwc:Occurrence.
    label: Přidružená média
  es:
    comments: ''
    description: Una lista (concatenada y delimitada) de identificadores (publicación,
      identificador global único, URI) de los contenidos multimedia asociados con
      el registro biológico.
    label: Medios asociados
  fr:
    comments: ''
    description: "Une liste (concaténée et séparée) d'identifiants (publication, identifiant\
      \ unique global (GUI), URI) des médias associés à la dwc:Occurrence."
    label: Média associé
  ru:
    comments: ''
    description: Список (в одной строке, через разделитель) идентификаторов (публикация,
      глобальный уникальный идентификатор, URI) медиаресурсов, связанных с dwc:Occurrence.
    label: Связанные медиаресурсы
  zh:
    comments: ''
    description: '與該筆紀錄相關的多媒體連結，若有多個連結以 "|" 分隔。'
    label: 相關多媒體資訊
http://rs.tdwg.org/dwc/terms/associatedOccurrences:
  cs:
    comments: Tento termín lze použít k poskytnutí seznamu asociací k jiným dwc:Occurrences.
      Všimněte si, že třída dwc:ResourceRelationship je alternativním prostředkem
      pro reprezentaci asociací, a to s většími podrobnostmi. Doporučeným osvědčeným
      postupem je oddělovat hodnoty v seznamu mezerou svislou čarou mezerou (` | `).
    description: Seznam (spojený a oddělený) identifikátorů jiných záznamů dwc:Occurrence
      a jejich asociací k tomuto dwc:Occurrence.
    label: Související výskyty
  es:
    comments: Este término puede utilizarse para proporcionar una lista de asociaciones
      con otros dwc:Occurrences. Cabe señalar que la clase dwc:ResourceRelationship
      es una alternativa para representar asociaciones, y permite incluir más detalle.
      La práctica recomendada es separar los valores en la lista con espacio barra
      vertical espacio (` | `).
    description: Una lista (concatenada y delimitada) de identificadores para otros
      registros dwc:Occurrence y sus asociaciones con este dwc:Occurrence.
    label: Registros asociados
  fr:
    comments: "Ce terme peut être utilisé pour fournir une liste d'associations avec\
      \ d'autres dwc:Occurrences. Notez que la classe dwc:ResourceRelationship est\
      \ un autre moyen de représenter les associations, avec plus de détails. La pratique\
      \ optimale recommandée est de séparer les valeurs d'une liste par une barre\
      \ verticale (` | `)."
    description: "Une liste (concaténée et séparée) d'identifiants d'autres enregistrements\
      \ de dwc:Occurrence et de leurs associations à cette dwc:Occurrence."
    label: Occurrences associées
  ru:
    comments: Этот термин предназначен для указания перечня связей с иными записями
      dwc:Occurrence. Обратите внимание, что для описания таких связей с более высокой
      детализацией может также применяться класс dwc:ResourceRelationship. В соответствии
      с рекомендуемой практикой, значения в перечне следует разделять символом «вертикальная
      черта» с пробелами (` | `).
    description: Список (в одной строке через разделитель) идентификаторов других
      записей dwc:Occurrence, связанных с данной записью dwc:Occurrence.
    label: Связанные находки
  zh:
    comments: 此術語可用於提供與其他出現紀錄關聯的清單。請注意，資源關係類別是表示關聯的替代方式，且能提供更詳細的資訊。建議最佳實務做法是使用空格、垂直線、空格（
      | ）分隔。
    description: '與該筆紀錄相關的其他出現紀錄，若有多個連結以 "|" 分隔。'
    label: 相關物種出現紀錄
http://rs.tdwg.org/dwc/terms/associatedOrganisms:
  cs:
    comments: Tento termín lze použít k poskytnutí seznamu asociací k jiným dwc:Organisms.
      Všimněte si, že třída dwc:ResourceRelationship je alternativním prostředkem
      pro reprezentaci asociací, a to s většími podrobnostmi. Doporučeným osvědčeným
      postupem je oddělovat hodnoty v seznamu mezerou svislou čarou mezerou (` | `).
    description: Seznam (spojený a oddělený) identifikátorů jiných dwc:Organisms a
      asociací tohoto dwc:Organism ke každému z nich.
    label: Související organismy
  es:
    comments: Este término puede utilizarse para proporcionar una lista de asociaciones
      con otros dwc:Organisms. Cabe señalar que la clase de dwc:ResourceRelationship
      es una alternativa para representar asociaciones y permite incluir más detalle.
      La práctica recomendada es separar los valores en la lista con espacio barra
      vertical espacio (` | `).
    description: Una lista (concatenada y separada) de los identificadores de otros
      dwc:Organisms y las asociaciones de cada uno de ellos con el dwc:Organism.
    label: Organismos Asociados
  fr:
    comments: "Ce terme peut être utilisé pour fournir une liste d'associations avec\
      \ d'autres dwc:Organisms. Notez que la classe dwc:ResourceRelationship est un\
      \ autre moyen de représenter les associations, avec plus de détails. La pratique\
      \ optimale recommandée est de séparer les valeurs d'une liste par une barre\
      \ verticale (` | `)."
    description: "Une liste (concaténée et séparée) d'identifiants d'autres dwc:Organisms\
      \ et les associations de cet dwc:Organism à chacun d'entre eux."
    label: Organismes associés
  ru:
    comments: Этот термин предназначен для указания перечня связей с иными записями
      dwc:Organisms. Обратите внимание, что для описания таких связей с более высокой
      детализацией может также применяться класс dwc:ResourceRelationship. В соответствии
      с рекомендуемой практикой, значения в перечне следует разделять символом «вертикальная
      черта» с пробелами (` | `).
    description: Список (в одной строке через разделитель) идентификаторов других
      записей dwc:Organisms и связей данного dwc:Organism с каждым из них.
    label: Связанные организмы
  zh:
    comments: 此術語可用於提供與其他出現紀錄關聯的清單。請注意，資源關係類別是表示關聯的替代方式，且能提供更詳細的資訊。建議最佳實務做法是使用空格、垂直線、空格（
      | ）分隔。
    description: 與此生物相關的其他生物紀錄列表（使用標點符號分隔及串聯）。
    label: 相關生物體
http://rs.tdwg.org/dwc/terms/associatedReferences:
  cs:
    comments: Doporučeným postupem je oddělovat hodnoty v seznamu mezerou svislou
      čarou mezerou (` | `). Všimněte si, že třída dwc:ResourceRelationship je alternativním
      prostředkem pro reprezentaci asociací, a to s většími detaily. Všimněte si také,
      že zamýšleným použitím termínu dcterms:references v jádře Darwin při použití
      na dwc:Occurrence je poukázat na definitivní zdrojovou reprezentaci této dwc:Occurrence,
      pokud je k dispozici. Všimněte si také, že zamýšleným použitím termínu dcterms:bibliographicCitation
      v Darwin Core, je-li použit na dwc:Occurrence, je poskytnout preferovaný způsob
      citování samotného dwc:Occurrence.
    description: Seznam (spojený a oddělený) identifikátorů (publikace, bibliografický
      odkaz, globální jedinečný identifikátor, URI) literatury spojené s dwc:Occurrence.
    label: Související reference
  es:
    comments: La práctica recomendada es separar los valores en una lista con espacio-barra
      vertical-espacio (` | `). Cabe señalar que la clase dwc:ResourceRelationship
      es una alternativa para representar asociaciones, y permite incluir más detalle.
      También cabe señalar que el objetivo del término dcterms:references, cuando
      se aplica a un dwc:Occurrence, es dirigir a la representación definitiva de
      la fuente de ese dwc:Occurrence, si hay alguna disponible. También cabe señalar
      que el objetivo de dcterms:bibliographicCitation, cuando se aplica a un dwc:Occurrence,
      es proporcionar la forma preferida de citar el dwc:Occurrence en sí.
    description: Una lista (concatenada y separada) de los identificadores (publicación,
      referencia bibliográfica, identificador único global, URI) de la literatura
      asociada con el dwc:Occurrence.
    label: Referencias asociadas
  fr:
    comments: "La pratique optimale recommandée est de séparer les valeurs d'une liste\
      \ par une barre verticale (` | `). Notez que la classe dwc:ResourceRelationship\
      \ est un autre moyen de représenter les associations, avec plus de détails.\
      \ Notez également que l'usage prévu du terme dcterms:references dans le Darwin\
      \ Core, lorsqu'il est appliqué à une dwc:Occurrence, est de pointer vers la\
      \ source originale de cette dwc:Occurrence s'il y en a une. Notez également\
      \ que l'usage prévu du terme dcterms:bibliographicCitation dans le Darwin Core\
      \ lorsqu'il est appliqué à une dwc:Occurrence est de fournir la manière optimale\
      \ de citer la dwc:Occurrence elle-même."
    description: "Une liste (concaténée et séparée) d'identifiants (publication, référence\
      \ bibliographique, identifiant unique global (GUI), URI) de la littérature associée\
      \ à la dwc:Occurrence."
    label: Références associées
  ru:
    comments: В соответствии с рекомендуемой практикой, значения в перечне следует
      разделять символом «вертикальная черта» с пробелами (` | `). Следует отметить,
      что класс dwc:ResourceRelationship является альтернативным способом представления
      связанных с dwc:Occurrence объектов, с большей детализацией. Учитывайте, что
      термин dcterms:references при его применении к dwc:Occurrence, служит для ссылки
      на каноническое (авторитетное) представление источника данной записи dwc:Occurrence,
      если такой источник доступен. Также следует отметить, что предполагаемое использование
      термина dcterms:bibliographicCitation в Darwin Core при применении к dwc:Occurrence
      заключается в предоставлении предпочтительного способа цитирования самого dwc:Occurrence.
    description: Список (в одной строке через разделитель) идентификаторов литературных
      источников (публикации, библиографические ссылки, глобальные уникальные идентификаторы,
      URI), связанных с данной записью dwc:Occurrence.
    label: Связанные источники
  zh:
    comments: 。
    description: 與此出現紀錄相關的文獻(如出版刊物、學術引用、全球唯一識別碼或URI等)列表(使用標點符號分隔)。
    label: 相關參考資料
http://rs.tdwg.org/dwc/terms/associatedSequences:
