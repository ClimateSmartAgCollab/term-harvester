  zh:
    comments: ''
    description: ''
    label: 樣本大小
http://rs.tdwg.org/dwc/terms/sampledSubstrateCategory:
  es:
    comments: 'La mejor práctica recomendada consiste en utilizar un vocabulario controlado
      y separar los valores de la lista mediante un espacio, una barra vertical y
      un espacio (` | `). Este término tiene un equivalente en el espacio de nombres
      dwciri: namespace que solo admite un IRI como valor, mientras que este término
      permite cualquier valor de cadena literal.'
    description: Una categoría o tipo de sustrato muestreado durante un dwc:Event.
    label: Categoría de sustrato muestreado
http://rs.tdwg.org/dwc/terms/sampledSubstrateLayer:
  es:
    comments: 'La mejor práctica recomendada consiste en utilizar un vocabulario controlado
      y separar los valores de la lista mediante un espacio, una barra vertical y
      un espacio (` | `). Este término tiene un equivalente en el espacio de nombres
      dwciri: namespace que solo admite un IRI como valor, mientras que este término
      permite cualquier valor de cadena literal.'
    description: Una lista (concatenada y separada) de capas de sustrato muestreadas
      durante un dwc:Event.
    label: Capa de sustrato muestreada
http://rs.tdwg.org/dwc/terms/samplingEffort:
  cs:
    comments: ''
    description: Množství úsilí vynaloženého během dwc:Event.
    label: Intenzita sběru vzorků
  fr:
    comments: ''
    description: "La quantité d'efforts déployés au cours d'un dwc:Event."
    label: "Pression d'échantillonnage"
  ru:
    comments: ''
    description: Выборочное усилие, затраченное в ходе dwc:Event.
    label: Выборочное усилие
  zh:
    comments: ''
    description: 一次調查的努力量。
    label: 取樣努力量
http://rs.tdwg.org/dwc/terms/samplingProtocol:
  cs:
    comments: ''
    description: Názvy, odkazy nebo popisy metod nebo protokolů použitých během dwc:Event.
    label: Protokol o sběru vzorků
  es:
    comments: La mejor práctica recomendada consiste en describir un dwc:Event con
      no más de un protocolo de muestreo. En el caso de un evento resumen que incluya
      múltiples protocolos, cuando no sea posible asignar un protocolo específico
      a dwc:Occurrences concretas, la mejor práctica recomendada es separar los valores
      en una lista utilizando el formato ` | ` (espacio, barra vertical, espacio).
      Este término tiene un equivalente en el espacio de nombres dwciri:namespace
      que solo admite una IRI como valor, mientras que este término permite cualquier
      valor de cadena de texto literal.
    description: Los nombres, referencias o descripciones de los métodos o protocolos
      usados durante un dwc:Event.
    label: Protocolo de muestreo
  fr:
    comments: ''
    description: "Les noms, références ou descriptions des méthodes ou protocoles\
      \ utilisés lors d'un dwc:Event."
    label: "Protocole d'échantillonnage"
  ru:
    comments: ''
    description: Названия, ссылки или описания методов и протоколов, применявшихся
      во время dwc:Event.
    label: Протокол выборки
  zh:
    comments: ''
    description: 調查方法或流程的名稱、描述，或其參考文獻。同一筆調查活動最好不要包含超過一個調查方法，如果超過則建議分為不同筆的調查活動。
    label: 調查方法
http://rs.tdwg.org/dwc/terms/scientificName:
  cs:
    comments: ''
    description: ''
    label: Vědecký název
  es:
    comments: Este término no debe contener calificadores de identificación; estos
      deben indicarse en el término IdentificationQualifier. Cuando se aplica a un
      organismo o a un registro biológico, este término debe utilizarse para representar
      el nombre científico asignado al organismo en cuestión, de acuerdo con el taxón
      al que fue o está actualmente asignado. Los nombres deben ajustarse al código
      de nomenclatura más reciente. Por ejemplo, los nombres de híbridos de algas,
      hongos y plantas deben seguir las normas del Código Internacional de Nomenclatura
      para algas, hongos y plantas (artículos H.1, H.2 y H.3 del Código de Shenzhen).
      Por tanto, siempre que sea posible, utilice el signo de multiplicación «×» (Unicode
      `U+00D7`, HTML `&times;`) para identificar un híbrido, en lugar de «x» o «X».
    description: El nombre científico completo, incluyendo la información sobre la
      autoría y la fecha, si se conoce. Cuando forma parte de un dwc:Identification,
      debe corresponder al nombre del rango taxonómico más bajo que pueda determinarse.
    label: ''
  fr:
    comments: ''
    description: ''
    label: Nom scientifique
  ru:
    comments: ''
    description: ''
    label: Научное название
  zh:
    comments: ''
    description: ''
    label: 學名
http://rs.tdwg.org/dwc/terms/scientificNameAuthorship:
  cs:
    comments: ''
    description: Informace o autorství pro dwc:scientificName formátované podle konvencí
      příslušného dwc:nomenclaturalCode.
    label: Autorství vědeckého názvu
  fr:
    comments: ''
    description: "Les informations relatives à l'autorité du dwc:scientificName formatées\
      \ selon les conventions du dwc:nomenclaturalCode correspondant."
    label: Auteur du nom scientifique
  ru:
    comments: ''
    description: Сведения об авторстве научного названия (dwc:scientificName), оформленные
      по правилам соответствующего номенклатурного кодекса (dwc:nomenclaturalCode).
    label: Автор (и год) описания таксона
  zh:
    comments: ''
    description: ''
    label: 學名命名者
http://rs.tdwg.org/dwc/terms/scientificNameID:
  cs:
    comments: ''
    description: Identifikátor pro nomenklaturní (nikoli taxonomické) údaje vědeckého
      názvu.
    label: ID vědeckého názvu
  es:
    comments: ''
    description: Un identificador de los detalles de la nomenclatura (no taxonómica)
      de un nombre científico.
    label: ID del nombre científico
  fr:
    comments: ''
    description: "Un identifiant pour les détails nomenclaturaux (et non taxonomiques)\
      \ d'un nom scientifique."
    label: Identifiant du nom scientifique
  ru:
    comments: ''
    description: Идентификатор, указывающий на номенклатурный источник (не таксономическую
      трактовку) научного названия.
    label: ID Научного названия
  zh:
    comments: ''
    description: ''
    label: 學名ID
http://rs.tdwg.org/dwc/terms/sex:
  cs:
    comments: Doporučeným osvědčeným postupem je používat řízený slovník. Tento termín
      má ekvivalent ve jmenném prostoru dwciri:, který jako hodnotu umožňuje pouze
      IRI, zatímco tento termín umožňuje jakoukoli řetězcovou literální hodnotu.
    description: ''
    label: Pohlaví
  es:
    comments: 'La práctica recomendada es usar un vocabulario controlado. Este término
      tiene un equivalente en el dwciri: namespace que solo permite un IRI como valor,
      mientras que este término permite cualquier cadena de texto.'
    description: Un sexo de un dwc:Organism.
    label: Sexo
  fr:
    comments: "La pratique optimale recommandée est d'utiliser un vocabulaire contrôlé.\
      \ Ce terme a un équivalent dans le dwciri: namespace qui n'autorise qu'un IRI\
      \ comme valeur, alors que ce terme autorise n'importe quelle valeur sous forme\
      \ de chaîne de caractères."
    description: ''
    label: Sexe
  ru:
    comments: Рекомендуемой практикой является использование контролируемого словаря.
      У этого термина существует эквивалент в пространстве имен dwciri:, который допускает
      только IRI в качестве значения, в то время как данный термин допускает использование
      любого строкового значения.
    description: ''
    label: Пол
  zh:
    comments: ''
    description: ''
    label: 性別
http://rs.tdwg.org/dwc/terms/siteNumber:
  es:
    comments: 'Por lo general, se trata de un identificador institucional para un
      lugar específico con nombre, a diferencia de dwc:locationID, que es un identificador
      para el conjunto completo de información distintiva de una instancia de dcterms:Location.
      Este término difiere de dwc:fieldNumber en que dwc:siteNumber no está estrictamente
      vinculado a un único dwc:Event. Este término tiene un equivalente en el espacio
      de nombres dwciri: namespace que solo admite un IRI como valor, mientras que
      este término permite cualquier valor de cadena de texto.'
    description: Un identificador para un sitio con nombre.
    label: Número de sitio
http://rs.tdwg.org/dwc/terms/specificEpithet:
  cs:
    comments: ''
    description: Název prvního nebo druhového epiteta dwc:scientificName.
    label: Specifický epithet
  es:
    comments: ''
    description: El nombre del primer epíteto o el epíteto de la especie del dwc:scientificName.
    label: Epíteto Específico
  fr:
    comments: ''
    description: "Le nom de la première épithète ou de l'épithète spécifique du dwc:scientificName."
    label: Épithète spécifique
  ru:
    comments: ''
    description: Название видового эпитета (первого эпитета) в составе dwc:scientificName.
    label: Видовой эпитет
  zh:
    comments: ''
    description: ''
    label: 種小名
http://rs.tdwg.org/dwc/terms/startDayOfYear:
  cs:
    comments: ''
    description: ''
    label: Počáteční den roku
  es:
    comments: El valor es 1 para el 1 de enero y 365 para el 31 de diciembre, excepto
      en un año bisiesto, en cuyo caso es 366.
    description: El día del año (expresado como número entero) más temprano en el
      que ocurrió un dwc:Event.
    label: ''
  fr:
    comments: ''
    description: ''
    label: Premier jour pour une année donnée
  ru:
    comments: ''
    description: ''
    label: Начальный день года
http://rs.tdwg.org/dwc/terms/stateProvince:
  cs:
    comments: Doporučeným osvědčeným postupem je používat řízený slovník, například
      Getty Thesaurus of Geographic Names. Doporučeným osvědčeným postupem je ponechat
      toto pole prázdné, pokud dcterms:Location pokrývá více entit na této administrativní
      úrovni nebo pokud dcterms:Location může být v jedné nebo jiné z více možných
      entit na této úrovni. Násobnost a neurčitost geografické entity lze zachytit
      buď v termínu dwc:higherGeography, nebo v termínu dwc:locality, případně v obou.
    description: Název nejbližší menší správní oblasti než země (stát, provincie,
      kanton, departement, region atd.), ve které se dcterms:Location vyskytuje.
    label: Členění prvního řádu
  es:
    comments: La práctica recomendada es utilizar un vocabulario controlado, como
      el Tesauro Getty de Nombres Geográficos. La práctica recomendada es dejar este
      elemento en blanco si la dcterms:Location abarca múltiples entidades en este
      nivel administrativo, o si la dcterms:Location tiene varias entidades posibles
      en este nivel. La multiplicidad e incertidumbre de la entidad geográfica puede
      documentarse en el término dwc:higherGeography o en el término dwc:locality,
      o en ambos.
    description: El nombre completo y sin abreviar de la siguiente región administrativa
      de menor jerarquía que dwc:country (estado, provincia, departamento, región,
      etc.) en el que se encuentra la dcterms:Location.
    label: División administrativa de primer orden
  fr:
    comments: "La pratique optimale recommandée est d'utiliser un vocabulaire contrôlé\
      \ tel que le Getty Thesaurus of Geographic Names. La pratique optimale recommandée\
      \ est de laisser ce champ vide si la dcterms:Location recouvre plusieurs entités\
      \ à ce niveau administratif ou si la dcterms:Location pourrait se trouver dans\
      \ l'une ou l'autre des multiples entités possibles à ce niveau. La multiplicité\
      \ et l'incertitude de l'entité géographique peuvent être renseignées soit dans\
      \ le terme dwc:higherGeography, soit dans le terme dwc:locality, soit dans les\
      \ deux."
    description: Le nom de la région administrative immédiatement inférieure au pays
      (état, province, canton, département, région, etc.) dans laquelle se trouve
      la dcterms:Location.
    label: Division de premier ordre
  ru:
    comments: Рекомендуется использовать контролируемый словарь географических названий,
      такой как Getty Thesaurus. Рекомендуется оставлять это поле пустым, если dcterms:Location
      охватывает несколько объектов на данном административном уровне или если dcterms:Location
      есть иная неопределенность в выборе одного значения для этого поля. Множественность
      и неопределенность географического объекта могут быть отражены либо в поле,
      обзозначаемом термином dwc:higherGeography, либо в поле, обозначенном термином
      dwc:locality, либо в обоих.
    description: Название следующей за страной по величине административной единицы
      (штат, провинция, кантон, департамент, регион, область, край и т.д.), в которой
      находится dcterms:Location.
    label: Административная единица первого порядка
http://rs.tdwg.org/dwc/terms/subfamily:
  cs:
    comments: ''
    description: Úplný vědecký název podčeledi, do které je dwc:Taxon zařazen.
    label: Podčeleď
  es:
    comments: ''
    description: El nombre científico completo de la subfamilia en el que se clasifica
      el dwc:Taxon.
    label: Subfamilia
  fr:
    comments: ''
    description: Le nom scientifique complet de la sous-famille dans laquelle le dwc:Taxon
      est classé.
    label: Sous-famille
  ru:
    comments: ''
    description: Полное научное название подсемейства, к которому был отнесен dwc:Taxon.
    label: Подсемейство
  zh:
    comments: ''
    description: ''
    label: 亞科
http://rs.tdwg.org/dwc/terms/subgenus:
  cs:
    comments: Hodnota tohoto termínu by měla být úplným názvem podrodu, jak to vyžaduje
      příslušný nomenklaturní kód.
    description: Úplný vědecký název podrodu, do kterého je dwc:Taxon zařazen.
    label: Podrod
  es:
    comments: Un valor para este término debe ser un nombre de subgénero completo
      según lo requiera el código de nomenclatura apropiado.
    description: El nombre científico completo del subgénero en el que se clasifica
      el dwc:Taxon.
    label: Subgénero
  fr:
    comments: La valeur de ce terme doit être un nom de sous-genre complet tel que
      requis par le code de nomenclature approprié.
    description: Le nom scientifique complet du sous-genre dans lequel le dwc:Taxon
      est classé.
    label: Sous-genre
  ru:
    comments: Этот термин должен принимать значения, которые являются полным названием
      подрода в соответствии с требованиями соответствуюещго номенклатурного кодекса.
    description: Полное научное название подрода, к которому было отнесен dwc:Taxon.
    label: Подрод
  zh:
    comments: ''
    description: ''
    label: 亞屬
http://rs.tdwg.org/dwc/terms/subtribe:
  cs:
    comments: ''
    description: Úplný vědecký název podkmene, do kterého je dwc:Taxon zařazen.
    label: Podkmen
  es:
    comments: ''
    description: El nombre científico completo de la subtribu en el que se clasifica
      el dwc:Taxon.
    label: Subtribu
  fr:
    comments: ''
    description: Le nom scientifique complet de la sous-tribu dans laquelle le dwc:Taxon
      est classé.
    label: Sous-tribu
  ru:
    comments: ''
    description: Полное научное название подтрибы, к которой dwc:Taxon был отнесен.
    label: Подтриба
http://rs.tdwg.org/dwc/terms/superfamily:
  cs:
    comments: Taxonomická kategorie podřízená řádu a nadřazená čeledi. Podle článku
      29.2 ICZN se pro název nadčeledi používá přípona `-oidea`.
    description: Úplný vědecký název nadčeledi, do které je dwc:Taxon zařazen.
    label: Nadčeleď
  es:
    comments: ''
    description: El nombre científico completo de la superfamilia en el que se clasifica
      el dwc:Taxon.
    label: Superfamilia
  fr:
    comments: "Une catégorie taxonomique subordonnée à un ordre et supérieure à une\
      \ famille. Selon l'article 29.2 de l'ICZN, le suffixe `-oidea` est utilisé pour\
      \ un nom de super-famille."
    description: Le nom scientifique complet de la super-famille dans laquelle le
      dwc:Taxon est classé.
    label: Super-famille
  ru:
    comments: Таксономическая категория, находящаяся в иерархии ниже отряда и выше
      семейства. Согласно статье 29.2 ICZN, для названия надсемейства используется
      суффикс -oidea.
    description: Полное научное название надсемейства, к которому dwc:Taxon был отнесен.
    label: Надсемейство
  zh:
    comments: ''
    description: ''
    label: 亞科
http://rs.tdwg.org/dwc/terms/taxonConceptID:
  cs:
    comments: ''
