  es:
    comments: Para dwc:Occurrences, se recomienda que el vocabulario predeterminado
      consista en detectado y no detectado, aunque los implementadores pueden ampliarlo
      si existe una justificación adecuada. Este término tiene un equivalente en el
      espacio de nombres dwciri:namespace que solo admite una IRI como valor, mientras
      que este término permite cualquier valor de cadena de texto.
    description: Una declaración sobre la detección o no detección de un dwc:Organism
      durante un dwc:Event.
    label: Estado del registro biológico
  fr:
    comments: ''
    description: ''
    label: "Statut de l'occurrence"
  ru:
    comments: ''
    description: ''
    label: Статус находки
  zh:
    comments: ''
    description: ''
    label: 出現狀態
http://rs.tdwg.org/dwc/terms/order:
  cs:
    comments: ''
    description: Úplný vědecký název řádu, do kterého je dwc:Taxon zařazen.
    label: Řazení
  es:
    comments: ''
    description: El nombre científico completo del orden en el que se clasifica el
      dwc:Taxon.
    label: Orden
  fr:
    comments: ''
    description: "Le nom scientifique complet de l'ordre dans lequel le dwc:Taxon\
      \ est classé."
    label: Ordre
  ru:
    comments: ''
    description: Полное научное название отряда (для животных) или порядка (для других
      царств), к которому относится dwc:Taxon.
    label: Отряд / Порядок
  zh:
    comments: ''
    description: ''
    label: 目
http://rs.tdwg.org/dwc/terms/organismID:
  cs:
    comments: ''
    description: Identifikátor instance dwc:Organism (na rozdíl od konkrétního digitálního
      záznamu dwc:Organism). Může to být globálně jedinečný identifikátor nebo identifikátor
      specifický pro datovou sadu.
    label: ID organismu
  es:
    comments: ''
    description: Un identificador para una instancia del dwc:Organism (a diferencia
      de un registro particular digital específico del dwc:Organism). Puede ser un
      identificador único global o un identificador específico del conjunto de datos.
    label: ID del organismo
  fr:
    comments: ''
    description: "Un identifiant de l'instance de dwc:Organism (par opposition à un\
      \ enregistrement numérique particulier du dwc:Organism). Il peut s'agir d'un\
      \ identifiant unique global (GUI) ou d'un identifiant spécifique à un jeu de\
      \ données."
    label: Identifiant de l’organisme
  ru:
    comments: ''
    description: Идентификатор экземпляра dwc:Organism (в отличие от конкретной цифровой
      записи о dwc:Organism). Может быть глобально уникальным идентификатором или
      идентификатором, специфичным для набора данных.
    label: ID организма
  zh:
    comments: ''
    description: 若該筆紀錄可追溯至生物個體，則可給予生物體ID。可設定有意義的組合格式，或使用全球唯一辨識碼(GUID)或通用唯一辨識碼(UUID)。
    label: 生物體ID
http://rs.tdwg.org/dwc/terms/organismName:
  cs:
    comments: ''
    description: Textový název nebo označení přiřazené instanci dwc:Organism.
    label: Název organismu
  es:
    comments: ''
    description: El nombre textual o etiqueta asignado a una instancia del dwc:Organism.
    label: Nombre del organismo
  fr:
    comments: ''
    description: Nom littéral ou étiquette attribuée à une instance de dwc:Organism.
    label: "Nom de l'organisme"
  ru:
    comments: ''
    description: Текстовое название или обозначение, присвоенное экземпляру dwc:Organism.
    label: Название организма
  zh:
    comments: ''
    description: 給該生物體取的名字或標籤。
    label: 生物體名
http://rs.tdwg.org/dwc/terms/organismQuantity:
  cs:
    comments: K dwc:organismQuantity musí být přiřazen odpovídající dwc:organismQuantityType.
    description: Číslo nebo výčtová hodnota pro množství dwc:Organisms.
    label: Množství organismů
  fr:
    comments: Une dwc:organismQuantity doit avoir un dwc:organismQuantityType correspondant.
    description: Un nombre ou une valeur numérique pour la quantité de dwc:Organisms.
    label: "Nombre d'organismes"
  ru:
    comments: Каждому значению dwc:organismQuantity должен соответствовать dwc:organismQuantityType.
    description: Число или значение из предопределенного перечня, характеризующее
      количество объектов dwc:Organism.
    label: Обилие организма
  zh:
    comments: ''
    description: ''
    label: 生物體數量
http://rs.tdwg.org/dwc/terms/organismQuantityType:
  cs:
    comments: Typ dwc:organismQuantityType musí mít odpovídající dwc:organismQuantity.
      Tento termín má ekvivalent ve jmenném prostoru dwciri:, který umožňuje jako
      hodnotu pouze IRI, zatímco tento termín umožňuje jakoukoli řetězcovou literální
      hodnotu.
    description: Typ kvantifikačního systému používaného pro množství dwc:Organisms.
    label: Typ množství organismu
  es:
    comments: ''
    description: Sistema de medida asociado a la cantidad de dwc:Organisms.
    label: Tipo de cantidad del organismo
  fr:
    comments: "Un dwc:organismQuantityType doit avoir un dwc:organismQuantity correspondant.\
      \ Ce terme a un équivalent dans le dwciri: namespace qui n'autorise qu'un IRI\
      \ comme valeur, alors que ce terme autorise n'importe quelle valeur sous forme\
      \ de chaîne de caractères."
    description: Le type de système de mesure utilisé pour la quantification des dwc:Organisms.
    label: "Type de la quantité d'organismes"
  ru:
    comments: Для каждого dwc:organismQuantityType должно существовать соответствующее
      значение dwc:organismQuantity. Этот термин имеет эквивалент в пространстве имён
      dwciri:, который допускает только IRI в качестве значения, тогда как данный
      термин допускает любое строковое литеральное значение.
    description: Способ учета или шкала, используемые для оценки количества организмов
      (dwc:Organism).
    label: Способ учета обилия организмов
  zh:
    comments: ''
    description: ''
    label: 生物體數量單位
http://rs.tdwg.org/dwc/terms/organismRemarks:
  cs:
    comments: ''
    description: Komentáře nebo poznámky k instanci dwc:Organism.
    label: Poznámky k organismu
  es:
    comments: ''
    description: Comentarios o anotaciones sobre el dwc:Organism registrado.
    label: Comentarios del organismo
  fr:
    comments: ''
    description: "Commentaires ou notes sur l'instance de dwc:Organism."
    label: Remarques sur l’organisme
  ru:
    comments: ''
    description: Комментарии или заметки, касающиеся экземпляра dwc:Organism.
    label: Примечания об организме
  zh:
    comments: ''
    description: ''
    label: 生物體註記
http://rs.tdwg.org/dwc/terms/organismScope:
  cs:
    comments: Doporučeným osvědčeným postupem je používat řízený slovník. Tento termín
      není určen k určení typu dwc:Taxon. Chcete-li popsat druh dwc:Organism pomocí
      objektu URI v RDF, použijte místo toho rdf:type (http://www.w3.org/1999/02/22-rdf-syntax-ns#type).
    description: Popis druhu instance dwc:Organism. Může být použit k určení, zda
      instance dwc:Organism představuje diskrétní organismus nebo zda představuje
      určitý typ agregace.
    label: Rozsah organismu
  es:
    comments: Se recomienda usar un vocabulario controlado. Este elemento no está
      destinado a ser utilizado para especificar un tipo de dwc:Taxon. Para describir
      el tipo de dwc:Organism mediante un objeto URI en RDF, utilice rdf:type (http://www.w3.org/1999/02/22-rdf-syntax-ns#type)
      en su lugar.
    description: Una descripción en la instancia del tipo dwc:Organism. Puede ser
      utilizado para indicar si la instancia dwc:Organism representa un organismo
      discreto o un tipo particular de agregación.
    label: Alcance del organismo
  fr:
    comments: "La pratique optimale recommandée est d'utiliser un vocabulaire contrôlé.\
      \ Ce terme n'est pas destiné à être utilisé pour spécifier un type de dwc:Taxon.\
      \ Pour décrire le type de dwc:Organism à l'aide d'un objet URI en RDF, utilisez\
      \ plutôt rdf:type (http://www.w3.org/1999/02/22-rdf-syntax-ns#type)."
    description: "Une description du type d'instance de dwc:Organism. Peut être utilisée\
      \ pour indiquer si l'instance de dwc:Organism représente un organisme isolé\
      \ ou si elle représente un type particulier d'agrégat ou de regroupement."
    label: "Périmètre de l'organisme"
  ru:
    comments: Рекомендуемой лучшей практикой является использование контролируемого
      словаря. Данный термин не предназначен для указания типа dwc:Taxon. Для описания
      вида dwc:Organism с использованием URI-объекта в RDF используйте вместо этого
      rdf:type (http://www.w3.org/1999/02/22-rdf-syntax-ns#type).
    description: Описание категории, к которой относится конкретный экземпляр dwc:Organism.
      Позволяет указать, является ли объект отдельным организмом или представляет
      собой определённый тип группового образования.
    label: Категория организма
  zh:
    comments: ''
    description: ''
    label: 生物體類型
http://rs.tdwg.org/dwc/terms/originalNameUsage:
  cs:
    comments: Úplný vědecký název s údaji o autorství a datu, pokud jsou známy, použití
      názvu, ve kterém byl terminální prvek dwc:scientificName původně vytvořen podle
      pravidel přidruženého dwc:nomenclaturalCode. Například pro názvy, které se řídí
      ICNafp, by tento termín označoval basionym záznamu představujícího následnou
      kombinaci. Na rozdíl od basionymů se však tento termín může vztahovat na vědecké
      názvy všech stupňů.
    description: Název taxonu s údaji o autorství a datu, pokud jsou známy, tak, jak
      se původně objevil při prvním stanovení podle pravidel přiřazeného dwc:nomenclaturalCode.
      Basionym (botanika) nebo basonymum (bakteriologie) dwc:scientificName nebo starší/starší
      homonymum u nahrazených názvů.
    label: Užití původního názvu
  fr:
    comments: "Le nom scientifique complet, avec les informations relatives à l'auteur\
      \ et à la date si elles sont connues, de l'usage du nom dans lequel l'élément\
      \ terminal du dwc:scientificName a été établi à l'origine selon les règles du\
      \ dwc:nomenclaturalCode associé. Par exemple, pour les noms régis par le ICNafp,\
      \ ce terme indiquerait le basionyme d'un enregistrement lié à une combinaison\
      \ subséquente. Contrairement aux basionymes, ce terme peut s'appliquer aux noms\
      \ scientifiques de tous rangs."
    description: "Le nom du taxon, avec les informations relatives à l'auteur et à\
      \ la date si elles sont connues, tel qu'il apparaissait à l'origine lorsqu'il\
      \ a été établi pour la première fois selon les règles du dwc:nomenclaturalCode\
      \ associé. Le basionyme (botanique) ou le basonyme (bactériologie) du dwc:scientificName\
      \ ou l'homonyme senior pour les noms remplacés."
    label: Usage original du nom
  ru:
    comments: Полное научное название таксона, включая авторство и дату, если они
      известны, содержащий конечный элемент dwc:scientificName, в том варианте, который
      был исходно установлен в соответствии с правилами соответствующего dwc:nomenclaturalCode.
      Например, таксонов, названия которых регулируются ICNafp, это базионим для записи,
      представляющей собой более позднюю комбинацию. В отличии от базионимов этот
      термин может быть применен к названиям таксонов любого ранга.
    description: Таксономическое название в его исходной форме (с авторством и датой,
      если известно), соответствующее моменту его первоначального описания по правилам
      соответствующего номенклатурного кодекса. Для заменённых названий — это базионим
      (базоним) текущего научного названия, либо более ранний гомоним, который был
      замещён.
    label: Первоначальное название организма
http://rs.tdwg.org/dwc/terms/originalNameUsageID:
  cs:
    comments: Tento termín by se měl používat pro označení dwc:taxonID záznamu dwc:Taxon,
      který představuje použití koncového prvku dwc:scientificName, jak bylo původně
      stanoveno podle pravidel souvisejícího dwc:nomenclaturalCode. Například pro
      názvy, které se řídí ICNafp, by tento termín stanovil vztah mezi záznamem představujícím
      následnou kombinaci a záznamem pro odpovídající basionym. Na rozdíl od basionymů
      se však tento termín může vztahovat na vědecké názvy všech stupňů. V případě
      Darwin Core Archives by měl být související záznam přítomen lokálně ve stejném
      archivu.
    description: Identifikátor použití názvu (dokumentovaný význam názvu podle zdroje),
      ve kterém byl terminální prvek dwc:scientificName původně vytvořen podle pravidel
      přiřazeného dwc:nomenclaturalCode.
    label: ID Užití původního názvu
  es:
    comments: ''
    description: ''
    label: ''
  fr:
    comments: "Ce terme devrait être utilisé pour désigner le dwc:taxonID d'un enregistrement\
      \ dwc:Taxon qui représente l'usage de l'élément terminal du dwc:scientificName\
      \ tel qu'il a été établi à l'origine selon les règles du dwc:nomenclaturalCode\
      \ associé. Par exemple, pour les noms régis par l'ICNafp, ce terme établirait\
      \ la relation entre un enregistrement représentant une combinaison subséquente\
      \ et l'enregistrement du basionyme correspondant. Contrairement aux basionymes,\
      \ ce terme peut s'appliquer aux noms scientifiques de tous rangs. Pour les archives\
      \ Darwin Core, l'enregistrement correspondant doit être présent localement dans\
      \ la même archive."
    description: "Un identifiant pour l'usage du nom (signification documentée du\
      \ nom selon une source) dans lequel l'élément terminal du dwc:scientificName\
      \ a été établi à l'origine selon les règles du dwc:nomenclaturalCode associé."
    label: "Identifiant de l'usage original du nom"
  ru:
    comments: Этот термин должен использоваться для ссылки на dwc:taxonID записи dwc:Taxon,
      которая представляет употребление терминального элемента dwc:scientificName
      в его исходном виде, установленном согласно правилам ассоциированного dwc:nomenclaturalCode.
      Например, для названий, регулируемых ICNafp, этот термин устанавливал бы связь
      между записью, представляющей более позднюю комбинацию, и записью её соответствующего
      базионима. В отличие от базионимов, однако, этот термин может применяться к
      научным названиям всех рангов. Для Darwin Core Archives связанная запись должна
      присутствовать локально в том же архиве.
    description: Идентификатор первоначального названия таксона (документированного
      значения названия по данным источника), в котором конечный элемент dwc:scientificName
      был исходно установлен согласно правилам соответствующего dwc:nomenclaturalCode.
    label: ID первоначального названия
  zh:
    comments: ''
    description: ''
    label: ''
http://rs.tdwg.org/dwc/terms/otherCatalogNumbers:
  cs:
    comments: Doporučeným postupem je oddělovat hodnoty v seznamu mezerou svislou
      čarou mezerou (` | `).
    description: ''
    label: Další katalogová čísla
  es:
    comments: ''
    description: Una lista (concatenada y separada) de números de catálogo completos
      previos o alternativos, u otros identificadores de uso humano, para la misma
      entidad dwc:MaterialEntity, ya sea en el conjunto de datos o colección actual
      o en cualquier otro.
    label: ''
  fr:
    comments: "La pratique optimale recommandée consiste à séparer les valeurs d'une\
      \ liste par une barre verticale (` | `)."
    description: ''
    label: Autres numéros de catalogue
  ru:
    comments: Рекомендуемой лучшей практикой является разделение значений в списке
      с помощью пробела, вертикальной черты и пробела (` | `).
    description: ''
    label: Другие каталожные номера
  zh:
    comments: ''
    description: ''
    label: 其他館藏號
http://rs.tdwg.org/dwc/terms/ownerInstitutionCode:
  cs:
    comments: ''
    description: ''
    label: Kód instituce vlastníka
  es:
    comments: ''
    description: Un nombre (o acrónimo) utilizado por una institución que posee un
      recurso.
    label: ''
  fr:
    comments: ''
    description: ''
    label: "Code de l'institution propriétaire"
  ru:
    comments: ''
    description: ''
    label: Код организации
  zh:
    comments: ''
    description: ''
    label: 所有者機構代碼
http://rs.tdwg.org/dwc/terms/parentEventID:
  cs:
    comments: ''
    description: ''
    label: ID nadřazené události
  es:
    comments: La mejor práctica recomendada es utilizar un identificador único a nivel
      global.
    description: Un identificador para un dwc:Event más amplio que contiene este y
      potencialmente otros dwc:Events.
    label: ''
  fr:
    comments: ''
    description: ''
    label: "Identifiant de l'événement parent"
  ru:
    comments: ''
    description: ''
    label: Идентификатор родительского события
  zh:
    comments: ''
    description: ''
    label: 母事件識別ID
http://rs.tdwg.org/dwc/terms/parentNameUsage:
  cs:
    comments: ''
    description: Úplný název, s údaji o autorství a datu, pokud jsou známy, přímého,
      nejbližšího nadřazeného dwc:Taxon (v klasifikaci) nejkonkrétnějšího prvku dwc:scientificName.
    label: Užití nadřazeného názvu
  fr:
    comments: ''
    description: "Le nom complet, avec les informations relatives à l'auteur et à\
      \ la date, si elles sont connues, du dwc:Taxon directement de rang supérieur\
      \ (dans une classification) à l'élément le moins inclusif du dwc:scientificName."
    label: Usage du nom parent
  ru:
    comments: ''
    description: Полное название, с указанием автора и даты, если известно, прямого,
      ближайшего родительского таксона dwc:Taxon более высокого ранга (в классификации)
      для dwc:scientificName.
    label: Использование родительского таксона
http://rs.tdwg.org/dwc/terms/parentNameUsageID:
  cs:
    comments: Tento termín by měl být používán pro přijaté názvy, aby odkazoval na
      dwc:taxonID záznamu dwc:Taxon, který představuje další vyšší taxon ve stejné
      taxonomické klasifikaci. V případě Darwin Core Archives by se měl související
      záznam vyskytovat lokálně ve stejném archivu.
    description: Identifikátor pro použití názvu (dokumentovaný význam názvu podle
      zdroje) přímého, nejbližšího nadřazeného taxonu vyššího řádu (v klasifikaci)
      nejkonkrétnějšího prvku dwc:scientificName.
    label: ID Užití nadřazeného názvu
  fr:
    comments: "Ce terme devrait être utilisé pour les noms acceptés pour se référer\
      \ au dwc:taxonID d'un enregistrement dwc:Taxon qui représente le taxon de rang\
      \ immédiatement supérieur dans la même classification. Pour les Archives Darwin\
      \ Core, l'enregistrement correspondant doit être présent dans la même archive."
    description: "Un identifiant pour l'usage du nom (signification documentée du\
      \ nom selon une source) du taxon de rang supérieur direct (dans une classification)\
      \ de l'élément le moins inclusif du dwc:scientificName."
    label: "Identifiant de l'usage du nom parent"
  ru:
    comments: Этот термин должен использоваться для правильных (действительных, валидных)
      названий для ссылки на dwc:taxonID записи dwc:Taxon, которая представляет следующий
      более высокий таксономический ранг в той же таксономической классификации. Для
      Darwin Core Archives связанная запись должна присутствовать локально в том же
      архиве.
