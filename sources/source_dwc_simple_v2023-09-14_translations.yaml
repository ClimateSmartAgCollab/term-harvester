    label: 相關基因序列
http://rs.tdwg.org/dwc/terms/associatedTaxa:
  cs:
    comments: Tento termín lze použít k poskytnutí seznamu přidružení k jiným záznamům
      dwc:Taxon, než je definováno v dwc:Occurrence. Všimněte si, že třída dwc:ResourceRelationship
      je alternativním prostředkem pro reprezentaci přidružení, a to s většími podrobnostmi.
      Tento termín není vhodný pro vytváření vztahů mezi dwc:Taxon záznamy, pouze
      mezi konkrétními dwc:Occurrences dwc:Organism s jinými dwc:Taxon záznamy. Doporučeným
      osvědčeným postupem je oddělovat hodnoty v seznamu mezerou svislou čarou mezerou
      (` | `).
    description: Seznam (spojený a oddělený) identifikátorů nebo názvů záznamů dwc:Taxon
      a přiřazení tohoto dwc:Occurrence ke každému z nich.
    label: Související taxony
  es:
    comments: Este término puede utilizarse para proporcionar una lista de asociaciones
      con registros dwc:Taxon adicionales al definido en el dwc:Occurrence. Cabe señalar
      que la clase dwc:ResourceRelationship es una alternativa para representar asociaciones,
      y permite incluir más detalle. Este término no es adecuado para establecer relaciones
      entre registros dwc:Taxon, sino para establecer relaciones entre dwc:Occurrences
      puntuales de un dwc:Organism con otros registros dwc:Taxon. La práctica recomendada
      es separar los valores en una lista con espacio-barra vertical-espacio (` |
      `).
    description: Una lista (concatenada y separada) de los identificadores o nombres
      de registros dwc:Taxon y las asociaciones de cada uno de ellos con este dwc:Occurrence.
    label: Taxones asociados
  fr:
    comments: "Ce terme peut être utilisé pour fournir une liste d'associations à\
      \ des enregistrements de dwc:Taxon autres que celles définies dans dwc:Occurrence.\
      \ Notez que la classe dwc:ResourceRelationship est un autre moyen de représenter\
      \ les associations, avec plus de détails. Ce terme ne convient pas pour établir\
      \ des relations entre des enregistrements de dwc:Taxon, mais seulement entre\
      \ des dwc:Occurrences spécifiques d'un dwc:Organisme et d'autres enregistrements\
      \ de dwc:Taxon. La pratique optimale recommandée est de séparer les valeurs\
      \ d'une liste par une barre verticale (` | `)."
    description: "Une liste (concaténée et séparée) d'identifiants ou des noms des\
      \ enregistrements de dwc:Taxon et les associations de cette dwc:Occurrence à\
      \ chacun d'entre eux."
    label: Taxons associés
  ru:
    comments: Термин может использоваться для связей с записями dwc:Taxon records
      отличных от тех, что определены в dwc:Occurrence. Обратите внимание, что класс
      dwc:ResourceRelationship является альтернативным способом представления связей
      и с большей детализацией. Данный термин не подходит для установления отношений
      между записями dwc:Taxon records, а только между конкретными dwc:Occurrences
      (находки) относящимися к dwc:Organism (организм) с другими записями dwc:Taxon
      records. Рекомендуемой лучшей практикой является разделение значений в списке
      с помощью пробела, вертикальной черты и пробела (` | `).
    description: Список (в одной строке через разделитель) идентификаторов или названий
      dwc:Taxon и связей данного dwc:Occurrence с каждым из них.
    label: Связанные таксоны
  zh:
    comments: ''
    description: 與此生物相關的其他生物紀錄列表（使用標點符號分隔及串聯）。
    label: 相關物種
http://rs.tdwg.org/dwc/terms/basisOfRecord:
  cs:
    comments: Doporučeným osvědčeným postupem je používat řízený slovník, například
      sadu místních názvů identifikátorů tříd v Darwin Core.
    description: Specifická povaha datového záznamu.
    label: Základ záznamu
  es:
    comments: Para este elemento se debe emplear el vocabulario controlado en inglés.
    description: Denota el origen o evidencia específica de la que se deriva el registro.
    label: Base del registro
  fr:
    comments: "La pratique optimale recommandée est d'utiliser un vocabulaire contrôlé\
      \ tel que l'ensemble des noms locaux des identifiants de classes du Darwin Core."
    description: "La nature précise de l'enregistrement."
    label: "Catégorie d'enregistrement"
  ru:
    comments: Рекомендуется использовать контролируемый словарь, такой как набор локальных
      имен идентификаторов классов в Darwin Core.
    description: Специфическая природа (сущность, характер, категория) записи данных.
    label: Основание находки
  zh:
    comments: 建議使用 Darwin Core 的控制詞彙。
    description: 資料紀錄的特定性質、類型。
    label: 紀錄類型
