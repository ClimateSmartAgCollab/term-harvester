http://rs.tdwg.org/dwc/terms/causeOfDeath:
  cs:
    comments: Příčinou mohou být přirozené příčiny (např. nemoci, predace), činnosti
      související s člověkem (např. zabíjení na silnicích, znečištění) nebo jiné faktory
      prostředí (např. extrémní povětrnostní jevy).
    description: Údaj o známé nebo předpokládané příčině úmrtí dwc:Organism.
    label: Příčna úmrtí
  es:
    comments: La causa puede deberse a causas naturales (por ejemplo, enfermedades,
      depredación), actividades humanas (por ejemplo, atropellos, contaminación) u
      otros factores ambientales (por ejemplo, fenómenos meteorológicos extremos).
    description: Una indicación de la causa conocida o sospechada de muerte de un
      dwc:Organism.
    label: Causa de Muerte
  fr:
    comments: "La cause peut être naturelle (par exemple, maladie, prédation), liée\
      \ à des activités humaines (par exemple, animaux tués sur la route, pollution)\
      \ ou à d'autres facteurs environnementaux (par exemple, phénomènes météorologiques\
      \ extrêmes)."
    description: "Une indication de la cause connue ou supposée de la mort d'un dwc:Organism."
    label: Cause de la Mort
  ru:
    comments: Причина может быть связана с естественными факторами (например, болезнь,
      нападение хищника), деятельностью человека (например, гибель на дороге, загрязнение
      окружающей среды) или иными факторами окружающей среды (например, экстремальные
      погодные явления).
    description: Сведения о известной или предполагаемой причине наступления смерти
      dwc:Organism.
    label: Причина смерти
