http://rs.tdwg.org/dwc/terms/higherClassification:
  cs:
    comments: Doporučeným postupem je oddělit hodnoty v seznamu mezerou svislou čarou
      mezerou (` | `), přičemž termíny jsou seřazeny od nejvyššího taxonomického stupně
      po nejnižší.
    description: Seznam (spojený a oddělený) názvů taxonů končící na stupni bezprostředně
      vyšším než odkazovaný dwc:Taxon.
    label: Vyšší zařazení
  es:
    comments: La práctica recomendada es separar los valores en la lista con una barra
      vertical espaciadora (` | `), con los elementos en orden desde el mayor rango
      taxonómico hasta el menor.
    description: Una lista (concatenada y separada) de los nombres de los taxones
      terminando en el rango inmediatamente superior al referenciado en el dwc:Taxon.
    label: Clasificación superior
  fr:
    comments: La pratique optimale recommandée est de séparer les valeurs dans une
      liste par des barres verticales (` | `), les termes étant classés du rang taxonomique
      le plus inclusif au moins inclusif.
    description: "Une liste (concaténée et séparée) de noms de taxons s'arrêtant au\
      \ rang immédiatement supérieur au dwc:Taxon référencé."
    label: Classification supérieure
  ru:
    comments: Рекомендуемой практикой является разделение значений в списке с помощью
      пробела, вертикальной черты и пробела (` | `), при этом термины должны быть
      упорядочены от высшего таксономического ранга к низшему.
    description: Список (объединенный и разделенный) названий таксонов, заканчивающийся
      на ранге, непосредственно вышестоящем по отношению к указанному dwc:Taxon.
    label: Вышестоящие таксоны
  zh:
    comments: ''
    description: ''
    label: 高階分類階層
http://rs.tdwg.org/dwc/terms/higherGeography:
