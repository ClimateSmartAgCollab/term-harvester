http://rs.tdwg.org/dwc/terms/dataGeneralizations:
  cs:
    comments: Tento termín má ekvivalent ve jmenném prostoru dwciri:, který jako hodnotu
      umožňuje pouze IRI, zatímco tento termín umožňuje zadat jakoukoli řetězcovou
      literální hodnotu.
    description: Opatření přijatá za účelem snížení specifičnosti nebo úplnosti sdílených
      údajů oproti jejich původní podobě. Navrhuje, že na vyžádání mohou být k dispozici
      alternativní údaje vyšší kvality.
    label: Zobecnění dat
  es:
    comments: 'Este término tiene un equivalente en el dwciri: namespace que solo
      permite usar un IRI como valor, mientras que este término permite cualquier
      valor de cadena de texto libre.'
    description: Medidas adoptadas para que los datos compartidos sean menos específicos
      o completos. Sugiere que los datos con mayor detalle existen y pueden estar
      disponibles bajo petición.
    label: Generalizaciones de los datos
  fr:
    comments: "Ce terme a un équivalent dans le dwciri: namespace qui n'autorise qu'un\
      \ IRI comme valeur, alors que ce terme autorise n'importe quelle valeur sous\
      \ forme de chaîne de caractères."
    description: Mesures prises pour rendre les données partagées moins précises ou
      moins complètes que dans leur forme originale. Cela peut signifier que des données
      de meilleure qualité peuvent être disponibles sur demande.
    label: Généralisation des données
  ru:
    comments: Этот термин имеет эквивалент в пространстве имён dwciri:, который допускает
      только IRI в качестве значения, в то время как данный термин допускает использование
      любой строки в качестве литерала.
    description: Действия, предпринятые для того, чтобы сделать опубликованные данные
      менее детальными или полными, чем в их исходной форме. Указывает на то, что
      по запросу могут быть предоставлены альтернативные данные более высокого качества.
    label: Обобщения данных
  zh:
    comments: ''
    description: ''
    label: 資料模糊化
