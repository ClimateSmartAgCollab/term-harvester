    label: Číslo terénní poznámky
  es:
    comments: 'A menudo sirve de enlace entre las notas de campo y un dwc:Event. Este
      término tiene un equivalente en el espacio de nombres dwciri: que solo admite
      una IRI como valor, mientras que este término permite cualquier valor de cadena
      de texto.'
