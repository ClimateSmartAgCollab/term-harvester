    description: Una representación en formato Well-Known Text (WKT) de la forma (huella,
      geometría) que define un dcterms:Location.
    label: Footprint en WKT Well-Known Text
  fr:
    comments: ''
    description: ''
    label: "WKT de l'emprise au sol"
  ru:
    comments: ''
    description: ''
    label: WKT-представление охвата
