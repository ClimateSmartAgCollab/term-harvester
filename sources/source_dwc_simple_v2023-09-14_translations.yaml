http://rs.tdwg.org/dwc/terms/pointRadiusSpatialFit:
  cs:
    comments: ''
    description: ''
    label: Prostorové přizpůsobení bodu poloměru
  es:
    comments: Los valores válidos son 0, un valor mayor o igual a 1, o indefinido.
      Un valor de 1 indica una coincidencia exacta o una superposición del 100 %.
      Se debe utilizar un valor de 0 si la combinación de punto y radio dada no contiene
      completamente la representación original. El parámetro pointRadiusSpatialFit
      es indefinido (y debe dejarse vacío) si la representación original es una geometría
      sin área (por ejemplo, un punto o una polilínea) y sin incertidumbre, y la georreferencia
      dada no corresponde a esa misma geometría (sin incertidumbre). Si tanto la representación
      original como la georreferencia dada son el mismo punto, el valor de pointRadiusSpatialFit
      es 1. En el documento *Georeferencing Best Practices* (Chapman y Wieczorek,
      2020; https://doi.org/10.15468/doc-gg7h-s853) se pueden encontrar explicaciones
      detalladas con ejemplos gráficos.
    description: Una relación entre el área de una representación de punto y radio
      (dwc:decimalLatitude, dwc:decimalLongitude, dwc:coordinateUncertaintyInMeters)
      y el área de una representación espacial verdadera (original o más específica)
      de un dcterms:Location.
    label: Ajuste espacial del radio-punto
  fr:
    comments: ''
    description: ''
    label: Ajustement du centre et du rayon
  ru:
    comments: ''
    description: ''
    label: Пространственное соответствие точки-радиуса
http://rs.tdwg.org/dwc/terms/preferredSpatialRepresentation:
  es:
    comments: ''
    description: Una indicación de qué representación espacial representa mejor el
      dcterms:Location.
    label: Representación espacial preferida
http://rs.tdwg.org/dwc/terms/preparations:
  cs:
    comments: Doporučeným postupem je oddělovat hodnoty v seznamu mezerou svislou
      čarou mezerou (` | `). Tento termín má ekvivalent ve jmenném prostoru dwciri:,
      který jako hodnotu povoluje pouze IRI, zatímco tento termín povoluje jakoukoli
      řetězcovou literální hodnotu.
    description: Seznam (spojený a oddělený) přípravků a metod uchovávání pro dwc:MaterialEntity.
    label: Uchovávání
  es:
    comments: 'La práctica recomendada es separar los valores en una lista con espacio-barra
      vertical-espacio (` | `). Este término tiene un equivalente en el dwciri: namespace
      que solo permite usar un IRI como valor, mientras que este término permite cualquier
      valor de cadena de texto libre.'
