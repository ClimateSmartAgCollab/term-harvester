      названия согласно источнику) прямого, ближайшего родительского таксона более
      высокого ранга (в классификации) для самого специфичного элемента dwc:scientificName.
    label: Идентификатор использования родительского таксона
http://rs.tdwg.org/dwc/terms/pathway:
  cs:
    comments: Doporučeným osvědčeným postupem je používat řetězce řízených hodnot
      z řízeného slovníku určeného pro použití s tímto termínem, který je uveden na
      adrese http://rs.tdwg.org/dwc/doc/pw/. Podrobnosti naleznete na adrese https://doi.org/10.3897/biss.3.38084.
      Tento termín má ekvivalent ve jmenném prostoru dwciri:, který jako hodnotu povoluje
      pouze IRI, zatímco tento termín povoluje jakoukoli řetězcovou literální hodnotu.
    description: Proces, kterým se dwc:Organism dostal na dané místo v daném čase.
    label: Cesta
  es:
    comments: 'La práctica recomendada es utilizar cadenas de texto provenientes del
      vocabulario controlado designado para documentar este término, disponibles en:
      http://rs.tdwg.org/dwc/doc/pw/. Para más detalles, diríjase a https://doi.org/10.3897/biss.3.38084.
      Este término tiene un equivalente en el dwciri: namespace que solo permite usar
      un IRI como valor, mientras que este término permite cualquier valor de cadena
      de texto libre.'
    description: El proceso por el cual un dwc:Organism llegó a un lugar y tiempo
      determinado.
    label: Ruta de introducción
  fr:
    comments: "La pratique optimale recommandée est d'utiliser les valeurs permises\
      \ par le vocabulaire contrôlé dédié à ce terme, dont la liste figure à l'adresse\
      \ http://rs.tdwg.org/dwc/doc/pw/. Pour plus de détails, voir https://doi.org/10.3897/biss.3.38084.\
      \ Ce terme a un équivalent dans le dwciri: namespace qui n'autorise qu'un IRI\
      \ comme valeur, alors que ce terme autorise n'importe quelle valeur sous forme\
      \ de chaîne de caractères."
    description: "Le processus par lequel un dwc:Organism s'est retrouvé à un endroit\
      \ donné à un moment donné."
    label: "Voie d'accès"
  ru:
    comments: 'Рекомендуется использовать значения из контролируемого словаря, закреплённого
      за этим термином: http://rs.tdwg.org/dwc/doc/pw/. За дополнительной информацией
      обращайтесь к https://doi.org/10.3897/biss.3.38084. У этого термина есть эквивалент
      в пространстве имён dwciri:, допускающий в качестве значений только IRI, тогда
      как данный термин допускает любое строковое значение.'
    description: Процесс, в результате которого dwc:Organism оказался в определённом
      месте в определённое время.
    label: Путь
