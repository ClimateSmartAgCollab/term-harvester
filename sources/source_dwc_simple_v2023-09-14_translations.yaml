http://rs.tdwg.org/dwc/terms/infragenericEpithet:
  cs:
    comments: Termín dwc:infragenericEpithet by měl být používán ve spojení s dwc:genericName,
      dwc:specificEpithet, dwc:infraspecificEpithet, dwc:taxonRank a dwc:scientificNameAuthorship,
      aby reprezentoval jednotlivé prvky kompletního dwc:scientificName. Lze je použít
      k označení zařazení druhu do podrodu, které se v zoologii často uvádí v závorce.
      Může být také použit pro sdílení infragenerických jmen, jako jsou botanické
      sekce (např. `Vicia sect. Cracca`).
    description: Infragenerická část binomického názvu, která je vyšší než druh, ale
      nižší než rod.
    label: Infragenerický epiteton
  es:
    comments: El término dwc:infragenericEpithet debe ser utilizado conjuntamente
      con dwc:genericName, dwc:specificEpithet, dwc:infraspecificEpithet, dwc:taxonRank
      y dwc:scientificNameAuthorship para representar los elementos individuales del
      dwc:scientificName completo. Este puede ser utilizado para indicar la colocación
      del subgénero de una especie, que en zoología normalmente se coloca entre parentesis.
      También puede ser utilizado para compartir nombres infragenéricos como secciones
      botánicas (e.g.`Vicia sect. Cracca`).
    description: La parte del epíteto infragenérico en un nombre binomial en rangos
      que están por encima de la especie, pero por debajo del género.
    label: Epíteto infragenérico
  fr:
    comments: "Le terme dwc:infragenericEpithet doit être utilisé conjointement avec\
      \ dwc:genericName, dwc:specificEpithet, dwc:infraspecificEpithet, dwc:taxonRank\
      \ et dwc:scientificNameAuthorship pour représenter les éléments individuels\
      \ du dwc:scientificName complet. Il peut être utilisé pour indiquer l'emplacement\
      \ du sous-genre d'une espèce, qui est souvent indiqué entre parenthèses en zoologie.\
      \ Il peut également être utilisé pour partager des noms infragénériques tels\
      \ que des sections en botanique (par exemple, `Vicia sect. Cracca`)."
    description: "Partie infragénérique d'un nom binomial dont le rang est supérieur\
      \ à celui de l'espèce mais inférieur à celui du genre."
    label: Épithète infragénérique
  ru:
    comments: Термин dwc:infragenericEpithet применяется вместе с dwc:genericName,
      dwc:specificEpithet, dwc:infraspecificEpithet, dwc:taxonRank и dwc:scientificNameAuthorship
      для формирования полного dwc:scientificName. С его помощью можно указать принадлежность
      вида к подроду (в зоологии такое указание часто заключается в скобки). Кроме
      того, термин подходит для передачи названий внутриродовых таксонов, например,
      ботанических секций (как `Vicia sect. Cracca`).
    description: Часть бинарного названия таксона, имеющего ранг между родом и видом.
    label: Внутриродовой эпитет
  zh:
    comments: ''
    description: ''
    label: 屬以下別名
http://rs.tdwg.org/dwc/terms/infraspecificEpithet:
  cs:
    comments: ''
    description: ''
    label: Infraspecifický epithet
  es:
    comments: 'En botánica, las cadenas de nombres que aparecen en la literatura y
      en las identificaciones pueden incluir múltiples rangos infraespecíficos. Según
      el Código Internacional de Nomenclatura para algas, hongos y plantas (artículos
      6.7 y 24.1 del Código de Shenzhen), los nombres válidos solo constan de dos
      epítetos, siendo el de rango inferior el correspondiente a dwc:infraspecificEpithet.
      Por ejemplo: en la cadena `Indigofera charlieriana subsp. sessilis var. scaberrima`,
      el dwc:infraspecificEpithet es `scaberrima` y el dwc:scientificName es `Indigofera
      charlieriana var. scaberrima`. Utilice dwc:verbatimIdentification para la cadena
      de nombre completa empleada en una dwc:Identification. '
    description: El nombre de la categoría infraespecífica más baja o terminal del
      dwc:scientificName.
    label: Epíteto infraespecífico
  fr:
    comments: ''
    description: ''
    label: Épithète infraspécifique
  ru:
    comments: ''
    description: ''
    label: Внутривидовой эпитет
  zh:
    comments: ''
    description: ''
    label: 種以下別名
