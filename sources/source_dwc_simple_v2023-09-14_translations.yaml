      muestreo (dwc:Event), que ocurre en un lugar y tiempo determinado.
    label: ID del evento
  fr:
    comments: ''
    description: "Un identifiant pour l'ensemble des informations associées à un dwc:Event\
      \ (quelque chose qui se produit à un endroit et à un temps donnés). Il peut\
      \ s'agir d'un identifiant unique global ou d'un identifiant spécifique à un\
      \ jeu de données."
    label: "Identifiant de l'événement"
  ru:
    comments: ''
    description: Идентификатор набора информации, связанного с dwc:Event (что-то,
      что происходит в определенном месте и времени). Может быть глобальным уникальным
