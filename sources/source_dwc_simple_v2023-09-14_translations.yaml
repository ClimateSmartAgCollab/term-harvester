  ru:
    comments: ''
    description: ''
    label: Минимальная высота в метрах
http://rs.tdwg.org/dwc/terms/month:
  cs:
    comments: ''
    description: Celé číslo měsíce, ve kterém dwc:Event nastala.
    label: měsíc
  es:
    comments: ''
    description: El mes en números enteros en que ocurrió durante el cual se produjo
      el evento de observación o colecta de un organismo o muestra.
    label: Mes
  fr:
    comments: ''
    description: "Le mois (nombre entier) au cours duquel le dwc:Event s'est produit."
    label: Mois
  ru:
