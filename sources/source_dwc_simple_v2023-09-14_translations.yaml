http://rs.tdwg.org/dwc/terms/locality:
  cs:
    comments: Méně specifické geografické informace lze poskytnout v jiných geografických
      termínech (dwc:higherGeography, dwc:continent, dwc:country, dwc:stateProvince,
      dwc:county, dwc:municipality, dwc:waterBody, dwc:island, dwc:islandGroup). Tento
      termín může obsahovat informace upravené oproti originálu za účelem opravy zjištěných
      chyb nebo standardizace popisu.
    description: Konkrétní popis místa.
    label: Lokalita
  es:
    comments: La información geográfica menos específica se puede proporcionar en
      otros términos geográficos (dwc:higherGeography, dwc:continent, dwc:country,
      dwc:stateProvince, dwc:county, dwc:municipality, dwc:waterBody, dwc:island,
      dwc:islandGroup). Este término puede contener información modificada de la original
      para corregir errores o estandarizar la descripción.
    description: La descripción específica del sitio.
    label: Localidad
  fr:
    comments: "Des informations géographiques moins spécifiques peuvent être fournies\
      \ dans d'autres termes géographiques (dwc:higherGeography, dwc:continent, dwc:country,\
      \ dwc:stateProvince, dwc:county, dwc:municipality, dwc:waterBody, dwc:island,\
      \ dwc:islandGroup). Ce terme peut contenir des informations modifiées par rapport\
      \ à l'original afin de corriger des erreurs apparentes ou de normaliser la description."
    description: La description précise du lieu.
    label: Localité
  ru:
    comments: Менее специфическая географическая информация может быть предоставлена
      в других географических терминах (dwc:higherGeography, dwc:continent, dwc:country,
      dwc:stateProvince, dwc:county, dwc:municipality, dwc:waterBody, dwc:island,
      dwc:islandGroup). Этот термин может содержать информацию, измененную по сравнению
      с исходной для исправления обнаруженных ошибок или стандартизации описания.
    description: Конкретное описание места находки.
    label: Локалитет
  zh:
    comments: ''
    description: 該筆紀錄的最小地點描述。
    label: 地區
http://rs.tdwg.org/dwc/terms/locationAccordingTo:
