    description: Порядковый номер месяца, в котором произошло dwc:Event.
    label: Месяц
  zh:
    comments: ''
    description: ''
    label: 月
http://rs.tdwg.org/dwc/terms/municipality:
  cs:
    comments: Doporučeným osvědčeným postupem je používat řízený slovník, například
      Getty Thesaurus of Geographic Names. Doporučeným osvědčeným postupem je ponechat
      toto pole prázdné, pokud dcterms:Location pokrývá více entit na této administrativní
      úrovni nebo pokud dcterms:Location může být v jedné nebo jiné z více možných
      entit na této úrovni. Násobnost a neurčitost geografické entity lze zachytit
      buď v termínu dwc:higherGeography, nebo v termínu dwc:locality, případně v obou.
    description: Úplný nezkrácený název nejbližšího menšího správního obvodu než kraj
      (město, obec atd.), ve kterém se dcterms:Location vyskytuje. Nepoužívejte tento
      termín pro blízké pojmenované místo, které neobsahuje vlastní dcterms:Location.
    label: Členění třetího řádu
  es:
    comments: La práctica recomendada es utilizar un vocabulario controlado, como
      el Tesauro Getty de Nombres Geográficos. La práctica recomendada es dejar este
      elemento en blanco si la dcterms:Location abarca múltiples entidades en este
      nivel administrativo, o si la dcterms:Location tiene varias entidades posibles
      en este nivel. La multiplicidad e incertidumbre de la entidad geográfica puede
      documentarse en el término dwc:higherGeography o en el término dwc:locality,
      o en ambos.
    description: El nombre completo y sin abreviar de la siguiente región administrativa
      más pequeña que el condado (ciudad, municipio, etc.) donde se encuentra el término
      dcterms:Location. No utilice este término para un lugar cercano que no contenga
      el término dcterms:Location.
    label: División administrativa de tercer orden
  fr:
    comments: "La pratique optimale recommandée est d'utiliser un vocabulaire contrôlé\
      \ tel que le Getty Thesaurus of Geographic Names. La pratique optimale recommandée\
      \ est de laisser ce champ vide si la dcterms:Location recouvre plusieurs entités\
      \ à ce niveau administratif ou si la dcterms:Location pourrait se trouver dans\
      \ l'une ou l'autre des multiples entités possibles à ce niveau. La multiplicité\
      \ et l'incertitude de l'entité géographique peuvent être renseignées soit dans\
      \ le terme dwc:higherGeography, soit dans le terme dwc:locality, soit dans les\
      \ deux."
    description: "Le nom complet et non abrégé de la région administrative immédiatement\
      \ inférieure au comté (ville, municipalité, etc.) dans laquelle se trouve la\
      \ dcterms:Location. N'utilisez pas ce terme pour un lieu nommé à proximité qui\
      \ ne contient pas la dcterms:Location elle-même."
    label: Division de troisième ordre
  ru:
    comments: Рекомендуется использовать контролируемый словарь географических названий,
      такой как Getty Thesaurus. Рекомендуется оставлять это поле пустым, если dcterms:Location
      охватывает несколько объектов на данном административном уровне или если dcterms:Location
      есть иная неопределенность в выборе одного значения для этого поля. Множественность
      и неопределенность географического объекта могут быть отражены либо в поле,
      обзозначаемом термином dwc:higherGeography, либо в поле, обозначенном термином
      dwc:locality, либо в обоих.
    description: Полное, несокращенное название следующей, меньшей чем регион единицы
      размера (район, городской округ, муниципалитет и т.д.), в которой находится
      dcterms:Location. Не используйте этот термин для обозначения близлежащего населенного
      пункта, который не содержит фактического местоположения dcterms:Location.
    label: Административная единица третьего порядка
http://rs.tdwg.org/dwc/terms/nameAccordingTo:
  cs:
    comments: ''
    description: 'Odkaz na zdroj, v němž je definován nebo naznačen konkrétní pojem
      okruhu vymezení taxonu - tradičně označovaný latinským "sensu" nebo "sec". (od
      secundum, což znamená "podle"). U taxonů, které jsou výsledkem identifikace,
      by měl být uveden odkaz na klíče, monografie, odborníky a další zdroje.'
    label: Název podle
  es:
    comments: Este término proporciona contexto al campo dwc:scientificName. Junto
      con dwc:scientificName —y separado por `sensu` o `sec.`—, forma la etiqueta
      del concepto taxonómico; esta relación puede considerarse análoga a la que existe
      entre dwc:acceptedNameUsage y dwc:acceptedNameUsageID. En los conjuntos de datos
      del núcleo de taxones (*Taxon Core*), si no se especifica, se puede asumir que
      dwc:nameAccordingTo hace referencia al propio conjunto de datos; en este caso,
      dicho conjunto suele aportar suficiente contexto para inferir la delimitación
      del taxón y su relación con otros taxones. En los conjuntos de datos del núcleo
      de registros biológicos (*Occurrence Core*), cuando no se proporciona, dwc:nameAccordingTo
      puede referirse a la taxonomía subyacente del conjunto de datos (por ejemplo,
      *Plants of the World Online* —http://powo.science.kew.org/— para registros de
      plantas vasculares en iNaturalist, caso en el cual debería indicarse explícitamente)
      o bien —como ocurre en la mayoría de los conjuntos de datos de especímenes preservados
      (*PreservedSpecimen*)— a la propia identificación (dwc:Identification), situación
      en la que no existe contexto adicional.
    description: La referencia a la fuente en la que está definida o implícita la
      definición conceptual del taxón documentado en scientificName, tradicionalmente
      representado por el Latín “sensu” o “sec.” (de secundum, que significa “según”).
      Para los taxones que resultan de las identificaciones, una referencia a las
      claves, monografías, expertos y otras fuentes debe ser provista.
    label: Nombre de acuerdo a
  fr:
    comments: ''
    description: 'La référence à la source dans laquelle la délimitation du taxon
      concept est définie ou suggérée - traditionnellement signifiée par le latin
      "sensu" ou "sec." (de secundum qui signifie "selon"). Pour les taxons résultant
      d''identifications, une référence aux clés, monographies, experts et autres
      sources doit être donnée.'
    label: Nom selon
  ru:
    comments: ''
    description: 'Ссылка на источник, в котором определена или подразумевается конкретная
      концепция объёма таксона - традиционно обозначается латинским "sensu" или "sec."
      (от secundum, "согласно"). Для таксонов, полученных в результате идентификаций,
      следует указывать ссылки на определители, монографии, экспертов и другие источники.'
    label: Источник названия
  zh:
    comments: ''
    description: ''
    label: 學名根據於
http://rs.tdwg.org/dwc/terms/nameAccordingToID:
  cs:
    comments: ''
    description: Identifikátor zdroje, ve kterém je definován nebo naznačen specifický
      okruh pojmu taxonu. Viz dwc:nameAccordingTo.
    label: Název podle ID
  es:
    comments: ''
    description: Un identificador de la fuente/publicación en la que está definida
      o implícita la definición conceptual del taxón específico. Véase dwc:nameAccordingTo.
    label: ID del nombre de acuerdo con
  fr:
    comments: ''
    description: Un identifiant de la source dans laquelle la circonscription du concept
      de taxon associé est définie ou sous-entendue. Voir dwc:nameAccordingTo.
    label: Identifiant du nom selon
  ru:
    comments: ''
    description: Идентификатор источника, в котором определена или подразумевается
      конкретная концепция объёма таксона. См. dwc:nameAccordingTo.
    label: Идентификатор источника названия
  zh:
    comments: ''
    description: ''
    label: 學名根據於ID
http://rs.tdwg.org/dwc/terms/namePublishedIn:
  cs:
    comments: Citace prvního zveřejnění názvu v dané kombinaci, nikoliv basionym /
      původní název. Rekombinace často nejsou v zoologii publikovány, v takovém případě
      by dwc:namePublishedIn mělo být prázdné.
    description: Odkaz na publikaci, ve které byl dwc:scientificName původně vytvořen
      podle pravidel přiřazeného dwc:nomenclaturalCode.
    label: Název publikován v
  es:
    comments: La citación de la primera publicación del nombre científico documentado
      en este registro, no el basónimo/nombre original. Las recombinaciones usualmente
      no se publican en zoología, en ese caso dwc:namePublishedIn debe estar vacío.
    description: Una referencia para la publicación en que se estableció originalmente
      el taxón presente en el dwc:scientificName, bajo las reglas del dwc:nomenclaturalCode
      asociado.
    label: Nombre publicado en
  fr:
    comments: Une référence à la première publication du nom dans sa combinaison indiquée,
      et non le basionyme / nom original. Les recombinaisons ne sont souvent pas publiées
      en tant que telles en zoologie, auquel cas dwc:namePublishedIn devrait être
      vide.
    description: "Une référence à la publication dans laquelle le dwc:scientificName\
      \ a été établi à l'origine selon les règles du dwc:nomenclaturalCode associé."
    label: Nom publié dans
  ru:
    comments: Цитируется первая публикация именно этой комбинации имени, а не базионима
      / исходного названия. Поскольку в зоологии рекомбинации часто не публикуются,
      в таких случаях поле dwc:namePublishedIn следует оставлять пустым.
    description: Ссылка на публикацию, в которой dwc:scientificName было впервые установлено
      согласно правилам соответствующего dwc:nomenclaturalCode (номенклатурного кодекса).
    label: Источник первоописания названия
  zh:
    comments: ''
    description: ''
    label: 學名發表文獻
http://rs.tdwg.org/dwc/terms/namePublishedInID:
  cs:
    comments: Citace prvního zveřejnění názvu v dané kombinaci, nikoliv basionym /
      původní název. Rekombinace často nejsou v zoologii publikovány, v takovém případě
      by dwc:namePublishedInID mělo být prázdné.
    description: Identifikátor publikace, ve které byl dwc:scientificName původně
      vytvořen podle pravidel přiřazeného dwc:nomenclaturalCode.
    label: Název publikován v ID
  fr:
    comments: Une référence à la première publication du nom dans la combinaison utilisé,
      pas le basionyme / la combinaison originale. Les recombinaisons ne sont souvent
      pas publiées en tant que telles en zoologie, auquel cas dwc:namePublishedInID
      doit être vide.
    description: "Un identifiant de la publication dans laquelle le dwc:scientificName\
      \ a été établi à l'origine selon les règles du dwc:nomenclaturalCode associé."
    label: Identifiant du travail où un nom est publié
  ru:
    comments: Ссылка на первую публикацию названия в данной комбинации, а не базинонима
      / исходного названия. Рекомбинации названий часто не публикуются в зоологии.
      В этом случае dwc:namePublishedInID должно оставаться пустым.
    description: Идентификатор публикации, в которой dwc:scientificName было первоначально
      установлено в соответствии с правилами соответствующего dwc:nomenclaturalCode.
    label: ID источника первоописания
  zh:
    comments: ''
    description: ''
    label: 學名發表文獻ID
http://rs.tdwg.org/dwc/terms/namePublishedInYear:
  cs:
    comments: ''
    description: Čtyřmístný rok, ve kterém byl dwc:scientificName publikován.
    label: Název publikován v roce
  es:
    comments: ''
    description: El año de cuatro dígitos en el que se publicó el taxón presente en
      el dwc:scientificName.
    label: Nombre publicado en el año
  fr:
    comments: ''
    description: "L'année en quatre chiffres au cours de laquelle le dwc:scientificName\
      \ a été publié."
    label: Année de publication du nom
  ru:
    comments: ''
    description: Год (четырехзначное число), в который было опубликовано dwc:scientificName.
    label: Год опубликования названия
  zh:
    comments: ''
    description: ''
    label: 學名發表年份
http://rs.tdwg.org/dwc/terms/nomenclaturalCode:
  cs:
    comments: Doporučeným osvědčeným postupem je používat řízený slovník.
    description: Kód názvosloví (nebo kódy v případě ambiregnálního názvu), podle
      kterého je dwc:scientificName vytvořen.
    label: Kód názvosloví
  fr:
    comments: "La pratique optimale recommandée est d'utiliser un vocabulaire contrôlé."
    description: "Le code de nomenclature (ou les codes, dans le cas d'un nom appliqué\
      \ à un taxon dont le Règne est ambigu) régissant le dwc:scientificName."
    label: Code de nomenclature
  ru:
    comments: Рекомендуется использовать контролируемый словарь.
    description: Номенклатурный кодекс (кодексы для амбирегальных названий), по правилам
      которого составлено научное название.
    label: Номенклатурный кодекс
  zh:
    comments: ''
    description: ''
    label: 命名代碼
http://rs.tdwg.org/dwc/terms/nomenclaturalStatus:
  cs:
    comments: ''
    description: Stav související s původním zveřejněním názvu a jeho soulad s příslušnými
      pravidly názvosloví. Je založen v podstatě na algoritmu podle obchodních pravidel
      kódu. Nevyžaduje žádné taxonomické stanovisko.
    label: Stav názvosloví
  es:
    comments: ''
    description: El estado nomenclatural en la publicación original del scientificName
      y su conformidad con las normas pertinentes de nomenclatura. Está basado en
      las definiciones del nomenclaturalCode en uso y no requiere una opinión taxonómica.
    label: Estado nomenclatural
  fr:
    comments: ''
    description: "Le statut lié à la publication originale du nom et à sa conformité\
      \ aux règles correspondantes en nomenclature. Ce statut est déterminé essentiellement\
      \ sur un algorithme de prise de décision conforme aux règles du code. Il ne\
      \ nécessite pas d'opinion taxonomique."
    label: Statut nomenclatural
  ru:
    comments: ''
    description: Статус определяется алгоритмически на основе положений кодекса. Для
      его установления не требуется таксономической оценки.
    label: Номенклатурный статус
  zh:
    comments: ''
    description: ''
    label: 命名狀態
http://rs.tdwg.org/dwc/terms/objectQuantity:
  es:
    comments: Un dwc:objectQuantity debe tener un dwc:objectQuantityType correspondiente.
    description: Un número o valor de enumeración para la cantidad de dwc:MaterialEntities
      diferenciables que componen este dwc:MaterialEntity.
    label: Cantidad de objetos
http://rs.tdwg.org/dwc/terms/objectQuantityType:
  es:
    comments: 'Un dwc:objectQuantityType debe tener un dwc:objectQuantity correspondiente.
      Este término tiene un equivalente en el espacio de nombres dwciri: namespace
      que solo permite una IRI como valor, mientras que este término admite cualquier
      valor de cadena literal.'
    description: El tipo de sistema de cuantificación utilizado para la cantidad de
      dwc:MaterialEntities.
    label: Cantidad del tipo de objeto
http://rs.tdwg.org/dwc/terms/occurrenceID:
  cs:
    comments: ''
    description: ''
    label: ID Výskytu
  es:
    comments: A falta de un identificador único global persistente, construya uno
      a partir de una combinación de identificadores del registro que haga que el
      dwc:occurrenceID sea lo más parecido posible a un identificador único a nivel
      mundial.
    description: Un identificador para una dwc:Occurrence (a diferencia de un registro
      digital concreto de una dwc:Occurrence).
    label: Identificador del registro
  fr:
    comments: ''
    description: ''
    label: "Identifiant de l'occurrence"
  ru:
    comments: ''
    description: ''
    label: ID находки
  zh:
    comments: ''
    description: ''
    label: 出現紀錄ID
http://rs.tdwg.org/dwc/terms/occurrenceRemarks:
  cs:
    comments: ''
    description: Komentáře nebo poznámky k dwc:Occurrence.
    label: Záznamy o výskytu
  fr:
    comments: ''
    description: Commentaires ou notes sur le dwc:Occurence.
    label: "Remarques sur l'occurrence"
  ru:
