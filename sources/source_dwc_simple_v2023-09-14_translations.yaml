http://rs.tdwg.org/dwc/terms/geodeticDatum:
  cs:
    comments: Doporučeným osvědčeným postupem je použít kód EPSG SRS, pokud je znám.
      V opačném případě použijte řízený slovník pro název nebo kód geodetického podkladu,
      pokud je znám. V opačném případě použijte řízený slovník pro název nebo kód
      elipsoidu, je-li znám. Není-li žádný z těchto údajů znám, použijte hodnotu `nezaznamenáno`.
      Tento termín má ekvivalent ve jmenném prostoru dwciri:, který umožňuje jako
      hodnotu pouze IRI, zatímco tento termín umožňuje doslovnou hodnotu řetězce.
    description: Elipsoid, geodetický referenční bod nebo prostorový referenční systém
      (SRS), na kterém jsou založeny zeměpisné souřadnice uvedené v dwc:decimalLatitude
      a dwc:decimalLongitude.
    label: Geodetické datum
  es:
    comments: 'Se recomienda usar el código EPSG del SRS, si se conoce. De lo contrario,
      utilice un vocabulario controlado para el nombre o código del datum geodésico,
      si se conoce. De lo contrario, utilice un vocabulario controlado para el nombre
      o código del elipsoide, si se conoce. Si no se conoce ninguno de estos, utilice
      el valor `no registrado`. Este término tiene un equivalente en el espacio de
      nombres dwciri: que solo permite un IRI como valor, mientras que este término
      permite un valor literal de cadena.'
    description: El elipsoide, datum geodésico o sistema de referencia espacial (SRS
      por sus siglas en inglés) sobre el cual están referenciadas las coordenadas
      geográficas provistas en dwc:decimalLatitude y dwc:decimalLongitude.
    label: Datum geodésico
  fr:
    comments: "La pratique optimale recommandée est d'utiliser le code EPSG du SRS,\
      \ s'il est connu. Sinon, utilisez un vocabulaire contrôlé pour le nom ou le\
      \ code du système de référence géodésique, s'il est connu. Sinon, utilisez un\
      \ vocabulaire contrôlé pour le nom ou le code de l'ellipsoïde, s'il est connu.\
      \ Si aucun de ces éléments n'est connu, utiliser la valeur `not recorded` (non\
      \ documenté). Ce terme a un équivalent dans le dwciri: namespace qui n'autorise\
      \ qu'un IRI comme valeur, alors que ce terme autorise n'importe quelle valeur\
      \ sous forme de chaîne de caractères."
    description: "L'ellipsoïde, le système de référence géodésique ou le système de\
      \ référence spatiale (SRS) sur lequel sont basées les coordonnées géographiques\
      \ données dans dwc:decimalLatitude et dwc:decimalLongitude."
    label: Système géodésique
  ru:
    comments: Рекомендуемой практикой является использование кода EPSG системы пространственной
      привязки (SRS), если он известен. В противном случае используйте контролируемый
      словарь для названия или кода геодезического датума, если он известен. В противном
      случае используйте контролируемый словарь для названия или кода эллипсоида,
      если он известен. Если ничего из перечисленного неизвестно, используйте значение
      `неизвестно`. У этого термина существует эквивалент в пространстве имен dwciri:,
      который допускает только IRI в качестве значения, в то время как данный термин
      допускает использование строкового значения.
    description: Эллипсоид, геодезический датум или система пространственной привязки
      (SRS), на основе которых заданы географические координаты в dwc:decimalLatitude
      и dwc:decimalLongitude.
    label: Геодезический датум
  zh:
    comments: ''
    description: 座標的大地基準。建議使用控制詞彙；若全未知，則填入「未知 (unknown)」。
    label: 大地基準
http://rs.tdwg.org/dwc/terms/geologicalContextID:
  cs:
    comments: ''
    description: Identifikátor souboru informací spojených s dwc:GeologicalContext
      (umístění v rámci geologického kontextu, např. stratigrafie). Může to být globální
      jedinečný identifikátor nebo identifikátor specifický pro danou datovou sadu.
    label: ID geologické souvislosti
  es:
    comments: ''
    description: Un identificador para el conjunto de la información asociada a un
      dwc:GeologicalContext (la ubicación dentro de un contexto geológico, tal como
      estratigrafía). Puede ser un identificador único global o un identificador específico
      para el conjunto de datos.
    label: ID del contexto geológico
  fr:
    comments: ''
    description: "Un identifiant pour l'ensemble des informations associées à un dwc:GeologicalContext\
      \ (l'emplacement dans un contexte géologique, tel que la stratigraphie). Il\
      \ peut s'agir d'un identifiant unique global (GUI) ou d'un identifiant spécifique\
      \ à un jeu de données."
    label: Identifiant du contexte géologique
  ru:
    comments: ''
    description: Идентификатор информации, связанного с dwc:GeologicalContext (местоположение
      в геологическом контексте, например, в стратиграфии). Может быть глобальным
      уникальным идентификатором или идентификатором, специфичным для набора данных.
    label: Идентификатор геологического контекста
http://rs.tdwg.org/dwc/terms/georeferenceProtocol:
  cs:
    comments: Tento termín má ekvivalent ve jmenném prostoru dwciri:, který jako hodnotu
      umožňuje pouze IRI, zatímco tento termín umožňuje zadat jakoukoli řetězcovou
      literální hodnotu.
    description: ''
    label: Protokol georeference
  es:
    comments: 'Este término tiene un equivalente en el dwciri: namespace que solo
      permite usar un IRI como valor, mientras que este término permite cualquier
      valor de cadena de texto libre.'
    description: Una descripción o referencia a un dwc:Protocol utilizado para determinar
      una huella espacial, coordenadas e incertidumbres.
    label: Protocolo de georreferenciación
  fr:
    comments: "Ce terme a un équivalent dans le dwciri: namespace qui n'autorise qu'un\
      \ IRI comme valeur, alors que ce terme autorise n'importe quelle valeur sous\
      \ forme de chaîne de caractères."
    description: ''
    label: Protocole de géoréférencement
  ru:
    comments: Этот термин имеет эквивалент в пространстве имён dwciri:, который допускает
      только IRI в качестве значения, в то время как данный термин допускает использование
      любой строки в качестве литерала.
    description: ''
    label: Протокол геопривязки
  zh:
    comments: ''
    description: ''
    label: 地理點位紀錄方法
http://rs.tdwg.org/dwc/terms/georeferenceRemarks:
  cs:
    comments: ''
    description: Komentáře nebo poznámky k určení prostorového popisu, vysvětlující
      předpoklady, které doplňují nebo jsou v rozporu s předpoklady formalizovanými
      v metodě uvedené v dwc:georeferenceProtocol.
    label: Poznámky ke georeferenci
  es:
    comments: ''
    description: Comentarios o notas sobre la determinación de la descripción espacial,
      explicando los supuestos realizados en adición o en oposición a los formalizados
      en el método mencionado en dwc:georeferenceProtocol.
    label: Comentarios de la georreferenciación
  fr:
    comments: ''
    description: Des commentaires ou des notes sur la définition de la description
      spatiale, expliquant les hypothèses formulées en plus ou en contradiction avec
      celles formalisées dans la méthode mentionnée dans dwc:georeferenceProtocol.
    label: Remarques sur le géoréférencement
  ru:
    comments: ''
    description: Комментарии или примечания о выполнении пространственного описания,
      поясняющие предположения, сделанные в дополнение или в противовес тем, которые
      формализованы в методе, указанном в dwc:georeferenceProtocol.
    label: Примечания к геопривязке
  zh:
    comments: ''
    description: ''
    label: 地理點位紀錄備註
http://rs.tdwg.org/dwc/terms/georeferenceSources:
  cs:
    comments: Doporučeným postupem je oddělovat hodnoty v seznamu mezerou svislou
      čarou mezerou (` | `). Tento termín má ekvivalent ve jmenném prostoru dwciri:,
      který jako hodnotu povoluje pouze IRI, zatímco tento termín povoluje jakoukoli
      řetězcovou literální hodnotu.
    description: ''
    label: Zdroje georeferencí
  es:
    comments: 'La práctica recomendada es separar los valores en una lista con espacio-barra
      vertical-espacio (` | `). Este término tiene un equivalente en el dwciri: namespace
      que solo permite usar un IRI como valor, mientras que este término permite cualquier
      valor de cadena de texto libre.'
    description: Una lista (concatenada y separada) de mapas, nomencladores u otros
      recursos utilizados para georreferenciar un dcterms:Location, descriptos con
      suficiente detalle para permitir que cualquier persona en el futuro utilice
      los mismos recursos.
    label: Fuentes de georreferenciación
  fr:
    comments: "La pratique optimale recommandée est de séparer les valeurs d'une liste\
      \ par une barre verticale (` | `). Ce terme a un équivalent dans le dwciri:\
      \ namespace qui n'autorise qu'un IRI comme valeur, alors que ce terme autorise\
      \ n'importe quelle valeur sous forme de chaîne de caractères."
    description: ''
    label: Sources du géoréférencement
  ru:
    comments: 'Рекомендуемой практикой является разделение значений в списке с помощью
      пробела, вертикальной черты и пробела (` | `). У этого термина существует эквивалент
      dwciri: namespace, который допускает только IRI в качестве значения, в то время
      как данный термин допускает использование любого строкового значения.'
    description: ''
    label: Источники геопривязки
  zh:
    comments: ''
    description: ''
    label: 地理點位紀錄平台
http://rs.tdwg.org/dwc/terms/georeferenceVerificationStatus:
  cs:
    comments: Doporučeným osvědčeným postupem je používat řízený slovník. Tento termín
      má ekvivalent ve jmenném prostoru dwciri:, který jako hodnotu povoluje pouze
      IRI, zatímco tento termín povoluje jakoukoli řetězcovou literální hodnotu.
    description: Kategorický popis míry, do jaké byl georeferenční údaj ověřen jako
      nejlepší možný prostorový popis dcterms:Location of the dwc:Occurrence.
    label: Stav ověření georeference
  es:
    comments: 'La práctica recomendada es usar un vocabulario controlado. Este término
      tiene un equivalente en el dwciri: namespace que solo permite un IRI como valor,
      mientras que este término permite cualquier cadena de texto.'
    description: Una descripción categórica sobre la verificación de la georreferenciación
      usada para representar la descripción espacial para dcterms:Location del dwc:Occurrence.
    label: Estado de la verificación de la georreferenciación
  fr:
    comments: "La pratique optimale recommandée est d'utiliser un vocabulaire contrôlé.\
      \ Ce terme a un équivalent dans le dwciri: namespace qui n'autorise qu'un IRI\
      \ comme valeur, alors que ce terme autorise n'importe quelle valeur sous forme\
      \ de chaîne de caractères."
    description: Une description qualitative de la mesure dans laquelle le géoréférencement
      est considéré comme représentant la meilleure description spatiale possible
      pour la dcterms:Location de la dwc:Occurrence.
    label: Statut de vérification du géoréférencement
  ru:
    comments: Рекомендуемой практикой является использование контролируемого словаря.
      У этого термина существует эквивалент в пространстве имен dwciri:, который допускает
      только IRI в качестве значения, в то время как данный термин допускает использование
      любого строкового значения.
    description: Категориальное описание степени, в которой геопривязка была проверена
      на соответствие наилучшему возможному пространственному описанию для dcterms:Location
      в dwc:Occurrence.
    label: Статус верефикации геопривязки
