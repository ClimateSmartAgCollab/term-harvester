    description: Una lista (concatenada y separada) de dcterms:BibliographicResources
      para dwc:NucleotideSequences asociados a una dwc:MaterialEntity.
    label: Secuencias asociadas
  fr:
    comments: ''
    description: ''
    label: Séquences associées
  ru:
