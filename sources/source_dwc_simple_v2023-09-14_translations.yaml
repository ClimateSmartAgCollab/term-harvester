      а не на номенклатурные детали, связанные с dwc:Taxon.
    label: ID таксономической концепции
  zh:
    comments: ''
    description: ''
    label: 分類群概念ID
http://rs.tdwg.org/dwc/terms/taxonID:
  cs:
    comments: ''
    description: ''
    label: ID taxonu
  es:
    comments: ''
    description: Un identificador para un dwc:Taxon.
    label: ID del Taxón
  fr:
    comments: ''
    description: ''
    label: Identifiant de taxon
  ru:
    comments: ''
    description: ''
    label: ID таксона
  zh:
    comments: ''
    description: ''
    label: 分類群ID
http://rs.tdwg.org/dwc/terms/taxonRank:
  cs:
    comments: ''
    description: Taxonomické zařazení nejkonkrétnějšího názvu v dwc:scientificName.
    label: Zařazení taxonu
  es:
    comments: La mejor práctica recomendada es utilizar un vocabulario controlado.
      Los rangos taxonómicos de algas, hongos y plantas se definen en el Código Internacional
      de Nomenclatura para algas, hongos y plantas (artículos H3.2, H4.4 y H.3.1 del
