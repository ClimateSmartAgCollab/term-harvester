    description: Úplný název nejnižší možné geologické biostratigrafické zóny stratigrafického
      horizontu, ze kterého byl dwc:MaterialEntity odebrán.
    label: Nejnižší biostratigrafická zóna
  es:
    comments: ''
    description: El nombre completo de la zona geológica bioestratigráfica más baja
      posible del horizonte estratigráfico donde se recolectó el dwc:MaterialEntity.
    label: Zona bioestratigráfica inferior
  fr:
    comments: ''
    description: "Le nom complet de la zone géologique biostratigraphique la plus\
      \ basse possible de l'horizon stratigraphique à partir duquel l'entité dwc:MaterialEntity\
      \ a été collectée."
    label: Zone biostratigraphique inférieure
  ru:
    comments: ''
    description: Полное название самой нижней возможной геологической биостратиграфической
      зоны стратиграфического горизонта, из которого был собран dwc:MaterialEntity.
    label: Самая нижняя биостратиграфическая зона
http://rs.tdwg.org/dwc/terms/materialEntityCategory:
  es:
    comments: 'La mejor práctica recomendada consiste en utilizar un vocabulario limitado
      y estrictamente controlado. Este término tiene un equivalente en el espacio
      de nombres dwciri: namespace que solo admite una IRI como valor, mientras que
      este término permite cualquier valor de tipo cadena literal.'
    description: Una clasificación de alto nivel y mutuamente excluyente que describe
      la sustancia fundamental y el origen de una dwc:MaterialEntity.
    label: Categoría de entidad material
http://rs.tdwg.org/dwc/terms/materialEntityID:
  cs:
    comments: Hodnoty dwc:materialEntityID jsou určeny k jednoznačné a trvalé identifikaci
      konkrétní dwc:MaterialEntity v rámci určitého kontextu. Příklady kontextu zahrnují
      konkrétní sbírku vzorků, organizaci nebo celosvětové měřítko. Doporučeným osvědčeným
      postupem je používat trvalý, celosvětově jedinečný identifikátor. Identifikátor
      je vázán na fyzický objekt (dwc:MaterialEntity) na rozdíl od konkrétního digitálního
      záznamu (reprezentace) tohoto fyzického objektu.
    description: Identifikátor konkrétní instance dwc:MaterialEntity.
    label: ID materiální entity
  es:
    comments: Los valores de dwc:materialEntityID están diseñados para identificar
      de forma única y persistente una dwc:MaterialEntity específica dentro de un
      contexto. Algunos ejemplos de contexto incluyen una colección de muestras específica,
      una organización o la escala mundial. Se recomienda utilizar un identificador
      único global y persistente. El identificador está vinculado a un objeto físico
      (dwc:MaterialEntity), en lugar de a un registro digital específico (representación)
      de dicho objeto físico.
    description: Un identificador para una instancia particular de dwc:MaterialEntity.
    label: Identificador de entidad material
  fr:
    comments: "Les valeurs de dwc:materialEntityID sont destinées à identifier de\
      \ manière unique et permanente une dwc:MaterialEntity particulière dans un certain\
      \ contexte. Les exemples de contexte comprennent une collection d'échantillons\
      \ donnée, une organisation donnée ou l'échelle globale. La pratique optimale\
      \ recommandée est d'utiliser un identifiant permanent et unique au niveau mondial.\
      \ L'identifiant est lié à un objet physique (la dwc:MaterialEntity) par opposition\
      \ à un enregistrement numérique particulier (représentation) de cet objet physique."
    description: "Identifiant d'une instance particulière d'une dwc:MaterialEntity."
    label: "Identifiant d'entité matérielle"
  ru:
    comments: Значения dwc:materialEntityID предназначены для однозначной и постоянной
      идентификации конкретной dwc:MaterialEntity в определённом контексте. Примерами
      контекста могут быть конкретная коллекция образцов, организация или мировой
      масштаб. Рекомендуемой лучшей практикой является использование постоянного глобально
      уникального идентификатора. Этот идентификатор связан с физическим объектом
      (dwc:MaterialEntity), в отличие от конкретной цифровой записи (представления)
      этого физического объекта.
    description: Идентификатор для конкретного экземпляра dwc:MaterialEntity.
    label: Идентификатор материального объекта
  zh:
    comments: ''
    description: ''
    label: 實體物質ID
http://rs.tdwg.org/dwc/terms/materialEntityRemarks:
  cs:
    comments: ''
    description: ''
    label: Poznámky k materiálním entitám
  es:
    comments: ''
    description: Comentarios o notas sobre una dwc:MaterialEntity.
    label: Observaciones sobre la entidad material
  fr:
    comments: ''
    description: ''
    label: "Remarques sur l'entité matérielle"
  ru:
    comments: ''
    description: ''
    label: Примечания о материальном объекте
  zh:
    comments: ''
    description: ''
    label: 實體物質註記
http://rs.tdwg.org/dwc/terms/materialEntityType:
  cs:
    comments: Obecnější klasifikace dwc:MaterialEntity než dwc:preparations. Doporučeným
      osvědčeným postupem je použití řízeného slovníku. Tento termín má ekvivalent
      ve jmenném prostoru dwciri:, který umožňuje jako hodnotu pouze IRI, zatímco
      tento termín umožňuje jakýkoli textový řetězec.
    description: ''
    label: Typ entity subjektu
  es:
    comments: 'Una clasificación más genérica de una dwc:MaterialEntity que dwc:preparations.
      Se recomienda usar un vocabulario controlado. Este término tiene un equivalente
      en el espacio de nombres dwciri: que solo permite un valor de IRI, mientras
      que este término permite cualquier valor literal de cadena.'
    description: Una clasificación de una dwc:MaterialEntity más genérica que dwc:preparations,
      pero menos amplia que dwc:materialCategory.
    label: Tipo de Entidad Material
  fr:
    comments: "Classification plus générique d'une dwc:MaterialEntity que dwc:preparations.\
      \ La pratique optimale recommandée est d'utiliser un vocabulaire contrôlé. Ce\
      \ terme a un équivalent dans le dwciri: namespace qui n'autorise qu'un IRI comme\
      \ valeur, alors que ce terme autorise n'importe quelle valeur sous forme de\
      \ chaîne de caractères."
    description: ''
    label: "Type d'entité matérielle"
  ru:
    comments: Более обобщенная классификация dwc:MaterialEntity, чем dwc:preparations.
      Рекомендуется использовать контролируемый словарь. Для данного термина существует
      аналог в пространстве имён dwciri:, который может принимать в качестве значений
      только IRI, в отличие от настоящего термина, значение которого может быть представлено
      произвольной строкой.
    description: ''
    label: Тип материального объекта
http://rs.tdwg.org/dwc/terms/maximumDepthInMeters:
  cs:
    comments: ''
    description: ''
    label: Maximální hloubka v metrech
  es:
    comments: Ver https://docs.gbif.org/georeferencing-best-practices/1.0/en/#img-depth-elevation-distance-above-surface.
    description: La mayor profundidad dentro de un rango de profundidades, medida
      con respecto a la superficie de referencia vertical indicada por el valor de
      dwc:verticalDatum.
    label: Profundidad máxima en metros
  fr:
    comments: ''
    description: ''
    label: Profondeur maximale en mètres
  ru:
    comments: ''
    description: ''
    label: Максимальная глубина в метрах
  zh:
    comments: ''
    description: ''
    label: 最大深度(公尺)
http://rs.tdwg.org/dwc/terms/maximumDistanceAboveSurfaceInMeters:
  cs:
    comments: ''
    description: Větší vzdálenost v rozsahu vzdálenosti od referenční plochy ve svislém
      směru v metrech. Kladné hodnoty použijte pro místa nad povrchem, záporné hodnoty
      pro místa pod povrchem. Pokud jsou uvedeny míry hloubky, je referenčním povrchem
      místo dané hloubkou, jinak je referenčním povrchem místo dané nadmořskou výškou.
    label: Maximální vzdálenost nad povrchem v metrech
  es:
    comments: ''
    description: La mayor distancia en metros, en un rango de distancia desde una
      superficie de referencia en dirección vertical. Use valores positivos para ubicaciones
      por encima de la superficie y valores negativos para ubicaciones por debajo
      de ella. Si las medidas de profundidad son proporcionadas, la superficie de
      referencia es la ubicación determinada por la profundidad, de lo contrario la
      superficie de referencia es la ubicación dada por la elevación.
    label: Distancia máxima de la superficie en metros
  fr:
    comments: ''
    description: "La plus grande distance d'une plage de distances par rapport à une\
      \ surface de référence dans la dimension verticale, en mètres. Utilisez des\
      \ valeurs positives pour les emplacements situés au-dessus de la surface, et\
      \ des valeurs négatives pour les emplacements situés en dessous. Si des mesures\
      \ de profondeur sont données, la surface de référence est l'emplacement donné\
      \ par la profondeur, sinon la surface de référence est l'emplacement donné par\
      \ l'élévation."
    label: Distance maximale au-dessus de la surface en mètres
  ru:
    comments: ''
    description: Большее расстояние в диапазоне расстояния от опорной поверхности
      в вертикальном направлении, в метрах. Используйте положительные значения для
      точек выше поверхности, отрицательные для точек ниже. Если приведены замеры
      глубины, то опорной поверхностью является местоположение, указанное по глубине,
      в противном случае опорной поверхностью является местоположение, указанное по
      высоте над уровнем моря.
    label: Максимальная высота над поверхностью в метрах
  zh:
    comments: ''
    description: ''
    label: 最大表面垂直距離
