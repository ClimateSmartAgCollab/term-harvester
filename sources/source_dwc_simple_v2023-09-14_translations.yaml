http://rs.tdwg.org/dwc/terms/dynamicProperties:
  cs:
    comments: Doporučeným osvědčeným postupem je použití schématu kódování klíč:hodnota
      pro formát výměny dat, jako je JSON.
    description: Seznam dalších měření, skutečností, charakteristik nebo tvrzení o
