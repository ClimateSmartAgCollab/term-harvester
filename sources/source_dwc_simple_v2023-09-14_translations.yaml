http://rs.tdwg.org/dwc/terms/genericName:
  cs:
    comments: U synonym se může lišit přijímaný rod a rodová část názvu. Termín dwc:genericName
      by měl být použit společně s dwc:specificEpithet pro vytvoření binomického názvu
      a s dwc:infraspecificEpithet pro vytvoření trinomického názvu. Termín dwc:genericName
      by se měl používat pouze pro kombinace. Jednočleny obecného stupně nemají dwc:genericName.
    description: Rodová část dwc:scientificName bez autorství.
    label: Obecný název
  es:
    comments: Para sinónimos el género aceptado y la parte del género del nombre pueden
      ser diferentes. El elemento dwc:genericName debe ser usado junto al dwc:specificEpithet
      para formar un binomio y con dwc:infraspecificEpithet para formar un trinomio.
      El elemento dwc:genericName solo debe ser usado para combinaciones. Uninomiales
      de rango genérico no tienen un dwc:genericName.
    description: La parte del género en un dwc:scientificName sin la autoría.
    label: Nombre genérico
  fr:
    comments: "Pour les synonymes, le genre accepté et la partie générique du nom\
      \ peuvent être différents. Le terme dwc:genericName doit être utilisé avec dwc:specificEpithet\
      \ pour former un binôme et avec dwc:infraspecificEpithet pour former un trinôme.\
      \ Le terme dwc:genericName ne doit être utilisé que pour les combinaisons. Les\
      \ uninomiaux de rang genre n'ont pas de dwc:genericName."
    description: "La partie générique du dwc:scientificName sans l'autorité."
    label: Nom générique
  ru:
    comments: Для синонимов принятый род и родовая часть названия могут различаться.
      Термин dwc:genericName должен использоваться вместе с dwc:specificEpithet для
      образования бинома и с dwc:infraspecificEpithet для образования тринома. Термин
      dwc:genericName должен использоваться только для комбинаций. Униномы родового
      ранга не имеют dwc:genericName.
    description: Родовая часть dwc:scientificName без авторства.
    label: Родовое название
  zh:
    comments: ''
    description: ''
    label: 通用名稱
