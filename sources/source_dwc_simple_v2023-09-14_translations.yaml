http://rs.tdwg.org/dwc/terms/verbatimIdentification:
  cs:
    comments: Tento termín má umožnit zachycení nezměněné původní identifikace/určení,
      včetně identifikačních kvalifikátorů, hybridních vzorců, nejistot atd. Tento
      termín je určen k použití jako doplněk k dwc:scientificName (a dwc:identificationQualifier
      atd.), nikoli místo něj.
    description: Řetězec představující taxonomickou identifikaci, jak je uvedena v
      původním záznamu.
    label: Přesná identifikace
  es:
    comments: Este elemento permite documentar la identificación o determinación original
      inalterada, incluidos los calificadores de identificación, fórmulas híbridas,
      incertidumbres, etc. Este término está pensado para utilizarse como complemento
      de dwc:scientificName (y dwc:identificationQualifier etc.) no en sustitución
      de estos.
    description: ''
    label: ''
  fr:
    comments: "Ce terme est destiné à permettre la saisie d'une identification/détermination\
      \ originale non modifiée, y compris les qualificatifs d'identification, les\
      \ formules hybrides, les incertitudes, etc. Ce terme doit être utilisé en complément\
      \ de dwc:scientificName (et de dwc:identificationQualifier, etc.), et non en\
      \ remplacement de ce dernier."
    description: "Une chaîne de caractères représentant l'identification taxonomique\
      \ telle qu'elle apparaît dans l'enregistrement original."
    label: "Verbatim de l'identification"
  ru:
    comments: Назначение данного термина — обеспечить фиксацию неизменённой исходной
      идентификации/определения, включая специальные обозначения, формулы гибридов,
      указания на неопределённость и т.д. Данный термин предназначен для использования
      в дополнение к dwc:scientificName (а также dwc:identificationQualifier и т.п.),
      но не для его замены.
    description: Таксономическое определение (результат идентификации), зафиксированное
      в первоисточнике в его исходной форме.
    label: Идентификация по первоисточнику
  zh:
    comments: ''
    description: ''
    label: 字面上鑑定
http://rs.tdwg.org/dwc/terms/verbatimLabel:
  cs:
    comments: ''
    description: ''
    label: Přesný štítek
  es:
    comments: El contenido de este término no debe incluir adornos, prefijos, encabezados
      ni otros añadidos al texto. No se deben desarrollar las abreviaturas ni corregir
      las supuestas faltas de ortografía. Se pueden utilizar líneas o saltos de línea
      entre bloques de texto que puedan verificarse consultando las etiquetas originales
      o imágenes de las mismas. Entre los ejemplos de entidades materiales se incluyen
      especímenes conservados, especímenes fósiles y muestras de material. La práctica
      recomendada es utilizar UTF-8 para todos los caracteres. También se recomienda
      añadir el comentario «verbatimLabel derived from human transcription» en dwc:materialEntityRemarks.
      Se pueden encontrar ejemplos en https://dwc.tdwg.org/examples/verbatimLabel.
    description: Una representación original y literal de la información escrita adherida
      a un dwc:MaterialEntity o relacionada con él.
    label: ''
  fr:
    comments: ''
    description: ''
    label: "Verbatim de l'étiquette"
  ru:
    comments: ''
    description: ''
    label: Этикетка по первоисточнику
  zh:
    comments: ''
    description: ''
    label: 字面上標籤
