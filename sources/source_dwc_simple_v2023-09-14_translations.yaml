      de un cultivar consta de un nombre botánico seguido de un epíteto de cultivar.
      El valor asignado a dwc:cultivarEpithet no debe incluir comillas. Se debe utilizar
      el término dwc:taxonRank para indicar de qué tipo de nombre de planta cultivada
      se trata (p. ej., cultivar, grupo de cultivares, grex). Este epíteto, incluyendo
      cualquier apóstrofe que lo encierre o sufijo, también debe indicarse en dwc:scientificName.
