  ru:
    comments: ''
    description: ''
    label: Полевой номер
  zh:
    comments: ''
    description: ''
    label: 野外調查編號
http://rs.tdwg.org/dwc/terms/footprintSRS:
  cs:
    comments: Doporučeným postupem je použít kód EPSG systému SRS, pokud je znám.
      V opačném případě použijte řízený slovník pro název nebo kód geodetického bodu,
      pokud je znám. V opačném případě použijte řízený slovník pro název nebo kód
      elipsoidu, pokud je znám. Pokud není znám žádný z těchto údajů, použijte hodnotu
      „nezaznamenáno“. Je také povoleno uvést SRS ve formátu Well-Known-Text, zejména
      pokud žádný kód EPSG neposkytuje potřebné hodnoty pro atributy SRS. Tento termín
      nepoužívejte k popisu SRS dwc:decimalLatitude a dwc:decimalLongitude, ani k
      popisu jakýchkoli přesných souřadnic – místo toho použijte dwc:geodeticDatum
      a dwc:verbatimSRS. Tento termín má ekvivalent v jmenném prostoru dwciri:, který
      jako hodnotu povoluje pouze IRI, zatímco tento termín povoluje jakoukoli hodnotu
      znakového řetězce.
    description: Elipsoid, geodetický referenční bod nebo prostorový referenční systém
      (SRS), na kterém je založena geometrie uvedená v dwc:footprintWKT.
    label: Stopa SRS
  es:
    comments: 'La mejor práctica recomendada es usar el código EPSG del SRS, si se
      conoce. De lo contrario, use un vocabulario controlado para el nombre o código
      del datum geodésico, si se conoce. De lo contrario, use un vocabulario controlado
      para el nombre o código del elipsoide, si se conoce. Si no se conoce ninguno
      de estos, use el valor `no registrado`. También se permite proporcionar el SRS
      en Well-Known-Text, especialmente si ningún código EPSG proporciona los valores
      necesarios para los atributos del SRS. No use este término para describir el
      SRS de dwc:decimalLatitude y dwc:decimalLongitude, ni de ninguna coordenada
      textual; use dwc:geodeticDatum y dwc:verbatimSRS en su lugar. Este término tiene
      un equivalente en el espacio de nombres dwciri: que solo permite un IRI como
      valor, mientras que este término permite cualquier valor literal de cadena.'
    description: El elipsoide, datum geodésico o sistema de referencia espacial (SRS
      por sus siglas en inglés) sobre el cual está referenciada la geometría dada
      en dwc:footprintWKT.
    label: SRS del footprint
  fr:
    comments: "La pratique optimale recommandée est d'utiliser le code EPSG du SRS,\
      \ s'il est connu. Sinon, utilisez un vocabulaire contrôlé pour le nom ou le\
      \ code du système de référence géodésique, s'il est connu. Sinon, utilisez un\
      \ vocabulaire contrôlé pour le nom ou le code de l'ellipsoïde, s'il est connu.\
      \ Si aucun de ces éléments n'est connu, utiliser la valeur `not recorded` (non\
      \ documenté). Il est également permis de fournir le SRS en Well-Known-Text,\
      \ en particulier si aucun code EPSG ne fournit les valeurs nécessaires pour\
      \ les attributs du SRS. N'utilisez pas ce terme pour décrire le SRS de dwc:decimalLatitude\
      \ et de dwc:decimalLongitude, ni de coordonnées verbatim - utilisez plutôt dwc:geodeticDatum\
      \ et dwc:verbatimSRS respectivement. Ce terme a un équivalent dans le dwciri:\
      \ namespace qui n'autorise qu'un IRI comme valeur, alors que ce terme autorise\
      \ n'importe quelle valeur sous forme de chaîne de caractères."
    description: "L'ellipsoïde, le système de référence géodésique ou le système de\
      \ référence spatiale (SRS) sur lequel la géométrie donnée dans dwc:footprintWKT\
      \ est basée."
    label: "SRS de l'emprise au sol"
  ru:
    comments: Рекомендуемой практикой является использование кода EPSG системы пространственной
      привязки (SRS), если он известен. В противном случае используйте контролируемый
      словарь для названия или кода геодезического датума, если он известен. В противном
      случае используйте контролируемый словарь для названия или кода эллипсоида,
      если он известен. Если ничего из перечисленного неизвестно, используйте значение
      not recorded. Также допускается указание системы пространственной привязки в
      формате Well-Known Text, особенно если ни один код EPSG не предоставляет необходимых
      значений для атрибутов SRS. Не используйте этот термин для описания системы
      пространственной привязки координат dwc:decimalLatitude и dwc:decimalLongitude,
      а также любых исходных координат - вместо этого используйте dwc:geodeticDatum
      и dwc:verbatimSRS. У этого термина существует эквивалент в пространстве имен
      dwciri:, который допускает только IRI в качестве значения, в то время как данный
      термин допускает использование любого строкового значения.
    description: Эллипсоид, геодезический датум или система пространственной привязки
      (SRS), на основе которых задана геометрия в dwc:footprintWKT.
    label: Система пространственной привязки
http://rs.tdwg.org/dwc/terms/footprintSpatialFit:
  cs:
    comments: ''
    description: ''
    label: Stopa prostorového rozložení
  es:
    comments: Los valores válidos son 0, un valor mayor o igual a 1, o indefinido.
      Un valor de 1 indica una coincidencia exacta o una superposición del 100 %.
      Se debe utilizar un valor de 0 si el footprint proporcionado no contiene completamente
      la representación original. El valor de dwc:footprintSpatialFit es indefinido
      (y debe dejarse vacío) si la representación original es una geometría sin área
      (por ejemplo, un punto o una polilínea) y sin incertidumbre, y la georreferenciación
      proporcionada no corresponde a esa misma geometría (sin incertidumbre). Si tanto
      la representación original como la georreferenciación proporcionada son el mismo
      punto, el valor de dwc:footprintSpatialFit es 1. En el documento Georeferencing
      Best Practices (Chapman y Wieczorek, 2020; https://doi.org/10.15468/doc-gg7h-s853)
      se pueden encontrar explicaciones detalladas con ejemplos gráficos.
    description: Una relación entre el área de una huella (dwc:footprintWKT) y el
      área de una representación espacial real (original o más específica) de una
      dcterms:Location.
    label: Ajuste espacial del footprint
  fr:
    comments: ''
    description: ''
    label: "Ajustement de l'emprise au sol"
  ru:
    comments: ''
    description: ''
    label: Соответствие границам
http://rs.tdwg.org/dwc/terms/footprintWKT:
