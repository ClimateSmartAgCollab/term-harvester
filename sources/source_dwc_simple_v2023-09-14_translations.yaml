    label: Rang du taxon
  ru:
    comments: ''
    description: Таксономический уровень самого низкого ранга, представленного в dwc:scientificName.
    label: Ранг таксона
  zh:
    comments: ''
    description: ''
    label: 分類群階層
http://rs.tdwg.org/dwc/terms/taxonRemarks:
  cs:
    comments: ''
    description: Poznámky nebo poznámky k taxonu nebo názvu.
    label: Poznámky k taxonu
  fr:
    comments: ''
    description: Commentaires ou notes sur le taxon ou le nom.
    label: Remarques sur le taxon
  ru:
    comments: ''
    description: Комментарии или заметки, относящиеся к таксону или его названию.
    label: Примечания по таксону
  zh:
    comments: ''
    description: ''
    label: 分類群註記
http://rs.tdwg.org/dwc/terms/taxonomicStatus:
  cs:
    comments: Doporučeným osvědčeným postupem je používat řízený slovník.
    description: Stav použití dwc:scientificName jako označení taxonu. Vyžaduje taxonomické
      stanovisko k vymezení rozsahu dwc:Taxon. Pravidla priority se pak používají
      k definování taxonomického statusu nomenklatury obsažené v tomto rozsahu v kombinaci
      se stanoviskem odborníků. Musí být propojen s konkrétním taxonomickým odkazem,
      který definuje daný pojem.
    label: Taxonomický status
  es:
    comments: La práctica recomendada es utilizar un vocabulario controlado.
    description: ''
    label: Estado taxonómico
  fr:
    comments: "La pratique optimale recommandée est d'utiliser un vocabulaire contrôlé."
    description: "Le statut de l'utilisation d'un dwc:scientificName comme étiquette\
      \ pour un taxon. Cela nécessite un avis taxonomique pour définir le périmètre\
      \ d'un dwc:Taxon. Les règles de priorité et l'avis des experts sont ensuite\
      \ utilisées pour définir le statut taxonomique du nom donné à ce taxon. Ce statut\
      \ doit être lié à une référence taxonomique spécifique qui définit le concept."
    label: Statut taxonomique
  ru:
    comments: Рекомендуется использовать контролируемый словарь.
    description: Статус dwc:scientificName, испльзуемого для обозначения таксона.
      Требует таксономического обоснования для определения объёма dwc:Taxon. Правила
      приоритета для определения таксономического статуса номенклатурного названия
      в рамках этого объёма используется с учетом мнения эксперта. Эта характеристика
      должна быть связана с конкретным таксономическим источником, задающим используемую
      трактовку таксона.
    label: Таксономический статус
  zh:
    comments: ''
    description: ''
    label: 物種分類狀態
http://rs.tdwg.org/dwc/terms/tribe:
  cs:
    comments: ''
    description: Úplný vědecký název kmene, do kterého je dwc:Taxon zařazen.
    label: Kmen
  es:
    comments: ''
    description: El nombre científico completo de la tribu en el que se clasifica
      el dwc:Taxon.
    label: Tribu
  fr:
    comments: ''
    description: Le nom scientifique complet de la tribu dans laquelle le dwc:Taxon
      est classé.
    label: Tribu
  ru:
    comments: ''
    description: Полное научное название трибы, к которой dwc:Taxon был отнесен.
    label: Триба
http://rs.tdwg.org/dwc/terms/typeOfType:
  es:
    comments: 'El término dwc:typeOfType debe utilizarse en combinación con dwc:typifiedName.
      Juntos conforman el estatus de tipo de un espécimen. Cabe señalar que relativamente
      pocos especímenes son tipos nomenclaturales (tipos de nombres), por lo que,
      en la mayoría de los casos, este término no tendrá ningún valor. A diferencia
      de dwc:typeStatus, dwc:typeOfType solo puede tener un único valor. Se recomienda
      utilizar un vocabulario controlado, como el Vocabulario de Estatus de Tipo Nomenclatural
      de GBIF. Este término tiene un equivalente en el espacio de nombres tcs: namespace
      que solo admite un IRI como valor, mientras que este término permite cualquier
      valor de cadena de texto.'
    description: Una categoría de tipo nomenclatural de una dwc:MaterialEntity.
    label: Tipo de tipo
http://rs.tdwg.org/dwc/terms/typeStatus:
  cs:
    comments: Doporučeným postupem je oddělovat hodnoty v seznamu mezerou svislou
      čarou mezerou (` | `). Tento termín má ekvivalent ve jmenném prostoru dwciri:,
      který jako hodnotu povoluje pouze IRI, zatímco tento termín povoluje jakoukoli
      řetězcovou literální hodnotu.
    description: Seznam (spojený a oddělený) nomenklaturních typů (status typu, typizovaný
      vědecký název, publikace), které se na předmět vztahují.
    label: Typový status
  es:
    comments: 'La práctica recomendada es separar los valores de una lista con un
      espacio, una barra vertical y otro espacio (` | `). Este término tiene un equivalente
      en el dwciri: namespace que solo permite un IRI como valor, mientras que este
      término permite cualquier valor literal de cadena.'
    description: ''
    label: Tipo nomenclatural
  fr:
    comments: "La pratique optimale recommandée est de séparer les valeurs d'une liste\
      \ par une barre verticale (` | `). Ce terme a un équivalent dans le dwciri:\
      \ namespace qui n'autorise qu'un IRI comme valeur, alors que ce terme autorise\
      \ n'importe quelle valeur sous forme de chaîne de caractères."
    description: Une liste (concaténée et séparée) des dimensions liées à la typification
      (statut de type, nom scientifique typifié, publication) appliquées au sujet.
    label: Statut de typification
  ru:
    comments: 'Рекомендуемой практикой является разделение значений в списке с помощью
      пробела, вертикальной черты и пробела (` | `). У этого термина существует эквивалент
      dwciri: namespace, который допускает только IRI в качестве значения, в то время
      как данный термин допускает использование любого строкового значения.'
    description: Список (значения в одной строке через разделитель) номенклатурных
      типов (категория типа, типифицированное научное название, публикация), применённых
      к объекту.
    label: Категория типа
  zh:
    comments: ''
    description: 學名標本模式，最好能使用控制詞彙。
    label: 學名標本模式
http://rs.tdwg.org/dwc/terms/typifiedName:
  cs:
    comments: ''
    description: ''
    label: Typizovaný název
  es:
    comments: El término dwc:typifiedName debe utilizarse en combinación con dwc:typeOfType.
      Juntos determinan el estatus de tipo de un espécimen. Cabe señalar que relativamente
      pocos especímenes son tipos nomenclaturales (tipos de nombres), por lo que,
      en la mayoría de los casos, este término no tendrá valor alguno. A diferencia
      de dwc:typeStatus, dwc:typifiedName solo puede tener un único valor; por tanto,
      una dwc:MaterialEntity solo puede tener un único dwc:typifiedName.
    description: Un nombre científico del cual un espécimen u otro nombre constituye
      el tipo.
    label: Nombre Tipificado
  fr:
    comments: ''
    description: ''
    label: Nom Typifié
  ru:
    comments: ''
    description: ''
    label: Типифицированное название
http://rs.tdwg.org/dwc/terms/verbatimCoordinateSystem:
  cs:
    comments: Doporučeným osvědčeným postupem je používat řízený slovník. Tento termín
      má ekvivalent ve jmenném prostoru dwciri:, který jako hodnotu umožňuje pouze
      IRI, zatímco tento termín umožňuje jakoukoli řetězcovou literální hodnotu.
    description: ''
    label: Přesný souřadnicový systém
  es:
    comments: 'La práctica recomendada es usar un vocabulario controlado. Este término
      tiene un equivalente en el dwciri: namespace que solo permite un IRI como valor,
      mientras que este término permite cualquier cadena de texto.'
    description: Un formato de coordenadas para dwc:verbatimLatitude y dwc:verbatimLongitude
      o dwc:verbatimCoordinates.
    label: Sistema original de coordenadas
  fr:
    comments: "La pratique optimale recommandée est d'utiliser un vocabulaire contrôlé.\
      \ Ce terme a un équivalent dans le dwciri: namespace qui n'autorise qu'un IRI\
      \ comme valeur, alors que ce terme autorise n'importe quelle valeur sous forme\
      \ de chaîne de caractères."
    description: ''
    label: Verbatim du système de coordonnées
  ru:
    comments: Рекомендуемой практикой является использование контролируемого словаря.
      У этого термина существует эквивалент в пространстве имен dwciri:, который допускает
      только IRI в качестве значения, в то время как данный термин допускает использование
      любого строкового значения.
    description: ''
    label: Формат координат по первоисточнику
  zh:
    comments: ''
    description: ''
    label: 字面上座標格式
http://rs.tdwg.org/dwc/terms/verbatimCoordinates:
