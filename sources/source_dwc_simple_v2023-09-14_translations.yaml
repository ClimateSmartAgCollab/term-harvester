      Tento termín má ekvivalent ve jmenném prostoru dwciri:, který jako hodnotu povoluje
      pouze IRI, zatímco tento termín povoluje jakoukoli řetězcovou literální hodnotu.
    description: Míra, do jaké dwc:Organismus přežívá, rozmnožuje se a rozšiřuje svůj
      areál v daném místě a čase.
    label: Stupeň zavedení
  es:
    comments: 'La práctica recomendada es utilizar cadenas de texto provenientes del
      vocabulario controlado designado para documentar este término, disponibles en:
      http://rs.tdwg.org/dwc/doc/doe/. Para más detalles, diríjase a https://doi.org/10.3897/biss.3.38084.
      Este término tiene un equivalente en el dwciri: namespace que solo permite usar
      un IRI como valor, mientras que este término permite cualquier valor de cadena
      de texto libre.'
    description: El grado en el que un dwc:Organism sobrevive, se reproduce y expande
      su rango de distribución en un lugar y tiempo determinado.
    label: Grado de establecimiento
  fr:
    comments: "La pratique optimale recommandée est d'utiliser les valeurs permises\
      \ par le vocabulaire contrôlé dédié à ce terme, dont la liste figure à l'adresse\
      \ http://rs.tdwg.org/dwc/doc/doe/. Pour plus de détails, voir https://doi.org/10.3897/biss.3.38084.\
      \ Ce terme a un équivalent dans le dwciri: namespace qui n'autorise qu'un IRI\
      \ comme valeur, alors que ce terme autorise n'importe quelle valeur sous forme\
      \ de chaîne de caractères."
    description: "Le degré de survie, de reproduction et d'expansion de l'aire de\
      \ répartition d'un dwc:Organism à un endroit et à un moment donnés."
    label: "Degré d'implantation"
  ru:
    comments: Рекомендуемой практикой является использование строковых значений из
      контролируемого словаря, предназначенного для применения с этим термином и представленного
      по адресу http://rs.tdwg.org/dwc/doc/doe/. Подробности смотрите по ссылке https://doi.org/10.3897/biss.3.38084.
      У этого термина существует эквивалент в пространстве имен dwciri:, который допускает
      только IRI в качестве значения, в то время как данный термин допускает использование
      любого строкового значения.
    description: Успешность, с которой dwc:Organism выживает, размножается и расширяет
      свой ареал в данном месте и в данное время.
    label: Степень укоренения интродуцированных видов
  zh:
    comments: ''
    description: ''
    label: 原生或引入階段評估
http://rs.tdwg.org/dwc/terms/digitalSpecimenID:
  cs:
    comments: 'Digitální vzorek je definován na adrese https://doi.org/10.3897/rio.7.e67379.
      Identifikátor dwc:digitalSpecimenID je určen k jednoznačné a trvalé identifikaci
      digitálního exempláře. Doporučeným osvědčeným postupem je používat DOI se strojově
      čitelnými metadaty v záznamu DOI, který používá metadatový profil dohodnutý
      komunitou (známý také jako profil FDO) pro Digitální exemplář. Příklad viz:
      https://doi.org/10.3535/N75-CR4-0SM?noredirect. Identifikátor je určen pro artefakt
      digitální informace (digitální exemplář) na rozdíl od identifikátoru pro konkrétní
      instanci dwc:MaterialEntity.'
    description: ''
    label: ''
  es:
    comments: 'Un Espécimen Digital se define en https://doi.org/10.3897/rio.7.e67379.
      Un dwc:digitalSpecimenID tiene como objetivo identificar de forma única y persistente
      un espécimen digital. Se recomienda utilizar un DOI con metadatos legibles por
      máquina en el registro DOI que utilice un perfil de metadatos acordado por la
      comunidad (también conocido como perfil FDO) para un espécimen digital. Para
      un ejemplo, consulte: https://doi.org/10.3535/N75-CR4-0SM?noredirect. El identificador
      corresponde a un artefacto de información digital (el Espécimen Digital), a
      diferencia de un identificador para una instancia específica de un dwc:MaterialEntity.'
    description: Un identificador para un recurso de espécimen digital.
    label: ID de espécimen digital
  fr:
    comments: "Un Spécimen Numérique est défini à l'adresse https://doi.org/10.3897/rio.7.e67379.\
      \ Un dwc:digitalSpecimenID est destiné à identifier de manière unique et permanente\
      \ un spécimen numérique. La pratique optimale recommandée est d'utiliser un\
      \ DOI avec des métadonnées interprétables par une machine dans l'enregistrement\
      \ DOI qui utilise un profil de métadonnées convenu par la communauté (également\
      \ connu sous le nom de profil FDO) pour un spécimen numérique. Pour un exemple,\
      \ voir : https://doi.org/10.3535/N75-CR4-0SM?noredirect. L'identifiant est celui\
      \ d'un artefact d'information numérique (le Spécimen Numérique) et non celui\
      \ d'une instance spécifique d'une dwc:MaterialEntity."
    description: ''
    label: ''
  ru:
    comments: 'Понятие «Цифровой образец» (Digital Specimen) определено по ссылке:
      https://doi.org/10.3897/rio.7.e67379. Термин dwc:digitalSpecimenID предназначен
      для однозначной и постоянной идентификации цифрового образца. Рекомендуется
      использовать DOI с машиночитаемыми метаданными в записи DOI, которые соответствуют
      согласованному сообществом метаданному профилю (также известному как FDO-профиль)
      для Цифрового образца. Например: https://doi.org/10.3535/N75-CR4-0SM?noredirect.
      Данный идентификатор относится к цифровому объекту (Цифровому образцу), в отличие
      от идентификатора экземпляра dwc:MaterialEntity.'
    description: ''
    label: ''
http://rs.tdwg.org/dwc/terms/discipline:
  cs:
    comments: ''
    description: ''
    label: Disciplína
  es:
    comments: 'Este término puede utilizarse para clasificar registros según ramas
