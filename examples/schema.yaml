      NNW:
        title: North-Northwest
    title: Sixteen Point Cardinality
    description: 'The 16‑wind compass rose expands on the 8‑point system by adding
      eight half‑winds. These are created by bisecting each 45‑degree angle between
      the cardinal and intercardinal points. The added directions are: north‑northeast
      (NNE), east‑northeast (ENE), east‑southeast (ESE), south‑southeast (SSE), south‑southwest
      (SSW), west‑southwest (WSW), west‑northwest (WNW), and north‑northwest (NNW).
      This system provides more precise directional reference at 22.5‑degree increments.'
    annotations:
      imported_from: AgriFoodCA_Picklists
      source_file: sources/AgriFoodCA_Picklists.yaml
