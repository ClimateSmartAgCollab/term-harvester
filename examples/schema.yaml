    title: Sixteen Point Cardinality
    description: "The 16\u2011wind compass rose expands on the 8\u2011point system\
      \ by adding eight half\u2011winds. These are created by bisecting each 45\u2011\
      degree angle between the cardinal and intercardinal points. The added directions\
      \ are: north\u2011northeast (NNE), east\u2011northeast (ENE), east\u2011southeast\
      \ (ESE), south\u2011southeast (SSE), south\u2011southwest (SSW), west\u2011\
      southwest (WSW), west\u2011northwest (WNW), and north\u2011northwest (NNW).\
      \ This system provides more precise directional reference at 22.5\u2011degree\
      \ increments."
