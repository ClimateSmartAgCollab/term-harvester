  AgriFoodCA_EightPointCardinality:
    permissible_values:
      N:
        title: North
      NE:
        title: Northeast
      E:
        title: East
      SE:
        title: Southeast
      S:
        title: South
      SW:
        title: Southwest
      W:
        title: West
      NW:
        title: Northwest
    title: Eight Point Cardinality
    description: "The 8\u2011wind compass rose consists of the four cardinal directions\u2014\
      north (N), east (E), south (S), and west (W)\u2014arranged at 90\u2011degree\
      \ intervals. By bisecting each of these angles, four intercardinal directions\
      \ are formed: northeast (NE), southeast (SE), southwest (SW), and northwest\
      \ (NW). Altogether, these eight points provide a simple directional framework\
      \ commonly used in navigation and maps."
    annotations:
      imported_from: AgriFoodCA_Picklists
      source_file: sources/AgriFoodCA_Picklists.yaml
