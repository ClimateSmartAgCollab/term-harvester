  AgriFoodCA_EightPointCardinality:
    permissible_values:
      N:
        title: North
      NE:
        title: Northeast
      E:
        title: East
      SE:
        title: Southeast
      S:
        title: South
      SW:
        title: Southwest
      W:
        title: West
      NW:
        title: Northwest
    title: Eight Point Cardinality
    description: 'The 8‑wind compass rose consists of the four cardinal directions-north
      (N), east (E), south (S), and west (W)-arranged at 90‑degree intervals. By bisecting
      each of these angles, four intercardinal directions are formed: northeast (NE),
      southeast (SE), southwest (SW), and northwest (NW). Altogether, these eight
      points provide a simple directional framework commonly used in navigation and
      maps.'
    annotations:
      imported_from: AgriFoodCA_Picklists
      source_file: sources/AgriFoodCA_Picklists.yaml
