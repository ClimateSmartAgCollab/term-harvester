  SoilStructureShape:
    name: SoilStructureShape
    title: Soil Structure Shapes
    description: Categorical classification of soil aggregate shapes describing how
      soil particles group together into structural units.
    see_also: https://iastate.pressbooks.pub/introsoilscience/chapter/soilstructure/
    permissible_values:
      GR:
        title: Granular
        description: "Rounded groups of particles that don't pack well, common in\
          \ A horizons with high organic matter and healthy roots."
      PL:
        title: Platy
        description: Horizontal natural breaks, commonly found in E horizons and easily
          destroyed by tillage.
      BL:
        title: Blocky
        description: Block-shaped units (angular or subangular) common in B horizons
          or cultivated A horizons.
      PR:
        title: Prismatic
        description: Vertically elongated units with longer natural breaks, generally
          found in B horizons.
      CO:
        title: Columnar
        description: Prismatic structure with rounded sodium-dispersed tops, found
          in agronomically challenging sodium-impacted soils.
      MA:
        title: Massive or Single Grained
        description: Non-structure indicating recently deposited soil with limited
          change, breaking under pressure or falling into individual grains.
    annotations:
      imported_from: SoilStructuralShape
      source_file: sources/SoilStructuralShape.yaml
