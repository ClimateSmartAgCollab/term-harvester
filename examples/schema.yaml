                  \ agenre, pangenre, genre queer, genre fluide ou genre non conforme.\
                  \ Elle comprend \xE9galement les personnes dont le genre d\xE9clar\xE9\
                  \ est bispirituel \u2014 un terme propre \xE0 certains peuples autochtones\
                  \ d'Am\xE9rique du Nord.Elle comprend les personnes dont le genre\
                  \ d\xE9clar\xE9 est \xE0 la fois masculin et f\xE9minin, ni l'un\
