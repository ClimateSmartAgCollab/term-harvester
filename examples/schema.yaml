          NSDB_DRAINAGE:
            permissible_values:
              VR:
                title: Drainage très rapide
                description: "L'eau s'écoule du sol beaucoup plus rapidement qu'elle\
                  \ n'y pénètre.  Le surplus d'eau descend très rapidement dans le\
                  \ cas où  le matériel sous-jacent est perméable.  L'écoulement souterrain\
                  \ peut-être très rapide lorsque les pluies sont intenses là où le\
                  \ gradient est abrupt.  Les sols ont une capacité de storage très\
                  \ basse (normallement moins de 2.5 cm) dans la section contrôlée\
                  \ et sont d'une texture grossière, ou peu profond, ou les deux.\
                  \ L'eau provient des précipitations."
              R:
                title: Drainage rapide
                description: "L'eau s'écoule du sol plus rapidement qu'elle n'y pénètre.\
                  \  Le surplus d'eau descend vers le bas dans le cas où le matériel\
                  \ sous-jacent est perméable.  Il peut se produire un écoulement\
                  \ souterrain sur les gradients abrupts lors des pluies intenses.\
                  \  Les sols ont une capacité de storage basse (2.5-4 cm) dans la\
                  \ section contrôlée et sont d'une texture grossière, ou peu profond,\
                  \ ou les deux. L'eau provient des précipitations."
              W:
                title: Drainage bon
                description: "L'eau s'écoule du sol aisément mais non rapidement.\
                  \  Le surplus d'eau descend facilement dans le matériel sous-jacent\
                  \ perméable ou migre latéralement sous forme d'écoulement souterrain.\
                  \  Les sols ont une capacité de storage intermédiaire (4-5 cm) dans\
                  \ la section contrôlée, et sont d'une texture et profondeur intermédiaire.\
                  \  L'eau provient des précipitations.  Sur des inclinaisons dans\
                  \ le sous-sol la descente d'eau peut se produire pour un temp court\
                  \ mais des surplus sont égaux au pertes."
              MW:
                title: Drainage modérément bon
                description: "L'eau s'écoule du sol un peu plus lentement qu'elle\
                  \ n'y pénètre.  Le surplus d'eau s'écoule un peu lentement à cause\
                  \ de la faible perméabilité, de la surface de saturation élevée,\
                  \ du faible gradient ou d'une combinaison de ces facteurs.  Les\
                  \ sols ont une capacité de teneur en eau de l'intermédiaire à élevée\
                  \ (5-6 cm) dans la section contrôlée et sont à texture moyenne à\
                  \ fine.  La source d'eau dominante est la précipitation dans les\
                  \ sols à texture moyenne à fine.  Dans les sols à texture grossière,\
                  \ des volumes importants d'écoulement souterrain s'ajoutent aux\
                  \ précipitations."
              I:
                title: Drainage imparfait
                description: "L'eau s'écoule du sol suffisamment lentement par rapport\
                  \ à l'apport d'eau pour que le sol reste humide durant une grande\
                  \ partie de la saison de croissance.  Le surplus d'eau descend lentement\
                  \ vers le bas là où les précipitations constituent le principal\
                  \ apport.  Dans les cas où les eaux souterraines ou sub-superficielles,\
                  \ ou les deux, constituent la principale source, le taux d'écoulement\
                  \ peut varier, mais le sol demeure humide durant une importante\
                  \ partie de la saison de croissance.  La source principale est la\
                  \ précipitation quand la capacité est élevée en teneur d'eau. La\
                  \ contribution d'écoulement superficiel ou souterrain, ou les deux,\
                  \ augmente à chaque fois que la capacitée de teneur en eau disponible\
                  \ diminue. Les sols ont une grande capacitée en provision d'eau,\
                  \ texture et profondeur, et ont des phases gleyifié de sous-groupe\
                  \ à drainage bon."
              P:
                title: Drainage pauvre
                description: "Étant donné que l'eau s'écoule beaucoup plus lentement\
                  \ qu'elle y est apportée, le sol demeure humide durant une grande\
                  \ partie de la période où le sol n'est pas gelé.  Il y a la plupart\
                  \ du temps un surplus d'eau dans le sol.  L'écoulement superficiel\
                  \ ou souterrain, ou les deux, s'ajoute aux précipitations comme\
                  \ principale source d'eau ; il peut y avoir aussi une nappe d'eau\
                  \ perchée, quand les précipitations sont plus importantes que l'évapotranspiration.\
                  \ La capacité de rétention d'eau, la texture et la profondeur des\
                  \ sols varient fortement. Ces sols appartiennent aux sous-groupe\
                  \ gleyifiés, aux gleysols ou aux sols organiques."
              VP:
                title: Drainage très pauvre
                description: "L'eau s'écoule tellement lentement que la surface de\
                  \ saturation affleure à la surface durant une large partie de la\
                  \ période où le sol n'est pas gelé.  L'excès d'eau est présente\
                  \ dans le sol durant une grande partie du temps.  L'écoulement de\
                  \ la nappe souterraine et l'écoulement souterrain constituent les\
                  \ principales sources d'eau.  Les précipitations jouent un rôle\
                  \ moins important, sauf là où il y a une nappe d'eau perchée et\
                  \ où les précipitations excèdent l'évapotranspiration. La capacité\
                  \ de rétention d'eau, la texture et la profondeur de ces sols varient\
                  \ fortement et ces derniers sont gleysoliques ou organiques."
              '-':
                title: Ne s&#39;applique pas
                description: "Drainage ne s'applique pas (roche, glace, etc)"
