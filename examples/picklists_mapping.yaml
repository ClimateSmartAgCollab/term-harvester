  MaturityLevels:
    schema_key: StandardsMaturityLevel
    id: 37
    name:
      en: Maturity Levels
    description:
      en: Key stages in a standard’s lifecycle—from early drafting to publication,
        long‑term adoption, and eventual retirement. Each status reflects how mature,
        stable, and widely accepted a standard is at any point in its development.
      fr: ''
    keywords:
      standard lifecycle:
        en: standard lifecycle
      specification development:
        en: specification development
      version status:
        en: version status
    category: general
    source: https://linkml.io/valuesets/governance/#maturity-levels
    languages:
    - en
    permissible_values:
      DRAFT:
        en: Initial development, may change significantly
      WORKING_DRAFT:
        en: Active work by a working group
      COMMITTEE_DRAFT:
        en: Under formal review
      CANDIDATE_RECOMMENDATION:
        en: Ready for implementation testing
      PROPOSED_STANDARD:
        en: Stable, ready for adoption
      STANDARD:
        en: Approved and published
      MATURE_STANDARD:
        en: Well-established with wide adoption
      SUPERSEDED:
        en: Replaced by a newer version
      WITHDRAWN:
        en: No longer recommended
