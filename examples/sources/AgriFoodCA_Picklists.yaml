                  \ le bas si le mat\xE9riau sous-jacent est perm\xE9able. Un \xE9\
                  coulement souterrain peut se produire sur des pentes abruptes lors\
                  \ de fortes pluies. Les sols ont une faible capacit\xE9 de r\xE9\
                  tention d\u2019eau disponible (2,5 \xE0 4 cm) dans la section de\
                  \ contr\xF4le et sont g\xE9n\xE9ralement de texture grossi\xE8re,\
                  \ ou peu profonds, ou les deux. La source d\u2019eau est la pr\xE9\
                  cipitation."
              W:
                title: "Bien drain\xE9"
                description: "L\u2019eau est \xE9vacu\xE9e du sol facilement mais\
                  \ non rapidement. L\u2019eau en exc\xE8s s\u2019infiltre facilement\
                  \ dans le mat\xE9riau perm\xE9able sous-jacent ou s\u2019\xE9coule\
                  \ lat\xE9ralement comme \xE9coulement souterrain. Les sols ont une\
                  \ capacit\xE9 de r\xE9tention d\u2019eau disponible interm\xE9diaire\
                  \ (4 \xE0 5 cm) dans la section de contr\xF4le, et sont g\xE9n\xE9\
                  ralement de texture et profondeur interm\xE9diaires. La source d\u2019\
                  eau est la pr\xE9cipitation. Sur les pentes, un \xE9coulement souterrain\
                  \ peut se produire pendant de courtes dur\xE9es, mais les apports\
                  \ sont compens\xE9s par les pertes."
              MW:
                title: "Mod\xE9r\xE9ment bien drain\xE9"
                description: "L\u2019eau est \xE9vacu\xE9e du sol quelque peu lentement\
                  \ par rapport \xE0 l\u2019apport. L\u2019eau en exc\xE8s est \xE9\
                  vacu\xE9e assez lentement en raison d\u2019une faible perm\xE9abilit\xE9\
                  , d\u2019une nappe phr\xE9atique peu profonde, d\u2019un manque\
                  \ de pente ou d\u2019une combinaison de ces facteurs. Les sols ont\
                  \ une capacit\xE9 de r\xE9tention d\u2019eau disponible de moyenne\
                  \ \xE0 \xE9lev\xE9e (5 \xE0 6 cm) dans la section de contr\xF4le\
                  \ et sont g\xE9n\xE9ralement de texture moyenne \xE0 fine. La pr\xE9\
                  cipitation est la principale source d\u2019eau dans les sols de\
                  \ texture moyenne \xE0 fine; dans les sols de texture grossi\xE8\
                  re, la pr\xE9cipitation et des apports significatifs par \xE9coulement\
                  \ souterrain sont n\xE9cessaires."
              I:
                title: "Imperfectement drain\xE9"
                description: "L\u2019eau est \xE9vacu\xE9e du sol suffisamment lentement\
                  \ par rapport \xE0 l\u2019apport pour que le sol reste humide pendant\
                  \ une grande partie de la saison de croissance. L\u2019eau en exc\xE8\
                  s descend lentement si la pr\xE9cipitation est la principale source\
                  \ d\u2019eau. Si l\u2019eau souterraine ou l\u2019\xE9coulement\
                  \ souterrain (ou les deux) constitue la principale source, le d\xE9\
                  bit peut varier, mais le sol demeure humide pendant une grande partie\
                  \ de la saison de croissance. La pr\xE9cipitation est la source\
                  \ principale si la capacit\xE9 de r\xE9tention d\u2019eau disponible\
                  \ est \xE9lev\xE9e; la contribution par \xE9coulement souterrain\
                  \ ou nappe phr\xE9atique augmente lorsque la capacit\xE9 de r\xE9\
                  tention d\u2019eau diminue. Les sols pr\xE9sentent une large gamme\
                  \ de capacit\xE9s de r\xE9tention, de textures et de profondeurs,\
                  \ et sont des phases gleyifi\xE9es de sous-groupes bien drain\xE9\
                  s."
              P:
                title: "Mal drain\xE9"
                description: "L\u2019eau est \xE9vacu\xE9e si lentement par rapport\
                  \ \xE0 l\u2019apport que le sol reste humide pendant une grande\
                  \ partie du temps o\xF9 il n\u2019est pas gel\xE9. L\u2019eau en\
                  \ exc\xE8s est pr\xE9sente dans le sol pendant une grande partie\
                  \ du temps. L\u2019\xE9coulement souterrain ou l\u2019eau souterraine,\
                  \ en plus de la pr\xE9cipitation, sont les principales sources d\u2019\
                  eau; il peut aussi y avoir une nappe perch\xE9e, avec une pr\xE9\
                  cipitation d\xE9passant l\u2019\xE9vapotranspiration. Les sols pr\xE9\
                  sentent une large gamme de capacit\xE9s de r\xE9tention, de textures\
                  \ et de profondeurs, et appartiennent \xE0 des sous-groupes gleyifi\xE9\
                  s, aux Gleysols ou aux sols organiques."
              VP:
                title: "Tr\xE8s mal drain\xE9"
                description: "L\u2019eau est \xE9vacu\xE9e du sol si lentement que\
                  \ la nappe phr\xE9atique demeure \xE0 la surface ou pr\xE8s de la\
                  \ surface pendant la majeure partie du temps o\xF9 le sol n\u2019\
                  est pas gel\xE9. L\u2019eau en exc\xE8s est pr\xE9sente pendant\
                  \ la majorit\xE9 du temps. L\u2019eau souterraine et l\u2019\xE9\
                  coulement souterrain sont les principales sources d\u2019eau. La\
                  \ pr\xE9cipitation est moins importante sauf lorsqu\u2019il existe\
                  \ une nappe perch\xE9e et que la pr\xE9cipitation d\xE9passe l\u2019\
                  \xE9vapotranspiration. Les sols pr\xE9sentent une large gamme de\
                  \ capacit\xE9s de r\xE9tention, de textures et de profondeurs, et\
                  \ sont soit gleyiques, soit organiques."
              '-':
                title: Sans objet
                description: Drainage non applicable (roche, glace, etc.).
