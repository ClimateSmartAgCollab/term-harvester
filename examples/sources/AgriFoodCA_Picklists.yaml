      \ quarter winds, which fall halfway between each pair of 16 wind points. These\
      \ \uFFFDby\uFFFD directions\uFFFDsuch as north by east, northeast by north,\
      \ and southwest by west\uFFFDcreate a system of 32 points spaced at 11.25 degree\
      \ intervals. Historically used in maritime navigation, this finer resolution\
      \ allows much more accurate description of direction."
