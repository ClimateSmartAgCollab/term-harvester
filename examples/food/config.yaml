# See docs on "reachable_from": https://linkml.io/linkml-model/latest/docs/reachable_from/
# Config below doesn't support LinkML dynamic enumeration "inherits", and is limited custom version of LinkML dynamic enumerations, not quite in context of LinkML schema.
# Note that "minus" list is implemented before "includes" list, which restores subordinate items that would otherwise have been eliminated by minus list items and their underlying items.
# See https://linkml.io/linkml-model/latest/docs/EnumExpression/
# Here 'reachable_from' is acted on via 'term_harvester.py -c' configuration to generate the LinkML .yaml schema file for the given source.  Over in schema.yaml, 'reachable_from' is acted on via 'term_harvester.py -l' for lookup function to populate schema.yaml enums.
# The optional top-level 'apis' object configures API endpoints for the -l lookup function.
# Each key is a service name (e.g. 'ols', 'bioportal', 'agrovoc') with a 'type' sub-object
# containing protocol-keyed configs (e.g. 'rest', 'sparql'), each with 'uri' and optional 'apikey',
# plus an 'ontologies' list.  The -l lookup routes each CURIE prefix to the first api whose
# 'ontologies' list contains it; falls back to OLS4.
# Example apis block:
#   apis:
#     ols:
#       type:
#         rest:
#           uri: http://www.ebi.ac.uk/ols4/api/ontologies/{ontology}/terms/{double_encoded}/graph
#       ontologies: [ENVO, GO, UBERON]
#     bioportal:
#       type:
#         rest:
#           uri: https://data.bioontology.org
#           apikey: YOUR_BIOPORTAL_KEY
#       ontologies: [MESH, NCIT, SNOMEDCT]
#     agrovoc:
#       type:
#         sparql:
#           uri: https://agrovoc.fao.org/sparql/
#       ontologies: [agrovoc]

output: schema.yaml
slots: automatic
locales:
  - en
  - fr
sources:
  CODEX_2025:
    title: GENERAL STANDARD FOR FOOD ADDITIVES - FOOD CATEGORIES
    name: CODEX_2025
    version: 192-1995 (Rev. 2025)
    content_type: CODEX
    file_format: zip
    reachable_from:
      source_ontology: https://www.fao.org/gsfaonline/docs/CXS_192e.pdf
    download_date: '2026-11-01'
    description: 'The Codex General Standard for Food Additives (CXS 192-1995, formerly
      CODEX STAN 192-1995) is the internationally agreed standard that establishes
      conditions under which food additives may be safely used in foods and specifies
      maximum use levels across a hierarchical food category system. Maintained by
      the Codex Alimentarius Commission (FAO/WHO) and revised periodically by the
      Codex Committee on Food Additives (CCFA), the standard is organised into three
      parts: Part I defines the food category system - a hierarchical classification
      of food and food ingredients that determines the scope of additive permissions;
      Part II provides prose descriptors for each food category; and Part III lists
      permitted food additives (colours, sweeteners, and others) with their authorised
      maximum use levels by food category, including carry-over provisions and additive-specific
      tables.'
  CSSCv3_SoilOrder:
    title: CSSC Soil Classification
    name: CSSCv3_SoilOrder
    version: '3'
    content_type: CSSC
    file_format: zip
    reachable_from:
      source_ontology: https://sis.agr.gc.ca/cansis/taxa/cssc3/index.html
    download_date: '2026-11-01'
    description: The hierarchical taxonomy of the Canadian System of Soil Classification
      (CSSC, Third Edition), covering all three categorical levels in a single enumeration.
      Soil Order codes identify the 10 highest-level taxa (e.g., BR for Brunisolic);
      Great Group codes append the group abbreviation after a period (e.g., BR.MB
      for Melanic Brunisol); Subgroup codes place the subgroup prefix before the period
      (e.g., O.MB for Orthic Melanic Brunisol, is_a BR.MB). The is_a hierarchy enables
      reachable_from filtering to retrieve any branch of the taxonomy from a single
      source node.
    see_also: https://sis.agr.gc.ca/cansis/taxa/cssc3/index.html
