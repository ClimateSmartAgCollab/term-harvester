    comments: Less specific geographic information can be provided in other geographic
      terms (dwc:higherGeography, dwc:continent, dwc:country, dwc:stateProvince, dwc:county,
      dwc:municipality, dwc:waterBody, dwc:island, dwc:islandGroup). This term may
      contain information modified from the original to correct perceived errors or
      standardize the description.
  location_according_to:
    name: location_according_to
