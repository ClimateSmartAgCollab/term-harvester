    slot_group: Geological Context
    range: string
    multivalued: false
    description: Full name of the highest possible geological biostratigraphic zone
    comments: "e.g. 'Blancan'"
  latest_age_or_highest_stage:
    name: latest_age_or_highest_stage
    title: Latest Age Or Highest Stage
    slot_uri: dwc:latestAgeOrHighestStage
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Full name of the latest/highest geochronologic age
  latest_eon_or_highest_eonothem:
    name: latest_eon_or_highest_eonothem
    title: Latest Eon Or Highest Eonothem
    slot_uri: dwc:latestEonOrHighestEonothem
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Full name of the latest/highest geochronologic eon
  latest_epoch_or_highest_series:
    name: latest_epoch_or_highest_series
    title: Latest Epoch Or Highest Series
    slot_uri: dwc:latestEpochOrHighestSeries
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Full name of the latest/highest geochronologic epoch
  latest_era_or_highest_erathem:
    name: latest_era_or_highest_erathem
    title: Latest Era Or Highest Erathem
    slot_uri: dwc:latestEraOrHighestErathem
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Full name of the latest/highest geochronologic era
  latest_period_or_highest_system:
    name: latest_period_or_highest_system
    title: Latest Period Or Highest System
    slot_uri: dwc:latestPeriodOrHighestSystem
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Full name of the latest/highest geochronologic period
  lithodemic_unit:
    name: lithodemic_unit
    title: Lithodemic Unit
    slot_uri: dwc:lithodemicUnit
    slot_group: Geological Context
    range: string
    multivalued: false
    description: A geologic unit lacking stratification
    comments: Due to the unstructured nature of complexes, both named units and lithological
      descriptive terms are acceptable values.
  lithostratigraphic_terms:
    name: lithostratigraphic_terms
    title: Lithostratigraphic Terms
    slot_uri: dwc:lithostratigraphicTerms
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Combination of all lithostratigraphic names for the context
    comments: "e.g. 'Pleistocene-Weichselien'"
  lowest_biostratigraphic_zone:
    name: lowest_biostratigraphic_zone
    title: Lowest Biostratigraphic Zone
    slot_uri: dwc:lowestBiostratigraphicZone
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Full name of the lowest possible geological biostratigraphic zone
    comments: "e.g. 'Maastrichtian'"
  member:
    name: member
    title: Member
    slot_uri: dwc:member
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Full name of the lithostratigraphic member
    comments: "e.g. 'Lava Dam Member'"
  tectonic_units:
    name: tectonic_units
    title: Tectonic Units
    slot_uri: dwc:tectonicUnits
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Combination of all tectonic unit names
    comments: 'Recommended best practice is to use an authoritative tectonic unit
      lexicon such as the Tectonic Map of Switzerland (TK500). This term has an equivalent
      in the dwciri: namespace that allows only an IRI as a value, whereas this term
      allows for any string literal value.'
  date_identified:
    name: date_identified
    title: Date Identified
    slot_uri: dwc:dateIdentified
    slot_group: Identification (Taxonomic)
    range: date
    multivalued: false
    description: Date on which the subject was identified as representing the dwc:Taxon
      (ISO 8601)
    comments: Recommended best practice is to use a date that conforms to ISO 8601-1:2019.
  identification_id:
    name: identification_id
    title: Identification ID
    slot_uri: dwc:identificationID
    slot_group: Identification (Taxonomic)
    range: uri
    multivalued: false
    description: Persistent globally unique identifier for the dwc:Identification
    comments: Recommended best practice is to use a globally unique identifier.
  identification_qualifier:
    name: identification_qualifier
    title: Identification Qualifier
    slot_uri: dwc:identificationQualifier
    slot_group: Identification (Taxonomic)
    range: string
    multivalued: false
    description: Brief phrase expressing the taxonomic doubt about the identification
    comments: 'This term has an equivalent in the dwciri: namespace that allows only
      an IRI as a value, whereas this term allows for any string literal value.'
  identification_references:
    name: identification_references
    title: Identification References
    slot_uri: dwc:identificationReferences
    slot_group: Identification (Taxonomic)
    range: string
    multivalued: false
    description: "Bibliographic references used in identification; use '|' separator\
      \ for multiple"
    comments: When used in the context of an eco:Survey, the subject consists of all
      of the dwc:Identifications related to the eco:Survey. Recommended best practice
      is to separate the values in a list with space vertical bar space (` | `).
  identification_remarks:
    name: identification_remarks
    title: Identification Remarks
    slot_uri: dwc:identificationRemarks
    slot_group: Identification (Taxonomic)
    range: string
    multivalued: false
    description: Comments or notes about the identification
  identification_type:
    name: identification_type
    title: Identification Type
    slot_uri: dwc:identificationType
    slot_group: Identification (Taxonomic)
    range: string
    multivalued: false
    description: Category that best matches the nature of the identification
    comments: 'The evidentiary basis, analytical approach, or inferential method by
      which an identification was determined. Values describe the dominant source
      of information supporting the identification (e.g., morphology, geography, molecular
      data, functional attributes, relationships, or taxonomic revision), independent
      of confidence level or taxonomic outcome. This term has an equivalent in the
      dwciri: namespace that allows only an IRI as a value, whereas this term allows
      for any string literal value.'
  identification_verification_status:
    name: identification_verification_status
    title: Identification Verification Status
    slot_uri: dwc:identificationVerificationStatus
    slot_group: Identification (Taxonomic)
    range: string
    multivalued: false
    description: Categorical indicator of extent to which identification has been
      verified
    comments: 'Recommended best practice is to use a controlled vocabulary such as
      that used in HISPID and ABCD. This term has an equivalent in the dwciri: namespace
      that allows only an IRI as a value, whereas this term allows for any string
      literal value.'
  identified_by:
    name: identified_by
    title: Identified By
    slot_uri: dwc:identifiedBy
    slot_group: Identification (Taxonomic)
    range: string
    multivalued: false
    description: "Name of agent(s) responsible for the taxonomic determination; use\
      \ '|' separator for multiple"
    comments: 'When used in the context of an eco:Survey, the subject consists of
      all of the dwc:Identifications related to the eco:Survey. Recommended best practice
      is to separate the values in a list with space vertical bar space (` | `). This
      term has an equivalent in the dwciri: namespace that allows only an IRI as a
      value, whereas this term allows for any string literal value.'
  identified_by_id:
    name: identified_by_id
    title: Identified By ID
    slot_uri: dwc:identifiedByID
    slot_group: Identification (Taxonomic)
    range: uri
    multivalued: false
    description: Identifier (e.g. ORCID) for agent who made the identification
    comments: When used in the context of an eco:Survey, the subject consists of all
      of the dwc:Identifications related to the eco:Survey. Recommended best practice
      is to provide a single identifier that disambiguates the details of the identifying
      dcterms:Agent. If a list is used, the order of the identifiers on the list should
      not be assumed to convey any semantics. Recommended best practice is to separate
      the values in a list with space vertical bar space (` | `).
  is_accepted_identification:
    name: is_accepted_identification
    title: Is Accepted Identification
    slot_uri: dwc:isAcceptedIdentification
    slot_group: Identification (Taxonomic)
    range: boolean
    multivalued: false
    description: Whether this identification is the currently accepted identification
      of the subject
    comments: Recommended best practice is to follow the TDWG Boolean Controlled Vocabulary
      http://rs.tdwg.org/tag/doc/boolean/.
  taxon_formula:
    name: taxon_formula
    title: Taxon Formula
    slot_uri: dwc:taxonFormula
    slot_group: Identification (Taxonomic)
    range: string
    multivalued: false
    description: String representing the pattern used to construct the identification
    comments: "e.g. 'A', 'A ?', 'A x B', 'not A'"
  taxon_sort_order:
    name: taxon_sort_order
    title: Taxon Sort Order
    slot_uri: dwc:taxonSortOrder
    slot_group: Identification (Taxonomic)
    range: integer
    multivalued: false
    description: Numeric position of the taxon in the taxonFormula (1 for first, 2
      for second, etc.)
  type_status:
    name: type_status
    title: Type Status
    slot_uri: dwc:typeStatus
    slot_group: Identification (Taxonomic)
    range: string
    multivalued: false
    description: List of nomenclatural types applied to the subject or its parts
    comments: 'Recommended best practice is to separate the values in a list with
      space vertical bar space (` | `). This term has an equivalent in the dwciri:
      namespace that allows only an IRI as a value, whereas this term allows for any
      string literal value.'
  verbatim_identification:
    name: verbatim_identification
    title: Verbatim Identification
    slot_uri: dwc:verbatimIdentification
    slot_group: Identification (Taxonomic)
    range: string
    multivalued: false
    description: String representing the taxonomic identification as it appeared in
      the original record
    comments: This term is meant to allow the capture of an unaltered original identification/determination,
      including identification qualifiers, hybrid formulas, uncertainties, etc. This
      term is meant to be used in addition to dwc:geologicalMaterialNames or dwc:scientificName
      (and dwc:identificationQualifier etc.), not instead of it.
  continent:
    name: continent
    title: Continent
    slot_uri: dwc:continent
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Name of the continent on which the dcterms:Location occurs
    comments: Recommended best practice is to use a controlled vocabulary such as
      the Getty Thesaurus of Geographic Names. Recommended best practice is to leave
      this field blank if the dcterms:Location spans multiple entities at this administrative
      level or if the dcterms:Location might be in one or another of multiple possible
      entities at this level. Multiplicity and uncertainty of the geographic entity
      can be captured either in the term dwc:higherGeography or in the term dwc:locality,
      or both.
    examples:
      - value: Africa
      - value: Antarctica
      - value: Asia
      - value: Europe
      - value: NorthAmerica
      - value: Oceania
      - value: SouthAmerica
  coordinate_precision:
    name: coordinate_precision
    title: Coordinate Precision
    slot_uri: dwc:coordinatePrecision
    slot_group: Location (Geography)
    range: decimal
    multivalued: false
    description: Decimal representation of the precision of coordinates
    comments: e.g. 0.00001 (≈1.1m at equator), 0.1 (≈11km)
  coordinate_uncertainty_in_meters:
    name: coordinate_uncertainty_in_meters
    title: Coordinate Uncertainty In Meters
    slot_uri: dwc:coordinateUncertaintyInMeters
    slot_group: Location (Geography)
    range: decimal
    multivalued: false
    description: "Horizontal distance in meters of the smallest circle containing\
      \ the whole location; default to 'not recorded'"
    comments: Leave the value empty if the uncertainty is unknown, cannot be estimated,
      or is not applicable (because there are no coordinates). Zero is not a valid
      value for this term.
  country:
    name: country
    title: Country
    slot_uri: dwc:country
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Full scientific name of the country in which the dcterms:Location
      occurs
    comments: 'Recommended best practice is to use a controlled vocabulary such as
      the Getty Thesaurus of Geographic Names. Recommended best practice is to leave
      this field blank if the dcterms:Location spans multiple entities at this administrative
      level or if the dcterms:Location might be in one or another of multiple possible
      entities at this level. Multiplicity and uncertainty of the geographic entity
      can be captured either in the term dwc:higherGeography or in the term dwc:locality,
      or both. — External vocabularies: ISO_COUNTRY'
  country_code:
    name: country_code
    title: Country Code
    slot_uri: dwc:countryCode
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: ISO 3166-1 alpha-2 two-letter country code
    comments: "Recommended best practice is to use an ISO 3166-1-alpha-2 country code,\
      \ or 'ZZ' (for an unknown location or a location unassignable to a single country\
      \ code), or 'XZ' (for the high seas beyond national jurisdictions). Multiplicity\
      \ and uncertainty of the geographic entity can be captured either in the term\
      \ dwc:higherGeography or in the term dwc:locality, or both. — External vocabularies:\
      \ ISO_COUNTRY"
  county:
    name: county
    title: County
    slot_uri: dwc:county
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Full name of the next smaller administrative region than stateProvince
    comments: Recommended best practice is to use a controlled vocabulary such as
      the Getty Thesaurus of Geographic Names. Recommended best practice is to leave
      this field blank if the dcterms:Location spans multiple entities at this administrative
      level or if the dcterms:Location might be in one or another of multiple possible
      entities at this level. Multiplicity and uncertainty of the geographic entity
      can be captured either in the term dwc:higherGeography or in the term dwc:locality,
      or both.
  decimal_latitude:
    name: decimal_latitude
    title: Decimal Latitude
    slot_uri: dwc:decimalLatitude
    slot_group: Location (Geography)
    range: decimal
    multivalued: false
    description: Geographic latitude in decimal degrees (WGS84) of the location, from
      -90 to 90
    comments: Positive values are north of the Equator, negative values are south
      of it. Valid values lie between -90 and 90, inclusive.
  decimal_longitude:
    name: decimal_longitude
    title: Decimal Longitude
    slot_uri: dwc:decimalLongitude
    slot_group: Location (Geography)
    range: decimal
    multivalued: false
    description: Geographic longitude in decimal degrees (WGS84) of the location,
      from -180 to 180
    comments: Positive values are east of the Greenwich Meridian, negative values
      are west of it. Valid values lie between -180 and 180, inclusive.
  footprint_spatial_fit:
    name: footprint_spatial_fit
    title: Footprint Spatial Fit
    slot_uri: dwc:footprintSpatialFit
    slot_group: Location (Geography)
    range: decimal
    multivalued: false
    description: Ratio of the area of the footprint to the area of the true spatial
      representation; 1 = exact fit
    comments: Legal values are 0, greater than or equal to 1, or undefined. A value
      of 1 is an exact match or 100% overlap. A value of 0 should be used if the given
      footprint does not completely contain the original representation. A dwc:footprintSpatialFit
      is undefined (and should be left empty) if the original representation is any
      geometry without area (e.g., a point or polyline) and without uncertainty and
      the given georeference is not that same geometry (without uncertainty). If both
      the original and the given georeference are the same point, a dwc:footprintSpatialFit
      is 1. Detailed explanations with graphical examples can be found in the Georeferencing
      Best Practices, Chapman and Wieczorek, 2020 (https://doi.org/10.15468/doc-gg7h-s853).
  footprint_srs:
    name: footprint_srs
    title: Footprint SRS
    slot_uri: dwc:footprintSRS
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Spatial reference system (SRS) for the footprintWKT geometry
    comments: 'Recommended best practice is to use the EPSG code of the SRS, if known.
      Otherwise use a controlled vocabulary for the name or code of the geodetic datum,
      if known. Otherwise use a controlled vocabulary for the name or code of the
      ellipsoid, if known. If none of these is known, use the value `not recorded`.
      It is also permitted to provide the SRS in Well-Known-Text, especially if no
      EPSG code provides the necessary values for the attributes of the SRS. Do not
      use this term to describe the SRS of the dwc:decimalLatitude and dwc:decimalLongitude,
      nor of any verbatim coordinates - use the dwc:geodeticDatum and dwc:verbatimSRS
      instead. This term has an equivalent in the dwciri: namespace that allows only
      an IRI as a value, whereas this term allows for any string literal value.'
  footprint_wkt:
    name: footprint_wkt
    title: Footprint WKT
    slot_uri: dwc:footprintWKT
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: WKT representation of the shape (footprint) of the dcterms:Location
    comments: A dcterms:Location may have both a point-radius representation (see
      dwc:decimalLatitude) and a footprint representation, and they may differ from
      each other.
  geodetic_datum:
    name: geodetic_datum
    title: Geodetic Datum
    slot_uri: dwc:geodeticDatum
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Ellipsoid, geodetic datum, or spatial reference system used for geographic
      coordinates
    comments: 'Recommended best practice is to use the EPSG code of the SRS, if known.
      Otherwise use a controlled vocabulary for the name or code of the geodetic datum,
      if known. Otherwise use a controlled vocabulary for the name or code of the
      ellipsoid, if known. If none of these is known, use the value `not recorded`.
      This term has an equivalent in the dwciri: namespace that allows only an IRI
      as a value, whereas this term allows for a string literal value.'
  georeference_protocol:
    name: georeference_protocol
    title: Georeference Protocol
    slot_uri: dwc:georeferenceProtocol
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Description of or reference to the protocol used to determine the
      georeference
    comments: 'This term has an equivalent in the dwciri: namespace that allows only
      an IRI as a value, whereas this term allows for any string literal value.'
  georeference_remarks:
    name: georeference_remarks
    title: Georeference Remarks
    slot_uri: dwc:georeferenceRemarks
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Notes or comments about the determination of the georeference
  georeference_sources:
    name: georeference_sources
    title: Georeference Sources
    slot_uri: dwc:georeferenceSources
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: "List of maps, gazetteers, or other resources used to georeference;\
      \ use '|' separator"
    comments: 'Recommended best practice is to separate the values in a list with
      space vertical bar space (` | `). This term has an equivalent in the dwciri:
      namespace that allows only an IRI as a value, whereas this term allows for any
      string literal value.'
  georeferenced_by:
    name: georeferenced_by
    title: Georeferenced By
    slot_uri: dwc:georeferencedBy
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Name of agent(s) responsible for the georeferencing
    comments: 'Recommended best practice is to separate the values in a list with
      space vertical bar space (` | `). This term has an equivalent in the dwciri:
      namespace that allows only an IRI as a value, whereas this term allows for any
      string literal value.'
  georeferenced_date:
    name: georeferenced_date
    title: Georeferenced Date
    slot_uri: dwc:georeferencedDate
    slot_group: Location (Geography)
    range: date
    multivalued: false
    description: Date on which the dcterms:Location was georeferenced (ISO 8601)
    comments: Recommended best practice is to use a date that conforms to ISO 8601-1:2019.
  higher_geography:
    name: higher_geography
    title: Higher Geography
