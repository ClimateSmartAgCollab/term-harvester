              \ le périmètre d'un dwc:Taxon. Les règles de priorité et l'avis des\
              \ experts sont ensuite utilisées pour définir le statut taxonomique\
              \ du nom donné à ce taxon. Ce statut doit être lié à une référence taxonomique\
              \ spécifique qui définit le concept."
            comments: "La pratique optimale recommandée est d'utiliser un vocabulaire\
              \ contrôlé."
