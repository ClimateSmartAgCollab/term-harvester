  minimum_distance_above_surface_in_meters:
    name: minimum_distance_above_surface_in_meters
    title: Minimum Distance Above Surface In Meters
    slot_uri: dwc:minimumDistanceAboveSurfaceInMeters
    slot_group: Location (Geography)
    range: decimal
    multivalued: false
    description: Minimum distance above a reference surface in meters (positive =
      above, negative = below)
  minimum_elevation_in_meters:
    name: minimum_elevation_in_meters
    title: Minimum Elevation In Meters
    slot_uri: dwc:minimumElevationInMeters
    slot_group: Location (Geography)
    range: decimal
    multivalued: false
    description: Minimum elevation (in meters) of the range; use negative values for
      below sea level
    comments: See https://docs.gbif.org/georeferencing-best-practices/1.0/en/#img-depth-elevation-distance-above-surface.
  municipality:
    name: municipality
    title: Municipality
    slot_uri: dwc:municipality
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Full name of the next smaller administrative region than county
    comments: Recommended best practice is to use a controlled vocabulary such as
      the Getty Thesaurus of Geographic Names. Recommended best practice is to leave
      this field blank if the dcterms:Location spans multiple entities at this administrative
      level or if the dcterms:Location might be in one or another of multiple possible
      entities at this level. Multiplicity and uncertainty of the geographic entity
      can be captured either in the term dwc:higherGeography or in the term dwc:locality,
      or both.
  named_place:
    name: named_place
    title: Named Place
    slot_uri: dwc:namedPlace
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Full name of the geographic place that is not better described by
      other location terms
    comments: Recommended best practice is to leave this field blank if the dcterms:Location
      spans multiple entities or may be in multiple possible entities that meet the
      term definition.  For named places represented as URIs or global unique identifiers,
      please use dwc:locationID.
  point_radius_spatial_fit:
    name: point_radius_spatial_fit
    title: Point Radius Spatial Fit
    slot_uri: dwc:pointRadiusSpatialFit
    slot_group: Location (Geography)
    range: decimal
    multivalued: false
    description: Ratio of the area of the point-radius to the area of the true spatial
      representation; 1 = exact fit
    comments: Legal values are 0, greater than or equal to 1, or undefined. A value
      of 1 is an exact match or 100% overlap. A value of 0 should be used if the given
      point-radius does not completely contain the original representation. The pointRadiusSpatialFit
      is undefined (and should be left empty) if the original representation is any
      geometry without area (e.g., a point or polyline) and without uncertainty and
      the given georeference is not that same geometry (without uncertainty). If both
      the original and the given georeference are the same point, the pointRadiusSpatialFit
      is 1. Detailed explanations with graphical examples can be found in the Georeferencing
      Best Practices, Chapman and Wieczorek, 2020 (https://doi.org/10.15468/doc-gg7h-s853).
  preferred_spatial_representation:
    name: preferred_spatial_representation
    title: Preferred Spatial Representation
    slot_uri: dwc:preferredSpatialRepresentation
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Indication of the best available spatial representation
    comments: "e.g. 'point-radius', 'footprint'"
  site_number:
    name: site_number
    title: Site Number
    slot_uri: dwc:siteNumber
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: An identifier given to a named sampling site
    comments: 'Usually an institutional identifier for a specific named place as opposed
      to dwc:locationID, which is an identifier for the entire set of distinct information
      for an instance of dcterms:Location. This term differs from dwc:fieldNumber
      in that dwc:siteNumber is not related strictly to one dwc:Event. This term has
      an equivalent in the dwciri: namespace that allows only an IRI as a value, whereas
      this term allows for any string literal value.'
  state_province:
    name: state_province
    title: State Province
    slot_uri: dwc:stateProvince
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Full name of the next smaller administrative region than country
    comments: 'Recommended best practice is to use a controlled vocabulary such as
      the Getty Thesaurus of Geographic Names. Recommended best practice is to leave
      this field blank if the dcterms:Location spans multiple entities at this administrative
      level or if the dcterms:Location might be in one or another of multiple possible
      entities at this level. Multiplicity and uncertainty of the geographic entity
      can be captured either in the term dwc:higherGeography or in the term dwc:locality,
      or both. — External vocabularies: ISO_COUNTRY'
  verbatim_coordinate_system:
    name: verbatim_coordinate_system
    title: Verbatim Coordinate System
    slot_uri: dwc:verbatimCoordinateSystem
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Coordinate format for verbatimCoordinates
    comments: 'Recommended best practice is to use a controlled vocabulary. This term
