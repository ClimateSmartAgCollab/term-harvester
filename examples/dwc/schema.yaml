    slot_uri: dwc:locationAccordingTo
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Information about the source of this location data
    comments: 'This term has an equivalent in the dwciri: namespace that allows only
      an IRI as a value, whereas this term allows for any string literal value.'
  location_id:
    name: location_id
    title: Location ID
    slot_uri: dwc:locationID
    slot_group: Location (Geography)
    range: uri
    multivalued: false
    description: Persistent globally unique identifier for the dcterms:Location
    comments: Recommended best practice is to use a globally unique identifier.
  location_remarks:
    name: location_remarks
    title: Location Remarks
    slot_uri: dwc:locationRemarks
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Comments or notes about the dcterms:Location
  maximum_depth_in_meters:
    name: maximum_depth_in_meters
    title: Maximum Depth In Meters
