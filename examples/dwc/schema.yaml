    multivalued: false
    description: Information about who can access the resource or its security status
    comments: Access Rights may include information regarding access or restrictions
      based on privacy, security, or other policies.
  basis_of_record:
    name: basis_of_record
    title: Basis Of Record
    slot_uri: dwc:basisOfRecord
    slot_group: Record-Level Terms
    range: string
    multivalued: false
    description: The specific nature of the data record
    comments: Recommended best practice is to use a controlled vocabulary such as
      the set of local names of the identifiers for classes in Darwin Core.
    examples:
      - value: PreservedSpecimen
      - value: LivingSpecimen
      - value: FossilSpecimen
      - value: HumanObservation
      - value: MachineObservation
      - value: MaterialEntity
      - value: MaterialCitation
      - value: Occurrence
  bibliographic_citation:
    name: bibliographic_citation
    title: Bibliographic Citation
    slot_uri: dcterms:bibliographicCitation
    slot_group: Record-Level Terms
    range: string
    multivalued: false
    description: Bibliographic reference for the resource as a statement indicating
      how it should be cited
    comments: 'From Dublin Core, "Recommended practice is to include sufficient bibliographic
      detail to identify the resource as unambiguously as possible." The intended
      usage of this term in Darwin Core is to provide the preferred way to cite the
      resource itself - "how to cite this record". Note that the intended usage of
      dcterms:references in Darwin Core, by contrast, is to point to the definitive
      source representation of the resource - "where to find the as-close-to-original
      reference", if one is available.'
  collection_code:
    name: collection_code
    title: Collection Code
    slot_uri: dwc:collectionCode
    slot_group: Record-Level Terms
    range: string
    multivalued: false
    description: Abbreviated name of the collection or data set from which the record
      was derived
  collection_id:
    name: collection_id
    title: Collection ID
    slot_uri: dwc:collectionID
    slot_group: Record-Level Terms
    range: uri
    multivalued: false
    description: Persistent globally unique identifier for the collection or data
      set
    comments: For physical specimens, the recommended best practice is to use a globally
      unique and resolvable identifier from a collections registry such as the Global
      Registry of Scientific Collections (https://scientific-collections.gbif.org/).
  data_generalizations:
    name: data_generalizations
    title: Data Generalizations
    slot_uri: dwc:dataGeneralizations
    slot_group: Record-Level Terms
    range: string
    multivalued: false
    description: Actions taken to make the data less specific
    comments: 'This term has an equivalent in the dwciri: namespace that allows only
      an IRI as a value, whereas this term allows for any string literal value.'
  dataset_id:
    name: dataset_id
    title: Dataset ID
    slot_uri: dwc:datasetID
    slot_group: Record-Level Terms
    range: string
    multivalued: false
    description: Identifier for the data set from which the record was derived
  dataset_name:
    name: dataset_name
    title: Dataset Name
    slot_uri: dwc:datasetName
    slot_group: Record-Level Terms
    range: string
    multivalued: false
    description: Name of, or reference to, the data set from which the record was
      derived
  dynamic_properties:
    name: dynamic_properties
    title: Dynamic Properties
    slot_uri: dwc:dynamicProperties
    slot_group: Record-Level Terms
    range: string
    multivalued: false
    description: A list of additional measurements, facts, characteristics, or assertions
      about the record as JSON
    comments: Recommended best practice is to use a key:value encoding schema for
      a data interchange format such as JSON.
  feedback_url:
    name: feedback_url
    title: Feedback URL
    slot_uri: dwc:feedbackURL
    slot_group: Record-Level Terms
    range: uri
    multivalued: false
    description: URL pointing to a form or page for submitting feedback about this
      record (added DWC 2024)
    comments: Recommended best practice is to optionally include query strings that
      act to pre-populate web page form elements and communicate the context.
  information_withheld:
    name: information_withheld
    title: Information Withheld
    slot_uri: dwc:informationWithheld
    slot_group: Record-Level Terms
    range: string
    multivalued: false
    description: Additional information that exists, but that has not been shared
      in the given record
    comments: 'This term has an equivalent in the dwciri: namespace that allows only
      an IRI as a value, whereas this term allows for any string literal value.'
  institution_code:
    name: institution_code
    title: Institution Code
    slot_uri: dwc:institutionCode
    slot_group: Record-Level Terms
    range: string
    multivalued: false
    description: Abbreviated name of the institution in which the object(s) are deposited
    comments: The institution having ownership of a resource should be given in dwc:ownerInstitutionCode.
  institution_id:
    name: institution_id
    title: Institution ID
    slot_uri: dwc:institutionID
    slot_group: Record-Level Terms
    range: uri
    multivalued: false
    description: Persistent globally unique identifier for the institution having
      custody of the object(s)
    comments: For physical specimens, the recommended best practice is to use a globally
      unique and resolvable identifier from a collections registry such as the Research
      Organization Registry (ROR) or the Global Registry of Scientific Collections
      (https://scientific-collections.gbif.org/).
  language:
    name: language
    title: Language
    slot_uri: dc:language
    slot_group: Record-Level Terms
    range: string
    multivalued: false
    description: "The language of the resource (BCP 47 tag, e.g. 'en', 'fr')"
    comments: 'Recommended best practice is to use a controlled vocabulary such as
      RFC 5646. This term has an equivalent in the dcterms: namespace that allows
      only an IRI as a value, whereas this term allows for any string literal value.'
  license:
    name: license
    title: License
    slot_uri: dcterms:license
    slot_group: Record-Level Terms
    range: uri
    multivalued: false
    description: Legal document giving official permission to do anything with the
      resource (URI)
  modified:
    name: modified
    title: Modified
    slot_uri: dcterms:modified
    slot_group: Record-Level Terms
    range: datetime
    multivalued: false
    description: The most recent date-time on which the resource was changed (ISO
      8601)
    comments: Recommended best practice is to use a date that conforms to ISO 8601-1:2019.
  owner_institution_code:
    name: owner_institution_code
    title: Owner Institution Code
    slot_uri: dwc:ownerInstitutionCode
    slot_group: Record-Level Terms
    range: string
    multivalued: false
    description: Abbreviated name of institution that owns the object(s) if different
      from institution in custody
  references:
    name: references
    title: References
    slot_uri: dcterms:references
    slot_group: Record-Level Terms
    range: uri
    multivalued: false
    description: A related resource referenced, cited, or otherwise pointed to by
      the described resource (URI)
    comments: 'From Dublin Core, "This property is intended to be used with non-literal
      values. This property is an inverse property of Is Referenced By." The intended
      usage of this term in Darwin Core is to point to the definitive source representation
      of the resource (e.g., dwc:Taxon, dwc:Occurrence, dwc:Event), if one is available.
      Note that the intended usage of dcterms:bibliographicCitation in Darwin Core,
      by contrast, is to provide the preferred way to cite the resource itself.'
  rights_holder:
    name: rights_holder
    title: Rights Holder
    slot_uri: dcterms:rightsHolder
    slot_group: Record-Level Terms
    range: string
    multivalued: false
    description: Person or organization owning or managing rights over the resource
  accepted_name_usage:
    name: accepted_name_usage
    title: Accepted Name Usage
    slot_uri: dwc:acceptedNameUsage
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Full name of the currently valid (accepted) taxon in the same taxonomic
      tradition
    comments: The full scientific name, with authorship and date information if known,
      of the accepted (botanical) or valid (zoological) name in cases where the provided
      dwc:scientificName is considered by the reference indicated in the dwc:nameAccordingTo
      property, or of the content provider, to be a synonym or misapplied name. When
      applied to a dwc:Organism or dwc:Occurrence, this term should be used in cases
      where a content provider regards the provided dwc:scientificName to be inconsistent
      with the taxonomic perspective of the content provider. For example, there are
      many discrepancies within specimen collections and observation datasets between
      the recorded name (e.g., the most recent identification from an expert who examined
      a specimen, or a field identification for an observed dwc:Organism), and the
      name asserted by the content provider to be taxonomically accepted.
  accepted_name_usage_id:
    name: accepted_name_usage_id
    title: Accepted Name Usage ID
    slot_uri: dwc:acceptedNameUsageID
    slot_group: Taxon (Classification)
    range: uri
    multivalued: false
    description: Identifier for the currently valid taxon name
    comments: 'This term should be used for synonyms or misapplied names to refer
      to the dwc:taxonID of a dwc:Taxon record that represents the accepted (botanical)
      or valid (zoological) name. For Darwin Core Archives the related record should
      be present locally in the same archive. — External vocabularies: NCBITaxon'
  class:
    name: class
    title: Class
    slot_uri: dwc:class
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Full scientific name of the class
    comments: 'not needed if species-level scientificName or NCBITaxon ID is provided
      — External vocabularies: NCBITaxon'
  cultivar_epithet:
    name: cultivar_epithet
    title: Cultivar Epithet
    slot_uri: dwc:cultivarEpithet
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Part of a name of a cultivar (excluding single quotes)
    comments: According to the Rules of the Cultivated Plant Code, a cultivar name
      consists of a botanical name followed by a cultivar epithet. The value given
      as the dwc:cultivarEpithet should exclude any quotes. The term dwc:taxonRank
      should be used to indicate which type of cultivated plant name (e.g., cultivar,
      cultivar group, grex) is concerned. This epithet, including any enclosing apostrophes
      or suffix, should be provided in dwc:scientificName as well.
  family:
    name: family
    title: Family
    slot_uri: dwc:family
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Full scientific name of the family
    comments: 'not needed if species-level scientificName or NCBITaxon ID is provided
      — External vocabularies: NCBITaxon'
  generic_name:
    name: generic_name
    title: Generic Name
    slot_uri: dwc:genericName
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Monomial genus portion of scientificName when it is a combination
    comments: For synonyms the accepted genus and the genus part of the name may be
      different. The term dwc:genericName should be used together with dwc:specificEpithet
      to form a binomial and with dwc:infraspecificEpithet to form a trinomial. The
      term dwc:genericName should only be used for combinations. Uninomials of generic
      rank do not have a dwc:genericName.
  genus:
    name: genus
    title: Genus
    slot_uri: dwc:genus
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Full scientific name of the genus
    comments: 'prefer scientificName when species is available — External vocabularies:
      NCBITaxon'
  higher_classification:
    name: higher_classification
    title: Higher Classification
    slot_uri: dwc:higherClassification
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Taxon classification names, from highest to lowest, concatenated
    comments: Recommended best practice is to separate the values in a list with space
      vertical bar space (` | `), with terms in order from the highest taxonomic rank
      to the lowest.
  infrageneric_epithet:
    name: infrageneric_epithet
    title: Infrageneric Epithet
    slot_uri: dwc:infragenericEpithet
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Epithet below genus level and above species level in a scientificName
    comments: The term dwc:infragenericEpithet should be used in conjunction with
      dwc:genericName, dwc:specificEpithet, dwc:infraspecificEpithet, dwc:taxonRank
      and dwc:scientificNameAuthorship to represent the individual elements of the
      complete dwc:scientificName. It can be used to indicate the subgenus placement
      of a species, which in zoology is often given in parentheses. Can also be used
      to share infrageneric names such as botanical sections (e.g., `Vicia sect. Cracca`).
  infraspecific_epithet:
    name: infraspecific_epithet
    title: Infraspecific Epithet
    slot_uri: dwc:infraspecificEpithet
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Lowest infraspecific epithet of the scientificName
    comments: 'In botany, name strings in literature and identifications may have
      multiple infraspecific ranks. According to the International Code of Nomenclature
      for algae, fungi, and plants (Shenzhen Code Articles 6.7 & Art. 24.1), valid
      names only have two epithets, with the lowest rank being the dwc:infraspecificEpithet.
      For example: the dwc:infraspecificEpithet in the string `Indigofera charlieriana
      subsp. sessilis var. scaberrima` is `scaberrima` and the dwc:scientificName
      is `Indigofera charlieriana var. scaberrima`. Use dwc:verbatimIdentification
      for the full name string used in a dwc:Identification.'
  kingdom:
    name: kingdom
    title: Kingdom
    slot_uri: dwc:kingdom
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Full scientific name of the kingdom
    comments: 'not needed if species-level scientificName or NCBITaxon ID is provided
      — External vocabularies: NCBITaxon'
  name_according_to:
    name: name_according_to
    title: Name According To
    slot_uri: dwc:nameAccordingTo
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Reference for the taxon circumscription
    comments: This term provides context to the dwc:scientificName. Together with
      the dwc:scientificName, separated by `sensu` or `sec.`, it forms the taxon concept
      label, which may be seen as having the same relationship to dwc:taxonConceptID
      as, for example, dwc:acceptedNameUsage has to dwc:acceptedNameUsageID. When
      not provided, in Taxon Core data sets the dwc:nameAccordingTo can be taken to
      be the data set. In this case the data set mostly provides sufficient context
      to infer the delimitation of the taxon and its relationship with other taxa.
      In Occurrence Core data sets, when not provided, dwc:nameAccordingTo can be
      an underlying taxonomy of the data set, e.g., Plants of the World Online (http://powo.science.kew.org/)
      for vascular plant records in iNaturalist (in which case it should be provided),
      or, which is the case for most dwc:PreservedSpecimen data sets, the dwc:Identification,
      in which case there is no further context.
  name_according_to_id:
    name: name_according_to_id
    title: Name According To ID
    slot_uri: dwc:nameAccordingToID
    slot_group: Taxon (Classification)
    range: uri
    multivalued: false
    description: Identifier for the reference establishing the taxon circumscription
  name_published_in:
    name: name_published_in
    title: Name Published In
    slot_uri: dwc:namePublishedIn
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Reference for the original publication of the scientificName
    comments: A citation of the first publication of the name in its given combination,
      not the basionym / original name. Recombinations are often not published in
      zoology, in which case dwc:namePublishedIn should be empty.
  name_published_in_id:
    name: name_published_in_id
    title: Name Published In ID
    slot_uri: dwc:namePublishedInID
    slot_group: Taxon (Classification)
    range: uri
    multivalued: false
    description: Identifier for the publication in which the scientificName was originally
      established
    comments: A citation of the first publication of the name in its given combination,
      not the basionym / original name. Recombinations are often not published in
      zoology, in which case dwc:namePublishedInID should be empty.
  name_published_in_year:
    name: name_published_in_year
    title: Name Published In Year
    slot_uri: dwc:namePublishedInYear
    slot_group: Taxon (Classification)
    range: integer
    multivalued: false
    description: Four-digit year of the original publication of the scientificName
  nomenclatural_code:
    name: nomenclatural_code
    title: Nomenclatural Code
    slot_uri: dwc:nomenclaturalCode
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Nomenclatural code under which the scientificName is constructed
    comments: Recommended best practice is to use a controlled vocabulary.
    examples:
      - value: ICZN
      - value: ICNafp
      - value: ICNCP
      - value: ICTV
      - value: ICNB
      - value: BioCode
      - value: PhyloCode
  nomenclatural_status:
    name: nomenclatural_status
    title: Nomenclatural Status
    slot_uri: dwc:nomenclaturalStatus
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Status related to the original publication of the name
    comments: "e.g. 'nom. inval.', 'nom. nud.', 'nom. illeg.'"
  order:
    name: order
    title: Order
    slot_uri: dwc:order
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Full scientific name of the order
    comments: 'not needed if species-level scientificName or NCBITaxon ID is provided
      — External vocabularies: NCBITaxon'
  original_name_usage:
    name: original_name_usage
    title: Original Name Usage
    slot_uri: dwc:originalNameUsage
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Name usage of the basionym or original combination of the scientificName
    comments: The full scientific name, with authorship and date information if known,
      of the name usage in which the terminal element of the dwc:scientificName was
      originally established under the rules of the associated dwc:nomenclaturalCode.
      For example, for names governed by the ICNafp, this term would indicate the
      basionym of a record representing a subsequent combination. Unlike basionyms,
      however, this term can apply to scientific names at all ranks.
  original_name_usage_id:
    name: original_name_usage_id
    title: Original Name Usage ID
    slot_uri: dwc:originalNameUsageID
    slot_group: Taxon (Classification)
    range: uri
    multivalued: false
    description: Identifier for the name usage in which the scientificName was originally
      established
    comments: This term should be used to refer to the dwc:taxonID of a dwc:Taxon
      record that represents the usage of the terminal element of the dwc:scientificName
      as originally established under the rules of the associated dwc:nomenclaturalCode.
      For example, for names governed by the ICNafp, this term would establish the
      relationship between a record representing a subsequent combination and the
      record for its corresponding basionym. Unlike basionyms, however, this term
      can apply to scientific names at all ranks. For Darwin Core Archives the related
      record should be present locally in the same archive.
  parent_name_usage:
    name: parent_name_usage
    title: Parent Name Usage
    slot_uri: dwc:parentNameUsage
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Full name of the direct, more inclusive taxon in the classification
  parent_name_usage_id:
    name: parent_name_usage_id
    title: Parent Name Usage ID
    slot_uri: dwc:parentNameUsageID
    slot_group: Taxon (Classification)
    range: uri
    multivalued: false
    description: Identifier for the direct, more inclusive taxon in this classification
    comments: 'This term should be used for accepted names to refer to the dwc:taxonID
      of a dwc:Taxon record that represents the next higher taxon rank in the same
      taxonomic classification. For Darwin Core Archives the related record should
      be present locally in the same archive. — External vocabularies: NCBITaxon'
  phylum:
    name: phylum
    title: Phylum
    slot_uri: dwc:phylum
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Full scientific name of the phylum
    comments: 'not needed if species-level scientificName or NCBITaxon ID is provided
      — External vocabularies: NCBITaxon'
  scientific_name:
    name: scientific_name
    title: Scientific Name
    slot_uri: dwc:scientificName
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Full scientific name including authorship if available
    comments: 'This term should not contain identification qualifications, which should
      instead be supplied in the IdentificationQualifier term. When applied to an
      Organism or Occurrence, this term should be used to represent the scientific
      name that was applied to the associated Organism in accordance with the Taxon
      to which it was or is currently identified. Names should be compliant to the
      most recent nomenclatural code. For example, names of hybrids for algae, fungi
      and plants should follow the rules of the International Code of Nomenclature
      for algae, fungi, and plants (Shenzhen Code Articles H.1, H.2 and H.3). Thus,
      use the multiplication sign `×` (Unicode `U+00D7`, HTML `&times;`) to identify
      a hybrid, not `x` or `X`, if possible. — External vocabularies: NCBITaxon'
  scientific_name_authorship:
    name: scientific_name_authorship
    title: Scientific Name Authorship
    slot_uri: dwc:scientificNameAuthorship
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Authorship information for the scientificName
    comments: "e.g. '(Pfeifer, 1846)' or 'Linnaeus, 1758'"
  scientific_name_id:
    name: scientific_name_id
    title: Scientific Name ID
    slot_uri: dwc:scientificNameID
    slot_group: Taxon (Classification)
    range: uri
    multivalued: false
    description: Identifier for nomenclatural details of the scientificName
    comments: e.g. ipni:320035-2 or Tropicos:17800567
  specific_epithet:
    name: specific_epithet
    title: Specific Epithet
    slot_uri: dwc:specificEpithet
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Species epithet of the scientificName
    comments: "e.g. 'sapiens' in 'Homo sapiens'"
  subfamily:
    name: subfamily
    title: Subfamily
    slot_uri: dwc:subfamily
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Full scientific name of the subfamily
  subgenus:
    name: subgenus
    title: Subgenus
    slot_uri: dwc:subgenus
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Full scientific name of the subgenus (without parentheses)
    comments: A value for this term should be a complete subgenus name as required
      by the appropriate nomenclatural code.
  subtribe:
    name: subtribe
    title: Subtribe
    slot_uri: dwc:subtribe
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Full scientific name of the subtribe
  superfamily:
    name: superfamily
    title: Superfamily
    slot_uri: dwc:superfamily
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Full scientific name of the superfamily
    comments: A taxonomic category subordinate to an order and superior to a family.
      According to ICZN article 29.2, the suffix `-oidea` is used for a superfamily
      name.
  taxon_concept_id:
    name: taxon_concept_id
    title: Taxon Concept ID
    slot_uri: dwc:taxonConceptID
    slot_group: Taxon (Classification)
    range: uri
    multivalued: false
    description: Identifier for the taxon concept (name + circumscription)
    comments: 'use NCBITaxon CURIE when available — External vocabularies: NCBITaxon'
  taxon_id:
    name: taxon_id
    title: Taxon ID
    slot_uri: dwc:taxonID
    slot_group: Taxon (Classification)
    range: uri
    multivalued: false
    description: Identifier for the dwc:Taxon concept
    comments: 'use NCBITaxon CURIE (e.g. NCBITaxon:9606 for Homo sapiens) when available
      — External vocabularies: NCBITaxon'
  taxon_rank:
    name: taxon_rank
    title: Taxon Rank
    slot_uri: dwc:taxonRank
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: The taxonomic rank of the most specific name in the scientificName
    comments: Recommended best practice is to use a controlled vocabulary. The taxon
      ranks of algae, fungi and plants are defined in the International Code of Nomenclature
      for algae, fungi, and plants (Shenzhen Code Articles H3.2, H4.4 and H.3.1).
    examples:
      - value: kingdom
      - value: phylum
      - value: class
      - value: order
      - value: superfamily
      - value: family
      - value: subfamily
      - value: tribe
      - value: subtribe
      - value: genus
      - value: subgenus
      - value: section
      - value: series
      - value: species
      - value: subspecies
      - value: variety
      - value: subvariety
      - value: form
      - value: cultivar
      - value: strain
  taxon_remarks:
    name: taxon_remarks
    title: Taxon Remarks
    slot_uri: dwc:taxonRemarks
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Comments or notes about the taxon or name
  taxonomic_status:
    name: taxonomic_status
    title: Taxonomic Status
    slot_uri: dwc:taxonomicStatus
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: The status of the use of the scientificName as a label for a taxon
    comments: Recommended best practice is to use a controlled vocabulary.
    examples:
      - value: accepted
      - value: synonym
      - value: heterotypicSynonym
      - value: homotypicSynonym
      - value: proParteSynonym
      - value: misapplied
      - value: doubtful
      - value: artificialHybrid
  tribe:
    name: tribe
    title: Tribe
    slot_uri: dwc:tribe
    slot_group: Taxon (Classification)
    range: string
    multivalued: false
    description: Full scientific name of the tribe
  verbatim_taxon_rank:
    name: verbatim_taxon_rank
    title: Verbatim Taxon Rank
    slot_uri: dwc:verbatimTaxonRank
    slot_group: Taxon (Classification)
