    slot_uri: dwc:island
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Name of the island on or near which the dcterms:Location occurs
    comments: Recommended best practice is to use a controlled vocabulary such as
      the Getty Thesaurus of Geographic Names.
  island_group:
    name: island_group
    title: Island Group
    slot_uri: dwc:islandGroup
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Name of the island group in or near which the dcterms:Location occurs
