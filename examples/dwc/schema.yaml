    slot_uri: dwc:verbatimCoordinates
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Original coordinate representation as it occurred in the original
      record
    comments: The coordinate ellipsoid, geodeticDatum, or full Spatial Reference System
      (SRS) for these coordinates should be stored in dwc:verbatimSRS and the coordinate
      system should be stored in dwc:verbatimCoordinateSystem.
  verbatim_depth:
    name: verbatim_depth
    title: Verbatim Depth
    slot_uri: dwc:verbatimDepth
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Original description of depth
    comments: "e.g. '100-200 m'"
  verbatim_elevation:
    name: verbatim_elevation
    title: Verbatim Elevation
    slot_uri: dwc:verbatimElevation
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Original description of elevation
    comments: "e.g. '100-200 m'"
  verbatim_latitude:
    name: verbatim_latitude
    title: Verbatim Latitude
    slot_uri: dwc:verbatimLatitude
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Original latitude representation
    comments: The coordinate ellipsoid, geodeticDatum, or full Spatial Reference System
      (SRS) for these coordinates should be stored in dwc:verbatimSRS and the coordinate
      system should be stored in dwc:verbatimCoordinateSystem.
  verbatim_locality:
    name: verbatim_locality
    title: Verbatim Locality
    slot_uri: dwc:verbatimLocality
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Original text of the specific description of the place
  verbatim_longitude:
    name: verbatim_longitude
    title: Verbatim Longitude
    slot_uri: dwc:verbatimLongitude
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Original longitude representation
    comments: The coordinate ellipsoid, geodeticDatum, or full Spatial Reference System
      (SRS) for these coordinates should be stored in dwc:verbatimSRS and the coordinate
      system should be stored in dwc:verbatimCoordinateSystem.
  verbatim_srs:
    name: verbatim_srs
    title: Verbatim SRS
    slot_uri: dwc:verbatimSRS
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Spatial reference system (SRS) for verbatimCoordinates
    comments: 'Recommended best practice is to use the EPSG code of the SRS, if known.
      Otherwise use a controlled vocabulary for the name or code of the geodetic datum,
      if known. Otherwise use a controlled vocabulary for the name or code of the
      ellipsoid, if known. If none of these is known, use the value `not recorded`.
      This term has an equivalent in the dwciri: namespace that allows only an IRI
      as a value, whereas this term allows for any string literal value.'
  vertical_datum:
    name: vertical_datum
    title: Vertical Datum
    slot_uri: dwc:verticalDatum
    slot_group: Location (Geography)
    range: string
    multivalued: false
    description: Vertical datum used as reference for the elevation
    comments: 'Recommended best practice is to use a controlled vocabulary. This term
      has an equivalent in the dwciri: namespace that allows only an IRI as a value,
