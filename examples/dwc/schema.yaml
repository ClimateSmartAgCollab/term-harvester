    range: string
    multivalued: false
    description: Geography less specific than locality, concatenated in order from
      general to specific
    comments: Recommended best practice is to separate the values in a list with space
      vertical bar space (` | `), with terms in order from least specific to most
      specific.
  higher_geography_id:
    name: higher_geography_id
    title: Higher Geography ID
    slot_uri: dwc:higherGeographyID
    slot_group: Location (Geography)
    range: uri
    multivalued: false
    description: Identifier for the geographic region
    comments: Recommended best practice is to use a persistent identifier from a controlled
      vocabulary such as the Getty Thesaurus of Geographic Names.
  island:
    name: island
