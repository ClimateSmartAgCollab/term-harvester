slots:
  digital_specimen_id:
    name: digital_specimen_id
    title: Digital Specimen ID
    slot_uri: dwc:digitalSpecimenID
    slot_group: Material Entity
    range: uri
    multivalued: false
    description: Persistent identifier for the digital twin of the physical specimen
      (added DWC 2022)
    comments: 'A Digital Specimen is defined in https://doi.org/10.3897/rio.7.e67379.
      A dwc:digitalSpecimenID is intended to uniquely and persistently identify a
      Digital Specimen. Recommended best practice is to use a DOI with machine readable
      metadata in the DOI record that uses a community agreed metadata profile (also
      known as FDO profile) for a Digital Specimen. For an example see: https://doi.org/10.3535/N75-CR4-0SM?noredirect.
      The identifier is for a digital information artifact (the Digital Specimen)
      as opposed to an identifier for a specific instance of a dwc:MaterialEntity.'
  damage_remarks:
    name: damage_remarks
    title: Damage Remarks
    slot_uri: dwc:damageRemarks
    slot_group: Material Entity
    range: string
    multivalued: false
    description: Notes about existing damage to the material entity
    comments: 'See Royce, K., Baars, C., & Viles, H. (2021). Defining Damage and Susceptibility,
      with Implications for Mineral Specimens and Objects: Introducing the Mineral
      Susceptibility Database. Studies in Conservation, 68(3), 298-317. https://doi.org/10.1080/00393630.2021.2015947'
  disposition:
    name: disposition
    title: Disposition
    slot_uri: dwc:disposition
    slot_group: Material Entity
    range: string
    multivalued: false
    description: The current state of a dwc:MaterialEntity with respect to a collection
    comments: 'Recommended best practice is to use a controlled vocabulary. This term
      has an equivalent in the dwciri: namespace that allows only an IRI as a value,
      whereas this term allows for any string literal value.'
    examples:
      - value: inCollection
      - value: missing
      - value: voucherElsewhere
      - value: discarded
      - value: destroyed
      - value: duplicate
      - value: lostInDebt
      - value: onLoan
  handling_requirements:
    name: handling_requirements
    title: Handling Requirements
    slot_uri: dwc:handlingRequirements
    slot_group: Material Entity
    range: string
    multivalued: false
    description: Special handling needs for the material entity
    comments: "e.g. 'keep frozen', 'do not freeze'"
  hazard_remarks:
    name: hazard_remarks
    title: Hazard Remarks
    slot_uri: dwc:hazardRemarks
    slot_group: Material Entity
    range: string
    multivalued: false
    description: Notes about the specific hazard or handling of the hazard
  hazard_type:
    name: hazard_type
    title: Hazard Type
    slot_uri: dwc:hazardType
    slot_group: Material Entity
    range: string
    multivalued: false
    description: Category of hazard associated with the entity
    comments: 'Recommended best practice is to use a controlled vocabulary such as
      https://kos.geospecimens.org/vocab/hazard-type. This term has an equivalent
      in the dwciri: namespace that allows only an IRI as a value, whereas this term
      allows for any string literal value.'
  is_part_of_material_entity_id:
    name: is_part_of_material_entity_id
    title: Is Part Of Material Entity ID
    slot_uri: dwc:isPartOfMaterialEntityID
    slot_group: Material Entity
    range: uri
    multivalued: false
    description: Identifier of the dwc:MaterialEntity of which this entity is a part
      (added DWC 2022)
    comments: A dwc:MaterialEntity was not taken from (derived from) a dwc:MaterialEntity
      of which it is a part. Recommended best practice is to use a globally unique
      identifier. The hierarchical relationship supported by this term allows for
      the atomization of individual parts of a dwc:MaterialEntity, such as a specimen
      composed of two minerals (Pyrite and Quartz), each with its own characteristics
      and potential dwc:Assertions.
  material_description:
    name: material_description
    title: Material Description
    slot_uri: dwc:materialDescription
    slot_group: Material Entity
    range: string
    multivalued: false
    description: Description of entity features, condition, contents, or other attributes
      not captured by other terms
  material_entity_category:
    name: material_entity_category
    title: Material Entity Category
    slot_uri: dwc:materialEntityCategory
    slot_group: Material Entity
    range: string
    multivalued: false
    description: Hierarchical category or classification of the material entity
    comments: 'Recommended best practice is to use a limited, tightly controlled vocabulary.
      This term has an equivalent in the dwciri: namespace that allows only an IRI
      as a value, whereas this term allows for any string literal value.'
  material_entity_id:
    name: material_entity_id
    title: Material Entity ID
    slot_uri: dwc:materialEntityID
    slot_group: Material Entity
    range: uri
    multivalued: false
    description: Persistent globally unique identifier for the dwc:MaterialEntity
    comments: Values of dwc:materialEntityID are intended to uniquely and persistently
      identify a particular dwc:MaterialEntity within some context. Examples of context
      include a particular sample collection, an organization, or the worldwide scale.
      Recommended best practice is to use a persistent, globally unique identifier.
      The identifier is bound to a physical object (the dwc:MaterialEntity) as opposed
      to a particular digital record (representation) of that physical object.
  material_entity_remarks:
    name: material_entity_remarks
    title: Material Entity Remarks
    slot_uri: dwc:materialEntityRemarks
    slot_group: Material Entity
    range: string
    multivalued: false
    description: Comments or notes about the dwc:MaterialEntity
  material_entity_type:
    name: material_entity_type
    title: Material Entity Type
    slot_uri: dwc:materialEntityType
    slot_group: Material Entity
    range: string
    multivalued: false
    description: The kind of material entity
    comments: 'A more generic classification of a dwc:MaterialEntity than dwc:preparations.
      Recommended best practice is to use a controlled vocabulary. This term has an
      equivalent in the dwciri: namespace that allows only an IRI as a value, whereas
      this term allows for any string literal value.'
    examples:
      - value: Tissue
      - value: Blood
      - value: Bone
      - value: Feather
      - value: Scale
      - value: Shell
      - value: Skull
      - value: Seed
      - value: Leaf
      - value: Root
      - value: Flower
      - value: Fossil
      - value: Rock
      - value: Soil
      - value: Water
      - value: DNA
      - value: RNA
      - value: WholeOrganism
  material_proportion:
    name: material_proportion
    title: Material Proportion
    slot_uri: dwc:materialProportion
    slot_group: Material Entity
    range: decimal
    multivalued: false
    description: The fraction or proportion of the original material entity
    comments: 'Recommended best practice is to use a controlled vocabulary such as
      http://resource.geosciml.org/classifier/cgi/proportionterm. This term has an
      equivalent in the dwciri: namespace that allows only an IRI as a value, whereas
      this term allows for any string literal value.'
  material_role:
    name: material_role
    title: Material Role
    slot_uri: dwc:materialRole
    slot_group: Material Entity
    range: string
    multivalued: false
    description: The role of the material entity in a specific context
    comments: 'Roles depend on both the part and the parent object. For instance,
      a rock (material category) within the parent specimen serves as a clast and
      depends on both the specimen part and the parent specimen for its existence.
      Recommended best practice is to use a controlled vocabulary such as IUGS CGI
      Compound Material Consituent Part, http://resource.geosciml.org/classifier/cgi/compoundmaterialconstituentpartrole.
      This term has an equivalent in the dwciri: namespace that allows only an IRI
      as a value, whereas this term allows for any string literal value.'
  measured_mass_in_grams:
    name: measured_mass_in_grams
    title: Measured Mass In Grams
    slot_uri: dwc:measuredMassInGrams
    slot_group: Material Entity
    range: decimal
    multivalued: false
    description: Mass of the material entity measured in grams
  object_quantity:
    name: object_quantity
    title: Object Quantity
    slot_uri: dwc:objectQuantity
    slot_group: Material Entity
    range: decimal
    multivalued: false
    description: Numeric count of objects associated with this entity
    comments: A dwc:objectQuantity must have a corresponding dwc:objectQuantityType.
  object_quantity_type:
    name: object_quantity_type
    title: Object Quantity Type
    slot_uri: dwc:objectQuantityType
    slot_group: Material Entity
    range: string
    multivalued: false
    description: Kind of quantity measure used in objectQuantity
    comments: 'A dwc:objectQuantityType must have a corresponding dwc:objectQuantity.
      This term has an equivalent in the dwciri: namespace that allows only an IRI
      as a value, whereas this term allows for any string literal value.'
  preparations:
    name: preparations
    title: Preparations
    slot_uri: dwc:preparations
    slot_group: Material Entity
    range: string
    multivalued: false
    description: List of preparation and preservation methods
    comments: 'Recommended best practice is to separate the values in a list with
      space vertical bar space (` | `). This term has an equivalent in the dwciri:
      namespace that allows only an IRI as a value, whereas this term allows for any
      string literal value.'
  substrate:
    name: substrate
    title: Substrate
    slot_uri: dwc:substrate
    slot_group: Material Entity
    range: string
    multivalued: false
    description: Material on or in which an organism or material entity was found
    comments: 'No inference can be made from this term that a dwc:Organism interacted
      in any other way than being connected to some (not a particular) material resource
      of the substrate type (such as during parasitization or decomposition). A host-parasite
      relationship is better expressed as a dwc:OrganismInteraction. This term has
      an equivalent in the dwciri: namespace that allows only an IRI as a value, whereas
      this term allows for any string literal value.'
  treatments:
    name: treatments
    title: Treatments
    slot_uri: dwc:treatments
    slot_group: Material Entity
    range: string
    multivalued: false
    description: Chemical or physical treatments applied to the material entity
    comments: Includes both proactive and reactive actions.
  verbatim_label:
    name: verbatim_label
    title: Verbatim Label
    slot_uri: dwc:verbatimLabel
    slot_group: Material Entity
    range: string
    multivalued: false
    description: Text that appears on a label attached to the material entity, verbatim
    comments: The content of this term should include no embellishments, prefixes,
      headers or other additions made to the text. Abbreviations must not be expanded
      and supposed misspellings must not be corrected. Lines or breakpoints between
      blocks of text that could be verified by seeing the original labels or images
      of them may be used. Examples of material entities include preserved specimens,
      fossil specimens, and material samples. Best practice is to use UTF-8 for all
      characters. Best practice is to add comment “verbatimLabel derived from human
      transcription” in dwc:materialEntityRemarks. Examples can be found at https://dwc.tdwg.org/examples/verbatimLabel.
  verbatim_mass:
    name: verbatim_mass
    title: Verbatim Mass
    slot_uri: dwc:verbatimMass
    slot_group: Material Entity
    range: string
    multivalued: false
    description: Mass of the material entity as originally recorded on a label or
      in a database
  day:
    name: day
    title: Day
    slot_uri: dwc:day
    slot_group: Event (Collection / Observation)
    range: integer
    multivalued: false
    description: Integer day of the month (1–31)
    comments: prefer ISO 8601 eventDate
  end_day_of_year:
    name: end_day_of_year
    title: End Day Of Year
    slot_uri: dwc:endDayOfYear
    slot_group: Event (Collection / Observation)
    range: integer
    multivalued: false
    description: Latest ordinal day of the year (1–366) on which the event occurred
    comments: The value is 1 for January 1 and 365 for December 31, except in a leap
      year, in which case it is 366.
  event_category:
    name: event_category
    title: Event Category
    slot_uri: dwc:eventCategory
    slot_group: Event (Collection / Observation)
    range: string
    multivalued: false
    description: Broad category of dwc:Event
    comments: 'Recommended best practice is to use a limited, tightly controlled vocabulary.
      Recommended best practice is to use one of the following controlled values:
      `Event`, `MaterialGathering`, `Occurrence`, `OrganismInteraction`, or `Survey`.
      This term has an equivalent in the dwciri: namespace that allows only an IRI
      as a value, whereas this term allows for any string literal value.'
  event_date:
    name: event_date
    title: Event Date
    slot_uri: dwc:eventDate
    slot_group: Event (Collection / Observation)
    range: date
    multivalued: false
    description: ISO 8601 date or interval during which the event occurred
    comments: Recommended best practice is to use a date that conforms to ISO 8601-1:2019.
      Not suitable for a time in a geological context.
  event_duration_unit:
    name: event_duration_unit
    title: Event Duration Unit
    slot_uri: dwc:eventDurationUnit
    slot_group: Event (Collection / Observation)
    range: string
    multivalued: false
    description: Units for the event duration
    comments: "e.g. 'minutes', 'hours', 'days'"
  event_duration_value:
    name: event_duration_value
    title: Event Duration Value
    slot_uri: dwc:eventDurationValue
    slot_group: Event (Collection / Observation)
    range: decimal
    multivalued: false
    description: Numeric value for the duration of the sampling event
  event_id:
    name: event_id
    title: Event ID
    slot_uri: dwc:eventID
    slot_group: Event (Collection / Observation)
    range: uri
    multivalued: false
    description: Persistent globally unique identifier for the dwc:Event
  event_remarks:
    name: event_remarks
    title: Event Remarks
    slot_uri: dwc:eventRemarks
    slot_group: Event (Collection / Observation)
    range: string
    multivalued: false
    description: Comments or notes about the dwc:Event
  event_time:
    name: event_time
    title: Event Time
    slot_uri: dwc:eventTime
    slot_group: Event (Collection / Observation)
    range: string
    multivalued: false
    description: ISO 8601 time or time interval during which the event occurred
    comments: Recommended best practice is to use a time of day that conforms to ISO
      8601-1:2019.
  event_type:
    name: event_type
    title: Event Type
    slot_uri: dwc:eventType
    slot_group: Event (Collection / Observation)
    range: string
    multivalued: false
    description: Narrow category of dwc:Event
    comments: 'Recommended best practice is to use a controlled vocabulary. This term
      has an equivalent in the dwciri: namespace that allows only an IRI as a value,
      whereas this term allows for any string literal value. — External vocabularies:
      DwCEventType'
  field_notes:
    name: field_notes
    title: Field Notes
    slot_uri: dwc:fieldNotes
    slot_group: Event (Collection / Observation)
    range: string
    multivalued: false
    description: Reference to or text of notes taken in the field during the event
    comments: 'This term has an equivalent in the dwciri: namespace that allows only
      an IRI as a value, whereas this term allows for any string literal value.'
  field_number:
    name: field_number
    title: Field Number
    slot_uri: dwc:fieldNumber
    slot_group: Event (Collection / Observation)
    range: string
    multivalued: false
    description: Identifier given to the dwc:Event in the field
    comments: 'Often serves as a link between field notes and a dwc:Event. This term
      has an equivalent in the dwciri: namespace that allows only an IRI as a value,
      whereas this term allows for any string literal value.'
  habitat:
    name: habitat
    title: Habitat
    slot_uri: dwc:habitat
    slot_group: Event (Collection / Observation)
    range: string
    multivalued: false
    description: Category or description of the habitat
    comments: 'This term has an equivalent in the dwciri: namespace that allows only
      an IRI as a value, whereas this term allows for any string literal value.'
  is_vegetation_cover_reported:
    name: is_vegetation_cover_reported
    title: Is Vegetation Cover Reported
    slot_uri: dwc:isVegetationCoverReported
    slot_group: Event (Collection / Observation)
    range: boolean
    multivalued: false
    description: Whether a vegetation cover metric was reported as part of the sampling
      event
  month:
    name: month
    title: Month
    slot_uri: dwc:month
    slot_group: Event (Collection / Observation)
    range: integer
    multivalued: false
    description: Integer month (1–12)
    comments: prefer ISO 8601 eventDate
  parent_event_id:
    name: parent_event_id
    title: Parent Event ID
    slot_uri: dwc:parentEventID
    slot_group: Event (Collection / Observation)
    range: uri
    multivalued: false
    description: Identifier for the broader dwc:Event that contains this event (e.g.
      plot visit within a campaign)
    comments: Recommended best practice is to use a globally unique identifier.
  reported_extreme_conditions:
    name: reported_extreme_conditions
    title: Reported Extreme Conditions
    slot_uri: dwc:reportedExtremeConditions
    slot_group: Event (Collection / Observation)
    range: string
    multivalued: false
    description: Description of extreme weather or climatic conditions during the
      event
    comments: "e.g. 'flooding during week 3'"
  reported_weather:
    name: reported_weather
    title: Reported Weather
    slot_uri: dwc:reportedWeather
    slot_group: Event (Collection / Observation)
    range: string
    multivalued: false
    description: List of weather or climatic conditions during the event as JSON
    comments: 'e.g. {"minimumTemperatureInDegreesFahrenheit":18}'
  sample_size_unit:
    name: sample_size_unit
    title: Sample Size Unit
    slot_uri: dwc:sampleSizeUnit
    slot_group: Event (Collection / Observation)
    range: string
    multivalued: false
    description: Unit of measurement of the sample size
    comments: 'A dwc:sampleSizeUnit must have a corresponding dwc:sampleSizeValue,
      e.g., `5` for dwc:sampleSizeValue with `m` for dwc:sampleSizeUnit. This term
      has an equivalent in the dwciri: namespace that allows only an IRI as a value,
      whereas this term allows for any string literal value.'
  sample_size_value:
    name: sample_size_value
    title: Sample Size Value
    slot_uri: dwc:sampleSizeValue
    slot_group: Event (Collection / Observation)
    range: decimal
    multivalued: false
    description: Numeric value for the size of the sample in a sampling dwc:Event
    comments: A dwc:sampleSizeValue must have a corresponding dwc:sampleSizeUnit.
  sampled_substrate_category:
    name: sampled_substrate_category
    title: Sampled Substrate Category
    slot_uri: dwc:sampledSubstrateCategory
    slot_group: Event (Collection / Observation)
    range: string
    multivalued: false
    description: Category or type of substrate sampled
    comments: 'Recommended best practice is to use a controlled vocabulary and separate
      the values in a list with space vertical bar space (` | `). This term has an
      equivalent in the dwciri: namespace that allows only an IRI as a value, whereas
      this term allows for any string literal value.'
  sampled_substrate_layer:
    name: sampled_substrate_layer
    title: Sampled Substrate Layer
    slot_uri: dwc:sampledSubstrateLayer
    slot_group: Event (Collection / Observation)
    range: string
    multivalued: false
    description: List of substrate layers sampled
    comments: 'Recommended best practice is to use a controlled vocabulary and separate
      the values in a list with space vertical bar space (` | `). This term has an
      equivalent in the dwciri: namespace that allows only an IRI as a value, whereas
      this term allows for any string literal value.'
  sampling_effort:
    name: sampling_effort
    title: Sampling Effort
    slot_uri: dwc:samplingEffort
    slot_group: Event (Collection / Observation)
    range: string
    multivalued: false
    description: Amount of effort expended during the sampling dwc:Event
    comments: "e.g. '40 trap-nights', '10 observer-hours'"
  sampling_protocol:
    name: sampling_protocol
    title: Sampling Protocol
    slot_uri: dwc:samplingProtocol
    slot_group: Event (Collection / Observation)
    range: string
    multivalued: false
    description: Name or description of sampling methods
    comments: 'Recommended best practice is to describe an eco:Survey with no more
      than one sampling protocol. In the case of a summary eco:Survey with multiple
      protocols, in which a specific protocol can not be attributed to specific dwc:Occurrences,
      the recommended best practice is to separate the values in a list with space
      vertical bar space ( | ). This term has an equivalent in the dwciri: namespace
      that allows only an IRI as a value, whereas this term allows for any string
      literal value.'
  start_day_of_year:
    name: start_day_of_year
    title: Start Day Of Year
    slot_uri: dwc:startDayOfYear
    slot_group: Event (Collection / Observation)
    range: integer
    multivalued: false
    description: Earliest ordinal day of the year (1–366) on which the event occurred
    comments: The value is 1 for January 1 and 365 for December 31, except in a leap
      year, in which case it is 366.
  verbatim_event_date:
    name: verbatim_event_date
    title: Verbatim Event Date
    slot_uri: dwc:verbatimEventDate
    slot_group: Event (Collection / Observation)
    range: string
    multivalued: false
    description: Original representation of date/time
    comments: "e.g. 'spring 1910', 'marzo 2002', 'before 1970'"
  year:
    name: year
    title: Year
    slot_uri: dwc:year
    slot_group: Event (Collection / Observation)
    range: integer
    multivalued: false
    description: Four-digit year
    comments: prefer ISO 8601 eventDate to avoid ambiguity
  bed:
    name: bed
    title: Bed
    slot_uri: dwc:bed
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Full name of the lithostratigraphic bed
    comments: "e.g. 'Harlem coal'"
  earliest_age_or_lowest_stage:
    name: earliest_age_or_lowest_stage
    title: Earliest Age Or Lowest Stage
    slot_uri: dwc:earliestAgeOrLowestStage
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Full name of the earliest/lowest geochronologic age
    comments: "e.g. 'Atlantic', 'Boreal', 'Skullrockian'"
  earliest_eon_or_lowest_eonothem:
    name: earliest_eon_or_lowest_eonothem
    title: Earliest Eon Or Lowest Eonothem
    slot_uri: dwc:earliestEonOrLowestEonothem
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Full name of the earliest/lowest geochronologic eon
    comments: "e.g. 'Phanerozoic', 'Proterozoic', 'Precambrian'"
  earliest_epoch_or_lowest_series:
    name: earliest_epoch_or_lowest_series
    title: Earliest Epoch Or Lowest Series
    slot_uri: dwc:earliestEpochOrLowestSeries
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Full name of the earliest/lowest geochronologic epoch
    comments: "e.g. 'Holocene', 'Pleistocene'"
  earliest_era_or_lowest_erathem:
    name: earliest_era_or_lowest_erathem
    title: Earliest Era Or Lowest Erathem
    slot_uri: dwc:earliestEraOrLowestErathem
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Full name of the earliest/lowest geochronologic era
    comments: "e.g. 'Cenozoic', 'Mesozoic', 'Paleozoic'"
  earliest_period_or_lowest_system:
    name: earliest_period_or_lowest_system
    title: Earliest Period Or Lowest System
    slot_uri: dwc:earliestPeriodOrLowestSystem
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Full name of the earliest/lowest geochronologic period
    comments: "e.g. 'Neogene', 'Tertiary', 'Quaternary'"
  formation:
    name: formation
    title: Formation
    slot_uri: dwc:formation
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Full name of the lithostratigraphic formation
    comments: "e.g. 'Notch Peak Formation', 'House Limestone'"
  geologic_event:
    name: geologic_event
    title: Geologic Event
    slot_uri: dwc:geologicEvent
