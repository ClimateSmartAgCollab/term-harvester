          language:
            title: Langue
            description: Une langue de la ressource.
            comments: "La pratique optimale recommandée est d'utiliser un vocabulaire\
              \ contrôlé tel que RFC 5646. Ce terme a un équivalent dans le dcterms:\
              \ namespace qui n'autorise qu'un IRI comme valeur, alors que ce terme\
              \ autorise n'importe quelle valeur sous forme de chaîne de caractères."
          type:
            title: Type
            description: La nature ou le genre de la ressource.
            comments: Doit être rempli avec une valeur issue du vocabulaire DCMI type
              (https://www.dublincore.org/specifications/dublin-core/dcmi-type-vocabulary/2010-10-11/).
          access_rights:
            title: "Droits d'accès"
            description: Informations sur les personnes autorisées à accéder à la
              ressource ou indication de son statut de sécurité.
            comments: "Les droits d'accès peuvent inclure des informations concernant\
              \ l'accès ou les restrictions basées sur la confidentialité, la sécurité\
              \ ou d'autres politiques."
          bibliographic_citation:
            title: Référence Bibliographique
            description: Une référence bibliographique pour la ressource.
            comments: "D'après le Dublin Core, « la pratique recommandée est d'inclure\
              \ suffisamment de détails bibliographiques pour identifier la ressource\
              \ de la manière la moins ambiguë possible ». L'usage prévu de ce terme\
              \ dans le Darwin Core est de fournir la méthode privilégiée pour citer\
              \ la ressource elle-même - « comment citer cet enregistrement ». Notez\
              \ que l'usage prévu de dcterms:references dans le Darwin Core, par contre,\
              \ est de pointer vers la représentation de la source définitive de la\
              \ ressource - « où trouver la référence la plus proche de l'original\
              \ », s'il y en a une."
          license:
            title: Licence
            description: "Document juridique donnant l'autorisation officielle de\
              \ faire quelque chose avec la ressource."
          modified:
            title: Date de Modification
            description: Date à laquelle la ressource a été modifiée.
            comments: "La pratique optimale recommandée est d'utiliser une date conforme\
              \ à la norme ISO 8601-1:2019."
          references:
            title: Références
            description: "Une ressource apparentée qui est référencée, citée ou pointée\
              \ d'une autre manière par la ressource décrite."
          rights_holder:
            title: Titulaire des Droits
            description: Personne ou organisation possédant ou gérant des droits sur
              la ressource.
          accepted_name_usage:
            title: Usage du nom accepté
            description: "Le nom complet, avec les informations relatives à l'auteur\
              \ et à la date si elles sont connues, du dwc:Taxon actuellement considéré\
              \ valide (en zoologie) ou accepté (en botanique)."
            comments: "Le nom scientifique complet, avec les informations sur l'auteur\
              \ et la date si elles sont connues, du nom accepté (botanique) ou valide\
              \ (zoologie) dans les cas où le dwc:scientificName fourni est considéré\
              \ par la référence indiquée dans la propriété dwc:nameAccordingTo, ou\
              \ par le fournisseur de données comme un synonyme ou un nom mal appliqué.\
              \ Lorsqu'il est appliqué à un dwc:Organism ou à une dwc:Occurrence,\
              \ ce terme doit être utilisé dans les cas où un fournisseur de données\
              \ considère que le dwc:scientificName fourni n'est pas cohérent avec\
              \ l'opinion taxonomique du fournisseur de données. Par exemple, il existe\
              \ de nombreuses divergences dans les collections et les ensembles de\
              \ données d'observation entre le nom indiqué (par exemple, l'identification\
              \ la plus récente d'un expert qui a examiné un spécimen, ou une identification\
              \ sur le terrain pour un dwc:Organism observé) et le nom avancé par\
              \ le fournisseur de données comme étant valable sur le plan taxonomique."
          accepted_name_usage_id:
            title: "Identifiant de l'usage du nom accepté"
            description: "Un identifiant pour l'usage du nom (signification documentée\
              \ du nom selon une source) du taxon actuellement valide (zoologie) ou\
              \ accepté (botanique)."
            comments: "Ce terme devrait être utilisé pour les synonymes ou les noms\
              \ mal appliqués pour se référer au dwc:taxonID d'un enregistrement dwc:Taxon\
              \ qui représente le nom accepté (botanique) ou valide (zoologie). Pour\
              \ les Archives Darwin Core, l'enregistrement correspondant doit être\
              \ présent dans la même archive."
          associated_media:
            title: Média associé
            description: "Une liste (concaténée et séparée) d'identifiants (publication,\
              \ identifiant unique global (GUI), URI) des médias associés à la dwc:Occurrence."
          associated_occurrences:
            title: Occurrences associées
            description: "Une liste (concaténée et séparée) d'identifiants d'autres\
              \ enregistrements de dwc:Occurrence et de leurs associations à cette\
              \ dwc:Occurrence."
            comments: "Ce terme peut être utilisé pour fournir une liste d'associations\
              \ avec d'autres dwc:Occurrences. Notez que la classe dwc:ResourceRelationship\
              \ est un autre moyen de représenter les associations, avec plus de détails.\
              \ La pratique optimale recommandée est de séparer les valeurs d'une\
              \ liste par une barre verticale (` | `)."
          associated_organisms:
            title: Organismes associés
            description: "Une liste (concaténée et séparée) d'identifiants d'autres\
              \ dwc:Organisms et les associations de cet dwc:Organism à chacun d'entre\
              \ eux."
            comments: "Ce terme peut être utilisé pour fournir une liste d'associations\
              \ avec d'autres dwc:Organisms. Notez que la classe dwc:ResourceRelationship\
              \ est un autre moyen de représenter les associations, avec plus de détails.\
              \ La pratique optimale recommandée est de séparer les valeurs d'une\
              \ liste par une barre verticale (` | `)."
          associated_references:
            title: Références associées
            description: "Une liste (concaténée et séparée) d'identifiants (publication,\
              \ référence bibliographique, identifiant unique global (GUI), URI) de\
              \ la littérature associée à la dwc:Occurrence."
            comments: "La pratique optimale recommandée est de séparer les valeurs\
              \ d'une liste par une barre verticale (` | `). Notez que la classe dwc:ResourceRelationship\
              \ est un autre moyen de représenter les associations, avec plus de détails.\
              \ Notez également que l'usage prévu du terme dcterms:references dans\
              \ le Darwin Core, lorsqu'il est appliqué à une dwc:Occurrence, est de\
              \ pointer vers la source originale de cette dwc:Occurrence s'il y en\
              \ a une. Notez également que l'usage prévu du terme dcterms:bibliographicCitation\
              \ dans le Darwin Core lorsqu'il est appliqué à une dwc:Occurrence est\
              \ de fournir la manière optimale de citer la dwc:Occurrence elle-même."
          associated_taxa:
            title: Taxons associés
            description: "Une liste (concaténée et séparée) d'identifiants ou des\
              \ noms des enregistrements de dwc:Taxon et les associations de cette\
              \ dwc:Occurrence à chacun d'entre eux."
            comments: "Ce terme peut être utilisé pour fournir une liste d'associations\
              \ à des enregistrements de dwc:Taxon autres que celles définies dans\
              \ dwc:Occurrence. Notez que la classe dwc:ResourceRelationship est un\
              \ autre moyen de représenter les associations, avec plus de détails.\
              \ Ce terme ne convient pas pour établir des relations entre des enregistrements\
              \ de dwc:Taxon, mais seulement entre des dwc:Occurrences spécifiques\
              \ d'un dwc:Organisme et d'autres enregistrements de dwc:Taxon. La pratique\
              \ optimale recommandée est de séparer les valeurs d'une liste par une\
              \ barre verticale (` | `)."
          basis_of_record:
            title: "Catégorie d'enregistrement"
            description: "La nature précise de l'enregistrement."
            comments: "La pratique optimale recommandée est d'utiliser un vocabulaire\
              \ contrôlé tel que l'ensemble des noms locaux des identifiants de classes\
              \ du Darwin Core."
          bed:
            title: Lit
            description: "Le nom complet du lit lithostratigraphique à partir de laquelle\
              \ l'entité dwc:MaterialEntity a été collectée."
          behavior:
            title: Comportement
            comments: "Ce terme a un équivalent dans le dwciri: namespace qui n'autorise\
              \ qu'un IRI comme valeur, alors que ce terme autorise n'importe quelle\
              \ valeur sous forme de chaîne de caractères."
          caste:
            title: Caste
          catalog_number:
            title: Numéro de catalogue
          class:
            title: Classe
            description: Le nom scientifique complet de la classe dans laquelle le
              dwc:Taxon est classé.
          collection_code:
            title: Code de la collection
          collection_id:
            title: Identifiant de la collection
            comments: "Pour les spécimens physiques, la pratique optimale recommandée\
              \ est d'utiliser un identifiant unique et résoluble à l'échelle mondiale\
              \ provenant d'un registre de collections tel que le Global Registry\
              \ of Scientific Collections (https://scientific-collections.gbif.org)."
          continent:
            title: Continent
            description: Le nom du continent dans lequel se trouve la dcterms:Location.
            comments: "La pratique optimale recommandée est d'utiliser un vocabulaire\
              \ contrôlé tel que le Getty Thesaurus of Geographic Names. La pratique\
              \ optimale recommandée est de laisser ce champ vide si la dcterms:Location\
              \ recouvre plusieurs entités à ce niveau administratif ou si la dcterms:Location\
              \ pourrait se trouver dans l'une ou l'autre des multiples entités possibles\
              \ à ce niveau. La multiplicité et l'incertitude de l'entité géographique\
              \ peuvent être renseignées soit dans le terme dwc:higherGeography, soit\
              \ dans le terme dwc:locality, soit dans les deux."
          coordinate_precision:
            title: Précision des coordonnées
            description: Une représentation décimale de la précision des coordonnées
              données dans dwc:decimalLatitude et dwc:decimalLongitude.
          coordinate_uncertainty_in_meters:
            title: Incertitude des coordonnées en mètres
          country:
            title: Pays
            description: "Le nom du pays ou de l'unité administrative principale dans\
              \ lesquels se trouve la dcterms:Location."
            comments: "La pratique optimale recommandée est d'utiliser un vocabulaire\
              \ contrôlé tel que le Getty Thesaurus of Geographic Names. La pratique\
              \ optimale recommandée est de laisser ce champ vide si la dcterms:Location\
              \ recouvre plusieurs entités à ce niveau administratif ou si la dcterms:Location\
              \ pourrait se trouver dans l'une ou l'autre des multiples entités possibles\
              \ à ce niveau. La multiplicité et l'incertitude de l'entité géographique\
              \ peuvent être renseignées soit dans le terme dwc:higherGeography, soit\
              \ dans le terme dwc:locality, soit dans les deux."
          country_code:
            title: Code du pays
            description: Le code standardisé du pays dans lequel se trouve la dcterms:Location.
          county:
            title: Division de deuxième ordre
            description: Le nom complet et non abrégé de la région administrative
              immédiatement inférieure à stateProvince (comté, département, etc.)
              dans laquelle se trouve la dcterms:Location.
            comments: "La pratique optimale recommandée est d'utiliser un vocabulaire\
              \ contrôlé tel que le Getty Thesaurus of Geographic Names. La pratique\
              \ optimale recommandée est de laisser ce champ vide si la dcterms:Location\
              \ recouvre plusieurs entités à ce niveau administratif ou si la dcterms:Location\
              \ pourrait se trouver dans l'une ou l'autre des multiples entités possibles\
              \ à ce niveau. La multiplicité et l'incertitude de l'entité géographique\
              \ peuvent être renseignées soit dans le terme dwc:higherGeography, soit\
              \ dans le terme dwc:locality, soit dans les deux."
          cultivar_epithet:
            title: Épithète de cultivar
            description: "Partie du nom d'un cultivar, d'un groupe de cultivars ou\
              \ d'un grex qui suit le dwc:scientificName."
          data_generalizations:
            title: Généralisation des données
            description: Mesures prises pour rendre les données partagées moins précises
              ou moins complètes que dans leur forme originale. Cela peut signifier
              que des données de meilleure qualité peuvent être disponibles sur demande.
            comments: "Ce terme a un équivalent dans le dwciri: namespace qui n'autorise\
              \ qu'un IRI comme valeur, alors que ce terme autorise n'importe quelle\
              \ valeur sous forme de chaîne de caractères."
          dataset_id:
            title: Identifiant du jeu de données
            description: "Un identifiant pour le jeu de données. Il peut s'agir d'un\
              \ identifiant unique global (GUI) ou d'un identifiant spécifique à une\
              \ collection ou à une institution."
          dataset_name:
            title: Nom du jeu de données
          date_identified:
            title: "Date d'identification"
            description: Date à laquelle le sujet a été identifié comme appartenant
              au dwc:Taxon.
            comments: "La pratique optimale recommandée est d'utiliser une date conforme\
              \ à la norme ISO 8601-1:2019."
          day:
            title: Jour
            description: "Le jour (nombre entier) du mois au cours duquel le dwc:Event\
              \ s'est produit."
          decimal_latitude:
            title: Latitude en échelle décimale
          decimal_longitude:
            title: Longitude en échelle décimale
          degree_of_establishment:
            title: "Degré d'implantation"
            description: "Le degré de survie, de reproduction et d'expansion de l'aire\
              \ de répartition d'un dwc:Organism à un endroit et à un moment donnés."
            comments: "La pratique optimale recommandée est d'utiliser les valeurs\
              \ permises par le vocabulaire contrôlé dédié à ce terme, dont la liste\
              \ figure à l'adresse http://rs.tdwg.org/dwc/doc/doe/. Pour plus de détails,\
              \ voir https://doi.org/10.3897/biss.3.38084. Ce terme a un équivalent\
              \ dans le dwciri: namespace qui n'autorise qu'un IRI comme valeur, alors\
              \ que ce terme autorise n'importe quelle valeur sous forme de chaîne\
              \ de caractères."
          digital_specimen_id:
            comments: "Un Spécimen Numérique est défini à l'adresse https://doi.org/10.3897/rio.7.e67379.\
              \ Un dwc:digitalSpecimenID est destiné à identifier de manière unique\
              \ et permanente un spécimen numérique. La pratique optimale recommandée\
              \ est d'utiliser un DOI avec des métadonnées interprétables par une\
              \ machine dans l'enregistrement DOI qui utilise un profil de métadonnées\
              \ convenu par la communauté (également connu sous le nom de profil FDO)\
              \ pour un spécimen numérique. Pour un exemple, voir : https://doi.org/10.3535/N75-CR4-0SM?noredirect.\
              \ L'identifiant est celui d'un artefact d'information numérique (le\
              \ Spécimen Numérique) et non celui d'une instance spécifique d'une dwc:MaterialEntity."
          disposition:
            title: Mise à disposition
            comments: "La pratique optimale recommandée est d'utiliser un vocabulaire\
              \ contrôlé. Ce terme a un équivalent dans le dwciri: namespace qui n'autorise\
              \ qu'un IRI comme valeur, alors que ce terme autorise n'importe quelle\
              \ valeur sous forme de chaîne de caractères."
          dynamic_properties:
            title: Propriétés dynamiques
            description: "Une liste de mesures, de faits, de caractéristiques ou d'affirmations\
              \ supplémentaires concernant le document. Il s'agit d'un mécanisme permettant\
              \ de structurer le contenu."
            comments: "La pratique optimale recommandée est d'utiliser un encodage\
              \ clé:valeur pour un format d'échange de données tel que JSON."
          earliest_age_or_lowest_stage:
            title: Âge le plus ancien ou étage inférieur
            description: "Le nom complet de l'âge géochronologique le plus ancien\
              \ possible ou de l'étage chronostratigraphique le plus bas attribuable\
              \ à l'horizon stratigraphique à partir duquel l'entité dwc:MaterialEntity\
              \ a été collectée."
          earliest_eon_or_lowest_eonothem:
            title: Éon le plus ancien ou éonothème inférieur
          earliest_epoch_or_lowest_series:
            title: Époque la plus ancienne ou série la plus basse
            description: "Le nom complet de l'époque géochronologique la plus ancienne\
              \ possible ou de la série chronostratigraphique la plus basse attribuable\
              \ à l'horizon stratigraphique à partir duquel l'entité dwc:MaterialEntity\
              \ a été collectée."
          earliest_era_or_lowest_erathem:
            title: Ère la plus ancienne ou érathème inférieur
            description: "Le nom complet de l'ère géochronologique potentielle la\
              \ plus ancienne ou de l'érythème chronostratigraphique le plus bas attribuable\
              \ à l'horizon stratigraphique à partir duquel la dwc:MaterialEntity\
              \ a été collectée."
          earliest_period_or_lowest_system:
            title: Première période ou système inférieur
            description: "Le nom complet de la période géochronologique la plus ancienne\
              \ possible ou du système chronostratigraphique le plus bas attribuable\
              \ à l'horizon stratigraphique à partir duquel la dwc:MaterialEntity\
              \ a été collectée."
          end_day_of_year:
            title: Numéro du jour de fin
          establishment_means:
            title: "Moyens d'implantation"
            description: "Indication selon laquelle un dwc:Organism a été introduit\
              \ en un lieu et à un moment donnés par l'activité directe ou indirecte\
              \ de l'humain moderne."
            comments: "La pratique optimale recommandée est d'utiliser les valeurs\
              \ permises par le vocabulaire contrôlé dédié à ce terme, dont la liste\
              \ figure à l'adresse http://rs.tdwg.org/dwc/doc/em/. Pour plus de détails,\
              \ voir https://doi.org/10.3897/biss.3.38084. Ce terme a un équivalent\
              \ dans le dwciri: namespace qui n'autorise qu'un IRI comme valeur, alors\
              \ que ce terme autorise n'importe quelle valeur sous forme de chaîne\
              \ de caractères."
          event_date:
            title: "Date de l'événement"
          event_id:
            title: "Identifiant de l'événement"
            description: "Un identifiant pour l'ensemble des informations associées\
              \ à un dwc:Event (quelque chose qui se produit à un endroit et à un\
              \ temps donnés). Il peut s'agir d'un identifiant unique global ou d'un\
              \ identifiant spécifique à un jeu de données."
          event_remarks:
            title: "Remarques sur l'événement"
            description: Commentaires ou notes sur le dwc:Event.
          event_time:
            title: "Heure de l'événement"
            description: "Le moment ou l'intervalle de temps pendant lequel un dwc:Event\
              \ s'est produit."
            comments: "La pratique optimale recommandée est d'utiliser une heure conforme\
              \ à la norme ISO 8601-1:2019."
          event_type:
            title: "Type d'événement"
            comments: "La pratique optimale recommandée est d'utiliser un vocabulaire\
              \ contrôlé. Ce terme a un équivalent dans le dwciri: namespace qui n'autorise\
              \ qu'un IRI comme valeur, alors que ce terme autorise n'importe quelle\
              \ valeur sous forme de chaîne de caractères."
          family:
            title: Famille
            description: Le nom scientifique complet de la famille dans laquelle le
              dwc:Taxon est classé.
          feedback_url:
            title: "URL du Retour d'Information"
            description: "Un localisateur de ressources uniforme (URL) qui pointe\
              \ vers une page web sur laquelle un formulaire peut être soumis pour\
              \ recueillir des commentaires sur l'enregistrement."
            comments: "La pratique optimale recommandée est d'inclure facultativement\
              \ des éléments de requête qui servent à pré-remplir les éléments du\
              \ formulaire de la page web et à communiquer le contexte."
          field_notes:
            title: Notes de terrain
            description: "L'un des éléments suivants : a) un indicateur de l'existence\
              \ de, b) une référence à (publication, URI), ou c) les notes prises\
              \ sur le terrain concernant le dwc:Event."
            comments: "Ce terme a un équivalent dans le dwciri: namespace qui n'autorise\
              \ qu'une IRI comme valeur, alors que ce terme autorise n'importe quelle\
              \ valeur sous forme de chaîne de caractères."
          field_number:
            title: Numéro de terrain
          footprint_srs:
            title: "SRS de l'emprise au sol"
            description: "L'ellipsoïde, le système de référence géodésique ou le système\
              \ de référence spatiale (SRS) sur lequel la géométrie donnée dans dwc:footprintWKT\
              \ est basée."
            comments: "La pratique optimale recommandée est d'utiliser le code EPSG\
              \ du SRS, s'il est connu. Sinon, utilisez un vocabulaire contrôlé pour\
              \ le nom ou le code du système de référence géodésique, s'il est connu.\
              \ Sinon, utilisez un vocabulaire contrôlé pour le nom ou le code de\
              \ l'ellipsoïde, s'il est connu. Si aucun de ces éléments n'est connu,\
              \ utiliser la valeur `not recorded` (non documenté). Il est également\
              \ permis de fournir le SRS en Well-Known-Text, en particulier si aucun\
              \ code EPSG ne fournit les valeurs nécessaires pour les attributs du\
              \ SRS. N'utilisez pas ce terme pour décrire le SRS de dwc:decimalLatitude\
              \ et de dwc:decimalLongitude, ni de coordonnées verbatim - utilisez\
              \ plutôt dwc:geodeticDatum et dwc:verbatimSRS respectivement. Ce terme\
              \ a un équivalent dans le dwciri: namespace qui n'autorise qu'un IRI\
              \ comme valeur, alors que ce terme autorise n'importe quelle valeur\
              \ sous forme de chaîne de caractères."
          footprint_spatial_fit:
            title: "Ajustement de l'emprise au sol"
          footprint_wkt:
            title: "WKT de l'emprise au sol"
          formation:
            title: Formation
            description: Le nom complet de la formation lithostratigraphique à partir
              de laquelle la dwc:MaterialEntity a été collectée.
          generic_name:
            title: Nom générique
            description: "La partie générique du dwc:scientificName sans l'autorité."
            comments: "Pour les synonymes, le genre accepté et la partie générique\
              \ du nom peuvent être différents. Le terme dwc:genericName doit être\
              \ utilisé avec dwc:specificEpithet pour former un binôme et avec dwc:infraspecificEpithet\
              \ pour former un trinôme. Le terme dwc:genericName ne doit être utilisé\
              \ que pour les combinaisons. Les uninomiaux de rang genre n'ont pas\
              \ de dwc:genericName."
          genus:
            title: Genre
            description: Le nom scientifique complet du genre dans lequel le dwc:Taxon
              est classé.
          geodetic_datum:
            title: Système géodésique
            description: "L'ellipsoïde, le système de référence géodésique ou le système\
              \ de référence spatiale (SRS) sur lequel sont basées les coordonnées\
              \ géographiques données dans dwc:decimalLatitude et dwc:decimalLongitude."
            comments: "La pratique optimale recommandée est d'utiliser le code EPSG\
              \ du SRS, s'il est connu. Sinon, utilisez un vocabulaire contrôlé pour\
              \ le nom ou le code du système de référence géodésique, s'il est connu.\
              \ Sinon, utilisez un vocabulaire contrôlé pour le nom ou le code de\
              \ l'ellipsoïde, s'il est connu. Si aucun de ces éléments n'est connu,\
              \ utiliser la valeur `not recorded` (non documenté). Ce terme a un équivalent\
              \ dans le dwciri: namespace qui n'autorise qu'un IRI comme valeur, alors\
              \ que ce terme autorise n'importe quelle valeur sous forme de chaîne\
              \ de caractères."
          geological_context_id:
            title: Identifiant du contexte géologique
            description: "Un identifiant pour l'ensemble des informations associées\
              \ à un dwc:GeologicalContext (l'emplacement dans un contexte géologique,\
              \ tel que la stratigraphie). Il peut s'agir d'un identifiant unique\
              \ global (GUI) ou d'un identifiant spécifique à un jeu de données."
          georeference_protocol:
            title: Protocole de géoréférencement
            comments: "Ce terme a un équivalent dans le dwciri: namespace qui n'autorise\
              \ qu'un IRI comme valeur, alors que ce terme autorise n'importe quelle\
              \ valeur sous forme de chaîne de caractères."
          georeference_remarks:
            title: Remarques sur le géoréférencement
            description: Des commentaires ou des notes sur la définition de la description
              spatiale, expliquant les hypothèses formulées en plus ou en contradiction
              avec celles formalisées dans la méthode mentionnée dans dwc:georeferenceProtocol.
          georeference_sources:
            title: Sources du géoréférencement
            comments: "La pratique optimale recommandée est de séparer les valeurs\
              \ d'une liste par une barre verticale (` | `). Ce terme a un équivalent\
              \ dans le dwciri: namespace qui n'autorise qu'un IRI comme valeur, alors\
              \ que ce terme autorise n'importe quelle valeur sous forme de chaîne\
              \ de caractères."
          georeference_verification_status:
            title: Statut de vérification du géoréférencement
            description: Une description qualitative de la mesure dans laquelle le
              géoréférencement est considéré comme représentant la meilleure description
              spatiale possible pour la dcterms:Location de la dwc:Occurrence.
            comments: "La pratique optimale recommandée est d'utiliser un vocabulaire\
              \ contrôlé. Ce terme a un équivalent dans le dwciri: namespace qui n'autorise\
              \ qu'un IRI comme valeur, alors que ce terme autorise n'importe quelle\
              \ valeur sous forme de chaîne de caractères."
          georeferenced_by:
            title: Géoréférencé par
            comments: "La pratique optimale recommandée est de séparer les valeurs\
              \ d'une liste par une barre verticale (` | `). Ce terme a un équivalent\
              \ dans le dwciri: namespace qui n'autorise qu'un IRI comme valeur, alors\
              \ que ce terme autorise n'importe quelle valeur sous forme de chaîne\
              \ de caractères."
          georeferenced_date:
            title: Date de géoréférencement
            description: Date à laquelle la dcterms:Location a été géoréférencée.
            comments: "La pratique optimale recommandée est d'utiliser une date conforme\
              \ à la norme ISO 8601-1:2019."
          group:
            title: Groupe
            description: "Le nom complet du groupe lithostratigraphique à partir duquel\
              \ l'entité dwc:MaterialEntity a été collectée."
          habitat:
            title: Habitat
            description: "Une catégorie ou description de l'habitat dans lequel le\
              \ dwc:Event s'est produit."
            comments: "Ce terme a un équivalent dans le dwciri: namespace qui n'autorise\
              \ qu'un IRI comme valeur, alors que ce terme autorise n'importe quelle\
              \ valeur sous forme de chaîne de caractères."
          higher_classification:
            title: Classification supérieure
            description: "Une liste (concaténée et séparée) de noms de taxons s'arrêtant\
              \ au rang immédiatement supérieur au dwc:Taxon référencé."
            comments: La pratique optimale recommandée est de séparer les valeurs
              dans une liste par des barres verticales (` | `), les termes étant classés
              du rang taxonomique le plus inclusif au moins inclusif.
          higher_geography:
            title: Géographie supérieure
            description: "Une liste (concaténée et séparée) de noms géographiques\
              \ moins spécifiques que l'information saisie dans le terme dwc:locality."
            comments: La pratique optimale recommandée est de séparer les valeurs
              dans une liste par des barres verticales (` | `), les termes étant classés
              du moins précis au plus précis.
          higher_geography_id:
            title: Identifiant de la géographie supérieure
            description: Un identifiant pour la région géographique dans laquelle
              la dcterms:Location se situe.
            comments: "La pratique optimale recommandée consiste à utiliser un identifiant\
              \ permanent issu d'un vocabulaire contrôlé tel que le Getty Thesaurus\
              \ of Geographic Names."
          highest_biostratigraphic_zone:
            title: Zone biostratigraphique supérieure
            description: "Le nom complet de la zone géologique biostratigraphique\
              \ la plus élevée possible de l'horizon stratigraphique à partir duquel\
              \ l'entité dwc:MaterialEntity a été collectée."
          identification_id:
            title: "Identifiant de l'identification"
          identification_qualifier:
            title: "Qualificatif de l'identification"
            description: 'Une phrase courte ou une abréviation standardisée ("cf.",
              "aff.") pour exprimer les doutes liés à l''identification.'
            comments: "Ce terme a un équivalent dans le dwciri: namespace qui n'autorise\
              \ qu'une IRI comme valeur, alors que ce terme autorise n'importe quelle\
              \ valeur sous forme de chaîne de caractères."
          identification_references:
            title: "Références associées à l'identification"
          identification_remarks:
            title: "Remarques sur l'identification"
            description: Commentaires ou notes sur la dwc:Identification.
          identification_verification_status:
            title: "Statut de la vérification de l'identification"
            comments: "La pratique optimale recommandée est d'utiliser un vocabulaire\
              \ contrôlé tel que celui utilisé dans HISPID et ABCD. Ce terme a un\
              \ équivalent dans le dwciri: namespace qui n'autorise qu'un IRI comme\
              \ valeur, alors que ce terme autorise n'importe quelle valeur sous forme\
              \ de chaîne de caractères."
          identified_by:
            title: Identifié par
          identified_by_id:
            title: "Identifiant de l'identificateur"
          individual_count:
            title: "Nombre d'individus"
            description: "Le nombre d'individus présents au moment de la dwc:Occurrence."
          information_withheld:
            title: Information non renseignée
            comments: "Ce terme a un équivalent dans le dwciri: namespace qui n'autorise\
              \ qu'un IRI comme valeur, alors que ce terme autorise n'importe quelle\
              \ valeur sous forme de chaîne de caractères."
          infrageneric_epithet:
            title: Épithète infragénérique
            description: "Partie infragénérique d'un nom binomial dont le rang est\
              \ supérieur à celui de l'espèce mais inférieur à celui du genre."
            comments: "Le terme dwc:infragenericEpithet doit être utilisé conjointement\
              \ avec dwc:genericName, dwc:specificEpithet, dwc:infraspecificEpithet,\
              \ dwc:taxonRank et dwc:scientificNameAuthorship pour représenter les\
              \ éléments individuels du dwc:scientificName complet. Il peut être utilisé\
              \ pour indiquer l'emplacement du sous-genre d'une espèce, qui est souvent\
              \ indiqué entre parenthèses en zoologie. Il peut également être utilisé\
              \ pour partager des noms infragénériques tels que des sections en botanique\
              \ (par exemple, `Vicia sect. Cracca`)."
          infraspecific_epithet:
            title: Épithète infraspécifique
          institution_code:
            title: "Code de l'institution"
          institution_id:
            title: "Identifiant de l'institution"
          island:
            title: Île
            description: "Le nom de l'île sur laquelle ou à proximité de laquelle\
              \ se trouve la dcterms:Location."
            comments: La pratique optimale recommandée consiste à utiliser un vocabulaire
              contrôlé tel que le Getty Thesaurus of Geographic Names.
          island_group:
            title: "Groupement d'îles"
            description: "Le nom du groupement d'îles dans lequel se trouve la dcterms:Location."
            comments: La pratique optimale recommandée consiste à utiliser un vocabulaire
              contrôlé tel que le Getty Thesaurus of Geographic Names.
          kingdom:
            title: Règne
            description: Le nom scientifique complet du règne dans lequel le dwc:Taxon
              est classé.
          latest_age_or_highest_stage:
            title: Âge le plus récent ou étage supérieur
            description: "Le nom complet de l'âge géochronologique le plus récent\
              \ possible ou de l'étage chronostratigraphique le plus haut attribuable\
              \ à l'horizon stratigraphique à partir duquel l'entité dwc:MaterialEntity\
              \ a été collectée."
          latest_eon_or_highest_eonothem:
            title: Éon le plus récent ou Eonothème le plus élevé
          latest_epoch_or_highest_series:
            title: Époque la plus récente ou série la plus haute
            description: "Le nom complet de l'époque géochronologique la plus récente\
              \ possible ou de la série chronostratigraphique la plus haute attribuable\
              \ à l'horizon stratigraphique à partir duquel l'entité dwc:MaterialEntity\
              \ a été collectée."
          latest_era_or_highest_erathem:
            title: Dernière ère ou érathème supérieur
            description: "Le nom complet de l'ère géochronologique la plus récente\
              \ possible ou de l'érathème chronostratigraphique la plus haute attribuable\
              \ à l'horizon stratigraphique à partir duquel l'entité dwc:MaterialEntity\
              \ a été collectée."
          latest_period_or_highest_system:
            title: Période la plus récente ou système supérieur
            description: "Le nom complet de la dernière période géochronologique possible\
              \ ou du système chronostratigraphique le plus élevé attribuable à l'horizon\
              \ stratigraphique à partir duquel la dwc:MaterialEntity a été collectée."
          life_stage:
            title: Stade de développement
            comments: "La pratique optimale recommandée est d'utiliser un vocabulaire\
              \ contrôlé. Ce terme a un équivalent dans le dwciri: namespace qui n'autorise\
              \ qu'un IRI comme valeur, alors que ce terme autorise n'importe quelle\
              \ valeur sous forme de chaîne de caractères."
          lithostratigraphic_terms:
            title: Termes lithostratigraphiques
            description: La combinaison de tous les noms lithostratigraphiques de
              la roche à partir de laquelle la dwc:MaterialEntity a été collectée.
          locality:
            title: Localité
            description: La description précise du lieu.
            comments: "Des informations géographiques moins spécifiques peuvent être\
              \ fournies dans d'autres termes géographiques (dwc:higherGeography,\
              \ dwc:continent, dwc:country, dwc:stateProvince, dwc:county, dwc:municipality,\
              \ dwc:waterBody, dwc:island, dwc:islandGroup). Ce terme peut contenir\
              \ des informations modifiées par rapport à l'original afin de corriger\
              \ des erreurs apparentes ou de normaliser la description."
          location_according_to:
            title: Localité selon
            description: "Informations sur la source des informations sur la dcterms:Location.\
              \ Il peut s'agir d'une publication (gazetteer/index géographique), d'une\
              \ institution ou d'un ensemble d'individus."
            comments: "Ce terme a un équivalent dans le dwciri: namespace qui n'autorise\
              \ qu'un IRI comme valeur, alors que ce terme autorise n'importe quelle\
              \ valeur sous forme de chaîne de caractères."
          location_id:
            title: Identifiant de la localité
          location_remarks:
            title: Remarques sur la localité
            description: Commentaires ou notes à propos de la dcterms:Location.
          lowest_biostratigraphic_zone:
            title: Zone biostratigraphique inférieure
            description: "Le nom complet de la zone géologique biostratigraphique\
              \ la plus basse possible de l'horizon stratigraphique à partir duquel\
              \ l'entité dwc:MaterialEntity a été collectée."
          material_entity_id:
            title: "Identifiant d'entité matérielle"
            description: "Identifiant d'une instance particulière d'une dwc:MaterialEntity."
            comments: "Les valeurs de dwc:materialEntityID sont destinées à identifier\
              \ de manière unique et permanente une dwc:MaterialEntity particulière\
              \ dans un certain contexte. Les exemples de contexte comprennent une\
              \ collection d'échantillons donnée, une organisation donnée ou l'échelle\
              \ globale. La pratique optimale recommandée est d'utiliser un identifiant\
              \ permanent et unique au niveau mondial. L'identifiant est lié à un\
              \ objet physique (la dwc:MaterialEntity) par opposition à un enregistrement\
              \ numérique particulier (représentation) de cet objet physique."
          material_entity_remarks:
            title: "Remarques sur l'entité matérielle"
          material_entity_type:
            title: "Type d'entité matérielle"
            comments: "Classification plus générique d'une dwc:MaterialEntity que\
              \ dwc:preparations. La pratique optimale recommandée est d'utiliser\
              \ un vocabulaire contrôlé. Ce terme a un équivalent dans le dwciri:\
              \ namespace qui n'autorise qu'un IRI comme valeur, alors que ce terme\
              \ autorise n'importe quelle valeur sous forme de chaîne de caractères."
          maximum_depth_in_meters:
            title: Profondeur maximale en mètres
          maximum_distance_above_surface_in_meters:
            title: Distance maximale au-dessus de la surface en mètres
            description: "La plus grande distance d'une plage de distances par rapport\
              \ à une surface de référence dans la dimension verticale, en mètres.\
              \ Utilisez des valeurs positives pour les emplacements situés au-dessus\
              \ de la surface, et des valeurs négatives pour les emplacements situés\
              \ en dessous. Si des mesures de profondeur sont données, la surface\
              \ de référence est l'emplacement donné par la profondeur, sinon la surface\
              \ de référence est l'emplacement donné par l'élévation."
          maximum_elevation_in_meters:
            title: Altitude maximale en mètres
          member:
            title: Membre
            description: "Le nom complet du membre lithostratigraphique à partir duquel\
              \ l'entité dwc:MaterialEntity a été collectée."
          minimum_depth_in_meters:
            title: Profondeur minimale en mètres
          minimum_distance_above_surface_in_meters:
            title: Distance minimale au-dessus de la surface en mètres
            description: "La plus petite distance d'une plage de distances par rapport\
              \ à une surface de référence dans la dimension verticale, en mètres.\
              \ Utilisez des valeurs positives pour les emplacements situés au-dessus\
              \ de la surface, et des valeurs négatives pour les emplacements situés\
              \ en dessous. Si des mesures de profondeur sont données, la surface\
              \ de référence est l'emplacement donné par la profondeur, sinon la surface\
              \ de référence est l'emplacement donné par l'élévation."
          minimum_elevation_in_meters:
            title: Altitude minimale en mètres
          month:
            title: Mois
            description: "Le mois (nombre entier) au cours duquel le dwc:Event s'est\
              \ produit."
          municipality:
            title: Division de troisième ordre
            description: "Le nom complet et non abrégé de la région administrative\
              \ immédiatement inférieure au comté (ville, municipalité, etc.) dans\
              \ laquelle se trouve la dcterms:Location. N'utilisez pas ce terme pour\
              \ un lieu nommé à proximité qui ne contient pas la dcterms:Location\
              \ elle-même."
            comments: "La pratique optimale recommandée est d'utiliser un vocabulaire\
              \ contrôlé tel que le Getty Thesaurus of Geographic Names. La pratique\
              \ optimale recommandée est de laisser ce champ vide si la dcterms:Location\
              \ recouvre plusieurs entités à ce niveau administratif ou si la dcterms:Location\
              \ pourrait se trouver dans l'une ou l'autre des multiples entités possibles\
              \ à ce niveau. La multiplicité et l'incertitude de l'entité géographique\
              \ peuvent être renseignées soit dans le terme dwc:higherGeography, soit\
              \ dans le terme dwc:locality, soit dans les deux."
          name_according_to:
            title: Nom selon
            description: 'La référence à la source dans laquelle la délimitation du
              taxon concept est définie ou suggérée - traditionnellement signifiée
              par le latin "sensu" ou "sec." (de secundum qui signifie "selon"). Pour
              les taxons résultant d''identifications, une référence aux clés, monographies,
              experts et autres sources doit être donnée.'
          name_according_to_id:
            title: Identifiant du nom selon
            description: Un identifiant de la source dans laquelle la circonscription
              du concept de taxon associé est définie ou sous-entendue. Voir dwc:nameAccordingTo.
          name_published_in:
            title: Nom publié dans
            description: "Une référence à la publication dans laquelle le dwc:scientificName\
              \ a été établi à l'origine selon les règles du dwc:nomenclaturalCode\
              \ associé."
            comments: Une référence à la première publication du nom dans sa combinaison
              indiquée, et non le basionyme / nom original. Les recombinaisons ne
              sont souvent pas publiées en tant que telles en zoologie, auquel cas
              dwc:namePublishedIn devrait être vide.
          name_published_in_id:
            title: Identifiant du travail où un nom est publié
            description: "Un identifiant de la publication dans laquelle le dwc:scientificName\
              \ a été établi à l'origine selon les règles du dwc:nomenclaturalCode\
              \ associé."
            comments: Une référence à la première publication du nom dans la combinaison
              utilisé, pas le basionyme / la combinaison originale. Les recombinaisons
              ne sont souvent pas publiées en tant que telles en zoologie, auquel
              cas dwc:namePublishedInID doit être vide.
          name_published_in_year:
            title: Année de publication du nom
            description: "L'année en quatre chiffres au cours de laquelle le dwc:scientificName\
              \ a été publié."
          nomenclatural_code:
            title: Code de nomenclature
            description: "Le code de nomenclature (ou les codes, dans le cas d'un\
              \ nom appliqué à un taxon dont le Règne est ambigu) régissant le dwc:scientificName."
            comments: "La pratique optimale recommandée est d'utiliser un vocabulaire\
              \ contrôlé."
          nomenclatural_status:
            title: Statut nomenclatural
            description: "Le statut lié à la publication originale du nom et à sa\
              \ conformité aux règles correspondantes en nomenclature. Ce statut est\
              \ déterminé essentiellement sur un algorithme de prise de décision conforme\
              \ aux règles du code. Il ne nécessite pas d'opinion taxonomique."
          occurrence_id:
            title: "Identifiant de l'occurrence"
          occurrence_remarks:
            title: "Remarques sur l'occurrence"
            description: Commentaires ou notes sur le dwc:Occurence.
          occurrence_status:
            title: "Statut de l'occurrence"
          order:
            title: Ordre
            description: "Le nom scientifique complet de l'ordre dans lequel le dwc:Taxon\
              \ est classé."
          organism_id:
            title: Identifiant de l’organisme
            description: "Un identifiant de l'instance de dwc:Organism (par opposition\
              \ à un enregistrement numérique particulier du dwc:Organism). Il peut\
              \ s'agir d'un identifiant unique global (GUI) ou d'un identifiant spécifique\
              \ à un jeu de données."
          organism_name:
            title: "Nom de l'organisme"
            description: Nom littéral ou étiquette attribuée à une instance de dwc:Organism.
          organism_quantity:
            title: "Nombre d'organismes"
            description: Un nombre ou une valeur numérique pour la quantité de dwc:Organisms.
            comments: Une dwc:organismQuantity doit avoir un dwc:organismQuantityType
              correspondant.
          organism_quantity_type:
            title: "Type de la quantité d'organismes"
            description: Le type de système de mesure utilisé pour la quantification
              des dwc:Organisms.
            comments: "Un dwc:organismQuantityType doit avoir un dwc:organismQuantity\
              \ correspondant. Ce terme a un équivalent dans le dwciri: namespace\
              \ qui n'autorise qu'un IRI comme valeur, alors que ce terme autorise\
              \ n'importe quelle valeur sous forme de chaîne de caractères."
          organism_remarks:
            title: Remarques sur l’organisme
            description: "Commentaires ou notes sur l'instance de dwc:Organism."
          organism_scope:
            title: "Périmètre de l'organisme"
            description: "Une description du type d'instance de dwc:Organism. Peut\
              \ être utilisée pour indiquer si l'instance de dwc:Organism représente\
              \ un organisme isolé ou si elle représente un type particulier d'agrégat\
              \ ou de regroupement."
            comments: "La pratique optimale recommandée est d'utiliser un vocabulaire\
              \ contrôlé. Ce terme n'est pas destiné à être utilisé pour spécifier\
              \ un type de dwc:Taxon. Pour décrire le type de dwc:Organism à l'aide\
              \ d'un objet URI en RDF, utilisez plutôt rdf:type (http://www.w3.org/1999/02/22-rdf-syntax-ns#type)."
          original_name_usage:
            title: Usage original du nom
            description: "Le nom du taxon, avec les informations relatives à l'auteur\
              \ et à la date si elles sont connues, tel qu'il apparaissait à l'origine\
              \ lorsqu'il a été établi pour la première fois selon les règles du dwc:nomenclaturalCode\
              \ associé. Le basionyme (botanique) ou le basonyme (bactériologie) du\
              \ dwc:scientificName ou l'homonyme senior pour les noms remplacés."
            comments: "Le nom scientifique complet, avec les informations relatives\
              \ à l'auteur et à la date si elles sont connues, de l'usage du nom dans\
              \ lequel l'élément terminal du dwc:scientificName a été établi à l'origine\
              \ selon les règles du dwc:nomenclaturalCode associé. Par exemple, pour\
              \ les noms régis par le ICNafp, ce terme indiquerait le basionyme d'un\
              \ enregistrement lié à une combinaison subséquente. Contrairement aux\
              \ basionymes, ce terme peut s'appliquer aux noms scientifiques de tous\
              \ rangs."
          original_name_usage_id:
            title: "Identifiant de l'usage original du nom"
            description: "Un identifiant pour l'usage du nom (signification documentée\
              \ du nom selon une source) dans lequel l'élément terminal du dwc:scientificName\
              \ a été établi à l'origine selon les règles du dwc:nomenclaturalCode\
              \ associé."
            comments: "Ce terme devrait être utilisé pour désigner le dwc:taxonID\
              \ d'un enregistrement dwc:Taxon qui représente l'usage de l'élément\
              \ terminal du dwc:scientificName tel qu'il a été établi à l'origine\
              \ selon les règles du dwc:nomenclaturalCode associé. Par exemple, pour\
              \ les noms régis par l'ICNafp, ce terme établirait la relation entre\
              \ un enregistrement représentant une combinaison subséquente et l'enregistrement\
              \ du basionyme correspondant. Contrairement aux basionymes, ce terme\
              \ peut s'appliquer aux noms scientifiques de tous rangs. Pour les archives\
              \ Darwin Core, l'enregistrement correspondant doit être présent localement\
              \ dans la même archive."
          other_catalog_numbers:
            title: Autres numéros de catalogue
            comments: "La pratique optimale recommandée consiste à séparer les valeurs\
              \ d'une liste par une barre verticale (` | `)."
          owner_institution_code:
            title: "Code de l'institution propriétaire"
          parent_event_id:
            title: "Identifiant de l'événement parent"
          parent_name_usage:
            title: Usage du nom parent
            description: "Le nom complet, avec les informations relatives à l'auteur\
              \ et à la date, si elles sont connues, du dwc:Taxon directement de rang\
              \ supérieur (dans une classification) à l'élément le moins inclusif\
              \ du dwc:scientificName."
          parent_name_usage_id:
            title: "Identifiant de l'usage du nom parent"
            description: "Un identifiant pour l'usage du nom (signification documentée\
              \ du nom selon une source) du taxon de rang supérieur direct (dans une\
              \ classification) de l'élément le moins inclusif du dwc:scientificName."
            comments: "Ce terme devrait être utilisé pour les noms acceptés pour se\
              \ référer au dwc:taxonID d'un enregistrement dwc:Taxon qui représente\
              \ le taxon de rang immédiatement supérieur dans la même classification.\
              \ Pour les Archives Darwin Core, l'enregistrement correspondant doit\
              \ être présent dans la même archive."
          pathway:
            title: "Voie d'accès"
            description: "Le processus par lequel un dwc:Organism s'est retrouvé à\
              \ un endroit donné à un moment donné."
            comments: "La pratique optimale recommandée est d'utiliser les valeurs\
              \ permises par le vocabulaire contrôlé dédié à ce terme, dont la liste\
              \ figure à l'adresse http://rs.tdwg.org/dwc/doc/pw/. Pour plus de détails,\
              \ voir https://doi.org/10.3897/biss.3.38084. Ce terme a un équivalent\
              \ dans le dwciri: namespace qui n'autorise qu'un IRI comme valeur, alors\
              \ que ce terme autorise n'importe quelle valeur sous forme de chaîne\
              \ de caractères."
          phylum:
            title: Phylum (Embranchement)
            description: Le nom scientifique complet du phylum (embranchement) ou
              division dans lequel le dwc:Taxon est classé.
          point_radius_spatial_fit:
            title: Ajustement du centre et du rayon
          preparations:
            title: Procédés de préparation
            description: Une liste (concaténée et séparée) de procédés de préparation
              et de conservation pour une dwc:MaterialEntity.
            comments: "La pratique optimale recommandée est de séparer les valeurs\
