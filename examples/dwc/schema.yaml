  establishment_means:
    name: establishment_means
    title: Establishment Means
    slot_uri: dwc:establishmentMeans
    slot_group: TDWG_DWC_Simple
    range: DwCEstablishmentMeans
    multivalued: false
    description: Statement about whether an organism has been introduced to a given
      place and time through the direct or indirect activity of modern humans
    comments: 'Recommended best practice is to use controlled value strings from the
      controlled vocabulary designated for use with this term, listed at http://rs.tdwg.org/dwc/doc/em/.
      For details, refer to https://doi.org/10.3897/biss.3.38084. This term has an
      equivalent in the dwciri: namespace that allows only an IRI as a value, whereas
      this term allows for any string literal value.'
  pathway:
    name: pathway
    title: Pathway
    slot_uri: dwc:pathway
    slot_group: TDWG_DWC_Simple
    range: DwCPathway
    multivalued: false
    description: The process by which an Organism came to be in a given place at a
      given time (added DWC 2020)
    comments: 'Recommended best practice is to use controlled value strings from the
      controlled vocabulary designated for use with this term, listed at http://rs.tdwg.org/dwc/doc/pw/.
      For details, refer to https://doi.org/10.3897/biss.3.38084. This term has an
      equivalent in the dwciri: namespace that allows only an IRI as a value, whereas
      this term allows for any string literal value.'
  type:
    name: type
    title: Type
    slot_uri: dc:type
    slot_group: TDWG_DWC_Simple
    range: DCMIType
    multivalued: false
    description: The nature or genre of the resource
    comments: Must be populated with a value from the DCMI type vocabulary (https://www.dublincore.org/specifications/dublin-core/dcmi-type-vocabulary/2010-10-11/).
enums:
  DCMIType:
    description: DCMI Type Vocabulary - the nature or genre of a resource
    see_also:
      - https://www.dublincore.org/specifications/dublin-core/dcmi-type-vocabulary/
    permissible_values:
      Collection:
        title: Collection
        description: An aggregation of resources.
        meaning: dcterms:Collection
      Dataset:
        title: Dataset
        description: Data encoded in a defined structure.
        meaning: dcterms:Dataset
      Event:
        title: Event
        description: A non-persistent, time-based occurrence.
        meaning: dcterms:Event
      Image:
        title: Image
        description: A visual representation other than text (superset of StillImage
          and MovingImage).
        meaning: dcterms:Image
      InteractiveResource:
        title: Interactive Resource
        description: A resource requiring interaction from the user to be understood.
        meaning: dcterms:InteractiveResource
      MovingImage:
        title: Moving Image
        description: A series of visual representations of movements.
        meaning: dcterms:MovingImage
      PhysicalObject:
        title: Physical Object
        description: An inanimate, three-dimensional object or substance.
        meaning: dcterms:PhysicalObject
      Service:
        title: Service
        description: A system that provides one or more functions.
        meaning: dcterms:Service
      Software:
        title: Software
        description: A computer program in source or compiled form.
        meaning: dcterms:Software
      Sound:
        title: Sound
        description: A resource whose content is primarily intended to be rendered
          as audio.
        meaning: dcterms:Sound
      StillImage:
        title: Still Image
        description: A static visual representation.
        meaning: dcterms:StillImage
      Text:
        title: Text
        description: A resource whose content is primarily words for reading.
        meaning: dcterms:Text
    annotations:
      imported_from: TDWG_DWC_Simple
      source_file: sources/TDWG_DWC_Simple.yaml
  DwCDegreeOfEstablishment:
    description: Degree of Establishment Controlled Vocabulary List of Terms
    see_also:
      - https://dwc.tdwg.org/doe/
      - https://fredi.hepvs.ch/documents/301998/files/bach_puf.pdf
    enum_uri: http://rs.tdwg.org/dwcdoe/values/d
    permissible_values:
      A:
        title: native
        description: Not transported beyond limits of native range.
        meaning: dwcdoe:d001
      B1:
        title: captive
        description: Individuals in captivity or quarantine (i.e. individuals provided
          with conditions suitable for them, but explicit measures of containment
          are in place)
        meaning: dwcdoe:d002
      B2:
        title: cultivated
        description: Individuals in cultivation (i.e., individuals provided with conditions
          suitable for them, but explicit measures to prevent dispersal are limited
          at best).
        meaning: dwcdoe:d003
      B3:
        title: released
        description: Individuals directly released into novel environment.
        meaning: dwcdoe:d004
      C0:
        title: failing
        description: Individuals released outside of captivity or cultivation in a
          location, but incapable of surviving for a significant period.
        meaning: dwcdoe:d005
      C1:
        title: casual
        description: Individuals surviving outside of captivity or cultivation in
          a location with no reproduction.
        meaning: dwcdoe:d006
      C2:
        title: reproducing
        description: Individuals surviving outside of captivity or cultivation in
          a location. Reproduction is occurring, but population not self-sustaining.
        meaning: dwcdoe:d007
      C3:
        title: established
        description: Individuals surviving outside of captivity or cultivation in
          a location. Reproduction occurring, and population self-sustaining.
        meaning: dwcdoe:d008
      D1:
        title: colonising
        description: Self-sustaining population outside of captivity or cultivation,
          with individuals surviving a significant distance from the original point
          of introduction.
        meaning: dwcdoe:d009
      D2:
        title: invasive
        description: Self-sustaining population outside of captivity or cultivation,
          with individuals surviving and reproducing a significant distance from the
          original point of introduction.
        meaning: dwcdoe:d010
      E:
        title: widespread invasive
        description: Fully invasive species, with individuals dispersing, surviving
          and reproducing at multiple sites across a spectrum of habitats and geographic
          range.
        meaning: dwcdoe:d011
    annotations:
      imported_from: TDWG_DWC_Simple
      source_file: sources/TDWG_DWC_Simple.yaml
  DwCEstablishmentMeans:
    description: Establishment Means Controlled Vocabulary List of Terms
    see_also:
      - https://dwc.tdwg.org/em/
    enum_uri: http://rs.tdwg.org/dwcem/values/e
    permissible_values:
      native:
        title: native (indigenous)
        description: A taxon occurring within its natural range.
        meaning: dwcem:e001
      nativeReintroduced:
        title: 'native: reintroduced'
        description: A taxon re-established by direct introduction by humans into
          an area that was once part of its natural range, but from where it had become
          extinct.
        meaning: dwcem:e002
      introduced:
        title: introduced (alien, exotic, non-native, nonindigenous)
        description: Establishment of a taxon by human agency into an area that is
          not part of its natural range.
        meaning: dwcem:e003
      introducedAssistedColonisation:
        title: 'introduced: assisted colonisation'
        description: "Establishment of a taxon specifically with the intention of\
          \ creating a self-sustaining wild population in an area that is not part\
          \ of the taxon's natural range."
        meaning: dwcem:e004
      vagrant:
        title: vagrant (casual)
        description: The temporary occurrence of a taxon far outside its natural or
          migratory range.
        meaning: dwcem:e005
      uncertain:
        title: uncertain (unknown, cryptogenic)
        description: The origin of the occurrence of the taxon in an area is obscure.
        meaning: dwcem:e006
      nativeEndemic:
        title: 'native: endemic'
        description: A taxon with a natural distribution restricted to a single geographical
          area.
        meaning: dwcem:e007
    annotations:
      imported_from: TDWG_DWC_Simple
      source_file: sources/TDWG_DWC_Simple.yaml
  DwCPathway:
    description: Pathway Controlled Vocabulary List of Terms
    see_also:
      - https://dwc.tdwg.org/pw/
      - https://nora.nerc.ac.uk/id/eprint/519129/1/N519129CR.pdf
    enum_uri: http://rs.tdwg.org/dwcpw/values/p
    permissible_values:
      biologicalControl:
        title: biological control
        description: Organisms occurring in an area because they were introduced for
          the purpose of biological control of another organism.
        meaning: dwcpw:p001
      erosionControl:
        title: erosion control
        description: Organisms introduced for the purpose of erosion control/dune
          stabilization (windbreaks, hedges, etc.).
        meaning: dwcpw:p002
      fisheryInTheWild:
        title: fishery in the wild
        description: Fish stocked into the wild either to create a fishery or for
          recreational angling.
        meaning: dwcpw:p003
      hunting:
        title: hunting
        description: Animals stocked into the wild specifically with the intention
          that they would be hunted for sport.
        meaning: dwcpw:p004
      landscapeImprovement:
        title: landscape improvement
        description: 'Landscape/flora/fauna "improvement" in the wild.'
        meaning: dwcpw:p005
      conservationOrWildlifeManagement:
        title: conservation or wildlife management
        description: Organisms introduced for conservation purposes or wildlife management.
        meaning: dwcpw:p006
      releasedForUse:
        title: released for use
        description: Release in nature for use (other than above, e.g., fur, transport,
          medical use).
        meaning: dwcpw:p007
      otherIntentionalRelease:
        title: other intentional release
        description: A catch-all term for intentional releases not for human use that
          are not covered by other more specific terms.
        meaning: dwcpw:p008
      agriculture:
        title: agriculture (including biofuel feedstocks)
        description: Plants grown with the intention of harvesting.
        meaning: dwcpw:p009
      aquacultureMariculture:
        title: aquaculture/mariculture
        description: The analog of agriculture and farmed animals, specifically related
          to aquatic organisms.
        meaning: dwcpw:p010
      publicGardenZooAquaria:
        title: botanic garden/zoo/aquaria (excluding domestic aquaria)
        description: Organisms in public collections of plants and/or animals.
        meaning: dwcpw:p011
      pet:
        title: pet/aquarium/terrarium species (including live food for such species)
        description: Privately kept animals.
        meaning: dwcpw:p012
      farmedAnimals:
        title: farmed animals (including animals left under limited control)
        description: Animals cared for and bred with the specific intention of using
          their products, such as meat and milk.
        meaning: dwcpw:p013
      forestry:
        title: forestry (including reforestation)
        description: Trees specifically introduced to provide timber and other forestry
          products.
        meaning: dwcpw:p014
      fur:
        title: fur farms
        description: Organisms escaped from a fur farm, including unauthorised releases.
        meaning: dwcpw:p015
      horticulture:
        title: horticulture
        description: Plants distributed by the ornamental and decorative plants industry.
        meaning: dwcpw:p016
      ornamentalNonHorticulture:
        title: ornamental purpose other than horticulture
        description: Ornamental plants introduced through pathways other than the
          horticultural industry.
        meaning: dwcpw:p017
      research:
        title: research and ex-situ breeding (in facilities)
        description: Plants and animals introduced for the purpose of breeding or
          scientific and medical research, including science education.
        meaning: dwcpw:p018
      liveFoodLiveBait:
        title: live food and live bait
        description: Live food imported for human consumption or live bait, such as
          shellfish and snails.
        meaning: dwcpw:p019
      otherEscape:
        title: other escape from confinement
        description: Organisms brought into an area with the intention of keeping
          them in captivity permanently, but that have subsequently escaped.
        meaning: dwcpw:p020
      contaminantNursery:
        title: contaminant nursery material
        description: Organisms transported into an area together with plant material.
        meaning: dwcpw:p021
      contaminateBait:
        title: contaminated bait
        description: Contaminants, pathogens and parasites transported with live,
          frozen or preserved bait used to catch fish or other organisms.
        meaning: dwcpw:p022
      foodContaminant:
        title: food contaminant (including of live food)
        description: Foods for human consumption, whether they are transported live
          or dead.
        meaning: dwcpw:p023
      contaminantOnAnimals:
        title: contaminant on animals (except parasites, organisms transported by
          host/vector)
        description: Contaminants carried either on or in the body of transported
          animals.
        meaning: dwcpw:p024
      parasitesOnAnimals:
        title: parasites on animals (including organisms transported by host and vector)
        description: Parasitic and pathogenic organisms transported with their host
          or vector animal.
        meaning: dwcpw:p025
      contaminantOnPlants:
        title: contaminant on plants (except parasites, species transported by host/vector)
        description: Organisms transported on plant material.
        meaning: dwcpw:p026
      parasitesOnPlants:
        title: parasites on plants (including species transported by host and vector)
        description: Parasitic and pathogenic organisms transported with their host
          or vector plant.
        meaning: dwcpw:p027
      seedContaminant:
        title: seed contaminant
        description: Organisms contaminating transported seeds.
        meaning: dwcpw:p028
      timberTrade:
        title: timber trade
        description: Contaminants on unprocessed timber, processed wood and wood-derived
          products.
        meaning: dwcpw:p029
      transportationHabitatMaterial:
        title: transportation of habitat material (soil, vegetation, wood etc)
        description: Organisms transported with their habitat material to a new location.
        meaning: dwcpw:p030
      fishingEquipment:
        title: angling/fishing equipment
        description: Aquatic organisms moved between sites on equipment of recreational
          anglers and professional fishermen.
        meaning: dwcpw:p031
      containerBulk:
        title: container/bulk
        description: Stowaways transported in or on cargo containers or bulk cargo
          units.
        meaning: dwcpw:p032
      hitchhikersAirplane:
        title: hitchhikers in or on airplane
        description: Organisms that enter airplanes or other aircraft, such as helicopters,
          and are transported by them to another location.
        meaning: dwcpw:p033
      hitchhikersShip:
        title: hitchhikers on ship/boat (excluding ballast water and hull fouling)
        description: Organisms that enter directly onto boats or ships and are transported
          by them to another location.
        meaning: dwcpw:p034
      machineryEquipment:
        title: machinery/equipment
        description: Organisms carried on the surfaces of or within heavy machinery
          and equipment.
        meaning: dwcpw:p035
      people:
        title: people and their luggage/equipment (in particular tourism)
        description: Organisms transported on people and/or their personal luggage.
        meaning: dwcpw:p036
      packingMaterial:
        title: organic packing material, in particular wood packaging
        description: Organic material, particularly unprocessed plant material that
          is used to pack transported goods.
        meaning: dwcpw:p037
      ballastWater:
        title: ship/boat ballast water
        description: Organisms transported within the water pumped into boats and
          ships to provide ballast.
        meaning: dwcpw:p038
      hullFouling:
        title: ship/boat hull fouling
        description: Organisms that attach themselves to the subsurface hull of boats
          and ships.
        meaning: dwcpw:p039
      vehicles:
        title: vehicles (car, train, etc.)
        description: Other vehicle hitchhikers that have been unintentionally dispersed,
          but are not covered by other terms.
        meaning: dwcpw:p040
      otherTransport:
        title: other means of transport
        description: A catchall term for any transport-related dispersal that is not
          covered in other terms.
        meaning: dwcpw:p041
      waterwaysBasinsSeas:
        title: interconnected waterways/basins/seas
        description: Organisms that dispersed through artificial waterways created
          to connect previously unconnected water bodies.
        meaning: dwcpw:p042
      tunnelsBridges:
        title: tunnels and land bridges
        description: Unintentional dispersal by organisms using artificial tunnels,
          bridges, roads and railways.
        meaning: dwcpw:p043
      naturalDispersal:
        title: natural dispersal across borders of invasive alien organisms
        description: Dispersal of organisms to new regions by natural dispersal from
          regions in which they are alien.
        meaning: dwcpw:p044
      releaseInNature:
        title: release in nature
        description: Organisms transported and released by humans in a (semi)natural
          environment with the intention that they should live there without further
          human aid.
        meaning: dwcpw:p045
      escapeFromConfinement:
        title: escape from confinement
        description: Organisms intentionally transported by humans and intended to
          be kept in captivity or cultivation, but having inadvertently escaped from
          human control.
        meaning: dwcpw:p046
      transportContaminant:
        title: transport-contaminant
        description: An umbrella term for all species transported as contaminants
          in other products.
        meaning: dwcpw:p047
      transportStowaway:
        title: transport-stowaway
        description: An umbrella term for all species transported by riding on forms
          of transport where the organism has a direct interaction with the transport
          and is not merely carried as part of, or a contaminant of cargo.
        meaning: dwcpw:p048
      corridor:
        title: corridor
        description: Infrastructures, such as bridges, tunnels and canals, have removed
          natural barriers to dispersal and allowed a species to move into a novel
          location.
        meaning: dwcpw:p049
      unaided:
        title: unaided
        description: Organisms that spread by natural dispersal, without action or
          assistance by humans, from regions in which they are also alien.
        meaning: dwcpw:p050
      intentional:
        title: intentional
        description: Organisms were brought to a new area with the specific intention
          of keeping them alive in the new region, regardless of whether they were
          intended to be cultivated or released into the wild.
        meaning: dwcpw:p051
      unintentional:
        title: unintentional
        description: The organism was unintentionally brought to a new region.
        meaning: dwcpw:p052
      corridorAndDispersal:
        title: corridor and dispersal
        description: Organisms dispersed naturally, even if that dispersal was aided
          by changes in the landscape created by humans.
        meaning: dwcpw:p053
    annotations:
      imported_from: TDWG_DWC_Simple
      source_file: sources/TDWG_DWC_Simple.yaml
