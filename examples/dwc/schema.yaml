  maximum_distance_above_surface_in_meters:
    name: maximum_distance_above_surface_in_meters
    title: Maximum Distance Above Surface In Meters
    slot_uri: dwc:maximumDistanceAboveSurfaceInMeters
    slot_group: Location (Geography)
    range: decimal
    multivalued: false
    description: Maximum distance above a reference surface in meters
  maximum_elevation_in_meters:
    name: maximum_elevation_in_meters
    title: Maximum Elevation In Meters
    slot_uri: dwc:maximumElevationInMeters
    slot_group: Location (Geography)
    range: decimal
    multivalued: false
    description: Maximum elevation (in meters) of the range
    comments: See https://docs.gbif.org/georeferencing-best-practices/1.0/en/#img-depth-elevation-distance-above-surface.
  minimum_depth_in_meters:
    name: minimum_depth_in_meters
    title: Minimum Depth In Meters
    slot_uri: dwc:minimumDepthInMeters
