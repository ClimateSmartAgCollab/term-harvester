    description: The degree to which an Organism survives, reproduces, and expands
      its range at the given place and time (added DWC 2020)
    comments: 'Recommended best practice is to use controlled value strings from the
      controlled vocabulary designated for use with this term, listed at http://rs.tdwg.org/dwc/doc/doe/.
      For details, refer to https://doi.org/10.3897/biss.3.38084. This term has an
      equivalent in the dwciri: namespace that allows only an IRI as a value, whereas
      this term allows for any string literal value.'
  dw_c_degree_of_establishment:
