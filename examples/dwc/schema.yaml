  geologic_province:
    name: geologic_province
    title: Geologic Province
    slot_uri: dwc:geologicProvince
    slot_group: Geological Context
    range: string
    multivalued: false
    description: Extensive region with similar geologic history
    comments: 'This term has an equivalent in the dwciri: namespace that allows only
