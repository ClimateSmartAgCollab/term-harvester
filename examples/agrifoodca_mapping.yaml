# agrifoodca_mapping.yaml — diff/mapping from schema.yaml to entry_code_picklists.json
# schema_to_json: controls which schema enums appear in entry_code_picklists.json.
#   Add or remove entries here and re-run --calibrate to update the enums section,
#   then --build to regenerate the JSON.
# enums: per-picklist overrides for names, descriptions, keywords, FR translations,
#   code remaps, and extra columns.  Regenerated by --calibrate; consumed by --build.
# Entries with 'static: true' have no backing schema enum; content is defined here.
# 'was_en' records the schema.yaml value that 'en' overrides (informational only;
#   ignored by --build).
schema_to_json:
  AgriFoodCA_AgreementScale: agreement_scale
  Canada: canadian_provinces
  AgriFoodCA_ComfortLevel: comfort_level
