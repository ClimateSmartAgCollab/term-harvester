  eight_point_cardinality:
    schema_key: AgriFoodCA_EightPointCardinality
    id: 9
    description:
      en: 'The 8‑wind compass rose consists of the four cardinal directions—north
        (N), east (E), south (S), and west (W)—arranged at 90‑degree intervals. By
        bisecting each of these angles, four intercardinal directions are formed:
        northeast (NE), southeast (SE), southwest (SW), and northwest (NW). Altogether,
        these eight points provide a simple directional framework commonly used in
        navigation and maps.'
      was_en: 'The 8‑wind compass rose consists of the four cardinal directions-north
        (N), east (E), south (S), and west (W)-arranged at 90‑degree intervals. By
        bisecting each of these angles, four intercardinal directions are formed:
        northeast (NE), southeast (SE), southwest (SW), and northwest (NW). Altogether,
        these eight points provide a simple directional framework commonly used in
        navigation and maps.'
