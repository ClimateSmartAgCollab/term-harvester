  thirty_two_point_cardinality:
    schema_key: AgriFoodCA_ThirtyTwoPointCardinality
    id: 39
    description:
      en: The 32 wind compass rose subdivides the circle even further by adding quarter
        winds, which fall halfway between each pair of 16 wind points. These "by"
        directions—such as north by east, northeast by north, and southwest by west—create
        a system of 32 points spaced at 11.25 degree intervals. Historically used
        in maritime navigation, this finer resolution allows much more accurate description
        of direction.
      was_en: The 32 wind compass rose subdivides the circle even further by adding
        quarter winds, which fall halfway between each pair of 16 wind points. These
        -by- directions-such as north by east, northeast by north, and southwest by
        west-create a system of 32 points spaced at 11.25 degree intervals. Historically
        used in maritime navigation, this finer resolution allows much more accurate
        description of direction.
